  --g:#33ff77; --g-dim:#1f8f47; --amber:#ffb000; --red:#ff5a4f;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#050403;color:#e8dcc0;font-family:'PTD',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
.page{max-width:1700px;margin:0 auto;padding:28px 20px 60px;}
.pg-h h1{font-family:'NMJ',serif;font-weight:800;font-size:22px;letter-spacing:-.01em;}

.fr{width:390px;}
.fr figcaption{font-size:13px;color:#e8dcc0;margin-bottom:8px;min-height:40px;line-height:1.45;}

.fr figcaption small{display:block;color:#a8977a;font-size:12px;}
.phone{width:390px;height:844px;position:relative;overflow:hidden;background:var(--room);
  box-shadow:0 0 0 1px #1c1710;}

/* ── 방 ── 위에 램프 하나. 벽(.walls)은 --r이 줄수록 안쪽으로 들어온다 */
.room{position:absolute;inset:0;
  background:radial-gradient(ellipse calc(70% + 60%*var(--r)) calc(46% + 30%*var(--r)) at 50% 24%, var(--lamp) 0%, #1a150e 55%, var(--room) 100%);}
.walls{position:absolute;inset:0;pointer-events:none;z-index:20;
  background:radial-gradient(ellipse calc(56% + 72%*var(--r)) calc(40% + 56%*var(--r)) at 50% 38%,
    transparent 38%, rgba(6,4,2,calc(.5 + .4*(1 - var(--r)))) 78%, rgba(3,2,1,.98) 100%);}
/* 벽이 가까우면 형광등이 가끔 꺼질 듯 흔들린다(움직이는 목업에서만) */
.room.tight .walls{animation:flick 7s infinite steps(1);}
@keyframes flick{0%,100%{opacity:1} 61%{opacity:1} 62%{opacity:.82} 63%{opacity:1} 64%{opacity:.9} 65%{opacity:1}}
.desk{position:absolute;inset:0;padding:14px 12px 0;display:flex;flex-direction:column;gap:12px;}

/* ── 종이 ── 줄무늬 대신 결. 램프 쪽(위)이 밝고 아래로 갈수록 가라앉는다 */
.sheet{position:relative;color:var(--ink);
  background:linear-gradient(180deg,var(--paper-hi) 0%,var(--paper) 45%,#ddd0b0 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 10px 24px rgba(0,0,0,.45);}
.sheet::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .36 0 0 0 0 .24 0 0 0 .22 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
.sheet > *{position:relative;}
.dim{color:var(--dim);}

/* ── 계좌 단말기 ── */
.term{position:relative;background:#03060a;color:var(--g);padding:10px 12px 11px;

/* ── 주문표 ── 인쇄된 양식: 왼쪽 항목, 가는 줄, 상자 없음 */
.form{padding:13px 15px 15px;}
.f-title,.d-title{display:flex;justify-content:space-between;align-items:baseline;
  padding-bottom:7px;border-bottom:2px solid var(--ink);}

.amt{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-bottom:7px;}
.seg{display:flex;border:1px solid var(--ink);}

button.ink{display:block;width:100%;border:0;background:var(--ink);color:var(--paper-hi);

button.ink span{font-weight:400;font-size:14px;color:#cbbd98;margin-left:6px;}
.form .go{margin-top:14px;}

/* ── 판 중 ── */
.mini{display:flex;align-items:baseline;gap:8px;background:#03060a;color:var(--g);padding:8px 12px;font-size:12px;

.scr{height:440px;border-radius:14px;background:#020403;position:relative;overflow:hidden;
  box-shadow:inset 0 0 40px rgba(0,0,0,.9), inset 0 0 0 2px #000;}
.scr::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 3px),
  radial-gradient(ellipse 60% 40% at 30% 20%,rgba(255,255,255,.06),transparent 70%);}

.m-top .red{color:var(--red);font-family:'GM';}
.m-ghost{position:absolute;left:50%;top:70px;transform:translateX(-50%);opacity:.24;filter:blur(.3px);}
.m-loss{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-family:'GM';font-size:30px;color:var(--red);
  text-shadow:0 0 12px rgba(255,90,79,.5);}
.m-chin{display:flex;justify-content:space-between;align-items:center;padding:9px 6px 10px;font-family:'GM';font-size:13px;color:#6e6450;}
.m-chin i{width:7px;height:7px;border-radius:50%;background:#5a1a14;}

/* ── 대화상자 ── 방은 어둡게 가라앉고 종이 한 장만 램프 아래 */
.stage{position:absolute;inset:0;}
.dim-bg{position:absolute;inset:0;filter:brightness(.28) saturate(.7);}
.dlg{position:absolute;left:18px;right:18px;top:92px;padding:16px 18px 18px;z-index:30;}
.doc .d-title{margin-bottom:12px;}

  font-size:20px;letter-spacing:.2em;color:var(--stamp);border:2.5px solid var(--stamp);transform:rotate(-9deg);
  opacity:.86;filter:url(#rough);mix-blend-mode:multiply;}
.d-amt{font-family:'NMJ',serif;font-weight:800;font-size:34px;letter-spacing:-.01em;margin-top:4px;}
.d-meta{font-size:13px;color:var(--dim);margin-top:2px;}
.voice{font-family:'NMJ',serif;font-size:16.5px;line-height:1.65;margin:18px 0 0;padding:12px 0 0;border-top:1px solid var(--rule);}

  transform:rotate(-1.4deg);box-shadow:0 3px 8px rgba(0,0,0,.25);

.tk-ic{line-height:0;}

button.cream{display:block;width:100%;margin-top:22px;border:0;background:#efe4c8;color:#211910;font-family:'PTD';

.pair{position:absolute;inset:0;z-index:30;}
