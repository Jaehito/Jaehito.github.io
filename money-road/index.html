<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 단타 게임</title>
<meta name="description" content="자동화로 베팅 한도와 종잣돈을 키우고, 15초 단타로 실제 수익을 만드는 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00c471; --gold:#ffb020;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; letter-spacing:-.02em; overflow-x:hidden;
    overscroll-behavior-y:contain;}
  html{overscroll-behavior-y:contain;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(24px + var(--safe-b));}

  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px;}
  .topbar .brand{font-size:18px; font-weight:800;} .topbar .brand span{color:var(--blue);}
  .top-right{display:flex; align-items:center; gap:8px;}
  .lv-chip{font-size:13px; font-weight:800; color:var(--gray); background:var(--card); padding:7px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .icon-btn{border:none; background:var(--card); color:var(--gray); width:36px; height:36px; border-radius:12px; font-size:15px; box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer;}

  /* 레벨 진행바 */
  .level-strip{margin:2px 20px 0; padding:0 2px;}
  .lv-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px;}
  .lv-name{font-size:12.5px; font-weight:800; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lv-pct{font-size:12.5px; font-weight:800; color:var(--green); flex-shrink:0;}
  .lv-bar{height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .lv-bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--green),#00e5a0); transition:width .3s;}
  .lv-hint{font-size:11px; font-weight:700; color:var(--gray3); margin-top:4px; text-align:right;}

  /* 히어로: 현금 */
  .hero{margin:12px 20px 0; padding:16px 20px 14px; border-radius:22px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#0b1b3a 0%,#12336e 55%,#1d4fb0 100%); color:#fff;}
  .hero::after{content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,#4c8dff55,transparent 70%);}
  .hero .k{font-size:12px; font-weight:700; color:#9fc0ff; position:relative;}
  .hero .cash{font-size:31px; font-weight:900; letter-spacing:-.04em; margin-top:3px; position:relative; font-variant-numeric:tabular-nums;}

  /* 탭 버튼(부트스트랩) */
  .tap-wrap{margin:12px 20px 0; position:relative;}
  .tap-btn{width:100%; border:none; border-radius:16px; padding:12px 18px; cursor:pointer;
    background:var(--card); color:var(--ink); box-shadow:var(--shadow);
    display:flex; align-items:center; gap:10px; transition:transform .06s;}
  .tap-btn:active{transform:scale(.98);}
  .tap-btn .e{font-size:20px;}
  .tap-btn .t{font-size:13.5px; font-weight:800; flex:1; text-align:left;}
  .tap-btn .s{font-size:12.5px; font-weight:800; color:var(--blue);}
  .float-pop{position:absolute; left:50%; top:6px; transform:translateX(-50%); font-size:14px; font-weight:900; color:var(--blue);
    pointer-events:none; animation:floatUp .7s ease-out forwards; z-index:5;}
  @keyframes floatUp{0%{opacity:0; transform:translate(-50%,0) scale(.8);}15%{opacity:1; transform:translate(-50%,-6px) scale(1.05);}100%{opacity:0; transform:translate(-50%,-26px) scale(1);}}

  /* 메인 탭 스위처 */
  .main-tabs{display:flex; gap:6px; margin:14px 20px 0; background:var(--card); border-radius:15px; padding:5px; box-shadow:var(--shadow);}
  .main-tab{flex:1; text-align:center; padding:11px; border-radius:11px; font-size:14px; font-weight:800; color:var(--gray2); background:transparent; border:none; cursor:pointer;}
  .main-tab.on{background:var(--ink); color:#fff;}

  /* 단타 패널 */
  .trade-panel{margin:12px 20px 0; background:var(--card); border-radius:20px; padding:14px 16px 16px; box-shadow:var(--shadow);}
  .tp-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .tp-title{font-size:14.5px; font-weight:800;}
  .tp-limit{font-size:11.5px; font-weight:700; color:var(--gray2); background:var(--field); padding:4px 9px; border-radius:999px;}
  .stock-tabs{display:flex; gap:7px; margin-bottom:11px;}
  .stock-tab{flex:1; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:9px 8px; cursor:pointer; text-align:center;}
  .stock-tab.sel{border-color:var(--blue); background:var(--blue-weak);}
  .stock-tab.locked{opacity:.5; cursor:default;}
  .stock-tab .e{font-size:19px;}
  .stock-tab .n{font-size:12px; font-weight:800; margin-top:2px;}
  .stock-tab .v{font-size:10px; font-weight:700; color:var(--gray2); margin-top:1px;}

  .bet-row{display:flex; align-items:center; gap:8px; background:var(--field); border-radius:14px; padding:8px 10px; margin-bottom:9px;}
  .bet-row button{width:38px; height:38px; border:none; background:var(--card); border-radius:11px; font-size:18px; font-weight:800; color:var(--ink); box-shadow:var(--shadow); cursor:pointer;}
  .bet-row .amt{flex:1; text-align:center; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums;}
  .bet-quicks{display:flex; gap:6px; margin-bottom:11px;}
  .bet-quicks button{flex:1; border:none; background:var(--field); color:var(--gray); font-weight:800; font-size:12px; padding:8px 0; border-radius:10px; cursor:pointer;}
  .bet-quicks button:active{background:var(--blue-weak); color:var(--blue);}
  .trade-go{width:100%; border:none; border-radius:14px; padding:14px; font-size:15.5px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 8px 20px rgba(49,130,246,.3);}
  .trade-go:disabled{background:var(--line); color:var(--gray3); box-shadow:none; cursor:default;}
  .trade-note{font-size:11.5px; color:var(--gray3); font-weight:600; text-align:center; margin-top:9px; line-height:1.5;}

  /* 진행중인 라운드 */
  .round-view{text-align:center;}
  .round-timer{font-size:11.5px; font-weight:800; color:var(--gray2); font-variant-numeric:tabular-nums;}
  .round-mult{font-size:40px; font-weight:900; letter-spacing:-.03em; margin:4px 0; font-variant-numeric:tabular-nums;}
  .round-mult.up{color:var(--red);} .round-mult.down{color:var(--blue);} .round-mult.flat{color:var(--gray2);}
  .round-chart{width:100%; height:80px; display:block; margin:4px 0 12px; background:var(--field); border-radius:12px;}
  .round-pnl{font-size:13px; font-weight:800; margin-bottom:12px;}
  .round-pnl.up{color:var(--red);} .round-pnl.down{color:var(--blue);}
  .sell-btn{width:100%; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#f04452,#ff6b78); box-shadow:0 8px 20px rgba(240,68,82,.3);}

  /* 자동화 패널 */
  .power-card{margin:12px 20px 0; background:var(--card); border-radius:20px; padding:16px; box-shadow:var(--shadow);}
  .power-row{display:flex; justify-content:space-between; align-items:baseline;}
  .power-k{font-size:12.5px; font-weight:800; color:var(--gray2);}
  .power-v{font-size:15px; font-weight:900;}
  .seed-bar{height:10px; background:var(--line); border-radius:999px; overflow:hidden; margin:10px 0 8px;}
  .seed-bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--gold),#ffcf6b); transition:width .3s;}
  .seed-hint{font-size:11px; font-weight:700; color:var(--gray3); margin-bottom:12px;}
  .collect-btn{width:100%; border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#ffb020,#ff9f43); box-shadow:0 8px 20px rgba(255,176,32,.3);}
  .collect-btn:disabled{background:var(--line); color:var(--gray3); box-shadow:none; cursor:default;}

  .section-title{font-size:13.5px; font-weight:800; color:var(--gray2); margin:18px 20px 8px;}

  .biz{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:12px 14px; margin:0 20px 8px; box-shadow:var(--shadow);}
  .biz .logo{width:42px; height:42px; border-radius:13px; background:var(--field); display:grid; place-items:center; font-size:21px; flex-shrink:0;}
  .biz .mid{flex:1; min-width:0;}
  .biz .nm{font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px;}
  .biz .cnt{font-size:11px; font-weight:800; color:var(--blue); background:var(--blue-weak); padding:1px 7px; border-radius:999px;}
  .biz .ds{font-size:12px; color:var(--gray2); font-weight:650; margin-top:2px;}
  .biz-buy{flex-shrink:0; border:none; border-radius:13px; padding:11px 14px; font-size:13px; font-weight:800; cursor:pointer; text-align:right; min-width:92px;}
  .biz-buy.can{background:var(--ink); color:#fff;}
  .biz-buy.cant{background:var(--field); color:var(--gray3);}
  .biz-buy .p{display:block; font-size:13.5px; font-weight:900;}
  .biz-buy .l{display:block; font-size:10.5px; font-weight:700; opacity:.75; margin-top:1px;}

  .hide{display:none !important;}

  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(0,0,0,.5);} .modal.on{display:flex;}
  .modal .box{width:100%; max-width:360px; background:var(--card); border-radius:26px; padding:30px 24px 22px; text-align:center; animation:pop .3s cubic-bezier(.2,1.2,.4,1);}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .emo{font-size:56px;}
  .modal .tt{font-size:21px; font-weight:900; margin:12px 0 6px;} .modal .dc{font-size:14.5px; color:var(--gray); font-weight:600; line-height:1.5;}
  .modal .ok{margin-top:18px; width:100%; border:none; color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:15px; cursor:pointer; background:linear-gradient(135deg,#3182F6,#4c8dff);}
  .stat-grid{display:flex; gap:10px; margin:16px 0 4px;} .stat-grid .s{flex:1; background:var(--field); border-radius:14px; padding:12px 6px;} .stat-grid .s .k{font-size:11px; color:var(--gray2); font-weight:700;} .stat-grid .s .v{font-size:15px; font-weight:800; margin-top:3px;}
  .lv-gain{margin-top:9px; font-size:13.5px; font-weight:700; color:var(--gray); background:var(--field); border-radius:12px; padding:10px 12px; text-align:left;} .lv-gain b{color:var(--blue); font-weight:800;}

  .toast{position:fixed; left:50%; bottom:28px; translate:-50% 0; background:rgba(25,31,40,.92); color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:14px; z-index:70; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;} .toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">머니<span>로드</span></div>
    <div class="top-right">
      <div class="lv-chip" id="lvChip">Lv.1</div>
      <button class="icon-btn" id="muteBtn">🔊</button>
    </div>
  </div>

  <div class="level-strip">
    <div class="lv-row"><span class="lv-name" id="lvName">—</span><span class="lv-pct" id="lvPct"></span></div>
    <div class="lv-bar"><i id="lvBar"></i></div>
    <div class="lv-hint" id="lvHint"></div>
  </div>

  <div class="hero">
    <div class="k">보유 현금</div>
    <div class="cash" id="cashView">0원</div>
  </div>

  <div class="tap-wrap">
    <button class="tap-btn" id="tapBtn">
      <span class="e">👊</span>
      <span class="t">빈털터리일 때 탭</span>
      <span class="s" id="tapSub">+1,000원</span>
    </button>
  </div>

  <div class="main-tabs">
    <button class="main-tab on" data-tab="trade">🎯 단타</button>
    <button class="main-tab" data-tab="biz">🏢 자동화</button>
  </div>

  <div id="panelTrade">
    <div class="trade-panel">
      <div class="tp-head"><span class="tp-title">📊 단타 (15초)</span><span class="tp-limit" id="tpLimit">한도 0원</span></div>
      <div class="stock-tabs" id="stockTabs"></div>
      <div id="tradeBody"></div>
    </div>
  </div>

  <div id="panelBiz" class="hide">
    <div class="power-card">
      <div class="power-row"><span class="power-k">생산력</span><span class="power-v" id="powerView">0원/초</span></div>
      <div class="seed-bar"><i id="seedBar"></i></div>
      <div class="seed-hint" id="seedHint">종잣돈 0 / 0</div>
      <button class="collect-btn" id="collectBtn">종잣돈 수령하기</button>
    </div>
    <div class="section-title">🏢 자동 수입원 <small style="font-weight:600;color:var(--gray3)">· 베팅 한도와 종잣돈을 키워요</small></div>
    <div id="bizList"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const RUN_KEY='moneyroad2_run_v4', META_KEY='moneyroad2_meta_v1';

function fmtWon(v){const neg=v<0;let x=Math.round(Math.abs(v));if(x<10000)return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000),man=Math.floor((x%100000000)/10000);let s='';if(eok)s+=eok+'억';if(man)s+=(s?' ':'')+man.toLocaleString()+'만';return (neg?'-':'')+s+'원';}
const won=n=>Math.round(n).toLocaleString()+'원';
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* audio */
let AC=null;
function beep(f,d,t='sine',vol=.15){if(META.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(720,.05,'triangle',.09),buy:()=>{beep(520,.07,'square',.1);setTimeout(()=>beep(780,.09,'square',.1),60);},pay:()=>{beep(880,.08,'sine',.13);setTimeout(()=>beep(1180,.12,'sine',.12),70);},warn:()=>beep(300,.15,'sawtooth',.12),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.14),i*100));}};

/* config: 자동화 — 더 이상 직접 현금을 벌지 않는다. "생산력"을 만들고,
   그 생산력이 (1) 베팅 한도, (2) 상한 있는 종잣돈 통을 결정한다.
   현금 성장의 유일한 엔진은 단타뿐이라서, 자동화와 단타가 서로 경쟁하지 않는다. */
const BUSINESSES=[
  {id:'alba',   emo:'🏪', name:'편의점 알바',   cost:20000,       power:200},
  {id:'rider',  emo:'🛵', name:'배달 라이더',   cost:150000,      power:1200},
  {id:'box',    emo:'📦', name:'무인 택배함',   cost:1000000,     power:7000},
  {id:'cafe',   emo:'☕', name:'무인 카페',     cost:6000000,     power:40000},
  {id:'rent',   emo:'🏢', name:'상가 임대',     cost:35000000,    power:220000},
  {id:'factory',emo:'🏭', name:'자동화 공장',   cost:200000000,   power:1300000},
  {id:'holding',emo:'🏦', name:'지주회사',      cost:1200000000,  power:8000000},
];
const COST_MULT=1.15;
const costOf=(biz,count)=>Math.round(biz.cost*Math.pow(COST_MULT,count));
const BASE_LIMIT=20000, BET_LIMIT_MULT=100; // 베팅 한도 = 기본 + 생산력×100
const SEED_CAP_SEC=1800; // 종잣돈 통 상한 = 생산력×30분

/* 단타 종목 — 15초 동안 봉우리형으로 오르내린다. 봉우리 시점/높이는 라운드마다 랜덤이라
   "관망(끝까지 홀드)"은 반드시 손해, "보고 파는" 플레이만 이득이 되도록 설계했다.
   (시뮬레이션 검증: 안정주 관망 0.86x / 보고팔기 1.4x, 테마주 관망 0.44x / 보고팔기 2.0x) */
const TRADE_STOCKS=[
  {id:'stable', emo:'🏦', name:'안정주', peakMin:10,peakMax:24, pMin:1.15,pMax:1.8, endMin:-0.55,endMax:-0.05, noise:0.012},
  {id:'theme',  emo:'🚀', name:'테마주', peakMin:8, peakMax:24, pMin:1.3, pMax:3.2, endMin:-0.85,endMax:-0.15, noise:0.03},
];
const ROUND_TICKS=30, ROUND_TICK_MS=500;

/* 레벨 = 지금까지 도달한 최고 현금(peakCash) 기준. 보상은 전부 무료 지급. */
const LEVELS=[
  {lv:2, need:500000,
   reward:{emo:'🚗',t:'첫 차',d:'중고차를 뽑았어요. 종잣돈 통도 더 오래 버텨요.',bonusTxt:'종잣돈 상한 영구 +50%',f:S=>{S.seedCapBonus=(S.seedCapBonus||0)+0.5;}}},
  {lv:3, need:3000000,
   reward:{emo:'🚀',t:'테마주 해금',d:'변동성 큰 테마주에도 손댈 수 있게 됐어요.',bonusTxt:'',f:S=>{S.themeUnlocked=true;}}},
  {lv:4, need:20000000,
   reward:{emo:'💍',t:'결혼',d:'평생을 함께할 사람을 만났어요.',bonusTxt:'탭 수입 영구 +30%',f:S=>{S.tapBonus=(S.tapBonus||0)+0.3;}}},
  {lv:5, need:150000000},
  {lv:6, need:1000000000,
   reward:{emo:'🏠',t:'내 집 마련',d:'드디어 내 집이 생겼어요. 배짱 있게 더 크게 굴려볼 수 있겠어요.',bonusTxt:'베팅 한도 영구 +50%',f:S=>{S.limitBonus=(S.limitBonus||0)+0.5;}}},
  {lv:7, need:8000000000},
  {lv:8, need:50000000000,
   reward:{emo:'🏆',t:'완전한 자유',d:'여기까지 왔어요. 더 이상 넘어야 할 관문은 없어요.',bonusTxt:'',final:true,f:S=>{}}},
];
function totalPower(){return BUSINESSES.reduce((a,b,i)=>a+b.power*S.counts[i],0);}
function betLimitOf(){return Math.round((BASE_LIMIT+S.power*BET_LIMIT_MULT)*(1+(S.limitBonus||0)));}
function seedCapOf(){return Math.round(S.power*SEED_CAP_SEC*(1+(S.seedCapBonus||0)));}

/* meta (설정만) */
let META;
function loadMeta(){try{const r=localStorage.getItem(META_KEY);if(r){META=JSON.parse(r);return;}}catch(e){}META={mute:false};}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META));}catch(e){}}

/* run state */
let S=null;
function newState(){
  const now=Date.now();
  const s={cash:0, power:0, counts:BUSINESSES.map(()=>0), level:1, peakCash:0,
    seedPool:0, tapBonus:0, limitBonus:0, seedCapBonus:0, themeUnlocked:false,
    selectedStock:'stable', betAmount:10000, activeRound:null, mainTab:'trade',
    lastTick:now, totalTaps:0};
  S=s;
  return s;
}
function saveRun(){try{localStorage.setItem(RUN_KEY,JSON.stringify(S));}catch(e){}}
function clearRun(){try{localStorage.removeItem(RUN_KEY);}catch(e){}}
function recomputePower(){S.power=totalPower();}
function bumpPeak(){if(S.cash>S.peakCash)S.peakCash=S.cash;}

/* 저장된 시점 이후 흐른 시간을 catch-up: 종잣돈 통이 상한까지 차오르고,
   떠나있는 동안 라운드가 15초를 넘겼으면 그 시점에 자동 청산한다. */
function catchUp(){
  const now=Date.now();
  const awaySec=(now-S.lastTick)/1000;
  const cap=seedCapOf();
  S.seedPool=Math.min(cap, S.seedPool+awaySec*S.power);
  let roundResolved=null;
  if(S.activeRound){
    const idx=currentTickIdx();
    if(idx>=S.activeRound.path.length-1){
      const mult=S.activeRound.path[idx];
      const payout=Math.round(S.activeRound.bet*mult);
      S.cash+=payout; bumpPeak();
      roundResolved={mult,payout,bet:S.activeRound.bet};
      S.activeRound=null;
    }
  }
  S.lastTick=now;
  return {awaySec,roundResolved};
}

function loadRun(){
  try{const r=localStorage.getItem(RUN_KEY);if(r){S=JSON.parse(r);
    if(!Array.isArray(S.counts)||S.counts.length!==BUSINESSES.length)S.counts=BUSINESSES.map(()=>0);
    recomputePower();
    return true;}
  }catch(e){}
  return false;
}
function startRun(){S=newState();saveRun();}

/* boot */
loadMeta();
$('muteBtn').textContent=META.mute?'🔇':'🔊';
let awayReport=null;
if(loadRun()){ awayReport=catchUp(); } else { startRun(); }
saveRun();

/* ===== 자동화 ===== */
function renderPower(){
  const cap=seedCapOf();
  $('powerView').textContent=`${fmtWon(S.power)}/초`;
  const pct=cap>0?Math.min(100,S.seedPool/cap*100):0;
  $('seedBar').style.width=pct+'%';
  $('seedHint').textContent=`종잣돈 ${fmtWon(S.seedPool)} / ${fmtWon(cap)}`;
  $('collectBtn').disabled=S.seedPool<1;
}
function collectSeed(){
  if(S.seedPool<1)return;
  const amt=Math.round(S.seedPool);
  S.cash+=amt; bumpPeak(); S.seedPool=0;
  sfx.pay(); toast(`💰 종잣돈 ${fmtWon(amt)} 수령!`);
  saveRun();
  if(!checkLevelUp())render();
}
$('collectBtn').onclick=collectSeed;
function renderBiz(){
  $('bizList').innerHTML=BUSINESSES.map((b,i)=>{
    const cnt=S.counts[i], cost=costOf(b,cnt), can=S.cash>=cost;
    return `<div class="biz"><div class="logo">${b.emo}</div>
      <div class="mid"><div class="nm">${b.name}${cnt>0?`<span class="cnt">${cnt}개</span>`:''}</div>
      <div class="ds">${cnt>0?`+${fmtWon(b.power*cnt)}/초 생산중`:`+${fmtWon(b.power)}/초`}</div></div>
      <button class="biz-buy ${can?'can':'cant'}" data-i="${i}"><span class="p">${fmtWon(cost)}</span><span class="l">구매</span></button>
      </div>`;
  }).join('');
  $('bizList').querySelectorAll('.biz-buy').forEach(btn=>btn.onclick=()=>buyBiz(+btn.dataset.i));
}
function buyBiz(i){
  const b=BUSINESSES[i], cost=costOf(b,S.counts[i]);
  if(S.cash<cost)return;
  S.cash-=cost; S.counts[i]++; recomputePower();
  sfx.buy(); toast(`${b.name} 구매! 베팅 한도 ${fmtWon(betLimitOf())}`);
  saveRun(); render();
}

/* ===== 레벨 ===== */
function checkLevelUp(){
  const nl=LEVELS.find(l=>l.lv===S.level+1);
  if(!nl||S.peakCash<nl.need)return false;
  S.level=nl.lv;
  if(nl.reward){
    if(nl.reward.f)nl.reward.f(S);
    saveRun(); render();
    showLevelReward(nl);
  }else{
    saveRun();
    toast(`🎉 Lv.${S.level} 달성!`);
    render();
    checkLevelUp();
  }
  return true;
}
function showLevelReward(nl){
  const r=nl.reward;
  $('modalBox').innerHTML=`<div class="emo">${r.emo}</div><div class="tt">${r.t}</div><div class="dc">${r.d}</div>
    ${r.bonusTxt?`<div class="dc" style="margin-top:8px;color:var(--blue);font-weight:800">${r.bonusTxt}</div>`:''}
    <button class="ok" id="mOk">${r.final?'계속 플레이':'좋아요'}</button>`;
  $('modal').classList.add('on');
  sfx.win();
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');render();checkLevelUp();};
}
function renderLevel(){
  const nl=LEVELS.find(l=>l.lv===S.level+1);
  $('lvChip').textContent=`Lv.${S.level}`;
  if(nl){
    const pct=Math.max(0,Math.min(100,S.peakCash/nl.need*100));
    $('lvName').textContent=`Lv.${S.level} → Lv.${nl.lv}`;
    $('lvPct').textContent=Math.floor(pct)+'%';
    $('lvBar').style.width=pct+'%';
    $('lvHint').textContent=`최고 ${fmtWon(S.peakCash)} · 목표 ${fmtWon(nl.need)}`;
  }else{
    $('lvName').textContent='🏆 최종 레벨 달성';
    $('lvPct').textContent='100%';
    $('lvBar').style.width='100%';
    $('lvHint').textContent=`최고 ${fmtWon(S.peakCash)}`;
  }
}

/* ===== 메인 탭 ===== */
function switchMainTab(tab){
  S.mainTab=tab; saveRun();
  document.querySelectorAll('.main-tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===tab));
  $('panelTrade').classList.toggle('hide',tab!=='trade');
  $('panelBiz').classList.toggle('hide',tab!=='biz');
}
document.querySelectorAll('.main-tab').forEach(el=>el.onclick=()=>{sfx.tap();switchMainTab(el.dataset.tab);});

/* ===== 단타 라운드 — 봉우리형 곡선 ===== */
function genPath(cfg){
  const tPeak=cfg.peakMin+Math.random()*(cfg.peakMax-cfg.peakMin);
  const P=cfg.pMin+Math.random()*(cfg.pMax-cfg.pMin);
  const endF=cfg.endMin+Math.random()*(cfg.endMax-cfg.endMin);
  const path=[1]; let noise=0;
  for(let i=1;i<=ROUND_TICKS;i++){
    let shape;
    if(i<=tPeak) shape=Math.sin((i/tPeak)*Math.PI/2);
    else shape=1-(1-endF)*Math.sin(((i-tPeak)/(ROUND_TICKS-tPeak))*Math.PI/2);
    noise+=cfg.noise*randn(); noise*=0.75;
    path.push(Math.max(0.05,1+(P-1)*shape+noise));
  }
  return path;
}
function currentTickIdx(){
  if(!S.activeRound)return 0;
  const elapsed=Date.now()-S.activeRound.startedAt;
  return Math.min(S.activeRound.path.length-1,Math.floor(elapsed/ROUND_TICK_MS));
}
function setBet(n){
  S.betAmount=Math.max(0,Math.min(betLimitOf(),Math.min(Math.floor(S.cash),Math.round(n))));
  renderTrade();
}
function startRound(){
  if(S.activeRound)return;
  const stock=TRADE_STOCKS.find(s=>s.id===S.selectedStock);
  const bet=S.betAmount;
  if(bet<=0||bet>betLimitOf()||bet>S.cash)return;
  const path=genPath(stock);
  S.cash-=bet;
  S.activeRound={stockId:stock.id,bet,path,startedAt:Date.now(),yMin:Math.min(...path),yMax:Math.max(...path)};
  sfx.buy();
  saveRun(); render();
}
function sellRound(){
  if(!S.activeRound)return;
  const idx=currentTickIdx();
  const mult=S.activeRound.path[idx];
  const payout=Math.round(S.activeRound.bet*mult);
  const profit=payout-S.activeRound.bet;
  S.cash+=payout; bumpPeak();
  sfx[profit>=0?'pay':'warn']();
  toast(`${mult>=1?'📈':'📉'} ${mult.toFixed(2)}x 청산 · ${profit>=0?'+':''}${fmtWon(profit)}`);
  S.activeRound=null;
  saveRun();
  if(!checkLevelUp())render();
}
/* 부드러운 곡선(2차 베지어 보간) + x/y축을 라운드 시작 시점에 고정해서
   그래프가 항상 왼쪽 끝(0초)에서 자라나 보이게 한다 */
function smoothPathD(pts){
  if(!pts.length)return '';
  if(pts.length===1)return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1],cur=pts[i];
    const midX=(prev[0]+cur[0])/2, midY=(prev[1]+cur[1])/2;
    d+=` Q${prev[0].toFixed(1)} ${prev[1].toFixed(1)} ${midX.toFixed(1)} ${midY.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  d+=` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  return d;
}
function renderTradeTabs(){
  $('stockTabs').innerHTML=TRADE_STOCKS.map(s=>{
    const locked=s.id==='theme'&&!S.themeUnlocked;
    return `<div class="stock-tab ${s.id===S.selectedStock?'sel':''} ${locked?'locked':''}" data-stock="${s.id}">
      <div class="e">${locked?'🔒':s.emo}</div><div class="n">${s.name}</div>
      <div class="v">${locked?'Lv.3 해금':(s.id==='stable'?'낮은 변동성':'높은 변동성')}</div></div>`;
  }).join('');
  $('stockTabs').querySelectorAll('.stock-tab').forEach(el=>{
    if(el.classList.contains('locked'))return;
    el.onclick=()=>{sfx.tap();S.selectedStock=el.dataset.stock;saveRun();renderTrade();
      $('stockTabs').querySelectorAll('.stock-tab').forEach(x=>x.classList.toggle('sel',x.dataset.stock===S.selectedStock));};
  });
}
function renderTrade(){
  $('tpLimit').textContent=`한도 ${fmtWon(betLimitOf())}`;
  if(S.activeRound){renderRoundView();return;}
  const limit=betLimitOf();
  const canGo=S.betAmount>0 && S.betAmount<=limit && S.betAmount<=S.cash;
  $('tradeBody').innerHTML=`
    <div class="bet-row"><button id="betMinus">−</button><div class="amt">${fmtWon(S.betAmount)}</div><button id="betPlus">+</button></div>
    <div class="bet-quicks"><button data-q="0.1">10%</button><button data-q="0.5">50%</button><button data-q="1">최대</button></div>
    <button class="trade-go" id="tradeGo" ${canGo?'':'disabled'}>15초 베팅 시작</button>
    <div class="trade-note">끝까지 들고만 있으면 손해예요 — 오르다 꺾이면 매도!</div>`;
  const step=Math.max(1000,Math.round(limit*0.05));
  $('betMinus').onclick=()=>{sfx.tap();setBet(S.betAmount-step);};
  $('betPlus').onclick=()=>{sfx.tap();setBet(S.betAmount+step);};
  $('tradeBody').querySelectorAll('.bet-quicks button').forEach(b=>b.onclick=()=>{sfx.tap();setBet(Math.min(limit,S.cash)*parseFloat(b.dataset.q));});
  $('tradeGo').onclick=()=>startRound();
}
function renderRoundView(){
  const r=S.activeRound, stock=TRADE_STOCKS.find(s=>s.id===r.stockId);
  const idx=currentTickIdx(), mult=r.path[idx];
  const remainSec=Math.max(0,Math.ceil((ROUND_TICKS-idx)*ROUND_TICK_MS/1000));
  const dir=mult>1.01?'up':mult<0.99?'down':'flat';
  const W=300,H=80,padX=6,padY=8;
  const rng=(r.yMax-r.yMin)||0.001;
  const xOf=i=>padX+(i/ROUND_TICKS)*(W-2*padX);
  const yOf=v=>H-padY-((v-r.yMin)/rng)*(H-2*padY);
  const pts=[];
  for(let i=0;i<=idx;i++)pts.push([xOf(i),yOf(r.path[i])]);
  const col=dir==='up'?'#f04452':dir==='down'?'#3182F6':'#8b95a1';
  const profit=Math.round(r.bet*mult)-r.bet;
  $('tradeBody').innerHTML=`<div class="round-view">
    <div class="round-timer">${stock.emo} ${stock.name} · 남은 시간 ${remainSec}초</div>
    <div class="round-mult ${dir}">${mult.toFixed(2)}x</div>
    <svg class="round-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${smoothPathD(pts)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="round-pnl ${profit>=0?'up':'down'}">${profit>=0?'+':''}${fmtWon(profit)}</div>
    <button class="sell-btn" id="sellBtn">지금 매도</button>
  </div>`;
  $('sellBtn').onclick=()=>sellRound();
}

/* ===== 히어로/탭 ===== */
function renderHero(){$('cashView').textContent=fmtWon(S.cash);}
const tapIncome=()=>Math.round(1000*(1+(S.tapBonus||0)));
$('tapBtn').onclick=()=>{
  S.cash+=tapIncome(); S.totalTaps++; bumpPeak();
  sfx.tap();
  const pop=document.createElement('div');
  pop.className='float-pop'; pop.textContent='+'+fmtWon(tapIncome());
  pop.style.left='50%';
  $('tapBtn').parentElement.appendChild(pop);
  setTimeout(()=>pop.remove(),700);
  saveRun();
  if(!checkLevelUp())renderHero();
};
$('tapSub').textContent=`+${fmtWon(1000)}`;

function render(){
  renderHero();renderLevel();
  switchMainTab(S.mainTab||'trade');
  renderTradeTabs();renderTrade();
  renderPower();renderBiz();
}

function showAwayModal(report){
  const bits=[`<div class="lv-gain">💰 종잣돈 통이 계속 채워졌어요 · 지금 <b>${fmtWon(S.seedPool)}</b> 있어요</div>`];
  if(report.roundResolved){
    const rr=report.roundResolved, profit=rr.payout-rr.bet;
    bits.push(`<div class="lv-gain">${rr.mult>=1?'📈':'📉'} 진행 중이던 단타가 <b>${rr.mult.toFixed(2)}x</b>로 마감 · ${profit>=0?'+':''}${fmtWon(profit)}</div>`);
  }
  const awayTxt=report.awaySec>=3600?`${Math.floor(report.awaySec/3600)}시간 ${Math.floor(report.awaySec%3600/60)}분`:`${Math.floor(report.awaySec/60)}분`;
  $('modalBox').innerHTML=`<div class="emo">⏱️</div><div class="tt">${awayTxt} 만이네요</div>
    <div class="dc">그동안 종잣돈 통이 계속 쌓였어요.</div>
    ${bits.join('')}
    <div class="stat-grid" style="margin-top:14px"><div class="s"><div class="k">현재 잔액</div><div class="v">${fmtWon(S.cash)}</div></div><div class="s"><div class="k">생산력</div><div class="v">${fmtWon(S.power)}/초</div></div></div>
    <button class="ok" id="mOk">확인</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');};
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}

$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';if(!META.mute)sfx.tap();};

/* main tick — 100ms 간격으로 종잣돈 축적, 라운드 진행/자동청산 체크 */
setInterval(()=>{
  const now=Date.now();
  const dt=(now-S.lastTick)/1000;
  const cap=seedCapOf();
  S.seedPool=Math.min(cap,S.seedPool+dt*S.power);
  S.lastTick=now;
  if(S.activeRound){
    const idx=currentTickIdx();
    if(idx>=S.activeRound.path.length-1){ sellRound(); return; }
    if(S.mainTab==='trade')renderRoundView();
  }else if(!checkLevelUp()){
    if(S.mainTab==='biz')renderPower();
  }
}, 100);
setInterval(saveRun, 3000);
window.addEventListener('pagehide', saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

render();
if(awayReport && awayReport.awaySec>=60) showAwayModal(awayReport);
</script>
