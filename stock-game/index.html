<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 파이어족 도전</title>
<meta name="description" content="주식 투자로 차·집·결혼·여행을 이루고 파이어족에 도전하는 로그라이크 인생 시뮬레이션 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00c471; --gold:#ffb020;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    line-height:1.4; letter-spacing:-.02em; overflow-x:hidden;
  }
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative;}
  .screen{display:none;} .screen.on{display:block;}
  #game{padding-bottom:calc(120px + var(--safe-b));}

  /* ===================== HOME ===================== */
  #home{padding:0 20px calc(40px + var(--safe-b)); min-height:100vh;
    background:radial-gradient(1200px 500px at 50% -10%, #dbe9ff 0%, var(--bg) 55%);}
  .home-hero{padding:56px 4px 20px; text-align:center;}
  .home-logo{font-size:44px; font-weight:900; letter-spacing:-.04em;
    background:linear-gradient(135deg,#3182F6,#00c2ff 60%,#7a5cff);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .home-tag{font-size:15px; color:var(--gray); font-weight:600; margin-top:8px;}
  .home-emoji{font-size:60px; margin:14px 0 4px; filter:drop-shadow(0 8px 16px rgba(49,130,246,.25));}
  .record{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .record .rt{font-size:13px; font-weight:800; color:var(--gray2); margin-bottom:12px;}
  .rec-grid{display:flex; gap:10px;}
  .rec-grid .c{flex:1; text-align:center; background:var(--field); border-radius:14px; padding:12px 4px;}
  .rec-grid .k{font-size:11px; color:var(--gray2); font-weight:700;}
  .rec-grid .v{font-size:15px; font-weight:800; margin-top:4px; letter-spacing:-.03em;}
  .legacy-head{display:flex; align-items:center; justify-content:space-between; margin:22px 4px 12px;}
  .legacy-head .t{font-size:17px; font-weight:800;}
  .legacy-bal{font-size:14px; font-weight:800; color:var(--gold); background:#fff7e6; padding:6px 12px; border-radius:999px;}
  .perk{background:var(--card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px;
    display:flex; align-items:center; gap:12px;}
  .perk .emo{font-size:26px; width:46px; height:46px; border-radius:13px; background:var(--field); display:grid; place-items:center; flex-shrink:0;}
  .perk .mid{flex:1; min-width:0;}
  .perk .nm{font-size:14.5px; font-weight:800;}
  .perk .ds{font-size:12px; color:var(--gray2); font-weight:600; margin-top:2px;}
  .dots{display:flex; gap:4px; margin-top:6px;}
  .dots i{width:16px; height:5px; border-radius:3px; background:var(--line);}
  .dots i.f{background:linear-gradient(90deg,#3182F6,#00c2ff);}
  .perk-buy{border:none; border-radius:12px; padding:9px 12px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; flex-shrink:0;
    background:#fff7e6; color:var(--gold);}
  .perk-buy:active{filter:brightness(.96);}
  .perk-buy.max{background:var(--line); color:var(--gray2);}
  .perk-buy.no{background:var(--field); color:var(--gray3);}
  .start-btn{width:100%; border:none; border-radius:18px; padding:18px; margin-top:20px; cursor:pointer;
    font-size:18px; font-weight:900; color:#fff; letter-spacing:-.02em;
    background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 10px 28px rgba(49,130,246,.36);}
  .start-btn:active{transform:translateY(1px);}
  .start-btn small{display:block; font-size:12px; font-weight:700; opacity:.85; margin-top:3px;}

  /* ===================== GAME HEADER ===================== */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px;}
  .topbar .brand{font-size:18px; font-weight:800;}
  .topbar .brand span{color:var(--blue);}
  .top-right{display:flex; gap:8px; align-items:center;}
  .date-chip{font-size:13px; font-weight:700; color:var(--gray); background:var(--card); padding:7px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .icon-btn{border:none; background:var(--card); color:var(--gray); width:36px; height:36px; border-radius:12px; font-size:15px; box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer;}

  .hero{padding:8px 20px 4px; position:relative; border-radius:24px; margin:0 12px;
    background:linear-gradient(135deg,#0b1b3a 0%,#12336e 55%,#1d4fb0 100%); color:#fff; overflow:hidden;}
  .hero::after{content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px; border-radius:50%;
    background:radial-gradient(circle,#4c8dff55,transparent 70%);}
  .hero .label{font-size:13px; color:#9fc0ff; font-weight:700; padding-top:8px;}
  .hero .net{font-size:34px; font-weight:900; letter-spacing:-.04em; margin:2px 0; display:flex; align-items:baseline; gap:8px;}
  .hero .delta{font-size:14px; font-weight:800;}
  .hero .delta.up{color:#ff6b78;} .hero .delta.down{color:#7fb0ff;}
  .spark{width:100%; height:52px; display:block; margin-top:2px;}
  .breakdown{display:flex; gap:8px; margin:12px 0 4px; padding-bottom:14px; position:relative; z-index:1;}
  .bd{flex:1; background:#ffffff1a; backdrop-filter:blur(4px); border-radius:14px; padding:10px 12px;}
  .bd .k{font-size:11px; color:#a9c4ff; font-weight:700;}
  .bd .v{font-size:14.5px; font-weight:800; margin-top:3px; letter-spacing:-.03em; color:#fff;}
  .bd .v.debt{color:#ff8a94;}

  .fire{margin:14px 20px 4px; background:var(--card); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .fire .row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .fire .t{font-size:14px; font-weight:800;} .fire .t b{color:var(--blue);}
  .fire .pct{font-size:15px; font-weight:900; color:var(--blue);}
  .bar{height:10px; background:var(--line); border-radius:999px; overflow:hidden;}
  .bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#3182F6,#00c2ff);
    transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .fire .sub{font-size:12px; color:var(--gray2); margin-top:8px; font-weight:600;}

  .tabs{display:flex; gap:6px; padding:16px 20px 8px;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:14px; font-size:14px; font-weight:800; color:var(--gray2); background:transparent; border:none; cursor:pointer; transition:.15s;}
  .tab.on{background:var(--ink); color:#fff;}
  .panel{padding:4px 16px;} .panel.hide{display:none;}
  .section-title{font-size:13px; font-weight:800; color:var(--gray2); margin:14px 6px 8px;}

  .stock{background:var(--card); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px;
    display:flex; align-items:center; gap:12px; cursor:pointer; transition:transform .1s;
    animation:rise .4s backwards;}
  .stock:active{transform:scale(.985);}
  .logo{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-size:22px; flex-shrink:0;}
  .stock .mid{flex:1; min-width:0;}
  .stock .nm{font-size:15px; font-weight:800;}
  .stock .own{font-size:12px; color:var(--gray2); font-weight:600; margin-top:2px;}
  .stock .own b{color:var(--gray);} .stock .own .pl.up{color:var(--red);} .stock .own .pl.down{color:var(--blue);}
  .stock .rt{text-align:right;}
  .stock .price{font-size:15px; font-weight:800; padding:2px 6px; border-radius:8px; display:inline-block;}
  .stock .price.flash-up{animation:flashUp .6s;} .stock .price.flash-down{animation:flashDown .6s;}
  .stock .chg{font-size:13px; font-weight:800; margin-top:2px;}
  .chg.up{color:var(--red);} .chg.down{color:var(--blue);} .chg.flat{color:var(--gray2);}
  @keyframes flashUp{0%{background:var(--red-weak);color:var(--red);}100%{background:transparent;}}
  @keyframes flashDown{0%{background:var(--blue-weak);color:var(--blue);}100%{background:transparent;}}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .life{background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:10px; display:flex; align-items:center; gap:14px; animation:rise .4s backwards;}
  .life .emo{font-size:30px; width:52px; height:52px; border-radius:16px; background:var(--field); display:grid; place-items:center; flex-shrink:0;}
  .life .mid{flex:1; min-width:0;}
  .life .nm{font-size:15px; font-weight:800;}
  .life .ds{font-size:12.5px; color:var(--gray2); font-weight:600; margin-top:3px; line-height:1.35;}
  .life .cost{font-size:13px; color:var(--gray); font-weight:700; margin-top:5px;}
  .mini-btn{border:none; background:var(--blue); color:#fff; font-weight:800; font-size:14px; padding:10px 16px; border-radius:12px; cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .mini-btn:active{background:var(--blue-press);}
  .mini-btn.done{background:var(--line); color:var(--gray2);}
  .mini-btn.off{background:var(--field); color:var(--gray3);}

  /* ===================== CTA ===================== */
  .cta-wrap{position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none; display:flex; justify-content:center;}
  .cta-inner{width:100%; max-width:460px; padding:12px 16px calc(14px + var(--safe-b));
    background:linear-gradient(180deg,rgba(242,244,246,0) 0%,var(--bg) 32%); pointer-events:auto;}
  .cta{width:100%; border:none; color:#fff; font-size:17px; font-weight:900; padding:17px; border-radius:16px; cursor:pointer; letter-spacing:-.02em;
    background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 8px 24px rgba(49,130,246,.34); transition:transform .08s;}
  .cta:active{transform:translateY(1px);}
  .cta .yr{font-size:12px; font-weight:700; opacity:.85; display:block; margin-top:2px;}

  /* ===================== SHEET ===================== */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; opacity:0; pointer-events:none; transition:.25s;}
  .scrim.on{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; margin:0 auto; max-width:460px;
    background:var(--card); border-radius:24px 24px 0 0; padding:8px 20px calc(20px + var(--safe-b));
    transform:translateY(110%); transition:transform .3s cubic-bezier(.2,.9,.2,1); box-shadow:0 -8px 30px rgba(0,0,0,.12); max-height:92vh; overflow-y:auto;}
  .sheet.on{transform:translateY(0);}
  .grab{width:40px; height:4px; background:var(--line); border-radius:999px; margin:6px auto 14px;}
  .sh-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .sh-head .nm{font-size:18px; font-weight:800;}
  .sh-head .px{font-size:13px; color:var(--gray); font-weight:700; margin-top:2px;}
  .sh-head .chg{font-size:13px; font-weight:800;}
  .chart-wrap{background:var(--field); border-radius:16px; padding:10px 8px 6px; margin-bottom:12px;}
  .chart{width:100%; height:120px; display:block;}
  .chart-lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--gray2); font-weight:700; padding:2px 6px 0;}
  .pos{display:flex; gap:8px; margin-bottom:12px;}
  .pos .c{flex:1; background:var(--field); border-radius:12px; padding:10px 6px; text-align:center;}
  .pos .k{font-size:11px; color:var(--gray2); font-weight:700;}
  .pos .v{font-size:14px; font-weight:800; margin-top:3px;}
  .pos .v.up{color:var(--red);} .pos .v.down{color:var(--blue);}
  .qty{display:flex; align-items:center; justify-content:space-between; background:var(--field); border-radius:16px; padding:8px 10px; margin-bottom:12px;}
  .qty button{width:44px; height:44px; border:none; background:var(--card); border-radius:12px; font-size:22px; font-weight:700; color:var(--ink); box-shadow:var(--shadow); cursor:pointer;}
  .qty .q{font-size:24px; font-weight:800;} .qty .q small{font-size:13px; color:var(--gray2); font-weight:700; margin-left:3px;}
  .quicks{display:flex; gap:7px; margin-bottom:14px;}
  .quicks button{flex:1; border:none; background:var(--field); color:var(--gray); font-weight:700; font-size:13px; padding:11px 0; border-radius:12px; cursor:pointer;}
  .quicks button:active{background:var(--blue-weak); color:var(--blue);}
  .sh-info{display:flex; justify-content:space-between; font-size:14px; font-weight:600; color:var(--gray); padding:6px 2px;}
  .sh-info b{color:var(--ink); font-weight:800;}
  .sh-actions{display:flex; gap:10px; margin-top:14px;}
  .sh-actions button{flex:1; border:none; padding:16px; border-radius:15px; font-size:16px; font-weight:800; cursor:pointer;}
  .btn-buy{background:var(--red); color:#fff;} .btn-sell{background:var(--blue); color:#fff;}
  .btn-buy:disabled,.btn-sell:disabled{background:var(--line); color:var(--gray3); cursor:default;}

  /* ===================== MODAL ===================== */
  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(0,0,0,.5);}
  .modal.on{display:flex;}
  .modal .box{width:100%; max-width:360px; background:var(--card); border-radius:26px; padding:30px 24px 22px; text-align:center; animation:pop .3s cubic-bezier(.2,1.2,.4,1); position:relative; z-index:2;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .emo{font-size:56px;} .modal .emo.big{font-size:70px;}
  .modal .tt{font-size:21px; font-weight:900; margin:12px 0 6px;}
  .modal .dc{font-size:14.5px; color:var(--gray); font-weight:600; line-height:1.5;}
  .modal .impact{font-size:18px; font-weight:900; margin:14px 0 4px;}
  .impact.up{color:var(--red);} .impact.down{color:var(--blue);} .impact.gold{color:var(--gold);}
  .modal .ok{margin-top:18px; width:100%; border:none; color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:15px; cursor:pointer; background:linear-gradient(135deg,#3182F6,#4c8dff);}
  .modal .ok.ghost{background:var(--field); color:var(--gray); margin-top:8px;}
  .choice-opts{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  .choice-opts button{border:2px solid var(--line); background:var(--card); border-radius:16px; padding:15px; font-size:15px; font-weight:800; color:var(--ink); cursor:pointer; text-align:left; transition:.12s;}
  .choice-opts button:active{border-color:var(--blue); background:var(--blue-weak);}
  .choice-opts button small{display:block; font-size:12px; font-weight:600; color:var(--gray2); margin-top:3px;}
  .stat-grid{display:flex; gap:10px; margin:16px 0 4px;}
  .stat-grid .s{flex:1; background:var(--field); border-radius:14px; padding:12px 6px;}
  .stat-grid .s .k{font-size:11px; color:var(--gray2); font-weight:700;}
  .stat-grid .s .v{font-size:15px; font-weight:800; margin-top:3px;}
  .legacy-earn{margin-top:14px; font-size:14px; font-weight:800; color:var(--gold); background:#fff7e6; border-radius:14px; padding:12px;}

  #confetti{position:fixed; inset:0; z-index:61; pointer-events:none; display:none;}
  #confetti.on{display:block;}
  .toast{position:fixed; left:50%; bottom:160px; translate:-50% 0; background:rgba(25,31,40,.92); color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:14px; z-index:70; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;}
  .toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <!-- ============ HOME ============ -->
  <div class="screen on" id="home"></div>

  <!-- ============ GAME ============ -->
  <div class="screen" id="game">
    <div class="topbar">
      <div class="brand">머니<span>로드</span></div>
      <div class="top-right">
        <div class="date-chip" id="dateChip">27세</div>
        <button class="icon-btn" id="muteBtn">🔊</button>
        <button class="icon-btn" id="homeBtn">🏠</button>
      </div>
    </div>
    <div class="hero">
      <div class="label">순자산</div>
      <div class="net"><span id="netWorth">0원</span><span class="delta" id="netDelta"></span></div>
      <svg class="spark" id="spark" viewBox="0 0 420 52" preserveAspectRatio="none"></svg>
      <div class="breakdown">
        <div class="bd"><div class="k">현금</div><div class="v" id="bdCash">0원</div></div>
        <div class="bd"><div class="k">투자자산</div><div class="v" id="bdStock">0원</div></div>
        <div class="bd"><div class="k">부채</div><div class="v debt" id="bdDebt">0원</div></div>
      </div>
    </div>
    <div class="fire">
      <div class="row"><div class="t">🔥 <b>파이어족</b>까지</div><div class="pct" id="firePct">0%</div></div>
      <div class="bar"><i id="fireBar"></i></div>
      <div class="sub" id="fireSub"></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="stock">📈 투자</button>
      <button class="tab" data-tab="life">🏡 인생</button>
    </div>
    <div class="panel" id="panelStock"></div>
    <div class="panel hide" id="panelLife"></div>

    <div class="cta-wrap"><div class="cta-inner">
      <button class="cta" id="nextBtn">다음 달로 <span class="yr" id="ctaYr"></span></button>
    </div></div>
  </div>
</div>

<!-- trade sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head">
    <div class="logo" id="shLogo"></div>
    <div style="flex:1"><div class="nm" id="shName"></div><div class="px" id="shPx"></div></div>
    <div class="chg" id="shChg"></div>
  </div>
  <div class="chart-wrap">
    <svg class="chart" id="chart" viewBox="0 0 400 120" preserveAspectRatio="none"></svg>
    <div class="chart-lbl"><span id="chLo"></span><span id="chHi"></span></div>
  </div>
  <div class="pos" id="posBox"></div>
  <div class="qty">
    <button id="qMinus">−</button>
    <div class="q"><span id="qNum">0</span><small>주</small></div>
    <button id="qPlus">+</button>
  </div>
  <div class="quicks">
    <button data-q="1">+1</button><button data-q="10">+10</button>
    <button data-q="100">+100</button><button data-q="max" id="qMax">최대</button>
  </div>
  <div class="sh-info"><span>주문 금액</span><b id="shTotal">0원</b></div>
  <div class="sh-info"><span>주문 후 현금</span><b id="shBal">0원</b></div>
  <div class="sh-actions">
    <button class="btn-buy" id="doBuy">매수</button>
    <button class="btn-sell" id="doSell">매도</button>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const RUN_KEY='moneyroad_run_v2', META_KEY='moneyroad_meta_v2';

/* ---------- format ---------- */
function fmtWon(v){
  const neg=v<0; let x=Math.round(Math.abs(v));
  if(x<10000) return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000), man=Math.floor((x%100000000)/10000);
  let s=''; if(eok)s+=eok+'억'; if(man)s+=(s?' ':'')+man.toLocaleString()+'만';
  return (neg?'-':'')+s+'원';
}
const won=n=>Math.round(n).toLocaleString()+'원';
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* ---------- audio ---------- */
let AC=null;
function beep(freq,dur,type='sine',vol=.15){
  if(META.mute) return;
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(vol,AC.currentTime); g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+dur);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

let S=null;
function startRun(){
  const cash=20000000 + perkLv('seed')*10000000;
  const salary=2700000 + perkLv('sal')*200000;
  const expense=1700000 - perkLv('save')*80000;
  S={month:0, cash, salary, baseExpense:expense,
     hold:{}, avg:{}, price:{}, phist:{},
     car:false, married:false, home:null,
     prevNet:null, hist:[], maxNet:cash, tab:'stock'};
  STOCKS.forEach(s=>{ S.hold[s.id]=0; S.avg[s.id]=0; S.price[s.id]=s.price;
    // seed 8 past points for a lively chart
    let arr=[], x=s.price;
    for(let i=0;i<8;i++){ arr.unshift(Math.max(1000,Math.round(x))); x=x/(1+ s.vol*0.5*randn()); }
    arr.push(s.price); S.phist[s.id]=arr;
  });
  S.hist=[netWorth()];
  META.runs++; saveMeta(); saveRun();
  showScreen('game'); render();
}
function loadRun(){try{const r=localStorage.getItem(RUN_KEY);if(r){S=JSON.parse(r);return true;}}catch(e){}return false;}

/* ---------- derived ---------- */
function portfolio(){return STOCKS.reduce((a,s)=>a+S.hold[s.id]*S.price[s.id],0);}
function debt(){return S.home?S.home.loan:0;}
function netWorth(){const eq=S.home?S.home.value-S.home.loan:0;return S.cash+portfolio()+eq;}
function monthlyExpense(){let e=S.baseExpense;e+=S.home?200000:600000;if(S.car)e+=150000;if(S.married)e+=800000;return e;}
function fireTarget(){return monthlyExpense()*12*25;}
function overdraft(){return -(20000000 + perkLv('credit')*15000000);}
function info(){return {age:27+Math.floor(S.month/12), y:2026+Math.floor(S.month/12), m:S.month%12+1};}

/* ================= advance ================= */
function advance(){
  sfx.next();
  S.prevNet=netWorth();
  S.cash+=S.salary;
  if(S.married)S.cash+=2500000;
  STOCKS.forEach(s=>{if(s.div)S.cash+=S.hold[s.id]*S.price[s.id]*s.div;});
  if(S.home&&S.home.loan>0){const it=S.home.loan*0.04/12;const pr=Math.min(S.home.loan,500000);S.home.loan-=pr;S.cash-=it+pr;}
  S.cash-=monthlyExpense();
  if(S.cash<0)S.cash-=(-S.cash)*0.006;
  STOCKS.forEach(s=>{let r=s.drift+s.vol*randn();S.price[s.id]=Math.max(1000,Math.round(S.price[s.id]*(1+r)));});
  if(S.home)S.home.value=Math.round(S.home.value*(1+0.003+0.004*randn()));
  // event
  let ev=null;
  const roll=Math.random();
  if(roll<0.30){ ev=EVENTS[Math.floor(Math.random()*EVENTS.length)]; applyEvent(ev); }
  STOCKS.forEach(s=>{S.phist[s.id].push(S.price[s.id]); if(S.phist[s.id].length>48)S.phist[s.id].shift();});
  S.month++;
  const net=netWorth();
  if(net>S.maxNet)S.maxNet=net;
  S.hist.push(net); if(S.hist.length>60)S.hist.shift();
  saveRun(); render(true);
  // resolve outcomes
  if(net>=fireTarget()){endRun('fire');return;}
  if(S.cash<overdraft()){endRun('bankrupt');return;}
  if(S.month>=396){endRun('retire');return;} // 60세
  if(ev){ showEvent(ev); return; }
  if(roll>=0.30 && roll<0.55){ showChoice(CHOICES[Math.floor(Math.random()*CHOICES.length)]); }
}
function applyEvent(ev){
  if(ev.s){
    let pct=ev.pct;
    if(ev.crash) pct*=(1 - perkLv('hedge')*0.15);
    if(ev.s==='all')STOCKS.forEach(s=>S.price[s.id]=Math.max(1000,Math.round(S.price[s.id]*(1+pct))));
    else S.price[ev.s]=Math.max(1000,Math.round(S.price[ev.s]*(1+pct)));
    ev._pct=pct;
  }
  if(ev.cash!==undefined){let a=ev.cash==='bonus'?S.salary*Math.ceil(1+Math.random()*2):ev.cash;ev._amt=a;S.cash+=a;}
}

let animRAF=null;
function animNum(el,from,to){
  cancelAnimationFrame(animRAF);
  const t0=performance.now(), dur=600;
  function step(t){const k=Math.min(1,(t-t0)/dur);const e=1-Math.pow(1-k,3);
    el.textContent=fmtWon(from+(to-from)*e); if(k<1)animRAF=requestAnimationFrame(step);}
  animRAF=requestAnimationFrame(step);
}
function render(animate){
  const {age,y,m}=info();
  $('dateChip').textContent=`${age}세 · ${y}.${String(m).padStart(2,'0')}`;
  $('ctaYr').textContent=`${y}년 ${m}월`;

  if(animate && S.prevNet!==null) animNum($('netWorth'),S.prevNet,net); else $('netWorth').textContent=fmtWon(net);
  const de=$('netDelta');
  if(S.prevNet!==null){const d=net-S.prevNet;de.textContent=(d>=0?'▲ ':'▼ ')+fmtWon(Math.abs(d));de.className='delta '+(d>=0?'up':'down');}
  else de.textContent='';
  $('bdCash').textContent=fmtWon(S.cash); $('bdCash').style.color=S.cash<0?'#ff8a94':'';
  $('bdStock').textContent=fmtWon(portfolio()+(S.home?S.home.value:0));
  $('bdDebt').textContent=fmtWon(debt());
  const tgt=fireTarget(), pct=Math.max(0,Math.min(100,net/tgt*100));
  $('firePct').textContent=Math.floor(pct)+'%'; $('fireBar').style.width=pct+'%';
  $('fireSub').textContent=`목표 ${fmtWon(tgt)} · 월 생활비 ${fmtWon(monthlyExpense())}`;
  drawSpark(); renderStocks(); renderLife();
}
function poly(hist,W,H,pad){
  const min=Math.min(...hist),max=Math.max(...hist),rng=(max-min)||1;
  return hist.map((v,i)=>[pad+i/(hist.length-1)*(W-2*pad), H-pad-(v-min)/rng*(H-2*pad)]);
}
function drawSpark(){
  const h=S.hist,svg=$('spark'); if(h.length<2){svg.innerHTML='';return;}
  const W=420,H=52,pts=poly(h,W,H,4);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const up=h[h.length-1]>=h[0], col=up?'#ff6b78':'#7fb0ff';
  svg.innerHTML=`<defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W-4} ${H} L4 ${H} Z" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
}

    const ay=H-8-(S.avg[id]-min)/rng*(H-16);
    if(ay>0&&ay<H)avgLine=`<line x1="8" y1="${ay.toFixed(1)}" x2="${W-8}" y2="${ay.toFixed(1)}" stroke="#8b95a1" stroke-width="1.2" stroke-dasharray="5 4"/>`;}
  svg.innerHTML=`<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${W-8} ${H} L8 ${H} Z" fill="url(#cg)"/>${avgLine}
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  $('chLo').textContent='최근 '+h.length+'개월'; $('chHi').textContent='고 '+won(Math.max(...h));
}
function renderPos(id){
  const p=S.price[id], own=S.hold[id];
  if(own<=0){$('posBox').innerHTML=`<div class="c"><div class="k">보유</div><div class="v">없음</div></div><div class="c"><div class="k">현금</div><div class="v">${fmtWon(S.cash)}</div></div>`;return;}
  const pl=(p-S.avg[id])*own, plp=(p-S.avg[id])/S.avg[id]*100, cls=pl>=0?'up':'down';
  $('posBox').innerHTML=`<div class="c"><div class="k">보유 ${own}주</div><div class="v">${fmtWon(own*p)}</div></div>
    <div class="c"><div class="k">평단가</div><div class="v">${won(S.avg[id])}</div></div>
    <div class="c"><div class="k">평가손익</div><div class="v ${cls}">${pl>=0?'+':''}${plp.toFixed(1)}%</div></div>`;
}
function updateSheet(){
  const p=S.price[sheetId]; $('qNum').textContent=qty;
  const total=qty*p; $('shTotal').textContent=won(total); $('shBal').textContent=fmtWon(S.cash-total);
  $('doBuy').disabled=!(qty>0&&total<=S.cash);
  $('doSell').disabled=!(qty>0&&qty<=S.hold[sheetId]);
}
function setQty(n){qty=Math.max(0,n);updateSheet();}
$('qPlus').onclick=()=>{sfx.click();setQty(qty+1);};
$('qMinus').onclick=()=>{sfx.click();setQty(qty-1);};
document.querySelectorAll('.quicks button').forEach(b=>b.onclick=()=>{sfx.click();
  if(b.dataset.q==='max')setQty(Math.floor(S.cash/S.price[sheetId])); else setQty(qty+parseInt(b.dataset.q));});
$('doBuy').onclick=()=>{const p=S.price[sheetId],total=qty*p;if(total>S.cash||qty<=0)return;
  const nn=S.hold[sheetId]+qty; S.avg[sheetId]=(S.avg[sheetId]*S.hold[sheetId]+p*qty)/nn; S.hold[sheetId]=nn; S.cash-=total;
  sfx.buy(); toast(`${STOCKS.find(s=>s.id===sheetId).name} ${qty}주 매수`); closeSheet(); saveRun(); render();};
$('doSell').onclick=()=>{if(qty<=0||qty>S.hold[sheetId])return; const p=S.price[sheetId];
  S.cash+=qty*p; S.hold[sheetId]-=qty; if(S.hold[sheetId]===0)S.avg[sheetId]=0;
  sfx.buy(); toast(`${STOCKS.find(s=>s.id===sheetId).name} ${qty}주 매도`); closeSheet(); saveRun(); render();};
$('scrim').onclick=closeSheet;

/* ================= event / choice ================= */
function showEvent(ev){
  sfx.event();
  let impact='';
  if(ev.s){const dir=ev._pct>0?'up':'down';impact=`<div class="impact ${dir}">${ev.s==='all'?'전체 시장':STOCKS.find(x=>x.id===ev.s).name} ${ev._pct>0?'+':''}${(ev._pct*100).toFixed(0)}%</div>`;}
  else if(ev._amt!==undefined){const dir=ev._amt>0?'up':'down';impact=`<div class="impact ${dir}">${ev._amt>0?'+':'-'}${fmtWon(Math.abs(ev._amt))}</div>`;}
  $('modalBox').innerHTML=`<div class="emo">${ev.emo}</div><div class="tt">${ev.t}</div><div class="dc">${ev.d}</div>${impact}<button class="ok" id="mOk">확인</button>`;
  $('modal').classList.add('on'); $('mOk').onclick=()=>{sfx.click();$('modal').classList.remove('on');};
}
function showChoice(c){
  sfx.event();
  const opts=c.opts.map((o,i)=>`<button data-i="${i}">${o.l}${o.s?`<small>${o.s}</small>`:''}</button>`).join('');
  $('modalBox').innerHTML=`<div class="emo">${c.emo}</div><div class="tt">${c.t}</div><div class="dc">${c.d}</div><div class="choice-opts">${opts}</div>`;
  $('modal').classList.add('on');
  $('modalBox').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    sfx.click(); const o=c.opts[+b.dataset.i]; const res=o.f(S); saveRun(); render();
    const up = /^\+|당첨|없음/.test(res) && !/^-/.test(res);
    $('modalBox').innerHTML=`<div class="emo">${up?'✅':'📩'}</div><div class="tt">${o.l}</div><div class="impact ${/^-/.test(res)?'down':'up'}">${res}</div><button class="ok" id="mOk2">확인</button>`;
    $('mOk2').onclick=()=>{sfx.click();$('modal').classList.remove('on');};
  });
}

/* ================= endings ================= */
function endRun(type){
  const {age,y}=info(), net=netWorth();
  let rank,earn=Math.floor(S.maxNet/30000000);
  if(type==='fire'){earn+=5; sfx.win(); confetti();
    rank= age<35?{e:'👑',t:'전설의 파이어족',d:`${age}세, 남들보다 훨씬 빠르게 경제적 자유를 이뤘어요.`}
        : age<45?{e:'🔥',t:'젊은 파이어족',d:`${age}세에 파이어를 달성했어요. 대단해요!`}
        :         {e:'🌴',t:'파이어족 달성',d:`${age}세, 마침내 경제적 자유를 얻었어요.`};
  }else if(type==='retire'){ sfx.win();
    rank= net>=500000000?{e:'🏆',t:'풍족한 은퇴',d:'60세, 여유로운 노후를 맞이했어요.'}
        : net>=100000000?{e:'🙂',t:'평범한 은퇴',d:'60세, 무난한 노후를 준비했어요.'}
        :                 {e:'😅',t:'빠듯한 노후',d:'60세, 조금 아쉬운 은퇴네요.'};
  }else{ sfx.lose(); earn=Math.max(0,earn-1);
    rank={e:'💸',t:'파산',d:'마이너스통장 한도를 초과했어요. 다음엔 현금을 남겨두세요!'};
  }
  META.legacy+=earn;
  if(net>META.best.net){META.best={net, ending:rank.t, age};}
  saveMeta(); clearRun();
  $('modalBox').innerHTML=`<div class="emo big">${rank.e}</div><div class="tt">${rank.t}</div><div class="dc">${rank.d}</div>
    <div class="stat-grid"><div class="s"><div class="k">최종 순자산</div><div class="v">${fmtWon(net)}</div></div><div class="s"><div class="k">달성 나이</div><div class="v">${age}세</div></div></div>
    <div class="legacy-earn">🧬 유산 포인트 +${earn} 획득!</div>
    <button class="ok" id="mHome">홈으로</button>`;
  $('modal').classList.add('on');
  $('mHome').onclick=()=>{sfx.click();$('modal').classList.remove('on');$('confetti').classList.remove('on');showScreen('home');renderHome();};
}

/* ================= confetti ================= */
function confetti(){
  const cv=$('confetti'); cv.classList.add('on');
  const ctx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
  const cols=['#3182F6','#00c471','#ffb020','#f04452','#7a5cff','#00c2ff'];
  let ps=[]; for(let i=0;i<140;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,
    vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3});
  let t0=performance.now();
  (function loop(t){ctx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});
    if(t-t0<4000 && cv.classList.contains('on'))requestAnimationFrame(loop); else ctx.clearRect(0,0,cv.width,cv.height);
  })(t0);
}

/* ================= HOME ================= */
function renderHome(){
  const b=META.best;
  const perksHtml=PERKS.map(p=>{
    const lv=perkLv(p.id), cost=p.cost(lv), maxed=lv>=p.max, can=META.legacy>=cost;
    const dots=Array.from({length:p.max},(_,i)=>`<i class="${i<lv?'f':''}"></i>`).join('');
    let btn = maxed?`<button class="perk-buy max">MAX</button>`
      : can?`<button class="perk-buy" data-perk="${p.id}">🧬 ${cost}</button>`
      : `<button class="perk-buy no">🧬 ${cost}</button>`;
    return `<div class="perk"><div class="emo">${p.emo}</div>
      <div class="mid"><div class="nm">${p.nm} <span style="color:var(--gray3);font-size:12px">Lv.${lv}</span></div>
        <div class="ds">${p.ds}</div><div class="dots">${dots}</div></div>${btn}</div>`;
  }).join('');
  $('home').innerHTML=`
    <div class="home-hero">
      <div class="home-emoji">🔥💰</div>
      <div class="home-logo">머니로드</div>
      <div class="home-tag">투자로 인생을 키우고 파이어족에 도전하세요</div>
    </div>
    <div class="record"><div class="rt">🏅 최고 기록</div>
      <div class="rec-grid">
        <div class="c"><div class="k">최고 순자산</div><div class="v">${b.net?fmtWon(b.net):'-'}</div></div>
        <div class="c"><div class="k">최고 엔딩</div><div class="v">${b.ending}</div></div>
        <div class="c"><div class="k">플레이</div><div class="v">${META.runs}판</div></div>
      </div></div>
    <div class="legacy-head"><div class="t">🧬 유산 상점</div><div class="legacy-bal">보유 ${META.legacy} P</div></div>
    <div style="font-size:12.5px;color:var(--gray2);font-weight:600;margin:0 4px 12px">판을 거듭할수록 강해집니다. 유산 포인트로 다음 판을 유리하게!</div>
    ${perksHtml}
    <button class="start-btn" id="startBtn">게임 시작<small>27세 · 현금 ${fmtWon(20000000+perkLv('seed')*10000000)}로 시작</small></button>
    <div style="text-align:center;font-size:11px;color:var(--gray3);margin-top:18px;font-weight:600">첫 판은 하드코어! 파산해도 유산은 쌓여요 🧬</div>`;
  $('startBtn').onclick=()=>{sfx.click();
    if(loadRunExists()){ confirmModal('이어서 할까요?','진행 중인 게임이 있어요.','이어하기','새 게임',()=>{loadRun();showScreen('game');render();},()=>{startRun();}); }
    else startRun();
  };
  $('home').querySelectorAll('[data-perk]').forEach(n=>n.onclick=()=>buyPerk(n.dataset.perk));
}
function loadRunExists(){try{return !!localStorage.getItem(RUN_KEY);}catch(e){return false;}}
function buyPerk(id){
  const p=PERKS.find(x=>x.id===id), lv=perkLv(id); if(lv>=p.max)return;
  const cost=p.cost(lv); if(META.legacy<cost){toast('유산 포인트가 부족해요');return;}
  META.legacy-=cost; META.perks[id]=lv+1; saveMeta(); sfx.cash(); toast(`${p.nm} Lv.${lv+1} 강화!`); renderHome();
}

/* ================= misc ui ================= */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
let toastT; function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600);}
function confirmModal(t,d,yes,no,onYes,onNo){
  $('modalBox').innerHTML=`<div class="emo">🎮</div><div class="tt">${t}</div><div class="dc">${d}</div><button class="ok" id="cY">${yes}</button><button class="ok ghost" id="cN">${no}</button>`;
  $('modal').classList.add('on');
  $('cY').onclick=()=>{sfx.click();$('modal').classList.remove('on');onYes();};
  $('cN').onclick=()=>{sfx.click();$('modal').classList.remove('on');onNo();};
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{sfx.click();S.tab=t.dataset.tab;saveRun();
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));
  $('panelStock').classList.toggle('hide',S.tab!=='stock'); $('panelLife').classList.toggle('hide',S.tab!=='life');});
$('nextBtn').onclick=advance;
$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';if(!META.mute)sfx.click();};
$('homeBtn').onclick=()=>{confirmModal('홈으로 나갈까요?','진행 상황은 저장돼요. 언제든 이어서 할 수 있어요.','나가기','계속하기',()=>{saveRun();showScreen('home');renderHome();},()=>{});};

/* ================= boot ================= */
loadMeta();
$('muteBtn').textContent=META.mute?'🔇':'🔊';
renderHome();
showScreen('home');
</script>
</body>
