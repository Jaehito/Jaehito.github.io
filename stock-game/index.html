<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 인생 투자 시뮬레이션</title>
<meta name="description" content="주식 투자로 인생 목표를 이루고 나만의 엔딩에 도달하는 로그라이크 인생 시뮬레이션 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00c471; --gold:#ffb020;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; letter-spacing:-.02em; overflow-x:hidden;
    overscroll-behavior-y:contain;}
  html{overscroll-behavior-y:contain;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative;}
  .screen{display:none;} .screen.on{display:block;}
  #game{padding-bottom:calc(120px + var(--safe-b));}

  /* HOME */
  #home{padding:0 20px calc(40px + var(--safe-b)); min-height:100vh; background:radial-gradient(1200px 500px at 50% -10%, #dbe9ff 0%, var(--bg) 55%);}
  .home-hero{padding:52px 4px 18px; text-align:center;}
  .home-emoji{font-size:58px; margin-bottom:6px; filter:drop-shadow(0 8px 16px rgba(49,130,246,.25));}
  .home-logo{font-size:44px; font-weight:900; letter-spacing:-.04em; background:linear-gradient(135deg,#3182F6,#00c2ff 60%,#7a5cff); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;}
  .home-tag{font-size:15px; color:var(--gray); font-weight:600; margin-top:8px;}
  .record{background:var(--card); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow); margin-bottom:14px;}
  .record .rt{font-size:13px; font-weight:800; color:var(--gray2); margin-bottom:12px;}
  .rec-grid{display:flex; gap:10px;}
  .rec-grid .c{flex:1; text-align:center; background:var(--field); border-radius:14px; padding:12px 4px;}
  .rec-grid .k{font-size:11px; color:var(--gray2); font-weight:700;}
  .rec-grid .v{font-size:15px; font-weight:800; margin-top:4px; letter-spacing:-.03em;}
  .legacy-head{display:flex; align-items:center; justify-content:space-between; margin:22px 4px 12px;}
  .legacy-head .t{font-size:17px; font-weight:800;}
  .legacy-bal{font-size:14px; font-weight:800; color:var(--gold); background:#fff7e6; padding:6px 12px; border-radius:999px;}
  .perk{background:var(--card); border-radius:16px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px; display:flex; align-items:center; gap:12px;}
  .perk .emo{font-size:26px; width:46px; height:46px; border-radius:13px; background:var(--field); display:grid; place-items:center; flex-shrink:0;}
  .perk .mid{flex:1; min-width:0;} .perk .nm{font-size:14.5px; font-weight:800;} .perk .ds{font-size:12px; color:var(--gray2); font-weight:600; margin-top:2px;}
  .dots{display:flex; gap:4px; margin-top:6px;} .dots i{width:16px; height:5px; border-radius:3px; background:var(--line);} .dots i.f{background:linear-gradient(90deg,#3182F6,#00c2ff);}
  .perk-buy{border:none; border-radius:12px; padding:9px 12px; font-size:12.5px; font-weight:800; cursor:pointer; white-space:nowrap; flex-shrink:0; background:#fff7e6; color:var(--gold);}
  .perk-buy.max{background:var(--line); color:var(--gray2);} .perk-buy.no{background:var(--field); color:var(--gray3);}
  .start-btn{width:100%; border:none; border-radius:18px; padding:18px; margin-top:20px; cursor:pointer; font-size:18px; font-weight:900; color:#fff; background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 10px 28px rgba(49,130,246,.36);}
  .start-btn:active{transform:translateY(1px);} .start-btn small{display:block; font-size:12px; font-weight:700; opacity:.85; margin-top:3px;}

  /* GAME HEADER */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px;}
  .topbar .brand{font-size:18px; font-weight:800;} .topbar .brand span{color:var(--blue);}
  .top-right{display:flex; gap:8px; align-items:center;}
  .date-chip{font-size:13px; font-weight:700; color:var(--gray); background:var(--card); padding:7px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .icon-btn{border:none; background:var(--card); color:var(--gray); width:36px; height:36px; border-radius:12px; font-size:15px; box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer;}
  .hero{padding:14px 20px 8px; position:relative; border-radius:24px; margin:0 12px; background:linear-gradient(135deg,#0b1b3a 0%,#12336e 55%,#1d4fb0 100%); color:#fff; overflow:hidden;}
  .hero::after{content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,#4c8dff55,transparent 70%);}
  .hero-top{display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1;}
  .hero-id{display:flex; align-items:center; gap:9px;}
  .hero-emo{font-size:24px;}
  .hero-nm{font-size:15px; font-weight:800;}
  .hero-own{font-size:11.5px; color:#9fc0ff; font-weight:600; margin-top:2px;}
  .hero-net{font-size:11.5px; color:#9fc0ff; font-weight:700; text-align:right;}
  .hero-net b{display:block; color:#fff; font-size:13.5px; font-weight:800; margin-top:2px;}
  .hero-price-row{display:flex; align-items:baseline; gap:10px; margin-top:10px; position:relative; z-index:1;}
  .hero-price{font-size:31px; font-weight:900; letter-spacing:-.04em;}
  .hero-chg{font-size:14px; font-weight:800;}
  .hero-chg.up{color:#ff6b78;} .hero-chg.down{color:#7fb0ff;} .hero-chg.flat{color:#c7d4ea;}
  .hero-chart{width:100%; height:86px; display:block; margin-top:4px; position:relative; z-index:1;}
  .hero-range{display:flex; justify-content:space-between; font-size:11px; color:#9fc0ff; font-weight:700; padding:2px 2px 2px; position:relative; z-index:1;}
  /* 짧은 화면에서는 차트를 줄여 종목 카드가 접히지 않게 */
  @media (max-height:760px){
    .hero{padding:11px 18px 6px;}
    .hero-chart{height:58px;}
    .hero-price{font-size:26px;}
    .hero-price-row{margin-top:6px;}
    .hero-range{display:none;}
    .stock{padding:8px 12px; margin-bottom:6px;}
    .logo{width:34px; height:34px; font-size:17px; border-radius:11px;}
    .tabs{padding:8px 20px 6px;}
  }
  .goal-strip{margin:10px 20px 0; padding:0 2px;}
  .gs-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px;}
  .gs-name{font-size:12.5px; font-weight:800; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .gs-pct{font-size:12.5px; font-weight:800; color:var(--blue); flex-shrink:0;}
  .gs-bar{height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .gs-bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#3182F6,#00c2ff); transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .net-card{margin:14px 20px 4px; background:var(--card); border-radius:16px; padding:14px; box-shadow:var(--shadow);}
  .net-card-top{display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:12.5px; font-weight:800; color:var(--gray2); margin-bottom:9px;}
  .nc-goal{font-weight:600; color:var(--gray3); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .breakdown{display:flex; gap:8px;}
  .bd{flex:1; background:var(--field); border-radius:12px; padding:9px 10px; text-align:center;}
  .bd .k{font-size:11px; color:var(--gray2); font-weight:700;} .bd .v{font-size:13.5px; font-weight:800; margin-top:3px; color:var(--ink);} .bd .v.debt{color:var(--red);}

  .bar{height:10px; background:var(--line); border-radius:999px; overflow:hidden;}
  .bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,#3182F6,#00c2ff); transition:width .6s cubic-bezier(.2,.8,.2,1);}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
  .chip{font-size:11.5px; font-weight:800; padding:5px 10px; border-radius:999px; background:var(--field); color:var(--gray3); transition:.2s;}
  .chip.on{color:#fff;}
  .chip.on.invest{background:#3182F6;} .chip.on.realty{background:#00b894;} .chip.on.career{background:#7a5cff;}
  .chip.on.family{background:#ff7a9c;} .chip.on.exp{background:#ff9f43;} .chip.on.biz{background:#e17055;}

  .tabs{display:flex; gap:6px; padding:11px 20px 7px;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:14px; font-size:14px; font-weight:800; color:var(--gray2); background:transparent; border:none; cursor:pointer; transition:.15s;}
  .tab.on{background:var(--ink); color:#fff;}
  .panel{padding:4px 16px;} .panel.hide{display:none;}
  .section-title{font-size:13px; font-weight:800; color:var(--gray2); margin:14px 6px 8px;}

  .stock{background:var(--card); border-radius:16px; padding:10px 14px; box-shadow:var(--shadow); margin-bottom:8px; display:flex; align-items:center; gap:11px; cursor:pointer; transition:transform .1s; animation:rise .4s backwards;}
  .stock:active{transform:scale(.985);}
  .stock.selected{box-shadow:0 0 0 2px var(--blue), 0 4px 20px rgba(0,0,0,.06);}
  .stock.locked,.life.locked{opacity:.55; cursor:default; background:var(--field); box-shadow:none;}
  .stock.locked:active,.life.locked:active{transform:none;}
  .stock.locked .own,.life.locked .ds{color:var(--gray3); font-weight:700;}
  .logo{width:38px; height:38px; border-radius:12px; display:grid; place-items:center; font-size:19px; flex-shrink:0;}
  .stock .mid{flex:1; min-width:0;} .stock .nm{font-size:15px; font-weight:800;}
  .stock .own{font-size:12px; color:var(--gray2); font-weight:600; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;} .stock .own b{color:var(--gray);} .stock .own .pl.up{color:var(--red);} .stock .own .pl.down{color:var(--blue);}
  .stock .mini-chart{width:48px; height:26px; flex-shrink:0;}
  .stock .rt{text-align:right; flex-shrink:0;}
  .stock .price{font-size:15px; font-weight:800; padding:2px 6px; border-radius:8px; display:inline-block;}
  .stock .price.flash-up{animation:flashUp .6s;} .stock .price.flash-down{animation:flashDown .6s;}
  .stock .chg{font-size:13px; font-weight:800; margin-top:2px;}
  .chg.up{color:var(--red);} .chg.down{color:var(--blue);} .chg.flat{color:var(--gray2);}
  @keyframes flashUp{0%{background:var(--red-weak);color:var(--red);}100%{background:transparent;}}
  @keyframes flashDown{0%{background:var(--blue-weak);color:var(--blue);}100%{background:transparent;}}
  @keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .life{background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:10px; display:flex; align-items:center; gap:14px; animation:rise .4s backwards;}
  .life .emo{font-size:30px; width:52px; height:52px; border-radius:16px; background:var(--field); display:grid; place-items:center; flex-shrink:0;}
  .life .mid{flex:1; min-width:0;} .life .nm{font-size:15px; font-weight:800;} .life .ds{font-size:12.5px; color:var(--gray2); font-weight:600; margin-top:3px; line-height:1.35;} .life .cost{font-size:13px; color:var(--gray); font-weight:700; margin-top:5px;}
  .mini-btn{border:none; background:var(--blue); color:#fff; font-weight:800; font-size:14px; padding:10px 16px; border-radius:12px; cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .mini-btn:active{background:var(--blue-press);} .mini-btn.done{background:var(--line); color:var(--gray2);} .mini-btn.off{background:var(--field); color:var(--gray3);}

  .cta-wrap{position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none; display:flex; justify-content:center;}
  .cta-inner{width:100%; max-width:460px; padding:10px 20px calc(14px + var(--safe-b)); background:linear-gradient(180deg,rgba(242,244,246,0) 0%,var(--bg) 32%); pointer-events:auto;}
  .cta{width:100%; border:none; color:#fff; cursor:pointer; padding:13px 16px; border-radius:16px; background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 8px 24px rgba(49,130,246,.34); transition:transform .08s; display:flex; align-items:center; gap:10px; text-align:left;}
  .cta:active{transform:translateY(1px);}
  .cta .tb-emo{font-size:24px; flex-shrink:0;}
  .cta .tb-mid{flex:1; min-width:0;}
  .cta .tb-nm{font-size:14.5px; font-weight:800; display:block;}
  .cta .tb-px{font-size:12px; font-weight:700; opacity:.85; display:block; margin-top:1px;}
  .cta .tb-cta{font-size:14.5px; font-weight:900; flex-shrink:0;}

  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; opacity:0; pointer-events:none; transition:.25s;} .scrim.on{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; margin:0 auto; max-width:460px; background:var(--card); border-radius:24px 24px 0 0; padding:8px 20px calc(20px + var(--safe-b)); transform:translateY(110%); transition:transform .3s cubic-bezier(.2,.9,.2,1); box-shadow:0 -8px 30px rgba(0,0,0,.12); max-height:92vh; overflow-y:auto; overscroll-behavior:contain; touch-action:pan-y;}
  .sheet.on{transform:translateY(0);}
  .grab{width:40px; height:4px; background:var(--line); border-radius:999px; margin:6px auto 14px;}
  .sh-head{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
  .sh-head .nm{font-size:18px; font-weight:800;} .sh-head .px{font-size:13px; color:var(--gray); font-weight:700; margin-top:2px;} .sh-head .chg{font-size:13px; font-weight:800;}
  .chart-wrap{background:var(--field); border-radius:16px; padding:10px 8px 6px; margin-bottom:12px;}
  .chart{width:100%; height:120px; display:block;} .chart-lbl{display:flex; justify-content:space-between; font-size:11px; color:var(--gray2); font-weight:700; padding:2px 6px 0;}
  .pos{display:flex; gap:8px; margin-bottom:12px;}
  .pos .c{flex:1; background:var(--field); border-radius:12px; padding:10px 6px; text-align:center;} .pos .k{font-size:11px; color:var(--gray2); font-weight:700;} .pos .v{font-size:14px; font-weight:800; margin-top:3px;} .pos .v.up{color:var(--red);} .pos .v.down{color:var(--blue);}
  .qty{display:flex; align-items:center; justify-content:space-between; background:var(--field); border-radius:16px; padding:8px 10px; margin-bottom:12px;}
  .qty button{width:44px; height:44px; border:none; background:var(--card); border-radius:12px; font-size:22px; font-weight:700; color:var(--ink); box-shadow:var(--shadow); cursor:pointer;} .qty .q{font-size:24px; font-weight:800;} .qty .q small{font-size:13px; color:var(--gray2); font-weight:700; margin-left:3px;}
  .quicks{display:flex; gap:7px; margin-bottom:14px;} .quicks button{flex:1; border:none; background:var(--field); color:var(--gray); font-weight:700; font-size:13px; padding:11px 0; border-radius:12px; cursor:pointer;} .quicks button:active{background:var(--blue-weak); color:var(--blue);}
  .sh-info{display:flex; justify-content:space-between; font-size:14px; font-weight:600; color:var(--gray); padding:6px 2px;} .sh-info b{color:var(--ink); font-weight:800;}
  .sh-actions{display:flex; gap:10px; margin-top:14px;} .sh-actions button{flex:1; border:none; padding:16px; border-radius:15px; font-size:16px; font-weight:800; cursor:pointer;}
  .btn-buy{background:var(--red); color:#fff;} .btn-sell{background:var(--blue); color:#fff;} .btn-buy:disabled,.btn-sell:disabled{background:var(--line); color:var(--gray3); cursor:default;}

  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(0,0,0,.5);} .modal.on{display:flex;}
  .modal .box{width:100%; max-width:360px; background:var(--card); border-radius:26px; padding:30px 24px 22px; text-align:center; animation:pop .3s cubic-bezier(.2,1.2,.4,1);}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .emo{font-size:56px;} .modal .emo.big{font-size:70px;}
  .modal .tt{font-size:21px; font-weight:900; margin:12px 0 6px;} .modal .dc{font-size:14.5px; color:var(--gray); font-weight:600; line-height:1.5;}
  .modal .impact{font-size:18px; font-weight:900; margin:14px 0 4px;} .impact.up{color:var(--red);} .impact.down{color:var(--blue);}
  .modal .tagline{font-size:13px; font-weight:800; color:var(--blue); margin-top:10px;}
  .modal .ok{margin-top:18px; width:100%; border:none; color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:15px; cursor:pointer; background:linear-gradient(135deg,#3182F6,#4c8dff);} .modal .ok.ghost{background:var(--field); color:var(--gray); margin-top:8px;}
  .choice-opts{display:flex; flex-direction:column; gap:10px; margin-top:18px;}
  .choice-opts button{border:2px solid var(--line); background:var(--card); border-radius:16px; padding:15px; font-size:15px; font-weight:800; color:var(--ink); cursor:pointer; text-align:left; transition:.12s;} .choice-opts button:active{border-color:var(--blue); background:var(--blue-weak);}
  .choice-opts button small{display:block; font-size:12px; font-weight:600; color:var(--gray2); margin-top:3px;}
  .stat-grid{display:flex; gap:10px; margin:16px 0 4px;} .stat-grid .s{flex:1; background:var(--field); border-radius:14px; padding:12px 6px;} .stat-grid .s .k{font-size:11px; color:var(--gray2); font-weight:700;} .stat-grid .s .v{font-size:15px; font-weight:800; margin-top:3px;}
  .lv-gain{margin-top:9px; font-size:13.5px; font-weight:700; color:var(--gray); background:var(--field); border-radius:12px; padding:10px 12px;}
  .lv-gain b{color:var(--blue); font-weight:800;}
  .legacy-earn{margin-top:14px; font-size:14px; font-weight:800; color:var(--gold); background:#fff7e6; border-radius:14px; padding:12px;}
  #confetti{position:fixed; inset:0; z-index:61; pointer-events:none; display:none;} #confetti.on{display:block;}
  .toast{position:fixed; left:50%; bottom:160px; translate:-50% 0; background:rgba(25,31,40,.92); color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:14px; z-index:70; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;} .toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="screen on" id="home"></div>
  <div class="screen" id="game">
    <div class="topbar">
      <div class="brand">머니<span>로드</span></div>
      <div class="top-right">
        <div class="date-chip" id="dateChip">27세</div>
        <button class="icon-btn" id="muteBtn">🔊</button>
        <button class="icon-btn" id="homeBtn">🏠</button>
      </div>
    </div>
    <div class="hero">
      <div class="hero-top">
        <div class="hero-id"><span class="hero-emo" id="heroEmo"></span><div><div class="hero-nm" id="heroNm"></div><div class="hero-own" id="heroOwn"></div></div></div>
        <div class="hero-net">순자산<b id="netWorthMini">0원</b></div>
      </div>
      <div class="hero-price-row"><span class="hero-price" id="heroPrice">0원</span><span class="hero-chg" id="heroChg"></span></div>
      <svg class="hero-chart" id="heroChart" viewBox="0 0 420 128" preserveAspectRatio="none"></svg>
      <div class="hero-range"><span id="heroLo"></span><span id="heroHi"></span></div>
    </div>
    <div class="goal-strip">
      <div class="gs-row"><span class="gs-name" id="goalName">—</span><span class="gs-pct" id="goalPct"></span></div>
      <div class="gs-bar"><i id="goalBar"></i></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-tab="stock">📈 투자</button>
      <button class="tab" data-tab="life">🏡 인생</button>
    </div>
    <div class="panel" id="panelStock"></div>
    <div class="panel hide" id="panelLife"></div>
    <div class="net-card">
      <div class="net-card-top"><span>자산 현황</span><span class="nc-goal" id="goalHint"></span></div>

function loadMeta(){try{const r=localStorage.getItem(META_KEY);if(r){META=JSON.parse(r);return;}}catch(e){}META={legacy:0,perks:{},best:{net:0,ending:'-',age:0},runs:0,mute:false};}

/* run */
let S=null;
function startRun(){
  S={month:0, cash:1000000+perkLv('seed')*2000000, salary:2000000+perkLv('sal')*100000, baseExpense:1000000-perkLv('save')*50000,
     hold:{}, avg:{}, price:{}, dayOpen:{}, phist:{}, car:false, married:false, home:null,
     prevNet:null, hist:[], maxNet:0, tab:'stock', featured:START_STOCKS[0],
     level:1, stocks:START_STOCKS.slice(), life:[],
     tags:{invest:0,realty:0,career:0,family:0,exp:0,biz:0}, travelCount:0, done:{}};
  STOCKS.forEach(s=>{S.hold[s.id]=0;S.avg[s.id]=0;S.price[s.id]=s.price;S.dayOpen[s.id]=s.price;let a=[],x=s.price;for(let i=0;i<8;i++){a.unshift(Math.max(1000,Math.round(x)));x=x/(1+s.vol*0.5*randn());}a.push(s.price);S.phist[s.id]=a;});
  S.maxNet=netWorth(); S.hist=[netWorth()];
  META.runs++; saveMeta(); saveRun(); showScreen('game'); render(); startLiveTicker(); startMonthTimer();
}
function loadRun(){try{const r=localStorage.getItem(RUN_KEY);if(r){S=JSON.parse(r);
  if(!S.dayOpen){S.dayOpen={};STOCKS.forEach(s=>S.dayOpen[s.id]=S.price[s.id]);}
  if(!S.level)S.level=1;
  if(!S.stocks)S.stocks=START_STOCKS.slice();
  if(!S.life)S.life=[];
  if(!S.featured||!S.stocks.includes(S.featured))S.featured=S.stocks[0];
  return true;}}catch(e){}return false;}
const stockUnlocked=id=>S.stocks.includes(id);
const lifeUnlocked=id=>S.life.includes(id);
function saveRun(){try{localStorage.setItem(RUN_KEY,JSON.stringify(S));}catch(e){}}
function clearRun(){try{localStorage.removeItem(RUN_KEY);}catch(e){}}
function loadRunExists(){try{return !!localStorage.getItem(RUN_KEY);}catch(e){return false;}}

function portfolio(){return STOCKS.reduce((a,s)=>a+S.hold[s.id]*S.price[s.id],0);}
function debt(){return S.home?S.home.loan:0;}
function netWorth(){const eq=S.home?S.home.value-S.home.loan:0;return S.cash+portfolio()+eq;}
function monthlyExpense(){let e=S.baseExpense;e+=S.home?150000:500000;if(S.car)e+=150000;if(S.married)e+=600000;return e;}
function fireTarget(){return monthlyExpense()*12*25;}
function overdraft(){return -(3000000+perkLv('credit')*1500000);}
function info(){return {age:27+Math.floor(S.month/12),y:2026+Math.floor(S.month/12),m:S.month%12+1};}

/* advance */
function advance(){
  sfx.next(); S.prevNet=netWorth();
  S.cash+=S.salary; if(S.married)S.cash+=1800000;
  STOCKS.forEach(s=>{if(s.div)S.cash+=S.hold[s.id]*S.price[s.id]*s.div;});
  if(S.home&&S.home.loan>0){const it=S.home.loan*0.04/12;const pr=Math.min(S.home.loan,500000);S.home.loan-=pr;S.cash-=it+pr;}
  S.cash-=monthlyExpense(); if(S.cash<0)S.cash-=(-S.cash)*0.006;
  STOCKS.forEach(s=>{let r=s.drift+s.vol*randn();S.price[s.id]=Math.max(1000,Math.round(S.price[s.id]*(1+r)));});
  if(S.home)S.home.value=Math.round(S.home.value*(1+0.003+0.004*randn()));
  STOCKS.forEach(s=>{S.dayOpen[s.id]=S.price[s.id];});
  let ev=null;const roll=Math.random();
  if(roll<0.30){ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];applyEvent(ev);}
  STOCKS.forEach(s=>{S.phist[s.id].push(S.price[s.id]);if(S.phist[s.id].length>48)S.phist[s.id].shift();});
  S.month++; const net=netWorth(); if(net>S.maxNet)S.maxNet=net;
  S.hist.push(net); if(S.hist.length>60)S.hist.shift();
  saveRun(); render();
  if(S.cash<overdraft()){endRun('bankrupt');return;}
  if(S.month>=396){endRun('retire');return;}
  // 레벨업 (해금 + 선택지). 선택 이벤트는 레벨업에서만 발생
  const nl=nextLevel();
  if(nl&&net>=nl.need){levelUp(nl);return;}
  // 경제적 자유 도달 → 은퇴 선언 분기 (파이어족 엔딩은 여기서만)
  if(!S.done.fire && net>=fireTarget()){S.done.fire=1;saveRun();showFireFork();return;}
  if(ev){showEvent(ev);return;}
}
function levelUp(nl){
  S.level=nl.lv;
  const gains=[];
  if(nl.stock&&!S.stocks.includes(nl.stock)){S.stocks.push(nl.stock);
    gains.push(`📈 새 종목 <b>${STOCKS.find(s=>s.id===nl.stock).name}</b> 해금`);}
  if(nl.life&&!S.life.includes(nl.life)){S.life.push(nl.life);
    gains.push(`🏡 인생 <b>${LIFE.find(l=>l.id===nl.life).nm}</b> 해금`);}
  if(nl.salary){S.salary+=nl.salary;gains.push(`💼 월급 <b>+${fmtWon(nl.salary)}</b>`);}
  saveRun();render();
  showLevelUp(nl,gains);
}

    if(ev.s==='all')STOCKS.forEach(s=>S.price[s.id]=Math.max(1000,Math.round(S.price[s.id]*(1+pct))));

function renderGoal(net){
  const setBar=pct=>{$('goalPct').textContent=Math.floor(pct)+'%';$('goalBar').style.width=pct+'%';};
  const nl=nextLevel();
  if(nl){
    const prev=LEVELS.find(l=>l.lv===S.level), from=prev?prev.need:0;
    const pct=Math.max(0,Math.min(100,(net-from)/(nl.need-from)*100));
    let reward='';
    if(nl.stock)reward=` · ${STOCKS.find(s=>s.id===nl.stock).emo} 새 종목`;
    else if(nl.life)reward=` · ${LIFE.find(l=>l.id===nl.life).emo} 인생 해금`;
    $('goalName').textContent=`Lv.${S.level} → Lv.${nl.lv}${reward}`;
    setBar(pct);
    $('goalHint').textContent=`${fmtWon(net)} / ${fmtWon(nl.need)}`;
  }else{
    const ft=fireTarget();
    $('goalName').textContent=S.done.fire?`🏁 Lv.${S.level} · 60세 은퇴까지`:`🔥 경제적 자유 (파이어)`;
    setBar(Math.max(0,Math.min(100,net/ft*100)));
    $('goalHint').textContent=S.done.fire?`${info().age}세 · 나만의 엔딩을 향해`:`목표 ${fmtWon(ft)}`;
  }
}

function poly(h,W,H,pad){const min=Math.min(...h),max=Math.max(...h),rng=(max-min)||1;return h.map((v,i)=>[pad+i/(h.length-1)*(W-2*pad),H-pad-(v-min)/rng*(H-2*pad)]);}
function chartMarkup(id,W,H,pad,prefix){

    if(ay>0&&ay<H)avgLine=`<line x1="${pad}" y1="${ay.toFixed(1)}" x2="${W-pad}" y2="${ay.toFixed(1)}" stroke="#8b95a1" stroke-width="1.2" stroke-dasharray="5 4"/>`;}
  return {markup:`<defs><linearGradient id="cg-${prefix}-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs><path d="${line} L${W-pad} ${H} L${pad} ${H} Z" fill="url(#cg-${prefix}-${id})"/>${avgLine}<path d="${line}" fill="none" stroke="${col}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`,h};
}

    {e:'🏘️',t:'부동산 재벌',d:'부동산으로 부를 일궜어요.',need:S.home&&S.home.value>=600000000,sc:t.realty*3+(S.home?S.home.value/100000000:0)},
    {e:'🏢',t:'대기업 임원',d:'커리어의 정점에 올랐어요.',need:S.salary>=6000000,sc:t.career*3+S.salary/1000000},
    {e:'🚀',t:'성공한 사업가',d:'사업으로 큰 성공을 거뒀어요.',need:S.tags.biz>0&&net>=400000000,sc:t.biz*4+net/200000000},
    {e:'👨‍👩‍👧‍👦',t:'화목한 가정',d:'돈보다 소중한 가족을 얻었어요.',need:S.married,sc:t.family*4+3},
    {e:'🌍',t:'세계여행가',d:'세계를 누비며 값진 경험을 쌓았어요.',need:S.travelCount>=3,sc:t.exp*3+S.travelCount},
    {e:'📊',t:'스마트 투자자',d:'현명한 투자로 자산을 크게 불렸어요.',need:net>=300000000,sc:t.invest*2+net/200000000},
  ].filter(c=>c.need).sort((a,b)=>b.sc-a.sc);
  if(cand.length&&cand[0].sc>=4){cand[0].bonus=4;return cand[0];}
  if(net>=100000000)return {e:'🙂',t:'평범한 은퇴',d:'무난하게 노후를 준비했어요.',bonus:1};
  return {e:'😅',t:'빠듯한 노후',d:'조금 아쉬운 은퇴네요. 다음 판을 노려봐요!',bonus:0};
}
function endRun(kind){
  stopLiveTicker();stopMonthTimer();
  const {age}=info(),net=netWorth();let rank,earn=Math.floor(S.maxNet/30000000),win=true;
  if(kind==='fire'){rank= age<35?{e:'👑',t:'전설의 파이어족',d:`${age}세, 남들보다 훨씬 빠르게 경제적 자유를 이뤘어요.`}:age<45?{e:'🔥',t:'젊은 파이어족',d:`${age}세에 파이어를 달성했어요!`}:{e:'🌴',t:'파이어족',d:`${age}세, 경제적 자유를 얻고 은퇴했어요.`};earn+=6;}
  else if(kind==='retire'){rank=judgeRetire();earn+=rank.bonus||0;}
  else{win=false;rank={e:'💸',t:'파산',d:'마이너스통장 한도를 초과했어요. 다음엔 현금을 남겨두세요!'};earn=Math.max(0,earn-1);}
  if(win){sfx.win();confetti();}else sfx.lose();
  META.legacy+=earn;
  if(net>META.best.net)META.best={net,ending:rank.t,age};
  saveMeta();clearRun();
  const paths=TAGDEF.filter(([k])=>S.tags[k]>0).sort((a,b)=>S.tags[b[0]]-S.tags[a[0]]).slice(0,3).map(([k,e,n])=>e+n).join(' · ')||'—';
  $('modalBox').innerHTML=`<div class="emo big">${rank.e}</div><div class="tt">${rank.t}</div><div class="dc">${rank.d}</div>
    <div class="stat-grid"><div class="s"><div class="k">최종 순자산</div><div class="v">${fmtWon(net)}</div></div><div class="s"><div class="k">나이</div><div class="v">${age}세</div></div></div>
    <div class="tagline">주요 성향 ${paths}</div>
    <div class="legacy-earn">🧬 유산 포인트 +${earn} 획득!</div>
    <button class="ok" id="mHome">홈으로</button>`;
  $('modal').classList.add('on');
  $('mHome').onclick=()=>{sfx.click();$('modal').classList.remove('on');$('confetti').classList.remove('on');showScreen('home');renderHome();};
}
function confetti(){const cv=$('confetti');cv.classList.add('on');const ctx=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#3182F6','#00c471','#ffb020','#f04452','#7a5cff','#00c2ff'];let ps=[];
  for(let i=0;i<140;i++)ps.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*0.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3});
  const t0=performance.now();(function loop(t){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.04;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();});if(t-t0<4000&&cv.classList.contains('on'))requestAnimationFrame(loop);else ctx.clearRect(0,0,cv.width,cv.height);})(t0);}

/* home */
function renderHome(){
  const b=META.best;
  const perksHtml=PERKS.map(p=>{const lv=perkLv(p.id),cost=p.cost(lv),maxed=lv>=p.max,can=META.legacy>=cost;
    const dots=Array.from({length:p.max},(_,i)=>`<i class="${i<lv?'f':''}"></i>`).join('');
    let btn=maxed?`<button class="perk-buy max">MAX</button>`:can?`<button class="perk-buy" data-perk="${p.id}">🧬 ${cost}</button>`:`<button class="perk-buy no">🧬 ${cost}</button>`;
    return `<div class="perk"><div class="emo">${p.emo}</div><div class="mid"><div class="nm">${p.nm} <span style="color:var(--gray3);font-size:12px">Lv.${lv}</span></div><div class="ds">${p.ds}</div><div class="dots">${dots}</div></div>${btn}</div>`;}).join('');
  $('home').innerHTML=`
    <div class="home-hero"><div class="home-emoji">💰🛣️</div><div class="home-logo">머니로드</div><div class="home-tag">투자로 인생 목표를 이루고<br>나만의 엔딩에 도달하세요</div></div>
    <div class="record"><div class="rt">🏅 최고 기록</div><div class="rec-grid">
      <div class="c"><div class="k">최고 순자산</div><div class="v">${b.net?fmtWon(b.net):'-'}</div></div>
      <div class="c"><div class="k">최고 엔딩</div><div class="v">${b.ending}</div></div>
      <div class="c"><div class="k">플레이</div><div class="v">${META.runs}판</div></div></div></div>
    <div class="legacy-head"><div class="t">🧬 유산 상점</div><div class="legacy-bal">보유 ${META.legacy} P</div></div>
    <div style="font-size:12.5px;color:var(--gray2);font-weight:600;margin:0 4px 12px">판을 거듭할수록 강해집니다. 유산 포인트로 다음 판을 유리하게!</div>
    ${perksHtml}
    <button class="start-btn" id="startBtn">게임 시작<small>27세 · 현금 ${fmtWon(20000000+perkLv('seed')*10000000)}로 시작</small></button>
    <div style="text-align:center;font-size:11px;color:var(--gray3);margin-top:18px;font-weight:600">엔딩은 8가지 이상! 파산해도 유산은 쌓여요 🧬</div>`;
  $('startBtn').onclick=()=>{sfx.click();
    if(loadRunExists())confirmModal('이어서 할까요?','진행 중인 게임이 있어요.','이어하기','새 게임',()=>{loadRun();showScreen('game');render();startLiveTicker();startMonthTimer();},()=>startRun());
    else startRun();};
  $('home').querySelectorAll('[data-perk]').forEach(n=>n.onclick=()=>buyPerk(n.dataset.perk));
}
function buyPerk(id){const p=PERKS.find(x=>x.id===id),lv=perkLv(id);if(lv>=p.max)return;const cost=p.cost(lv);if(META.legacy<cost){toast('유산 포인트가 부족해요');return;}META.legacy-=cost;META.perks[id]=lv+1;saveMeta();sfx.cash();toast(`${p.nm} Lv.${lv+1} 강화!`);renderHome();}

/* misc */
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1600);}
function confirmModal(t,d,yes,no,onYes,onNo){$('modalBox').innerHTML=`<div class="emo">🎮</div><div class="tt">${t}</div><div class="dc">${d}</div><button class="ok" id="cY">${yes}</button><button class="ok ghost" id="cN">${no}</button>`;$('modal').classList.add('on');$('cY').onclick=()=>{sfx.click();$('modal').classList.remove('on');onYes();};$('cN').onclick=()=>{sfx.click();$('modal').classList.remove('on');onNo();};}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{sfx.click();S.tab=t.dataset.tab;saveRun();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));$('panelStock').classList.toggle('hide',S.tab!=='stock');$('panelLife').classList.toggle('hide',S.tab!=='life');});
$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';if(!META.mute)sfx.click();};
$('homeBtn').onclick=()=>confirmModal('홈으로 나갈까요?','진행 상황은 저장돼요. 언제든 이어서 할 수 있어요.','나가기','계속하기',()=>{stopLiveTicker();stopMonthTimer();saveRun();showScreen('home');renderHome();},()=>{});
$('tradeBtn').onclick=()=>{sfx.click();openSheet(S.featured);};

/* boot — 시작 화면 없이 바로 게임. 기록/유산상점은 엔딩 후에만 */
loadMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';renderHome();
if(loadRunExists()&&loadRun()){showScreen('game');render();startLiveTicker();startMonthTimer();}
else startRun();
</script>
</body>
</html>
