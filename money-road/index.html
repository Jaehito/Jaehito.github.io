<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 단타 게임</title>
<meta name="description" content="10만원 시드로 시작해서 15초 단타로 자산을 불리는 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00c471; --gold:#ffb020;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; letter-spacing:-.02em; overflow-x:hidden;
    overscroll-behavior-y:contain;}
  html{overscroll-behavior-y:contain;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(24px + var(--safe-b));}

  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px;}
  .topbar .brand{font-size:18px; font-weight:800;} .topbar .brand span{color:var(--blue);}
  .top-right{display:flex; align-items:center; gap:8px;}
  .lv-chip{font-size:13px; font-weight:800; color:var(--gray); background:var(--card); padding:7px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .icon-btn{border:none; background:var(--card); color:var(--gray); width:36px; height:36px; border-radius:12px; font-size:15px; box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer;}

  /* 레벨 진행바 */
  .level-strip{margin:2px 20px 0; padding:0 2px;}
  .lv-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px;}
  .lv-name{font-size:12.5px; font-weight:800; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lv-pct{font-size:12.5px; font-weight:800; color:var(--green); flex-shrink:0;}
  .lv-bar{height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .lv-bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--green),#00e5a0); transition:width .3s;}
  .lv-hint{font-size:11px; font-weight:700; color:var(--gray3); margin-top:4px; text-align:right;}

  /* 히어로: 현금 */
  .hero{margin:12px 20px 0; padding:16px 20px 14px; border-radius:22px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#0b1b3a 0%,#12336e 55%,#1d4fb0 100%); color:#fff;}
  .hero::after{content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,#4c8dff55,transparent 70%);}
  .hero .k{font-size:12px; font-weight:700; color:#9fc0ff; position:relative;}
  .hero .cash{font-size:31px; font-weight:900; letter-spacing:-.04em; margin-top:3px; position:relative; font-variant-numeric:tabular-nums;}

  /* 메인 탭 스위처 */
  .main-tabs{display:flex; gap:6px; margin:14px 20px 0; background:var(--card); border-radius:15px; padding:5px; box-shadow:var(--shadow);}
  .main-tab{flex:1; text-align:center; padding:11px; border-radius:11px; font-size:14px; font-weight:800; color:var(--gray2); background:transparent; border:none; cursor:pointer;}
  .main-tab.on{background:var(--ink); color:#fff;}

  /* 단타 패널 */
  .trade-panel{margin:12px 20px 0; background:var(--card); border-radius:20px; padding:14px 16px 16px; box-shadow:var(--shadow);}
  .tp-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .tp-title{font-size:14.5px; font-weight:800;}
  .tp-limit{font-size:11.5px; font-weight:700; color:var(--gray2); background:var(--field); padding:4px 9px; border-radius:999px;}
  .stock-tabs{display:flex; gap:7px; margin-bottom:11px;}
  .stock-tab{flex:1; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:9px 8px; cursor:pointer; text-align:center;}
  .stock-tab.sel{border-color:var(--blue); background:var(--blue-weak);}
  .stock-tab.locked{opacity:.5; cursor:default;}
  .stock-tab .e{font-size:19px;}
  .stock-tab .n{font-size:12px; font-weight:800; margin-top:2px;}
  .stock-tab .v{font-size:10px; font-weight:700; color:var(--gray2); margin-top:1px;}

  .bet-row{display:flex; align-items:center; gap:8px; background:var(--field); border-radius:14px; padding:8px 10px; margin-bottom:9px;}
  .bet-row button{width:38px; height:38px; border:none; background:var(--card); border-radius:11px; font-size:18px; font-weight:800; color:var(--ink); box-shadow:var(--shadow); cursor:pointer;}
  .bet-row .amt{flex:1; text-align:center; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums;}
  .bet-quicks{display:flex; gap:6px; margin-bottom:9px;}
  .bet-quicks button{flex:1; border:none; background:var(--field); color:var(--gray); font-weight:800; font-size:12px; padding:8px 0; border-radius:10px; cursor:pointer;}
  .bet-quicks button:active{background:var(--blue-weak); color:var(--blue);}
  .auto-row{display:flex; gap:6px; margin-bottom:11px;}
  .auto-row button{flex:1; border:2px solid var(--line); background:var(--card); color:var(--gray); font-weight:800; font-size:11.5px; padding:8px 0; border-radius:10px; cursor:pointer;}
  .auto-row button.sel{border-color:var(--blue); background:var(--blue-weak); color:var(--blue);}
  .auto-label{font-size:11px; font-weight:700; color:var(--gray3); margin-bottom:6px;}
  .trade-go{width:100%; border:none; border-radius:14px; padding:14px; font-size:15.5px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 8px 20px rgba(49,130,246,.3);}
  .trade-go:disabled{background:var(--line); color:var(--gray3); box-shadow:none; cursor:default;}
  .trade-note{font-size:11.5px; color:var(--gray3); font-weight:600; text-align:center; margin-top:9px; line-height:1.5;}

  /* 진행중인 라운드 */
  .round-view{text-align:center;}
  .round-timer{font-size:11.5px; font-weight:800; color:var(--gray2); font-variant-numeric:tabular-nums;}
  .round-mult{font-size:40px; font-weight:900; letter-spacing:-.03em; margin:4px 0; font-variant-numeric:tabular-nums;}
  .round-mult.up{color:var(--red);} .round-mult.down{color:var(--blue);} .round-mult.flat{color:var(--gray2);}
  .round-chart{width:100%; height:80px; display:block; margin:4px 0 12px; background:var(--field); border-radius:12px;}
  .round-pnl{font-size:13px; font-weight:800; margin-bottom:12px;}
  .round-pnl.up{color:var(--red);} .round-pnl.down{color:var(--blue);}
  .sell-btn{width:100%; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#f04452,#ff6b78); box-shadow:0 8px 20px rgba(240,68,82,.3);}

  .section-title{font-size:13.5px; font-weight:800; color:var(--gray2); margin:18px 20px 8px;}

  .biz{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:12px 14px; margin:0 20px 8px; box-shadow:var(--shadow);}
  .biz .logo{width:42px; height:42px; border-radius:13px; background:var(--field); display:grid; place-items:center; font-size:21px; flex-shrink:0;}
  .biz .mid{flex:1; min-width:0;}
  .biz .nm{font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px;}
  .biz .cnt{font-size:11px; font-weight:800; color:var(--blue); background:var(--blue-weak); padding:1px 7px; border-radius:999px;}
  .biz .ds{font-size:12px; color:var(--gray2); font-weight:650; margin-top:2px;}
  .biz-buy{flex-shrink:0; border:none; border-radius:13px; padding:11px 14px; font-size:13px; font-weight:800; cursor:pointer; text-align:right; min-width:92px;}
  .biz-buy.can{background:var(--ink); color:#fff;}
  .biz-buy.cant{background:var(--field); color:var(--gray3);}
  .biz-buy .p{display:block; font-size:13.5px; font-weight:900;}
  .biz-buy .l{display:block; font-size:10.5px; font-weight:700; opacity:.75; margin-top:1px;}

  .hide{display:none !important;}

  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(0,0,0,.5);} .modal.on{display:flex;}
  .modal .box{width:100%; max-width:360px; background:var(--card); border-radius:26px; padding:30px 24px 22px; text-align:center; animation:pop .3s cubic-bezier(.2,1.2,.4,1);}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .emo{font-size:56px;}
  .modal .tt{font-size:21px; font-weight:900; margin:12px 0 6px;} .modal .dc{font-size:14.5px; color:var(--gray); font-weight:600; line-height:1.5;}
  .modal .ok{margin-top:18px; width:100%; border:none; color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:15px; cursor:pointer; background:linear-gradient(135deg,#3182F6,#4c8dff);}
  .modal .ok.bankrupt{background:linear-gradient(135deg,#4e5968,#191f28);}
  .stat-grid{display:flex; gap:10px; margin:16px 0 4px;} .stat-grid .s{flex:1; background:var(--field); border-radius:14px; padding:12px 6px;} .stat-grid .s .k{font-size:11px; color:var(--gray2); font-weight:700;} .stat-grid .s .v{font-size:15px; font-weight:800; margin-top:3px;}
  .lv-gain{margin-top:9px; font-size:13.5px; font-weight:700; color:var(--gray); background:var(--field); border-radius:12px; padding:10px 12px; text-align:left;} .lv-gain b{color:var(--blue); font-weight:800;}

  .toast{position:fixed; left:50%; bottom:28px; translate:-50% 0; background:rgba(25,31,40,.92); color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:14px; z-index:70; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;} .toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">머니<span>로드</span></div>
    <div class="top-right">
      <div class="lv-chip" id="lvChip">Lv.1</div>
      <button class="icon-btn" id="muteBtn">🔊</button>
    </div>
  </div>

  <div class="level-strip">
    <div class="lv-row"><span class="lv-name" id="lvName">—</span><span class="lv-pct" id="lvPct"></span></div>
    <div class="lv-bar"><i id="lvBar"></i></div>
    <div class="lv-hint" id="lvHint"></div>
  </div>

  <div class="hero">
    <div class="k">보유 현금</div>
    <div class="cash" id="cashView">0원</div>
  </div>

  <div class="main-tabs">
    <button class="main-tab on" data-tab="trade">🎯 단타</button>
    <button class="main-tab" data-tab="shop">🛒 상점</button>
  </div>

  <div id="panelTrade">
    <div class="trade-panel">
      <div class="tp-head"><span class="tp-title">📊 단타 (15초)</span><span class="tp-limit" id="tpLimit">한도 0원</span></div>
      <div class="stock-tabs" id="stockTabs"></div>
      <div id="tradeBody"></div>
    </div>
  </div>

  <div id="panelShop" class="hide">
    <div class="section-title">🛒 단타 업그레이드 <small style="font-weight:600;color:var(--gray3)">· 현금으로 구매해요</small></div>
    <div id="shopList"></div>
  </div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const RUN_KEY='moneyroad2_run_v6', META_KEY='moneyroad2_meta_v1';

function fmtWon(v){const neg=v<0;let x=Math.round(Math.abs(v));if(x<10000)return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000),man=Math.floor((x%100000000)/10000);let s='';if(eok)s+=eok+'억';if(man)s+=(s?' ':'')+man.toLocaleString()+'만';return (neg?'-':'')+s+'원';}
const won=n=>Math.round(n).toLocaleString()+'원';
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* audio */
let AC=null;
function beep(f,d,t='sine',vol=.15){if(META.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(720,.05,'triangle',.09),buy:()=>{beep(520,.07,'square',.1);setTimeout(()=>beep(780,.09,'square',.1),60);},pay:()=>{beep(880,.08,'sine',.13);setTimeout(()=>beep(1180,.12,'sine',.12),70);},warn:()=>beep(300,.15,'sawtooth',.12),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.14),i*100));},bankrupt:()=>{[400,340,280,220].forEach((f,i)=>setTimeout(()=>beep(f,.22,'sawtooth',.1),i*130));}};

/* config: 현금 성장의 유일한 엔진은 단타뿐이다. 상점 업그레이드는 전부
   "단타를 더 잘/크게 할 수 있게" 만들 뿐, 그 자체로 현금을 만들지 않는다.
   베팅 한도는 따로 없다 — 보유 현금 전액까지 베팅 가능. 대신 레버리지를 사면
   같은 돈으로 더 크게 걸 수 있다(손익 둘 다 배율만큼 커짐 — 위험도 커짐). */
const LEVERAGE_MULTS=[1,2,3,5,10];
const LEVERAGE_COSTS=[150000,450000,1200000,3000000];
const STOPLOSS_COSTS=[80000,300000,900000];
const STOPLOSS_PCT=[0,0.15,0.30,0.45];
const HINT_COST=250000, AUTOSELL_COST=400000, SURGE_COST=800000;
const START_CASH=100000, START_CASH_LEGACY_CAP=400000, LEGACY_PER_POINT=2000;
const BROKE_LIMIT=1000;

/* 단타 종목 — 종목마다 변동성(pMult/noiseMult)이 다르다. 실제 가격 흐름은
   아래 PATTERNS(5종)이 만들고, 종목은 그 흐름의 진폭만 키운다. */
const TRADE_STOCKS=[
  {id:'stable', emo:'🏦', name:'안정주', pMult:1.0, noiseMult:1.0},
  {id:'theme',  emo:'🚀', name:'테마주', pMult:1.6, noiseMult:1.8},
  {id:'surge',  emo:'🔥', name:'급등주', pMult:2.3, noiseMult:2.6},
];
const ROUND_TICKS=300, ROUND_TICK_MS=50; // 15초를 0.05초 단위로 나눠서 더 부드럽고 잦게 움직이게
const NOISE_SCALE=Math.sqrt(30/ROUND_TICKS); // 기존 30틱 기준으로 검증한 노이즈 강도를 촘촘한 해상도에 맞게 보정

function dev(base,mult){return Math.max(0.05,1+(base-1)*mult);}
/* 여러 구간(keypoint)을 사인 이징으로 잇는 범용 경로 생성기 — 구간을 몇 개, 어떤 값으로
   두느냐에 따라 상승/하락/V자는 물론 이중 바닥(W)·이중 고점(M)·지연 반응까지 전부 표현 가능 */
function buildMultiPhase(keypoints,noiseAmt){
  const kps=[[0,1],...keypoints];
  const path=[1]; let noise=0;
  for(let i=1;i<=ROUND_TICKS;i++){
    const frac=i/ROUND_TICKS;
    let seg=kps.length-2;
    for(let k=0;k<kps.length-1;k++){ if(frac<=kps[k+1][0]){seg=k;break;} }
    const [f0,v0]=kps[seg],[f1,v1]=kps[seg+1];
    const segFrac=(f1-f0)>0?(frac-f0)/(f1-f0):1;
    const s=Math.sin(Math.min(1,Math.max(0,segFrac))*Math.PI/2);
    const val=v0+(v1-v0)*s;
    noise+=noiseAmt*randn(); noise*=0.75;
    path.push(Math.max(0.05,val+noise));
  }
  return path;
}
function buildFlat(noiseAmt,driftAmt){
  const path=[1]; let noise=0; const drift=(Math.random()-0.5)*driftAmt;
  for(let i=1;i<=ROUND_TICKS;i++){
    noise+=noiseAmt*randn(); noise*=0.8;
    path.push(Math.max(0.05,1+drift*(i/ROUND_TICKS)+noise));
  }
  return path;
}
/* 10개 패턴 — 시뮬레이션으로 검증: 막눈 홀드 평균 0.955x(손해) vs 숙련 플레이 평균 1.498x(이득).
   패턴마다 요구하는 대응이 전부 달라서(즉시매도/버티기/중간에익절/초반무시 등),
   "일단 홀드"나 "일단 반응만 보고 팔기" 같은 단일 정답이 통하지 않는다. */
const PATTERNS=[
  {id:'up',emo:'📈',weight:.12,gen:st=>{
    const peakFrac=0.55+Math.random()*0.20, peakV=dev(1.4+Math.random()*0.7,st.pMult), endV=dev(1.15+Math.random()*0.35,st.pMult);
    return buildMultiPhase([[peakFrac,peakV],[1,endV]],0.012*NOISE_SCALE*st.noiseMult);
  }},
  {id:'down',emo:'📉',weight:.15,gen:st=>{
    const bottomFrac=0.5+Math.random()*0.25, botV=dev(0.4+Math.random()*0.3,st.pMult), endV=1+(botV-1)*(0.9+Math.random()*0.15);
    return buildMultiPhase([[bottomFrac,botV],[1,endV]],0.01*NOISE_SCALE*st.noiseMult);
  }},
  {id:'v',emo:'✅',weight:.12,gen:st=>{
    const bottomFrac=0.22+Math.random()*0.16, botV=dev(0.5+Math.random()*0.25,st.pMult), endV=dev(1.05+Math.random()*0.45,st.pMult);
    return buildMultiPhase([[bottomFrac,botV],[1,endV]],0.014*NOISE_SCALE*st.noiseMult);
  }},
  {id:'spike',emo:'🎢',weight:.10,gen:st=>{
    const peakFrac=0.08+Math.random()*0.17, peakV=dev(1.8+Math.random()*1.7,st.pMult), endV=dev(0.5+Math.random()*0.35,st.pMult);
    return buildMultiPhase([[peakFrac,peakV],[1,endV]],0.02*NOISE_SCALE*st.noiseMult);
  }},
  {id:'flat',emo:'➖',weight:.08,gen:st=>buildFlat(0.01*NOISE_SCALE*st.noiseMult,0.15*st.pMult)},
  {id:'invv',emo:'⛰️',weight:.10,gen:st=>{
    const peakFrac=0.4+Math.random()*0.2, peakV=dev(1.4+Math.random()*0.7,st.pMult), endV=dev(0.55+Math.random()*0.3,st.pMult);
    return buildMultiPhase([[peakFrac,peakV],[1,endV]],0.014*NOISE_SCALE*st.noiseMult);
  }},
  {id:'w',emo:'🌊',weight:.10,gen:st=>{
    const d1=dev(0.5+Math.random()*0.25,st.pMult), b1=dev(1.15+Math.random()*0.25,st.pMult), d2=dev(0.55+Math.random()*0.25,st.pMult), endV=dev(0.95+Math.random()*0.2,st.pMult);
    return buildMultiPhase([[0.22,d1],[0.5,b1],[0.75,d2],[1,endV]],0.013*NOISE_SCALE*st.noiseMult);
  }},
  {id:'m',emo:'🐫',weight:.10,gen:st=>{
    const p1=dev(1.35+Math.random()*0.35,st.pMult), d1=dev(0.75+Math.random()*0.2,st.pMult), p2=dev(1.05+Math.random()*0.2,st.pMult), endV=dev(0.65+Math.random()*0.2,st.pMult);
    return buildMultiPhase([[0.22,p1],[0.5,d1],[0.75,p2],[1,endV]],0.013*NOISE_SCALE*st.noiseMult);
  }},
  {id:'delayup',emo:'⏫',weight:.07,gen:st=>{
    const flatV=dev(0.98+Math.random()*0.08,1), endV=dev(1.6+Math.random()*0.5,st.pMult);
    return buildMultiPhase([[0.55,flatV],[1,endV]],0.008*NOISE_SCALE*st.noiseMult);
  }},
  {id:'delaydown',emo:'⏬',weight:.06,gen:st=>{
    const flatV=dev(0.98+Math.random()*0.08,1), endV=dev(0.4+Math.random()*0.25,st.pMult);
    return buildMultiPhase([[0.55,flatV],[1,endV]],0.008*NOISE_SCALE*st.noiseMult);
  }},
];
function pickPattern(){
  let r=Math.random(),acc=0;
  for(const p of PATTERNS){acc+=p.weight; if(r<=acc)return p;}
  return PATTERNS[PATTERNS.length-1];
}
function genRound(stock){
  const pat=pickPattern();
  return {patternId:pat.id, patternEmo:pat.emo, path:pat.gen(stock)};
}

/* 라운드 손익에 손절 보험을 적용 — 손실일 때만 일부를 되돌려준다 */
function applyStoploss(profit){
  if(profit>=0)return profit;
  const pct=STOPLOSS_PCT[S.upg.stoplossLv||0];
  if(!pct)return profit;
  return profit+Math.abs(profit)*pct;
}

/* 저장된 시점 이후 흐른 시간을 catch-up: 자리를 비운 사이 돈이 불어나 있거나
   사라져 있는 건 이상하니(지켜보지 않은 결과로 보상/손실을 주지 않는다), 떠나있는
   동안 라운드가 15초를 넘겨버렸으면 손익 없이 베팅한 금액만 그대로 돌려준다. */
function catchUp(){
  const now=Date.now();
  const awaySec=(now-S.lastTick)/1000;
  let roundRefunded=null;
  if(S.activeRound){
    const idx=currentTickIdx();
    if(idx>=S.activeRound.path.length-1){
      S.cash+=S.activeRound.bet;
      roundRefunded={bet:S.activeRound.bet};
      S.activeRound=null;
    }
  }
  S.lastTick=now;
  return {awaySec,roundRefunded};
}

function currentTickIdx(){
  if(!S.activeRound)return 0;
  const elapsed=Date.now()-S.activeRound.startedAt;
  return Math.min(S.activeRound.path.length-1,Math.floor(elapsed/ROUND_TICK_MS));

function setBet(n){
  S.betAmount=Math.max(0,Math.min(Math.floor(S.cash),Math.round(n)));
  renderTrade();

function startRound(){
  if(S.activeRound)return;
  const stock=TRADE_STOCKS.find(s=>s.id===S.selectedStock);
  const bet=S.betAmount;
  if(bet<=0||bet>S.cash)return;
  const {patternId,patternEmo,path}=genRound(stock);
  const maxLev=leverageMultOf();
  const leverage=Math.min(Math.max(1,S.betLeverage||1),maxLev);
  S.cash-=bet;
  S.activeRound={stockId:stock.id,bet,path,patternId,patternEmo,leverage,
    autoTarget:S.upg.autosell?(S.betAutoTarget||0):0,
    startedAt:Date.now(), yMin:0.96, yMax:1.04, boundsIdx:0, dispYMin:0.96, dispYMax:1.04};
  sfx.buy();
  saveRun(); render();
}
function sellRound(auto){
  if(!S.activeRound)return;
  const idx=currentTickIdx();
  const mult=S.activeRound.path[idx];
  const bet=S.activeRound.bet;
  const lev=S.activeRound.leverage||1;
  const rawProfit=Math.round(bet*(mult-1)*lev);
  const profit=applyStoploss(rawProfit);
  const payout=Math.max(0,bet+profit);
  S.cash+=payout; bumpPeak();
  sfx[profit>=0?'pay':'warn']();
  toast(`${auto?'🎯 자동 익절! ':''}${mult>=1?'📈':'📉'} ${mult.toFixed(2)}x${lev>1?` ×${lev}`:''} 청산 · ${profit>=0?'+':''}${fmtWon(profit)}`);
  S.activeRound=null;
  saveRun();
  if(checkBankrupt())return;
  if(!checkLevelUp())render();
}
/* 부드러운 곡선(2차 베지어 보간) + x/y축을 라운드 시작 시점에 고정해서
   그래프가 항상 왼쪽 끝(0초)에서 자라나 보이게 한다 */
function smoothPathD(pts){
  if(!pts.length)return '';
  if(pts.length===1)return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1],cur=pts[i];
    const midX=(prev[0]+cur[0])/2, midY=(prev[1]+cur[1])/2;
    d+=` Q${prev[0].toFixed(1)} ${prev[1].toFixed(1)} ${midX.toFixed(1)} ${midY.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  d+=` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  return d;
}

function renderRoundView(){
  const r=S.activeRound, stock=TRADE_STOCKS.find(s=>s.id===r.stockId);
  const idx=currentTickIdx(), mult=r.path[idx];
  const remainSec=Math.max(0,Math.ceil((ROUND_TICKS-idx)*ROUND_TICK_MS/1000));
  const dir=mult>1.01?'up':mult<0.99?'down':'flat';
  const W=300,H=80,padX=6,padY=8;
  /* y축은 "지금까지 실제로 본 값"만 확장형(expand-only)으로 반영한다 — 미래 전체 경로의
     최고/최저로 미리 고정하면, 선이 차트 위/아래 끝에 닿는 순간 "이게 그 라운드의 진짜
     고점/저점이다"를 그래프가 스포일러처럼 알려줘서 패턴을 볼 필요가 없어짐. 하지만
     상승/하락이 쭉 이어지는 구간에서는 "진짜 새 고점/저점"이 거의 매 틱 갱신되기 때문에,
     목표 경계(yMin/yMax)를 그대로 그리기에 쓰면 이미 그려둔 예전 구간의 픽셀 위치까지
     매 틱 같이 밀려서 그래프가 통째로 다시 그려지는 것처럼 흔들려 보임. 그래서 실제
     그리기에 쓰는 화면상 경계(dispYMin/dispYMax)는 목표치를 향해 서서히(이징) 따라가게
     만들어서, 예전 구간은 순간이동하지 않고 부드럽게만 자리를 조정하도록 한다 */
  if(typeof r.yMin!=='number'){r.yMin=0.96;r.yMax=1.04;r.boundsIdx=0;}
  if(idx>r.boundsIdx){
    for(let i=r.boundsIdx+1;i<=idx;i++){
      if(r.path[i]<r.yMin)r.yMin=r.path[i];
      if(r.path[i]>r.yMax)r.yMax=r.path[i];
    }
    r.boundsIdx=idx;
  }
  if(typeof r.dispYMin!=='number'){r.dispYMin=r.yMin;r.dispYMax=r.yMax;}
  const rawRng=(r.yMax-r.yMin)||0.001, pad=rawRng*0.15;
  const targetYMin=r.yMin-pad, targetYMax=r.yMax+pad;
  const EASE=0.2;
  r.dispYMin+=(targetYMin-r.dispYMin)*EASE;
  r.dispYMax+=(targetYMax-r.dispYMax)*EASE;
  const yMin=r.dispYMin, yMax=r.dispYMax;
  const rng=(yMax-yMin)||0.001;
  const xOf=i=>padX+(i/ROUND_TICKS)*(W-2*padX);
  const yOf=v=>H-padY-((v-yMin)/rng)*(H-2*padY);
  const pts=[];
  for(let i=0;i<=idx;i++)pts.push([xOf(i),yOf(r.path[i])]);
  const col=dir==='up'?'#f04452':dir==='down'?'#3182F6':'#8b95a1';
  const lev=r.leverage||1;
  const profit=Math.round(r.bet*(mult-1)*lev);
  const hintTxt=S.upg.hint?`${r.patternEmo} `:'';
  const levTxt=lev>1?` · 🎚️${lev}배`:'';
  const autoTxt=r.autoTarget?` · 🎯${r.autoTarget}x 자동`:'';
  $('tradeBody').innerHTML=`<div class="round-view">
    <div class="round-timer">${hintTxt}${stock.emo} ${stock.name} · 남은 시간 ${remainSec}초${levTxt}${autoTxt}</div>
    <div class="round-mult ${dir}">${mult.toFixed(2)}x</div>
    <svg class="round-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${smoothPathD(pts)}" fill="none" stroke="${col}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div class="round-pnl ${profit>=0?'up':'down'}">${profit>=0?'+':''}${fmtWon(profit)}</div>
    <button class="sell-btn" id="sellBtn">지금 매도</button>
  </div>`;
  $('sellBtn').onclick=()=>sellRound(false);
}

/* ===== 히어로 ===== */
function renderHero(){$('cashView').textContent=fmtWon(S.cash);}

function render(){
  renderHero();renderLevel();
  switchMainTab(S.mainTab||'trade');
  renderTradeTabs();renderTrade();
  renderShop();
}

function showAwayModal(report){
  const bits=[];
  if(report.roundRefunded){
    bits.push(`<div class="lv-gain">⏸️ 진행 중이던 단타는 지켜보지 못해서 손익 없이 베팅금 <b>${fmtWon(report.roundRefunded.bet)}</b>만 환불했어요</div>`);
  }
  const awayTxt=report.awaySec>=3600?`${Math.floor(report.awaySec/3600)}시간 ${Math.floor(report.awaySec%3600/60)}분`:`${Math.floor(report.awaySec/60)}분`;
  $('modalBox').innerHTML=`<div class="emo">⏱️</div><div class="tt">${awayTxt} 만이네요</div>
    <div class="dc">자리를 비운 동안은 돈이 불지도 줄지도 않아요 — 직접 지켜봐야 의미가 있으니까요.</div>
    ${bits.join('')}
    <div class="stat-grid" style="margin-top:14px"><div class="s"><div class="k">현재 잔액</div><div class="v">${fmtWon(S.cash)}</div></div></div>
    <button class="ok" id="mOk">확인</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');};
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}

$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';if(!META.mute)sfx.tap();};

/* main tick — 0.1초 간격으로 라운드 진행/자동익절/자동청산/파산 체크 */
setInterval(()=>{
  const now=Date.now();
  S.lastTick=now;
  if($('modal').classList.contains('on'))return;
  if(S.activeRound){
    const idx=currentTickIdx();
    const mult=S.activeRound.path[idx];
    if(idx>=S.activeRound.path.length-1){ sellRound(false); return; }
    if(S.activeRound.autoTarget && mult>=S.activeRound.autoTarget){ sellRound(true); return; }
    if(S.mainTab==='trade')renderRoundView();
  }else{
    checkBankrupt()||checkLevelUp();
  }
}, ROUND_TICK_MS);
setInterval(saveRun, 3000);
window.addEventListener('pagehide', saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

render();
if(!checkBankrupt() && awayReport && awayReport.awaySec>=60) showAwayModal(awayReport);
</script>
</body>
