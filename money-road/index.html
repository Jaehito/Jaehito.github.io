  /* ═══════════════════════════════════════════════════════════════════
     윈도우 98 — 낡은 업무용 PC의 응용 프로그램 창 하나.

     안 1(평가 계좌)과 맞물린다. 회사가 지원자에게 좋은 장비를 줄 리 없다.
     창 하나가 곧 세계관 설명이다.

     상표 규칙(tools/README.md에 여섯 줄): 제품명에 그 OS 이름을 쓰지 않는다.
     로고·깃발·시작 버튼·작업 표시줄을 두지 않는다 — 응용 프로그램 창 하나뿐이다.
     아이콘은 전부 직접 그린다(ic()). 서체는 OFL만(Galmuri11).

     크기 규칙: 글자는 11의 배수만 쓴다(11 / 22 / 33 / 44).
     Galmuri11이 11px 격자로 그려진 폰트라, 그 배수가 아니면 글자가 뭉갠다.
     제약이지만 덕분에 크기 체계가 넷으로 정리된다.
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    /* 이름은 그대로 두고 값만 98로 옮긴다 — 참조하는 자리가 200곳이 넘는다 */
    --blue:#000080; --blue-weak:#dfdfdf; --blue-press:#00005a;
    --red:#c00000; --red-weak:#f2dede; --green:#008000; --gold:#808000;
    --ink:#000000; --gray:#000000; --gray2:#404040; --gray3:#808080;
    --line:#808080; --bg:#008080; --card:#c0c0c0; --field:#ffffff;
    --radius:0; --shadow:none;
    /* 베벨 네 색 — 98의 입체는 테두리 색 넷과 안쪽 그림자 둘로만 만들어진다 */
    --face:#c0c0c0; --hi:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#000000;
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  /* 돌출(버튼)과 침강(입력·목록·차트) — 화면의 모든 입체가 이 둘 중 하나다 */
  .out{border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .in{border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  html{overscroll-behavior-y:contain;}
  body{font-family:'Galmuri11',monospace;
    background:var(--bg); color:var(--ink); line-height:1.45; overflow-x:hidden;
    overscroll-behavior-y:contain; font-size:22px;
    /* 픽셀 서체는 이게 없으면 그냥 흐릿한 글씨다 */
    -webkit-font-smoothing:none; font-smooth:never;}
  /* 창 — 앱 전체가 창 하나다. 좁은 화면에서는 화면을 꽉 채운다. */
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative;
    background:var(--face); display:flex; flex-direction:column;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
    padding-bottom:var(--safe-b);}
  button{font-family:inherit;}
  svg.ic{display:inline-block; vertical-align:-3px; flex-shrink:0; image-rendering:pixelated;}

  /* ── 제목표 ── 대화상자가 뜨면 .off로 회색이 된다(98의 초점 표시) */
  .topbar{display:flex; align-items:center; gap:6px; padding:4px 4px 4px 7px; flex-shrink:0;
    background:linear-gradient(90deg,#000080,#1084d0); color:#fff;}
  .topbar.off{background:linear-gradient(90deg,#808080,#b5b5b5);}
  .topbar .brand{font-size:11px; font-weight:700; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; min-width:0;}
  .topbar .brand span{color:#fff;}
  .tb-left{display:flex; align-items:center; gap:6px; min-width:0; flex:1;}
  .top-right{display:flex; align-items:center; gap:2px; margin-left:auto; flex-shrink:0;}
  .top-right-row{display:flex; align-items:center; gap:2px;}
  /* 제목표 버튼 — 장식이 아니라 실제로 음소거·도구를 연다 */
  .icon-btn{background:var(--face); color:var(--ink); width:26px; height:24px; padding:0;
    display:grid; place-items:center; cursor:pointer;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .lv-chip,.tier-chip{font-size:11px; color:#fff; background:transparent; padding:0 4px; white-space:nowrap;}
  /* 잔고 줄 — 목표 바로 아래. 98의 제목표는 창 이름의 자리라 값을 띄우지 않는다. */
  .cash-row{display:flex; align-items:baseline; gap:8px; margin-top:2px; padding-bottom:7px;}
  .cash-row .k{font-size:11px; color:var(--gray2);}
  .cash-top{margin-left:auto; font-size:22px; font-weight:700;}

  /* ── 메뉴바 ── */
  .menubar{display:flex; flex-shrink:0; background:var(--face);
    border-bottom:1px solid var(--sh); position:relative; z-index:30;}
  .menubar > button{background:transparent; border:0; color:var(--ink); cursor:pointer;
    font-size:11px; padding:16px 11px; line-height:16px;}
  .menubar > button.on{background:var(--blue); color:#fff;}
  .menubar u{text-decoration:underline;}
  .menu{position:absolute; top:100%; z-index:31; min-width:196px; background:var(--face); padding:3px;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0,0,0,.3);}
  .menu button{display:flex; align-items:center; gap:8px; width:100%; height:38px; padding:0 10px;
    background:transparent; border:0; color:var(--ink); font-size:11px; cursor:pointer; text-align:left;}
  .menu button:hover,.menu button.on{background:var(--blue); color:#fff;}
  .menu .rd{width:11px; text-align:center; flex-shrink:0;}
  .menu hr{border:0; border-top:1px solid var(--sh); border-bottom:1px solid var(--hi); margin:3px 2px;}

  /* ── 본문 ── 창 안쪽. 그룹박스들이 세로로 쌓인다. */
  .body{flex:1; padding:9px; display:flex; flex-direction:column; gap:10px; min-width:0;}
  /* 그룹박스 — 98의 정체성. 제목이 테두리를 끊고 앉는다. */
  .grp{position:relative; border:2px groove var(--lt); padding:17px 8px 9px;}
  .grp > .lg{position:absolute; top:-9px; left:8px; background:var(--face); padding:0 5px;
    font-size:11px; line-height:16px; white-space:nowrap;}

  /* ── 상환 그룹 ── 예전 탑바 칩 둘 + 진행바가 여기로 모였다 */
  .level-strip{}
  .lv-row{display:flex; align-items:center; gap:8px;}
  .lv-name{font-size:11px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lv-name b{font-weight:700;}
  .lv-name small{font-size:11px; color:var(--gray2); margin-left:4px;}
  .lv-pct{font-size:11px; color:var(--green); flex-shrink:0;}
  /* 진행바 — 98은 이어진 막대가 아니라 칸으로 끊어 찬다. 여기서는 채우는 게 아니라
     남은 거래일이 하루에 한 칸씩 꺼지는 연료계다. */
  .lv-bar{height:26px; padding:2px; display:flex; gap:2px; overflow:hidden; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .lv-bar>i{display:block; height:100%; width:12px; flex-shrink:0; background:var(--blue);}
  .lv-bar>i.e{background:transparent;}
  .lv-bar.p-warn>i{background:var(--gold);}
  .lv-bar.p-bad>i{background:var(--red);}
  .dday{font-size:11px; flex-shrink:0;}
  .dday.p-warn{color:var(--gold);} .dday.p-bad,.dday.last{color:var(--red);}
  .repay-sub{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px;
    font-size:11px; color:var(--gray2);}
  .repay-sub b{color:var(--ink);}
  .repay-sub.p-warn b{color:var(--gold);} .repay-sub.p-bad b{color:var(--red);}
  .repay-chip{display:flex; align-items:center; gap:6px; width:100%; background:transparent;
    border:0; padding:0 0 6px; cursor:pointer; font-family:inherit; font-size:22px;
    color:var(--ink); text-align:left;}
  .repay-chip .goal{margin-left:auto; font-weight:700;}
  .repay-chip .sep{display:none;} .repay-chip .dd{display:none;}
  .extend{background:var(--face); color:var(--ink); font-size:11px; cursor:pointer;
    padding:7px 10px; min-height:34px; white-space:nowrap;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}

  /* ── 탭 컨트롤 ── 알약 셋을 98의 폴더 탭으로 */
  .main-tabs{display:flex; gap:2px; margin-bottom:-2px; position:relative; z-index:1;}
  .main-tab{flex:1; height:48px; font-size:11px; background:var(--face); color:var(--ink);
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
    border:2px solid; border-color:var(--lt) var(--sh) var(--face) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi);}
  .main-tab.on{font-weight:700; margin-top:-3px; height:51px; border-bottom-color:var(--face);}
  .main-tab.locked{color:var(--gray3); text-shadow:1px 1px 0 var(--hi);}
  .tabpane{border:2px groove var(--lt); padding:11px 8px 9px;}

  /* ── 단타 패널 ── */
  .trade-panel{display:flex; flex-direction:column; gap:12px;}
  .tp-head{display:none;}   /* 목표·D-day는 상환 그룹이 이미 말한다 — 같은 값을 두 번 쓰지 않는다 */
  .stock-tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  .stock-tab{background:var(--face); color:var(--ink); cursor:pointer; min-height:74px;
    padding:6px 2px; font-size:11px; line-height:14px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .stock-tab.sel{border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .stock-tab.locked{color:var(--gray3); text-shadow:1px 1px 0 var(--hi); cursor:default;}
  .stock-tab .e{line-height:0;}
  .stock-tab .n{font-weight:700;}
  .stock-tab .v{color:var(--gray2);}
  .stock-tab.locked .n,.stock-tab.locked .v{color:var(--gray3);}

  /* ── 베팅 ── 금액 필드는 침강, ± 는 큰 버튼 */
  .bet-row{display:flex; align-items:stretch; gap:6px;}
  .bet-row button{width:56px; min-height:48px; background:var(--face); color:var(--ink);
    font-size:33px; line-height:1; cursor:pointer; padding:0;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .bet-row .amt{flex:1; display:flex; align-items:center; justify-content:center;
    font-size:22px; font-weight:700; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .bet-quicks{display:flex; gap:6px;}
  .bet-quicks button,.btn-row button,.dir-toggle button{flex:1; min-height:48px; font-size:11px;
    background:var(--face); color:var(--ink); cursor:pointer; padding:6px 4px;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .btn-row{display:flex; gap:6px;}
  .btn-row button.sel,.dir-toggle button.sel,.bet-quicks button:active{
    border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt); font-weight:700;}
  .lev-row button small{display:block; font-size:11px; color:var(--gray2); margin-top:2px;}
  .lev-row button.sel small{color:var(--ink);}
  .dir-toggle{flex:1; display:flex; gap:6px;}
  .dir-toggle button.sel{color:var(--red);} .dir-toggle button.sel.short{color:var(--blue);}
  .opt-row{display:flex; gap:6px;}
  .opt{flex:1; min-height:48px; background:var(--face); color:var(--ink); cursor:pointer;
    font-size:11px; padding:6px 9px; display:flex; align-items:center; gap:5px; text-align:left;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .opt b{margin-left:auto; font-weight:700;}
  .opt.open{border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .opt.room{flex:0 0 auto; cursor:default;}

  /* ── 기본 버튼 ── 98은 기본 버튼에 검은 테를 하나 더 두른다 */
  .trade-go,.sell-btn,.retire-btn,.modal .ok{
    width:100%; min-height:62px; font-size:22px; font-weight:700; cursor:pointer;
    background:var(--face); color:var(--ink); padding:8px 10px;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
    outline:1px solid var(--dk); outline-offset:1px;}
  .trade-go:disabled{color:var(--gray3); text-shadow:1px 1px 0 var(--hi); cursor:default; outline:0;}
  .trade-go small,.sell-btn small{display:block; font-size:11px; font-weight:400; margin-top:3px;}
  .trade-go.go-long{color:var(--red);} .trade-go.go-short{color:var(--blue);}
  .trade-go.danger{color:var(--red);}
  .split-row,.sell-row{display:flex; gap:7px;}
  .split-row .trade-go,.sell-row .sell-btn{flex:1;}
  .sell-btn.sell-half{flex:.8; outline:0; font-weight:400;}
  .retire-btn{margin-top:10px;}
  .trade-note{font-size:11px; color:var(--gray2); text-align:center; line-height:1.5; margin-top:4px;}
  .pace-line{font-size:11px; text-align:center; padding:8px; margin-bottom:0;
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh); background:var(--field);}
  .pace-line.p-warn{color:var(--gold);} .pace-line.p-bad{color:var(--red);}

  /* ── 장세 신호 ── 색만으로 구분하지 않는다. 화살표 아이콘이 같이 말한다. */
  .signal{display:flex; align-items:center; gap:9px; padding:8px 9px;
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh); background:var(--field);}
  .signal .sg-left{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .signal .sg-emo{line-height:0;}
  .signal .sg-name{font-size:22px; font-weight:700;}
  .signal.strong .sg-name{color:var(--green);}
  .signal.mid .sg-name{color:var(--gold);}
  .signal.weak .sg-name{color:var(--blue);}
  .signal .sg-mid{min-width:0; flex:1;}
  .signal .sg-ds{font-size:11px;}
  .signal .sg-acc{font-size:11px; color:var(--gray2); margin-top:2px;}
  .dex-btn{margin-left:auto; flex-shrink:0; width:38px; height:38px; cursor:pointer; padding:0;
    background:var(--face); display:grid; place-items:center;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .liq-note,.min-note,.debt-note,.buff-line{font-size:11px; padding:7px 9px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .liq-note b{color:var(--red); font-weight:700;}
  .debt-note,.buff-line{color:var(--gray2);}
  .buff-line{display:flex; align-items:center; gap:7px;}

  /* ── 진행중인 라운드 ── 창은 전부 픽셀인데 차트 선만 안티앨리어싱이다.
     15초 동안 눈이 붙어 있는 유일한 곳이라, 여기서 계단이 보이면 판단이 흐려진다. */
  .round-view{display:flex; flex-direction:column; gap:10px;}
  .round-timer{font-size:11px; display:flex; justify-content:space-between; gap:8px;}
  .round-timer .rt-l{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .round-timer .rt-r.warn{color:var(--red);}
  .round-mult{font-size:44px; line-height:48px; font-weight:700; text-align:center;
    transition:color .18s;}
  .round-mult.up{color:var(--red);} .round-mult.down{color:var(--blue);} .round-mult.flat{color:var(--gray2);}
  .round-chartbox{position:relative; padding:4px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .round-chart{width:100%; height:150px; display:block; background:var(--field);}
  .round-view.tense .round-chartbox{animation:rvEdge .5s ease-in-out infinite alternate;}
  @keyframes rvEdge{ from{border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
                     to{border-color:var(--red) var(--red) var(--red) var(--red);} }
  .round-count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:44px; font-weight:700; color:var(--red); opacity:0; pointer-events:none;}
  .round-count.on{animation:rvCnt .95s ease-out;}
  @keyframes rvCnt{ 0%{opacity:.55;} 70%{opacity:.16;} 100%{opacity:0;} }
  .rv-txt{stroke:var(--field); stroke-width:2.5px; paint-order:stroke fill; stroke-linejoin:round;}
  .rv-pulse{transform-box:fill-box; transform-origin:center; animation:rvPulse 1.15s ease-out infinite;}
  @keyframes rvPulse{ 0%{transform:scale(1); opacity:.5;} 100%{transform:scale(3.4); opacity:0;} }
  @media(prefers-reduced-motion:reduce){
    .rv-pulse,.round-view.tense .round-chartbox,.round-count.on{animation:none;}
    .round-mult{transition:none;}
  }
  .round-pnl{font-size:33px; line-height:37px; font-weight:700; text-align:right;}
  .round-pnl.up{color:var(--red);} .round-pnl.down{color:var(--blue);}
  .rv-wallet{font-size:11px; color:var(--gray2); text-align:right;}
  .rv-wallet b{color:var(--ink); font-weight:700;}
  /* 남은 시간도 같은 칸 진행바다 — 상환 게이지와 같은 부품이라 따로 배울 것이 없다 */
  .round-bar{height:26px; padding:2px; display:flex; gap:2px; overflow:hidden; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .round-bar i{display:block; height:100%; width:12px; flex-shrink:0; background:var(--blue);}
  .round-bar i.e{background:transparent;}
  .round-view.tense .round-bar i{background:var(--red);}
  .water{display:flex; align-items:center; gap:8px; min-height:48px; padding:8px 10px;
    font-size:11px; cursor:pointer; background:var(--face); color:var(--ink);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .water b{font-weight:700;}
  .water .r{margin-left:auto; color:var(--gray2);}
  .water.off{color:var(--gray3); text-shadow:1px 1px 0 var(--hi); cursor:default;}
  .water.off .r{color:var(--gray3);}

  /* ── 오늘의 기록 ── 상태표시줄로 내려갔다. 98에 원래 그 자리가 있다. */
  .strip{display:flex; gap:2px; padding:3px; flex-shrink:0; background:var(--face); cursor:pointer;
    border-top:1px solid var(--hi);}
  .strip-row{display:flex; align-items:center; gap:6px; width:100%; font-size:11px;}
  .strip-row > span{padding:4px 7px; white-space:nowrap; display:flex; align-items:center; gap:5px;
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .strip-row .fire{flex:1; min-width:0; overflow:hidden; color:var(--ink);}
  .strip-row .cv{color:var(--gray2);}
  /* 펼친 기록판은 상태표시줄 위에 뜬다 */
  .rec-grid{position:absolute; left:9px; right:9px; bottom:40px; z-index:25;
    display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; background:var(--face);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0,0,0,.3);}
  .rec{padding:6px 8px; background:var(--field);
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .rec .k{font-size:11px; color:var(--gray2);}
  .rec .v{font-size:11px; font-weight:700; margin-top:2px;}
  .strip-buff{display:flex; align-items:center; gap:8px; padding:8px 9px; margin-top:8px;
    background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .strip-buff .e{line-height:0;}
  .strip-buff .t{font-size:11px; font-weight:700;}
  .strip-buff .d{font-size:11px; color:var(--gray2); margin-top:2px;}

  /* ── 상점 · 해금 ── 98 리스트박스. 고른 줄은 남색 반전. */
  .section-title{font-size:11px; color:var(--gray2); margin-bottom:8px;}
  .section-title small{color:var(--gray2) !important;}
  .biz{display:flex; align-items:center; gap:8px; padding:9px; min-height:62px;
    font-size:11px; border-bottom:1px solid var(--lt); background:var(--field);}
  .biz:last-child{border-bottom:0;}
  .biz .logo{width:32px; height:32px; display:grid; place-items:center; flex-shrink:0;}
  .biz .mid{flex:1; min-width:0;}
  .biz .nm{font-size:22px; font-weight:700; display:flex; align-items:baseline; gap:6px;}
  .biz .cnt{font-size:11px; font-weight:400; color:var(--gray2);}
  .biz .ds{font-size:11px; color:var(--gray2); margin-top:2px;}
  .biz-buy{flex-shrink:0; min-width:92px; min-height:48px; padding:7px 10px; font-size:11px;
    cursor:pointer; text-align:center; background:var(--face); color:var(--ink);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .biz-buy.cant{color:var(--gray3); text-shadow:1px 1px 0 var(--hi); cursor:default;}
  .biz-buy .p{display:block; font-weight:700;}
  .biz-buy .l{display:block; margin-top:2px;}
  .unlock-tag{flex-shrink:0; min-width:92px; padding:8px 10px; font-size:11px; text-align:center;}
  .unlock-tag.open{color:var(--green);}
  .unlock-tag.closed{color:var(--gray3); text-shadow:1px 1px 0 var(--hi);}
  #shopList,#unlockList{background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}

  /* ── 대화상자 ── 98은 배경을 어둡게 덮지 않는다. 부모 제목표가 회색이 되는 것으로
     초점을 옮긴다(showModal이 .topbar에 .off를 건다). */
  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center;
    justify-content:center; padding:14px;} .modal.on{display:flex;}
  .modal .dlg{width:100%; max-width:360px; max-height:94vh; display:flex; flex-direction:column;
    background:var(--face);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 3px 3px 0 rgba(0,0,0,.35);}
  .modal .dlg .topbar{flex-shrink:0;}
  .modal .dlg .icon-btn{width:24px; height:22px; font-size:11px; line-height:1;}
  .modal .box{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; text-align:left;}
  .modal .emo{display:flex; justify-content:center; margin-bottom:4px; line-height:0;}
  .modal .tt{font-size:22px; font-weight:700; text-align:center; margin:6px 0;}
  .modal .dc{font-size:11px; color:var(--gray2); line-height:1.6; text-align:center;}
  .modal .ok{margin-top:12px;}
  .modal .ok.bankrupt{color:var(--red);}
  .stat-grid{display:flex; gap:7px; margin:12px 0 4px;}
  .stat-grid .s{flex:1; padding:8px 6px; background:var(--field); text-align:center;
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .stat-grid .s .k{font-size:11px; color:var(--gray2);}
  .stat-grid .s .v{font-size:11px; font-weight:700; margin-top:3px;}
  .lv-gain{margin-top:8px; font-size:11px; padding:8px 9px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .lv-gain b{font-weight:700;}
  .lv-gain.early b{color:var(--gold);}
  .intro-li{display:flex; gap:8px; align-items:flex-start; font-size:11px; line-height:1.6; margin-top:9px;}
  .intro-li .e{flex-shrink:0; line-height:0; margin-top:2px;}
  .tier-list{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
  .diff-card{display:block; width:100%; min-height:62px; padding:9px 10px; text-align:left;
    cursor:pointer; font-family:inherit; font-size:11px; background:var(--face); color:var(--ink);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .diff-card.sel{border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .diff-card.lock{color:var(--gray3); text-shadow:1px 1px 0 var(--hi); cursor:default;}
  .diff-top{display:flex; align-items:baseline; gap:8px;}
  .diff-nm{font-size:22px; font-weight:700;}
  .diff-card.lock .diff-nm{color:var(--gray3);}
  .diff-clear{color:var(--green);}
  .diff-xp{margin-left:auto; flex-shrink:0;}
  .diff-de{margin-top:4px; color:var(--gray2);}
  .diff-de.none{color:var(--gray3);}

  /* ── 거래 결과 ── */
  .rs-box{text-align:left;}
  .cm-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .cm-title{font-size:11px;}
  .rs-badge{font-size:11px; padding:3px 7px; background:var(--field);
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .rs-badge.hot{color:var(--red);} .rs-badge.cold{color:var(--gray2);}
  .rs-money{font-size:33px; line-height:37px; font-weight:700; text-align:center;}
  .rs-money.up{color:var(--red);} .rs-money.down{color:var(--blue);}
  .rs-sub{font-size:11px; color:var(--gray2); text-align:center; margin-top:4px;}
  .rs-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; justify-content:center;}
  .rs-chip{font-size:11px; padding:4px 8px; background:var(--field);
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    display:flex; align-items:center; gap:4px;}
  .rs-chip.grade{color:var(--green);} .rs-chip.grade.low{color:var(--blue);}
  .rs-chip.short,.rs-chip.lev{color:var(--blue);}
  .rs-chip.streak{color:var(--red);}
  .cm-feed{display:flex; flex-direction:column; gap:6px; min-height:21px; margin-top:10px;
    padding:8px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .cm-msg{display:flex; align-items:flex-start; gap:7px; font-size:11px; line-height:1.5;}
  .cm-msg .av{display:none;}   /* 말풍선 아이콘은 대화상자 제목표가 이미 달고 있다 */
  .cm-msg b{font-weight:700; flex-shrink:0;}
  .rs-like{color:var(--gray2); font-size:11px; margin-left:5px; white-space:nowrap;}
  .rs-sum{font-size:22px; font-weight:700;}
  .rs-sum.up{color:var(--red);} .rs-sum.down{color:var(--blue);}
  .rs-wallet{margin-top:10px; padding-top:8px; border-top:1px solid var(--sh); font-size:11px;}
  .rs-wallet b{font-weight:700;}
  .rs-close{margin-top:10px; padding:8px 10px; text-align:center; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .cl-top{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:11px;}
  .cl-top.one{justify-content:center;}
  .cl-dd b{font-weight:700;}
  .rs-close.p-warn .cl-dd{color:var(--gold);}
  .rs-close.p-bad .cl-dd{color:var(--red);}
  .rs-close.p-done .cl-dd{color:var(--green);}

  /* ── 경험치 정산 ── */
  .xp-tbl{display:flex; flex-direction:column; gap:5px; margin-top:12px; font-size:11px;}
  .xp-tbl>div{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  .xp-tbl b{font-weight:700; flex-shrink:0;}
  .xp-tbl .pen, .xp-tbl .pen b{color:var(--red);}
  .xp-tbl .sum{border-top:1px solid var(--sh); padding-top:6px; margin-top:2px;
    font-size:22px; font-weight:700;}
  .xp-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    margin-top:14px; font-size:11px;}
  .xp-head small{color:var(--gray2); flex-shrink:0;}
  .xp-bar{height:22px; padding:2px; margin-top:5px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .xp-bar>i{display:block; height:100%; background:var(--blue); transition:width .5s ease-out;}
  .unlock-pop{display:flex; align-items:center; gap:9px; padding:9px 10px; margin-top:9px;
    background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .unlock-pop .e{flex-shrink:0; line-height:0;}
  .unlock-pop .t{display:block; font-size:11px; font-weight:700; color:var(--blue);}
  .unlock-pop .d{display:block; font-size:11px; color:var(--gray2); margin-top:2px;}

  /* ── 패턴 도감 ── */
  .dex-note{font-size:11px; padding:8px 9px; margin:9px 0 4px; line-height:1.55; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .dex-note b{font-weight:700;}
  .scroller{max-height:56vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .dex-sec{margin-top:11px;}
  .dex-head{font-size:11px; font-weight:700; padding:5px 8px; display:flex; align-items:center; gap:6px;}
  .dex-head small{font-weight:400; margin-left:5px; color:var(--gray2);}
  .dex-head.strong{color:var(--green);} .dex-head.mid{color:var(--gold);} .dex-head.weak{color:var(--blue);}
  .dex-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px;}
  .dex{padding:7px 8px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .dex.unseen{color:var(--gray3);} .dex.none{opacity:.45;}
  .dex-top{display:flex; align-items:baseline; gap:6px;}
  .dex-nm{font-size:11px; font-weight:700;}
  .dex-pct{margin-left:auto; font-size:11px;}
  .dex svg{display:block; margin-top:4px;}
  .dex-st{font-size:11px; color:var(--gray2); margin-top:3px;}

  .hide{display:none !important;}
  /* display를 정한 클래스(.water의 flex 등)가 UA의 [hidden]{display:none}을 이겨서
     hidden을 걸어도 그대로 보인다. 한 줄로 막아둔다. */
  [hidden]{display:none !important;}

  /* 토스트 — 상태표시줄 위에 잠깐 뜬다 */
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:56px; z-index:70;
    background:var(--face); color:var(--ink); font-size:11px; padding:9px 12px; max-width:86%;
    text-align:center; opacity:0; pointer-events:none; transition:opacity .2s;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0,0,0,.3);}
  .toast.on{opacity:1;}

  /* 🛠 테스트 도구 — 상단 로고를 2번 연타하면 열린다. 평소엔 아무 흔적이 없다. */
  .dv-top{display:flex; align-items:center; gap:8px; padding-bottom:9px;
    border-bottom:1px solid var(--line);}
  .dv-title{font-size:15px; font-weight:900; color:var(--ink);}
  .dv-state{flex:1; font-size:10.5px; font-weight:700; color:var(--gray3);
    font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .dv-wipe{border:none; background:var(--red-weak); color:var(--red); font-size:13px;
    width:28px; height:28px; border-radius:9px; cursor:pointer; flex-shrink:0;}
  .dv-tabs{display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin:9px 0 10px;
    background:var(--field); border-radius:11px; padding:3px;}
  .dv-tab{border:none; background:transparent; font-family:inherit; font-size:10.5px;
    font-weight:800; color:var(--gray2); padding:7px 2px; border-radius:8px; cursor:pointer;
    line-height:1.25;}
  .dv-tab b{display:block; font-size:13px; font-weight:400;}
  .dv-tab.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .dv-scroll{max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; text-align:left;}
  .dv-sec{font-size:10.5px; font-weight:800; color:var(--gray3); margin:11px 0 6px;}
  .dv-sec:first-child{margin-top:0;}
  .dv-row{display:flex; gap:5px; align-items:center; margin-bottom:5px;}
  .dv-row.wrap{flex-wrap:wrap;}
  .dv-btn{flex:1; border:1px solid var(--line); background:var(--field); color:var(--gray);
    font-family:inherit; font-size:11.5px; font-weight:800; padding:8px 6px; border-radius:9px;
    cursor:pointer; white-space:nowrap;}
  .dv-btn.sm{flex:0 0 auto; padding:6px 9px; font-size:11px;}
  .dv-btn.sel{border-color:var(--blue); background:var(--blue-weak); color:var(--blue);}
  .dv-btn.danger{border-color:var(--red); background:var(--red-weak); color:var(--red);}
  .dv-lab{font-size:11px; font-weight:800; color:var(--gray3); flex-shrink:0;}
  .dv-val{flex:1; text-align:center; font-size:14px; font-weight:900; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .dv-val small{display:block; font-size:10px; font-weight:700; color:var(--gray3);}
  .dv-note{font-size:10.5px; font-weight:700; color:var(--gray3); margin-top:7px; line-height:1.55;}
  .dv-note b{color:var(--blue);}
  /* 탭 바닥 — 값을 만져도 새 판이라야 듣는 것이 있어서 재시작이 늘 손 닿는 곳에 있어야 한다 */
  .dv-foot{display:flex; gap:5px; margin-top:11px; padding-top:9px;
    border-top:1px solid var(--line);}
  .dv-foot .dv-btn{font-size:11px; padding:9px 6px;}
  .dv-foot .go{border-color:var(--blue); background:var(--blue-weak); color:var(--blue);}
  /* 패턴 탭 */
  .dv-mix{display:flex; gap:5px; margin-bottom:9px;}
  .dv-mix span{flex:1; text-align:center; font-size:10.5px; font-weight:800; padding:6px 2px;
    border-radius:8px; font-variant-numeric:tabular-nums;}
  .dv-mix .s{background:#e9f9f0; color:#00a862;}
  .dv-mix .m{background:#fff9ec; color:#8a5a00;}
  .dv-mix .k{background:var(--red-weak); color:var(--red);}
  .dv-mix .e{background:var(--blue-weak); color:var(--blue);}
  .pat-row{display:flex; gap:8px; align-items:center; padding:6px; border-radius:11px;
    border:1px solid var(--line); background:var(--card); margin-bottom:5px; cursor:pointer;}
  .pat-row.forced{border-color:var(--blue); background:var(--blue-weak);}
  .pat-chart{width:62px; height:38px; flex-shrink:0; background:var(--field); border-radius:7px;}
  .pat-mid{flex:1; min-width:0;}
  .pat-nm{font-size:12px; font-weight:900; color:var(--ink); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .pat-nm em{font-style:normal; font-size:10px; font-weight:800; margin-left:4px;}
  .pat-nm em.s{color:#00a862;} .pat-nm em.m{color:#c98600;} .pat-nm em.k{color:var(--red);}
  .pat-w{display:flex; align-items:center; gap:3px; margin-top:3px;}
  .pat-w button{border:1px solid var(--line); background:var(--field); color:var(--gray);
    font-family:inherit; font-size:11px; font-weight:900; width:21px; height:21px;
    border-radius:6px; cursor:pointer; padding:0; flex-shrink:0;}
  .pat-w span{width:30px; text-align:center; font-size:11px; font-weight:900; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .pat-w span.pat-early{width:auto; text-align:left; font-size:10px; font-weight:700;
    color:var(--gray3); margin-left:5px; white-space:nowrap;}
  .pat-early b{color:var(--blue);}
  .pat-prob{width:44px; text-align:right; font-size:12px; font-weight:900; color:var(--gray);
    font-variant-numeric:tabular-nums; flex-shrink:0;}
  /* 값 옆에 "무엇이고 어느 쪽이 어려워지나"를 붙인다 — 숫자만 있으면 못 만진다 */
  .dv-help{font-size:10.5px; font-weight:700; color:var(--gray3); line-height:1.55;
    background:var(--field); border-radius:10px; padding:8px 10px; margin:-2px 0 8px;}
  .dv-help b{color:var(--ink);}
  .dv-help .up{color:var(--red); font-weight:800;}
  .dv-help .dn{color:var(--blue); font-weight:800;}
  .dv-prev{font-size:10.5px; font-weight:700; color:var(--gray); background:var(--blue-weak);
    border-radius:10px; padding:8px 10px; margin-top:7px; line-height:1.6;
    font-variant-numeric:tabular-nums;}
  .dv-prev b{color:var(--blue); font-weight:900;}
  .dv-prev .hd{display:block; font-size:9.5px; font-weight:800; color:var(--gray2);
    letter-spacing:.03em; margin-bottom:3px;}
  .dv-gate{display:flex; gap:5px; align-items:center; margin-bottom:4px;}
  .dv-gate .nm{flex:1; font-size:11px; font-weight:800; color:var(--gray); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .dv-gate button{border:1px solid var(--line); background:var(--field); color:var(--gray);
    font-family:inherit; font-size:11px; font-weight:900; width:21px; height:21px;
    border-radius:6px; cursor:pointer; padding:0; flex-shrink:0;}
  .dv-gate .vv{width:36px; text-align:center; font-size:11px; font-weight:900; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .dv-gate .rn{width:42px; text-align:right; font-size:10.5px; font-weight:800; color:var(--blue);
    font-variant-numeric:tabular-nums;}
  /* 📋 템플릿 화면 */
  .dv-hd{display:flex; align-items:center; gap:8px; padding-bottom:9px;
    border-bottom:1px solid var(--line); margin-bottom:10px;}
  .dv-hd .bk{border:none; background:var(--field); color:var(--gray); font-size:13px;
    width:28px; height:28px; border-radius:9px; cursor:pointer; flex-shrink:0;}
  .dv-tplbox{width:100%; height:132px; border:1px solid var(--line); border-radius:10px;
    background:var(--field); color:var(--gray); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:9.5px; line-height:1.5; padding:9px 10px; resize:none; margin-top:6px;
    user-select:text; -webkit-user-select:text;}
  .dv-tplbox.edit{border-color:var(--blue); background:var(--card); color:var(--ink);}
  .dv-slot{display:flex; gap:5px; align-items:center; margin-bottom:5px;}
  .dv-slot .nm{flex:1; font-size:11.5px; font-weight:800; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dv-slot .nm small{display:block; font-size:9.5px; font-weight:700; color:var(--gray3);
    font-variant-numeric:tabular-nums;}
  .dv-slot.empty .nm{color:var(--gray3); font-weight:700;}
  .modal .ok.dark{color:var(--gray2);}
  .modal .ok.danger{color:var(--red);}
  .modal .ok.ghost{margin-top:7px; outline:0; font-weight:400;}
  /* 2번 탭으로 도구를 여는 이상, 브라우저의 더블탭 확대와 겹친다. 확대만 막는다. */
  .brand{cursor:pointer; touch-action:manipulation; -webkit-user-select:none; user-select:none;}
</style>
</head>
<body>
<div id="app">
  <!-- 제목표 — 98 관용구대로 "문서 — 프로그램"이다. 한 판이 곧 문서 하나라는 뜻이고,
       세계관 설명을 제목 한 줄이 대신한다. 대화상자가 뜨면 .off로 회색이 된다. -->
  <div class="topbar" id="topbar">
    <div class="tb-left">
      <span id="appIcon"></span>
      <div class="brand" id="brandTap">머니<span>로드</span></div>
    </div>
    <div class="top-right">
      <div class="tier-chip hide" id="tierChip"></div>
      <div class="lv-chip" id="lvChip">Lv.1</div>
      <div class="top-right-row">
        <button class="icon-btn" id="muteBtn"></button>
      </div>
    </div>
  </div>

  <!-- 메뉴바 — 언어 전환이 사는 자리. 번역이 끝나서 🛠 도구 밖으로 나왔다. -->
  <div class="menubar" id="menubar">
    <button id="mnLang" data-menu="lang"></button>
    <button id="mnHelp" data-menu="help"></button>
  </div>

  <div class="body">
    <!-- 잔고는 여기 산다. 예전에는 제목표(탑바)에 있었는데, 98의 제목표는

/* 브라우저 설정으로 첫 언어를 정한다. 고른 뒤에는 저장값이 이긴다. */
function detectLang(){
  try{ return String(navigator.language||'').toLowerCase().indexOf('ko')===0?'ko':'en'; }
  catch(e){ return 'ko'; }
}
let LANG=(function(){
  try{ const v=localStorage.getItem(LANG_KEY); if(v==='ko'||v==='en')return v; }catch(e){}
  return detectLang();
})();
function t(k,v){
  const d=L[LANG]||L.ko;
  const s=(d&&d[k]!=null)?d[k]:(L.ko[k]!=null?L.ko[k]:k);
  return v?String(s).replace(/\{(\w+)\}/g,function(_,n){return v[n]!=null?v[n]:'';}):s;
}
function setLang(l){
  if(l!=='ko'&&l!=='en')return;
  LANG=l;
  try{ localStorage.setItem(LANG_KEY,l); }catch(e){}
  if(typeof render==='function')render();
}

  stable:[9,9,7,7,8,8,6,6,7,7,5,5,6,6,4,4],

  coin:  [8,1,14,2,15,1,13,15,2,14,1,15,3,13,1,14],
};
const ICO_SPCOL={stable:'#000080',theme:'#c00000',surge:'#c00000',
                 etf:'#008000',penny:'#c00000',coin:'#c00000'};
/* 같은 줄에서 여러 번 불리므로 만든 것을 들고 있는다 — 한 판에 수십 번 다시 그린다. */
const ICO_CACHE={};
function ic(name,scale){
  const s=scale||2, key=name+'@'+s;
  if(ICO_CACHE[key])return ICO_CACHE[key];
  let r='';
  if(ICO[name]){
    const rows=ICO[name];
    for(let y=0;y<16;y++){
      const line=rows[y];
      let x=0;
      while(x<16){
        const c=line[x];
        if(c==='.'){x++;continue;}
        let w=1; while(x+w<16&&line[x+w]===c)w++;
        r+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+ICO_PAL[c]+'"/>';
        x+=w;
      }
    }
  }else if(ICO_SPARK[name]){
    const ys=ICO_SPARK[name], col=ICO_SPCOL[name];
    r='<rect x="0" y="0" width="16" height="16" fill="#ffffff"/>'
     +'<rect x="0" y="7" width="16" height="1" fill="#c0c0c0"/>';
    for(let x=0;x<16;x++){
      const y=ys[x];
      r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+col+'"/>';
      if(x){const p=ys[x-1],a=Math.min(p,y),b=Math.max(p,y);
        if(b-a>1)r+='<rect x="'+x+'" y="'+(a+1)+'" width="1" height="'+(b-a-1)+'" fill="'+col+'"/>';}
    }
  }else return '';
  const out='<svg class="ic" width="'+16*s+'" height="'+16*s+'" viewBox="0 0 16 16" '
    +'shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
  ICO_CACHE[key]=out;
  return out;
}

   전부 같은 정수를 쓰니 밸런스와 세이브는 언어와 무관하다.

   영어판은 100으로 나눠 달러로 쓴다. 환율이 100이라는 뜻이 아니라, 밸런스를 한 줄도

  if(d>=1e4){

/* 여러 구간(keypoint)을 사인 이징으로 잇는 범용 경로 생성기 — 구간을 몇 개, 어떤 값으로

function buildMultiPhase(keypoints,noiseAmt,T){
  T=T||ROUND_TICKS;
  const kps=[[0,1],...keypoints];
  const path=[1]; let noise=0;
  for(let i=1;i<=T;i++){
    const frac=i/T;
    let seg=kps.length-2;
    for(let k=0;k<kps.length-1;k++){ if(frac<=kps[k+1][0]){seg=k;break;} }
    const [f0,v0]=kps[seg],[f1,v1]=kps[seg+1];
    const segFrac=(f1-f0)>0?(frac-f0)/(f1-f0):1;
    const s=Math.sin(Math.min(1,Math.max(0,segFrac))*Math.PI/2);
    const val=v0+(v1-v0)*s;
    noise+=noiseAmt*randn(); noise*=0.75;
    path.push(Math.max(0.05,val+noise));
  }
  return path;
}
function buildFlat(noiseAmt,driftAmt,T){

    path.push(Math.max(0.05,1+drift*(i/T)+noise));
  }
  return path;

function pickPattern(){
  let r=Math.random(),acc=0;

/* 신호가 말하는 건 "등급"까지고, 그 등급 안에서 어떤 패턴이 나올지는 종목이 정한다.
   이 분리가 중요하다 — 등급 분포는 종목과 무관하므로 종목을 바꿔도 신호가 그대로
   유효하고(그래서 다시 뽑을 필요가 없고), 동시에 종목마다 다른 판이 나온다.
   등급까지 종목이 바꾸게 두면 "좋은 신호가 뜰 때까지 종목 돌리기"가 열린다. */
function pickInTier(tier,stock){
  const w=(stock&&stock.patW)||null;
  const pool=PATTERNS.filter(p=>PATTERN_TIER[p.id]===tier);
  const ws=pool.map(p=>p.weight*((w&&w[p.id]!==undefined)?w[p.id]:1));
  const tot=ws.reduce((a,x)=>a+x,0);
  if(!(tot>0))return pool[0];   // 종목이 한 등급을 통째로 막는 일은 없어야 한다
  let r=Math.random()*tot,acc=0;
  for(let i=0;i<pool.length;i++){ acc+=ws[i]; if(r<=acc)return pool[i]; }
  return pool[pool.length-1];
}

  const pat=(DEV.pat&&PATTERNS.find(x=>x.id===DEV.pat))||pickInTier(tier||'mid',stock);

   단계를 바꿀 때 이전 단계의 보정 위에 또 보정하는 일이 안 생긴다. */
const BASE_WEIGHTS=PATTERNS.map(p=>p.weight);
function applyTierWeights(){
  const d=tierOf().down, HALF=0.29;   // strong 합 = weak 합 = 0.29

    p.weight = t==='weak' ? w0+d*(w0/HALF)
             : t==='strong' ? w0-d*(w0/HALF)
             : w0;
  });

/* 레버리지 청산선 — 손실이 베팅금 전액이 되는 가격.

   숏: (1-mult)*L = -1  →  mult = 1 + 1/L   (위쪽, 1배도 2배에서 청산된다)
   숏이 비대칭으로 위험한 건 이 때문이다. 가격은 아래로 0까지지만 위로는 상한이 없어서

/* 판당 필요 수익률 = (목표 ÷ 현금)^(1 ÷ 남은 거래일) − 1.

  let cls='p-ok';

  if(days<=1)cls='p-bad'; else if(days<=3&&cls==='p-ok')cls='p-warn';
  const p=Math.max(0,need)*100;
  return {need,cls,last:days<=1,txt:`+${p<10?p.toFixed(1):Math.round(p)}%`};
}

/* ===== 트레이더 경험치 (판이 끝나도 남는 것) =====
   예전에는 포인트로 강화를 "사는" 트리였다 — 시드머니·타고난 촉·보험·뒷배·빚 청산.
   다섯 노드가 전부 다음 판을 쉽게 만드는 방향이라, 반복 플레이의 보상이 곧 난이도
   완화였다. 트리를 통째로 걷어내고 경험치만 남긴다: 고를 것도 살 것도 없이 레벨이
   오르면 열리고, 열리는 건 수치가 아니라 "할 수 있는 일"뿐이다.

   XP는 그 판의 최고 기록을 로그로 환산한다. 선형(최고÷100만)으로 두면 500억을 찍는
   순간 5만 XP가 나와서 해금이 한 판에 끝나버린다. 여기에 관문을 일찍 갚아 모아둔
   보너스 XP가 더해진다(EARLY_XP_PER_DAY).

   메타 해금은 실제로 구현된 것만 적는다. 기능이 하나 붙을 때마다 여기 한 줄이 는다 —
   "곧 나옴" 상태의 빈 항목을 두지 않기 위해서다. */
/* 🛠 메타 성장 다이얼 — 도구의 🧬 메타 탭이 민다. 해금이 몇 판에 열리는지는
   이 셋과 META_UNLOCKS의 need가 같이 정한다. */
let XP_LOG_MULT=20;
const XP_LOG_MULT_BASE=XP_LOG_MULT;
function xpOfPeak(peak){return Math.max(1,Math.floor(XP_LOG_MULT*Math.log10(Math.max(peak,MIN_BET)/100000)));}
let EARLY_XP_PER_DAY=2;     // 관문을 하루 일찍 갚을 때마다 붙는 XP
const EARLY_XP_BASE=EARLY_XP_PER_DAY;
let TIER_XP_MULT=1.0;       // 난이도 배수 전체에 곱한다(1단계 기준)
const TIER_XP_BASE=TIER_XP_MULT;

const META_UNLOCKS=[
  {lv:2, need:40,  id:'short',  get emo(){return ic('sigdn');},
   get name(){return t('unShortN');}, get ds(){return t('unShortD');}},

  {lv:4, need:260, id:'water',  get emo(){return ic('drop');},

const UNLOCK_NEED_BASE=META_UNLOCKS.map(u=>u.need);   /* 🛠 도구가 need를 밀므로 원본을 남긴다 */
/* ===== 📋 패턴 도감 =====
   이 게임은 패턴을 읽는 게임인데 읽는 법을 배울 곳이 없었다. 겪은 패턴을 영구히
   쌓아서, 신호 등급별로 "실제로 무엇이 나왔는지"와 "지금 고른 종목에서는 어떤 비율로
   나오는지"를 보여준다. 종목마다 등급 안 분포가 다르므로(patW) 이게 곧 실전 참고표다.

   쉬워지지는 않는다 — 도감은 지나간 판의 통계와 규칙일 뿐, 다음 판에 무엇이 나올지는
   알려주지 않는다. 신호 적중률도 그대로다. */
function recordPattern(id,lo,hi){
  if(!id)return;
  const d=META.dex||(META.dex={});
  const e=d[id]||(d[id]={n:0,hi:0,lo:0});
  e.n++; e.hi+=hi; e.lo+=lo;
  saveMeta();
}
function dexOf(id){return (META.dex&&META.dex[id])||{n:0,hi:0,lo:0};}
function dexSeen(){return PATTERNS.filter(p=>dexOf(p.id).n>0).length;}
function metaLv(){ let lv=1; for(const u of META_UNLOCKS) if((META.xp||0)>=u.need)lv=u.lv; return lv; }
function metaHas(id){ const u=META_UNLOCKS.find(x=>x.id===id); return !!u&&(META.xp||0)>=u.need; }
function nextUnlock(){ return META_UNLOCKS.find(u=>(META.xp||0)<u.need)||null; }
/* 방금 끝난 판의 정산 내역. penalty는 파산/반대매매에만 붙는다. */
function settleOf(penalty){
  const base=xpOfPeak(S.peakCash), early=Math.max(0,S.earlyXp||0), t=tierOf();
  const mult=t.xp*TIER_XP_MULT;
  return {peak:S.peakCash, base, early, penalty, mult, tier:tierIdx(), tierName:t.n, tierEmo:t.emo,
    total:Math.max(1,Math.round((base+early)*(1-penalty)*mult))};
}

/* ===== 매도 등급 =====
   그 판에 실제로 지나간 가격 범위 안에서 어디에 팔았나. 고점 매도 100%, 바닥 매도 0%.
   처음엔 "고점 대비"((매도−1)÷(최고−1))로 잡았는데, 하락장에서는 매도 시점이 곧 그 순간의
   최저점이라 모든 플레이어가 D를 받는 결함이 있었다. 최저~최고 범위로 바꾸면 상승장·하락장
   구분 없이 항상 정의되고 실력순으로 갈린다. */
const GRADE_CUT=[[0.90,'S','gradeS'],[0.70,'A','gradeA'],[0.45,'B','gradeB'],
                 [0.20,'C','gradeC'],[-1,'D','gradeD']];
const GRADE_MIN_RANGE=0.04;   /* 이보다 덜 움직인 판은 등급이 노이즈라 매기지 않는다 */
function gradeOf(mult,lo,hi,dir){
  const rng=hi-lo;
  if(rng<GRADE_MIN_RANGE)return null;
  /* 롱은 높이 팔수록, 숏은 낮게 덮을수록 잘한 것이다 */
  const e=Math.max(0,Math.min(1,((dir||1)<0?hi-mult:mult-lo)/rng));
  const g=GRADE_CUT.find(c=>e>=c[0]);
  return {pct:Math.round(e*100), g:g[1], txt:t(g[2])};
}

   최소 배율(빚)과 최대 배율을 한 값에 섞으면 빚을 갚을 때 최대까지 같이 내려간다. */
function leverageMultOf(){return LEVERAGE_MULTS[Math.min(LEVERAGE_MULTS.length-1,S.upg.leverageLv||0)];}

/* meta (설정 + 판이 끝나도 남는 경험치)
   pendingSettle에는 정산 내역을 통째로 넣어둔다. 정산 화면을 띄운 채로 앱을 닫아도
   다시 켰을 때 같은 내역을 보여줘야 하는데, boolean만으로는 복원할 수가 없다. */

/* WIPING이 서면 저장이 멎는다. location.reload()는 pagehide를 발생시키고 거기
   saveRun이 걸려 있어서, 잠그지 않으면 방금 지운 판이 리로드 직전에 다시 쓰인다.
   3초 주기 자동 저장도 같은 틈에 끼어든다. */
let WIPING=false;
function saveRun(){if(WIPING)return;try{localStorage.setItem(RUN_KEY,JSON.stringify(S));}catch(e){}}

function bumpPeak(){if(S.cash>S.peakCash)S.peakCash=S.cash;}

/* 라운드 손익에 손절 보험을 적용 — 손실일 때만 일부를 되돌려준다 */
function applyStoploss(profit){
  if(profit>=0)return profit;
  const pct=STOPLOSS_PCT[S.upg.stoplossLv||0];
  if(!pct)return profit;
  return profit+Math.abs(profit)*pct;
}

/* 저장된 시점 이후 흐른 시간을 catch-up: 자리를 비운 사이 돈이 불어나 있거나
   사라져 있는 건 이상하니(지켜보지 않은 결과로 보상/손실을 주지 않는다), 떠나있는
   동안 라운드가 15초를 넘겨버렸으면 손익 없이 베팅한 금액만 그대로 돌려준다. */
function catchUp(){
  const now=Date.now();
  const awaySec=(now-S.lastTick)/1000;
  let roundRefunded=null;
  if(S.activeRound){
    const idx=currentTickIdx();
    if(idx>=S.activeRound.path.length-1){
      S.cash+=S.activeRound.bet;
      roundRefunded={bet:S.activeRound.bet};
      S.activeRound=null;
      S.lastResult=null;
      rollPending(); // 이미 흘러가버린 라운드의 신호는 버리고 새로 뽑는다
    }
  }
  S.lastTick=now;
  return {awaySec,roundRefunded};
}

}

/* ===== 난이도 선택 화면 =====

   고르기 전에 무엇을 짊어지는지 알아야 선택이다. */
let tierPick=0;

   메인 탭을 넷으로 늘리지 않는다. */
function showDexModal(){

    const col=tier==='strong'?'#f04452':tier==='weak'?'#3182F6':'#8b95a1';
    return pool.map((p,i)=>{

            stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="dex-st">${seen?t('dexSeen',{n:d.n,lo:avgLo,hi:avgHi}):t('dexUnseen')}</div>
      </div>`;

  const sec=tier=>{

    return `<div class="dex-sec"><div class="dex-head ${tier}">${g.emo} ${g.name}
      <small>${g.ds}</small></div><div class="dex-grid">${rows(tier)}</div></div>`;

    <div class="dex-note">${t('dexNote',{e:st.emo,n:st.name})}</div>
    <div class="scroller">${SIGNAL_TIERS.map(sec).join('')}</div>

  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');};
}

  /* TIERS.map의 인자 이름을 ti로 바꿨다 — t는 번역 함수라 가리면 안 된다 */
  $('modalBox').innerHTML=`<div class="emo">${ic('lever',3)}</div><div class="tt">${t('tmTitle')}</div>
    <div class="dc">${t('tmDesc')}</div>
    <div class="tier-list">${TIERS.map((ti,i)=>{
      if(i>maxI)return `<div class="diff-card lock">
        <div class="diff-top"><span class="diff-nm">${ic('lock')} ${t('tmCard',{i:i+1,n:ti.n})}</span></div>
        <div class="diff-de">${t('tmLockDe',{n:i})}</div></div>`;
      const cleared=(META.cleared||0)>i;
      return `<button class="diff-card ${i===tierPick?'sel':''}" data-tier="${i}">
        <div class="diff-top"><span class="diff-nm">${t('tmCard',{i:i+1,n:ti.n})}</span>
          ${cleared?`<span class="diff-clear">${t('tmCleared')}</span>`:''}
          <span class="diff-xp">XP ×${ti.xp.toFixed(1)}</span></div>
        <div class="diff-de${ti.de.length?'':' none'}">${ti.de.length?ti.de.join(' · '):t('tmNoDe')}</div>
      </button>`;
    }).join('')}</div>

  $('modalBox').querySelectorAll('.diff-card[data-tier]').forEach(b=>b.onclick=()=>{
    sfx.tap(); tierPick=+b.dataset.tier; renderTierModal(); });
  $('mOk').onclick=()=>{ sfx.tap(); $('modal').classList.remove('on');
    startRunAt(tierPick); render(); };
}

/* 상점은 "단타를 더 잘하게" 돕는 것만 판다. 배당주(자동 수입)는 삭제했다 —
   단타를 대체하지 않도록 일부러 미미하게 만든 항목이라, 존재감이 없는 게 설계대로 작동한 결과였다.
   그러면 있을 이유가 없다. 레버리지도 팔지 않는다(빚/레벨 보상으로만 움직인다). */
const SHOP_IDS=['info','stoploss'];
function upgradeInfo(id){
  if(id==='stoploss'){
    const lv=S.upg.stoplossLv;
    if(lv>=3)return {emo:ic('shield'),name:t('shStopN'),cnt:'MAX', ds:t('shStopMax',{p:Math.round(STOPLOSS_PCT[3]*100)}), maxed:true};
    return {emo:ic('shield'),name:t('shStopN'),cnt:lv>0?`Lv.${lv}`:'', ds:`${lv>0?t('shStopCur',{p:Math.round(STOPLOSS_PCT[lv]*100)}):''}${t('shStopNxt',{p:Math.round(STOPLOSS_PCT[lv+1]*100)})}`, cost:STOPLOSS_COSTS[lv], buyLabel:t('shUpgrade')};
  }
  if(id==='info'){
    const lv=S.upg.infoLv||0, cur=Math.round(INFO_ACC[lv]*100);
    if(lv>=INFO_ACC.length-1)return {emo:ic('glass'),name:t('shInfoN'),cnt:`${cur}%`, ds:t('shInfoMax'), maxed:true};
    return {emo:ic('glass'),name:t('shInfoN'),cnt:`${cur}%`, ds:t('shInfoNxt',{a:cur,b:Math.round(INFO_ACC[lv+1]*100)}), cost:INFO_COSTS[lv], buyLabel:t('shUpgrade')};
  }
}
function buyUpgrade(id){
  const info=upgradeInfo(id);
  if(info.maxed||S.cash<info.cost)return;
  S.cash-=info.cost;
  if(id==='leverage')S.upg.leverageLv++;
  else if(id==='stoploss')S.upg.stoplossLv++;
  else if(id==='info')S.upg.infoLv++;
  sfx.buy(); toast(t('shBought',{n:info.name}));
  saveRun(); render();
}
function renderShop(){
  $('shopList').innerHTML=SHOP_IDS.map(id=>{
    const info=upgradeInfo(id);
    const can=!info.maxed && S.cash>=info.cost;
    const btn=info.maxed
      ? `<button class="biz-buy cant" disabled><span class="p">${t('shopDone')}</span></button>`
      : `<button class="biz-buy ${can?'can':'cant'}" data-id="${id}"><span class="p">${fmtMoney(info.cost)}</span><span class="l">${info.buyLabel}</span></button>`;
    return `<div class="biz"><div class="logo">${info.emo}</div>
      <div class="mid"><div class="nm">${info.name}${info.cnt?`<span class="cnt">${info.cnt}</span>`:''}</div>
      <div class="ds">${info.ds}</div></div>
      ${btn}</div>`;
  }).join('');
  $('shopList').querySelectorAll('.biz-buy:not([disabled])').forEach(btn=>btn.onclick=()=>buyUpgrade(btn.dataset.id));
}

/* ===== 해금 탭 = 레벨 보상 로드맵 전체 (무료로 열리는 건 전부 여기 모아둔다) ===== */
/* 정산 화면은 탭에 깔지 않는다. 파산하거나 은퇴한 "직후"에만 여는 화면이다 —
   죽고 나서 강해지고 다시 들어가는 게 로그라이크의 리듬이고, 평소 화면도 깨끗해진다.
   예전 레거시 화면과 달리 고르거나 살 것이 없다. 경험치가 차면 그냥 열린다. */
function showSettleModal(st){
  const after=META.xp||0, before=after-st.total;
  /* 이번 정산으로 넘어선 해금 */
  const opened=META_UNLOCKS.filter(u=>before<u.need&&after>=u.need);
  const nx=nextUnlock();
  /* 진행바는 "직전 해금 → 다음 해금" 구간을 채운다. 첫 해금 전에는 0에서 출발한다. */
  const done=META_UNLOCKS.filter(u=>u.need<=after);
  const lo=done.length?done[done.length-1].need:0;
  const pct=nx?Math.max(0,Math.min(100,(after-lo)/Math.max(1,nx.need-lo)*100)):100;
  const penLabel=st.penalty>0?t('sePen',{p:Math.round(st.penalty*100)}):null;
  $('modalBox').innerHTML=`<div class="emo">${ic('xp',3)}</div><div class="tt">${t('seTitle')}</div>
    <div class="xp-tbl">
      <div><span>${t('sePeak',{v:fmtMoney(st.peak)})}</span><b>+${st.base}</b></div>
      ${st.early>0?`<div><span>${t('seEarly')}</span><b>+${st.early}</b></div>`:''}
      ${st.mult&&st.mult!==1?`<div><span>${t('seTier',{e:st.tierEmo||'',n:(st.tier||0)+1,name:st.tierName||''})}</span><b>×${st.mult.toFixed(1)}</b></div>`:''}
      ${penLabel?`<div class="pen"><span>${penLabel}</span><b>−${Math.round(st.penalty*100)}%</b></div>`:''}
      <div class="sum"><span>${t('seSum')}</span><span>+${st.total} XP</span></div>
    </div>
    <div class="xp-head"><span>Lv.${metaLv()} <small>${t('seCum',{v:after})}</small></span>
      <small>${nx?t('seToNext',{e:nx.emo,n:nx.name,v:Math.max(0,nx.need-after)}):t('seAllOpen')}</small></div>
    <div class="xp-bar"><i style="width:${pct}%"></i></div>
    ${opened.map(u=>`<div class="unlock-pop"><span class="e">${u.emo}</span>
      <span><span class="t">${t('seNewUnlock',{n:u.name})}</span><span class="d">${u.ds}</span></span></div>`).join('')}
    <button class="ok" id="mOk">${t('seStart')}</button>`;
  $('modal').classList.add('on');
  if(opened.length)sfx.win();
  $('mOk').onclick=()=>{
    sfx.tap(); META.pendingSettle=null; saveMeta();
    /* 단계를 하나라도 깼으면 고를 것이 생긴다. 아직 1단계뿐이면 물어볼 이유가 없다. */
    if(maxTierIdx()>0){ showTierModal(); return; }
    $('modal').classList.remove('on');
    startRunAt(0); render();
  };
}

function renderUnlock(){

      <div class="ds">${l.tag||r.bonusTxt||r.d}</div></div>

/* ===== 거래 결과에 대한 사회적 반응 =====

   그래서 반응은 매도가 끝난 "직후"에, 결과 크기에 비례해서 보여준다.
   소액 익절은 아무도 관심 없고(시큰둥한 한 줄), 대박은 댓글이 쏟아지고 좋아요가 터진다 —
   "따도 아무도 몰라주면 재미없다"를 정면으로 겨냥한 장치. 레버리지를 쓴 거래는
   반응이 더 커져서, 크게 거는 이유가 돈 말고 하나 더 생긴다. */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function CH(){return CHAT[LANG]||CHAT.ko;}
function buffNames(R){return (R.buffs||[]).map(b=>BUFFS[b].name).join('+');}
/* 회귀 테스트가 FAKE_NAMES라는 이름으로 목록이 살아 있는지 본다.
   이름을 살려두고 현재 언어의 목록을 준다 — 목록이 둘로 갈렸을 뿐 사라진 게 아니다. */
try{ Object.defineProperty(window,'FAKE_NAMES',{get:()=>CH().names}); }catch(e){}
function nameFor(seed){const n=CH().names; return n[Math.abs(Math.floor(seed))%n.length];}
/* 사건별 문장 — 조건이 맞을 때만 후보에 오른다. when은 언어와 무관하니 여기 남고,
   문장만 CHAT에서 가져온다. 영어에 빠진 사건이 있으면 한국어로 떨어진다. */
const EVENT_LINES=[
  {id:'wiped',       when:R=>R.profit<=-R.bet*0.95},
  {id:'missPeak',    when:R=>R.grade&&R.grade.pct<45&&R.hi>=1.15},
  {id:'perfect',     when:R=>R.grade&&R.grade.g==='S'},
  {id:'streakBreak', when:R=>R.prevStreak>=3&&R.profit<=0},
  {id:'streakOn',    when:R=>R.streak>=3&&R.profit>0},
  {id:'buffFail',    when:R=>(R.buffs||[]).length>0&&R.profit<0},
  {id:'buffWin',     when:R=>(R.buffs||[]).length>0&&R.profit>R.bet*0.5},
  {id:'bigLev',      when:R=>R.lev>=5&&R.profit>R.bet},
  {id:'dday',        when:R=>R.daysLeft<=2&&R.profit>0},
  {id:'ddayFail',    when:R=>R.daysLeft<=2&&R.profit<0},
];
function evLines(id,R){
  const f=(CH().ev||{})[id]||CHAT.ko.ev[id];
  try{ return f?f(R):[]; }catch(e){ return []; }
}
function reactPool(tier){return (CH().react||{})[tier]||CHAT.ko.react[tier];}
function buildReactions(R){
  const bet=R.bet, r=bet>0?R.profit/bet:0;
  let tier;
  if(r>=1.0)tier='jackpot'; else if(r>=0.15)tier='win';
  else if(r>-0.15)tier='meh'; else if(r>-0.5)tier='loss'; else tier='disaster';
  const likeBase={jackpot:260,win:28,meh:1,loss:16,disaster:140}[tier];
  const out=[];
  /* 이번 판에 해당하는 사건이 있으면 그중 하나를 먼저 — 이게 "나를 보고 하는 말"이 된다 */
  const hits=EVENT_LINES.filter(e=>{try{return e.when(R);}catch(x){return false;}});
  if(hits.length){ const lines=evLines(pick(hits).id,R); if(lines.length)out.push(pick(lines)); }
  /* 그다음 일반 반응 하나 */
  const pool=[...reactPool(tier)];
  if(R.lev>1){const ex=(CH().lev||{})[r>=0.15?'win':r<=-0.15?'loss':null]; if(ex)pool.push(...ex);}
  out.push(pick(pool));
  const mult=1+(R.lev>1?R.lev*0.35:0);
  /* map 인자를 txt로 둔다 — t는 번역 함수라 여기서 가리면 안 된다 */
  return {tier, list:out.slice(0,2).map(txt=>({
    name:nameFor(Math.random()*100000), text:txt,
    likes:Math.max(0,Math.round(likeBase*mult*(0.5+Math.random())))}))};
}
function resultModalHTML(R){

  const chips=[];

  /* 숏도 "팔았다"로 통일한다 — 버튼이 하는 일은 어느 방향이든 "이 판을 끝낸다"다 */

  return `<div class="cm-head"><span class="cm-title">${t('rsTitle')}</span>${badge}</div>

/* 한 판이 끝나면 하루가 간다 — 그런데 팝업을 닫는 순간 D가 조용히 줄면
   처음 하는 사람은 마감이 갑자기 닥친 걸로 느낀다. 소모되는 하루만 여기서 보여준다.

   날짜·목표까지 남은 금액·판당 필요 수익률은 일부러 뺐다. 셋 다 상단 상환 스트립과
   시작 버튼 위 경고줄에 이미 같은 값이 있어서, 결과 팝업에 또 적으면 한 판 끝날 때마다
   같은 숫자를 세 번 읽히는 꼴이 된다. 위험도는 문구 대신 배경색(.p-ok/.p-warn/.p-bad)이
   전달한다 — 색은 이미 스트립·진행바와 같은 3단계라 따로 배울 것도 없다.
   endOfDay()는 이 팝업을 닫은 뒤에 돌기 때문에 여기 값은 아직 줄기 전이다. */
function closeRowHTML(){
  if(gateDone())return '';
  const g=gateOf(), before=S.daysLeft, after=before-1;
  const row=(cls,inner)=>`<div class="rs-close ${cls}"><div class="cl-top one">${inner}</div></div>`;
  if(S.peakCash>=g.goal)return row('p-done',`<span class="cl-dd"><b>${t('clRepay',{n:g.n})}</b></span>`);
  if(after<=0)return row('p-bad',`<span class="cl-dd"><b>${t('clExpired')}</b></span>`);
  return row(riskAt(S.cash,after).cls,`<span class="cl-dd">D-${before} → <b>D-${after}</b></span>`);
}
function showResultModal(R,after){
  /* 버튼 색으로 손익을 또 말하지 않는다 — 금액이 이미 빨강/파랑으로 크게 서 있고,
     98의 버튼은 언제나 회색이다. 색을 넣으면 그 순간 98이 아니게 된다. */
  $('modalBox').innerHTML=`<div class="rs-box">${resultModalHTML(R)}</div>
    <button class="ok" id="mOk">${t('btnOk')}</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');after&&after();};
}

/* ===== 레벨 ===== */
/* 라운드가 끝날 때마다 하루가 간다. 상환 판정을 먼저 하고 기한을 따진다 —
   마지막 날에 목표를 채우면 통과해야 하니까. */
function endOfDay(){
  if(gateDone())return false;
  S.dayCount++; S.daysLeft--;
  if(checkLevelUp())return true;              // 상환 완료(=레벨업) 모달
  if(S.daysLeft<=0){ showDefaultModal(); return true; }
  return false;
}
function checkLevelUp(){
  if(gateDone())return false;
  const g=gateOf();
  if(S.peakCash<g.goal)return false;
  const nl=LEVELS.find(l=>l.lv===S.level+1);
  S.gate++; S.level=nl?nl.lv:S.level+1;
  /* 완제하면 그 단계를 깬 것으로 치고 다음 난이도가 열린다. 파산으로는 안 열린다. */
  if(gateDone()&&(META.cleared||0)<tierIdx()+1){ META.cleared=tierIdx()+1; saveMeta(); }
  /* 기한보다 며칠 일찍 갚았나 → 그만큼 현금으로 받는다. 거래일은 이월되지 않고,
     다음 관문은 언제나 GATES에 적힌 일수로 새로 시작한다. */
  const early=Math.max(0,S.daysLeft);
  const bonus=Math.round(g.goal*EARLY_BONUS_RATE*early);
  if(bonus>0){ S.cash+=bonus; bumpPeak(); }
  S.earlyXp=(S.earlyXp||0)+early*EARLY_XP_PER_DAY;   // 판이 끝날 때 정산에 더해진다
  if(!gateDone())S.daysLeft=gateDaysOf(S.gate);
  if(nl&&nl.reward&&nl.reward.f)nl.reward.f(S);
  saveRun(); render();
  showRepayModal(g,(nl&&nl.reward)?nl:null,early,bonus);
  return true;
}
/* 완제(마지막 관문 통과)는 그 판의 끝이다. 예전에는 "계속 플레이" 버튼이 팝업만 닫아서,
   더 넘을 관문도 받을 보상도 없는 판에 그대로 방치됐다(정산하려면 해금 탭에 들어가
   은퇴를 따로 눌러야 했다). 이제 버튼 하나로 100% 정산하고 레거시 화면으로 넘어간다
   — 은퇴와 같은 대우다. 기한 안에 다 갚은 사람을 은퇴보다 불리하게 둘 이유가 없다. */
function showRepayModal(g,nl,early,bonus){
  const done=gateDone();
  const r=nl&&nl.reward;
  const next=done?null:GATES[S.gate];
  const st=done?settleOf(0):null;
  $('modalBox').innerHTML=`<div class="emo">${done?ic('trophy',3):(r?r.emo:ic('chain',3))}</div>
    <div class="tt">${done?t('rpDone'):t('rpGate',{n:g.n})}</div>
    <div class="dc">${done?t('rpDoneDesc'):t('rpGateDesc',{v:fmtMoney(g.goal)})}</div>
    ${bonus>0?`<div class="lv-gain early"><b>${t('rpEarly',{n:early})}</b>
      — <b>${fmtMoney(bonus)}</b> · ${t('kXp')} <b>+${early*EARLY_XP_PER_DAY}</b></div>`:''}
    ${r?`<div class="lv-gain"><b>${r.t}</b> — ${r.bonusTxt||r.d}</div>`:''}
    ${next?`<div class="stat-grid">
      <div class="s"><div class="k">${t('kNextGoal',{n:next.n})}</div><div class="v">${fmtMoney(next.goal)}</div></div>
      <div class="s"><div class="k">${t('kDeadline')}</div><div class="v">${t('vDays',{n:S.daysLeft})}</div></div></div>`:''}
    ${done?`<div class="stat-grid">
      <div class="s"><div class="k">${t('kRunPeak')}</div><div class="v">${fmtMoney(S.peakCash)}</div></div>
      <div class="s"><div class="k">${t('kXp')}</div><div class="v" style="color:var(--gold)">+${st.total} XP</div></div></div>`:''}
    <button class="ok" id="mOk">${done?t('rpSettle'):t('rpNext')}</button>`;
  $('modal').classList.add('on');
  sfx.win();
  $('mOk').onclick=done
    ? ()=>{sfx.tap();finishRun(st);}
    : ()=>{sfx.tap();$('modal').classList.remove('on');render();checkLevelUp();};
}

/* 기한 연장 — 실제로도 만기 연장은 있다. 대신 자산을 낸다. */
function extendDeadline(){
  if(gateDone())return;
  const cost=Math.floor(S.cash*EXTEND_COST_FRAC);
  if(cost<=0||S.cash-cost<MIN_BET)return;
  S.cash-=cost; S.daysLeft+=EXTEND_DAYS;
  sfx.buy(); toast(t('exToast',{n:EXTEND_DAYS,v:fmtMoney(cost)}));
  saveRun(); render();
}
/* 98의 진행바는 이어진 막대가 아니라 칸으로 끊어 찬다. 칸 수를 고정해 두면
   "몇 칸 남았나"를 세게 되고, 그게 마감이 다가온다는 걸 숫자보다 먼저 알려준다. */
const BAR_CELLS=13;
function blocks(done,total,cls){
  let s='';
  for(let i=0;i<total;i++)s+='<i'+(i<done?'':' class="e"')+'></i>';
  return `<div class="lv-bar ${cls||''}">${s}</div>`;
}
function renderLevel(){
  $('lvChip').textContent=`Lv.${S.level}`;
  /* 난이도는 1단계에서 숨긴다 — 고를 것이 없던 사람에게는 있으나 마나 한 정보고,
     탑바는 이미 잔고·상환·레벨로 꽉 차 있다. */
  const tc=$('tierChip'), ti=tierIdx();
  tc.classList.toggle('hide', ti===0);
  if(ti>0)tc.textContent=t('tierChip',{n:ti+1});
  const chip=$('repayChip'), el=$('repayStrip');
  if(gateDone()){
    chip.className='repay-chip';
    chip.innerHTML=t('gateDoneChip');
    el.innerHTML=`<div class="lv-row"><span class="lv-name">${t('gateDoneRow',{v:fmtMoney(S.peakCash)})}</span>
      <span class="lv-pct">100%</span></div>${blocks(BAR_CELLS,BAR_CELLS)}`;
    $('cashView').textContent=fmtMoney(S.cash);
    return;
  }
  const g=gateOf();
  const d=S.daysLeft, urgent=d<=3;
  const cells=Math.max(0,Math.min(BAR_CELLS,d));
  const r=riskAt(S.cash,d);
  const canExtend=S.cash*(1-EXTEND_COST_FRAC)>=MIN_BET;
  /* 상환금과 D-day는 탑바 칩이 들고 있다. 탑바는 sticky라 스크롤해도 남는다 —
     마감이 걸린 게임에서 마감은 늘 보여야 한다. 그래서 스트립에서는 같은 줄을
     빼고 진행바와 설명줄만 남긴다(관문 이름은 설명줄 앞으로 옮겼다). */
  chip.className=`repay-chip ${r.cls}${r.last?' last':''}`;
  chip.innerHTML=ic('chain')+` <span class="goal">${fmtMoney(g.goal)}</span><span class="sep">·</span>` +
    `<span class="dd">${r.last?t('lastDay'):t('dday',{n:d})}</span>`;
  el.innerHTML=`${blocks(cells,BAR_CELLS,r.cls)}
    <div class="repay-sub ${r.cls}">
      <span>${t('repaySub',{g:g.n,d:dateOfDay(S.dayCount),p:r.txt})}</span>
      ${urgent&&canExtend?`<button class="extend" id="extendBtn">${t('extendBtn',{n:EXTEND_DAYS,v:fmtMoney(Math.floor(S.cash*EXTEND_COST_FRAC))})}</button>`:''}
    </div>`;
  if($('extendBtn'))$('extendBtn').onclick=()=>{sfx.tap();extendDeadline();};
}

/* ===== 파산 ===== */
function checkBankrupt(){
  if($('modal').classList.contains('on'))return false;
  if(S.cash<BROKE_LIMIT && !S.activeRound){
    showBankruptModal();
    return true;
  }
  return false;
}
/* 파산은 경험치가 30% 깎인다. 그 30%가 나중에 광고를 붙일 자리다. */

/* 판을 끝내고 정산 화면으로. 내역을 META에 남겨두는 건, 정산 화면을 띄운 채
   앱을 닫았다가 다시 켜도 같은 화면을 보여주기 위해서다. */
function finishRun(st){

/* ===== 메인 탭 ===== */
function switchMainTab(tab){
  /* 라운드 중에는 단타 탭을 벗어날 수 없다 — 벗어나도 라운드는 계속 흘러가서
     15초를 통째로 날리게 되고, "직접 지켜봐야 의미가 있다"는 이 게임의 원칙과도 어긋난다 */
  if(S.activeRound&&tab!=='trade'){ toast(t('tsRoundLock')); tab='trade'; }
  S.mainTab=tab; saveRun();
  document.querySelectorAll('.main-tab').forEach(el=>el.classList.toggle('on',el.dataset.tab===tab));
  $('panelTrade').classList.toggle('hide',tab!=='trade');
  $('panelShop').classList.toggle('hide',tab!=='shop');
  $('panelUnlock').classList.toggle('hide',tab!=='unlock');

    el.classList.toggle('locked', !!S.activeRound && el.dataset.tab!=='trade'));

document.querySelectorAll('.main-tab').forEach(el=>el.onclick=()=>{sfx.tap();switchMainTab(el.dataset.tab);});

/* ===== 단타 라운드 ===== */
function currentTickIdx(){
  if(!S.activeRound)return 0;
  const elapsed=Date.now()-S.activeRound.startedAt;
  return Math.min(S.activeRound.path.length-1,Math.floor(elapsed/ROUND_TICK_MS));
}
function roundDir(){return (S.activeRound&&S.activeRound.dir)||1;}
function setBet(n){
  const hi=Math.floor(S.cash);
  S.betAmount=Math.max(Math.min(MIN_BET,hi),Math.min(hi,Math.round(n)));
  renderTrade();
}
/* dir: +1 롱(상승에 베팅) · -1 숏(하락에 베팅). 공매도를 안 열었으면 언제나 +1이다. */
function startRound(dir){
  if(dir===undefined)dir=S.betDir||1;
  if(S.activeRound)return;
  const stock=TRADE_STOCKS.find(s=>s.id===S.selectedStock);
  const bet=S.betAmount;
  if(bet<MIN_BET||bet>S.cash)return;
  ensurePending();
  const {patternId,patternEmo,path,ticks}=genRound(stock,S.pending.tier);
  const maxLev=leverageMultOf(), minLev=minLevOf();
  const leverage=Math.min(Math.max(minLev,S.betLeverage||minLev),maxLev);
  S.cash-=bet;
  S.activeRound={stockId:stock.id,bet,path,ticks,patternId,patternEmo,leverage,
    dir:(metaHas('short')&&dir<0)?-1:1,
    entry:1, bet0:bet, watered:false,   // entry = 평균 단가. 물타기로만 움직인다
    startedAt:Date.now(), yMin:0.96, yMax:1.04, boundsIdx:0, dispYMin:0.96, dispYMax:1.04,
    peak:1, peakIdx:0, low:1, lowIdx:0,
    buffs:(S.buffs||[]).slice()};
  S.buffs=[];              // 티켓은 이 한 판에만 — 남겨두지 않는다
  ensureToday(); S.today.rounds++;
  S.lastResult=null;
  sfx.buy();
  saveRun(); render();
}
/* 베팅금 중 part만큼을 지금 가격에 청산했을 때의 손익.
   티켓 효과(⚡부스터·🛟청산 면제)와 손절 보험은 청산하는 금액을 기준으로 건마다 적용한다.
   두 번에 나눠 팔아도 금액의 합이 원래 베팅금이므로 효과가 불어나지 않는다. */
function cashOutOf(part,mult,lev,dir,entry){
  let raw=Math.round(part*(mult/(entry||1)-1)*lev*dir);   // 숏이면 가격이 내려야 이익
  if(raw>0&&roundHas('boost'))raw=Math.round(raw*1.5);    // ⚡ 이익만 1.5배
  let profit=applyStoploss(raw);
  let payout=Math.max(0,part+profit);
  if(roundHas('liq')&&payout<part*0.30){ payout=Math.round(part*0.30); profit=payout-part; }  // 🛟 청산 면제
  return {profit,payout};
}
/* ✂️ 분할 매도 — 절반만 실현하고 나머지는 계속 들고 간다. 판당 한 번뿐이다.
   W·M 같은 이중 패턴에서 "반만 먹고 남기기"가 처음으로 가능해진다. */
function sellHalf(){
  const R=S.activeRound;
  if(!R||R.half||!metaHas('split'))return;
  const part=Math.floor(R.bet/2);
  if(part<1)return;
  const mult=R.path[currentTickIdx()];
  const {profit,payout}=cashOutOf(part,mult,R.leverage||1,roundDir(),R.entry);
  R.half={bet:part,mult,profit};
  R.bet-=part;                       // 남은 절반만 계속 굴린다
  S.cash+=payout; bumpPeak();
  sfx[profit>=0?'pay':'warn']();
  saveRun(); renderRoundView();
}
/* 💧 물타기 — 라운드 중 베팅금을 더 얹는다. 판당 한 번, 손실 중일 때만.
   금액 B를 가격 p에 사면 수량은 B/p이므로 평단은 총투입 ÷ 총수량으로 내려가고,
   청산선(평단 × (1−1/L))도 같이 내려간다. 버틸 여력이 생기는 대신 투입금이 늘어
   더 밀리면 손실도 같이 커진다.

   수수료는 안 붙인다. sim/water.js 실측(3단계 기준): 기계적으로 쓰면 클리어율이
   17% → 12%로 떨어지고 파산률은 11% → 14%로 오른다 — 지는 판에만 더 걸고 이기는
   판엔 안 거는 역-켈리라, 판당 기댓값이 양수여도 성장률이 깎인다. 이미 충분히
   위험해서 수수료까지 물리면(5%에 8%) 아무도 안 쓰는 죽은 버튼이 된다.
   잘 쓰면 이득이고 막 쓰면 손해인 것 — 그게 이 버튼이 선택인 이유다. */
const WATER_FRAC=0.5;                       // 최초 베팅의 절반을 얹는다
function waterAmountOf(R){return Math.floor((R.bet0||R.bet)*WATER_FRAC);}
function canWater(R,mult){
  if(!R||R.watered||!metaHas('water'))return false;
  const add=waterAmountOf(R);
  if(add<1||S.cash<add)return false;
  const m=(mult===undefined)?R.path[currentTickIdx()]:mult;
  return (m-(R.entry||1))*(R.dir||1)<0;     // 손실 중일 때만 — 이익 중에 얹는 건 물타기가 아니다
}
function addWater(){
  const R=S.activeRound;
  const mult=R?R.path[currentTickIdx()]:0;
  if(!canWater(R,mult))return;
  const add=waterAmountOf(R), entry=R.entry||1;
  const q0=R.bet/entry, q1=add/mult;        // 수량 = 금액 ÷ 가격
  R.entry=(R.bet+add)/(q0+q1);
  R.bet+=add; R.watered=true;
  S.cash-=add;
  sfx.buy();
  saveRun(); renderRoundView();
}
function sellRound(auto){
  if(!S.activeRound)return;
  const idx=currentTickIdx();
  const mult=S.activeRound.path[idx];
  const bet=S.activeRound.bet;
  const lev=S.activeRound.leverage||1;
  const dir=roundDir();
  const {profit,payout}=cashOutOf(bet,mult,lev,dir,S.activeRound.entry);
  /* 매도 등급 — 그 판 "전 구간"의 최저~최고 안에서 내가 판 위치.
     매도 시점까지(본 구간)로 잡으면, 하락장에서는 매도 순간이 곧 그때까지의 최저점이라
     D가 47% 쏟아진다(실측). 전 구간으로 잡아야 "일찍 빠져나온 것"이 제대로 A/S를 받는다.
     플레이어가 못 본 뒷구간까지 쓰는 셈이지만, 등급은 사후 채점이고
     "안 팔았으면 어디까지 갔는지"를 알려주는 게 이 게임의 후회/안도 훅이기도 하다. */
  const R=S.activeRound;
  let lo=R.path[0], hi=R.path[0];
  for(let i=0;i<R.path.length;i++){ if(R.path[i]<lo)lo=R.path[i]; if(R.path[i]>hi)hi=R.path[i]; }
  /* 분할 매도를 했으면 두 번의 매도를 금액으로 가중평균한 배율에 등급을 매긴다 —
     한쪽만 보면 "반은 고점에 팔고 반은 흘렸다"가 등급에 안 잡힌다. */
  const half=R.half||null;
  const totalBet=bet+(half?half.bet:0);
  const totalProfit=profit+(half?half.profit:0);
  const effMult=half?(half.mult*half.bet+mult*bet)/totalBet:mult;
  const grade=gradeOf(effMult,lo,hi,dir);
  if(metaHas('dex'))recordPattern(R.patternId,lo,hi);   // 도감은 판이 끝날 때 한 번만 쌓인다
  const buffs=(R.buffs||[]).slice();
  S.cash+=payout; bumpPeak();
  sfx[totalProfit>=0?'pay':'warn']();
  S.activeRound=null;
  /* 연승: 익절이면 +1, 아니면 0. 단계에 닿으면 다음 한 판에 걸릴 티켓을 준다 */
  const won=totalProfit>0;
  const prevStreak=S.streak||0;
  S.streak=won?prevStreak+1:0;
  const earned=(won&&STREAK_REWARD[S.streak])?STREAK_REWARD[S.streak].slice():[];
  if(earned.length)grantBuffs(earned);
  ensureToday();
  const T=S.today;
  if(won)T.wins++;
  if(effMult>T.bestMult)T.bestMult=effMult;
  if(totalProfit>T.bestProfit)T.bestProfit=totalProfit;
  if(S.streak>T.bestStreak)T.bestStreak=S.streak;
  if(grade&&grade.g==='S')T.sCount++;
  const res={mult,effMult,half,entry:R.entry||1,watered:!!R.watered,
    profit:totalProfit,bet:totalBet,lev,dir,
    grade,lo,hi,streak:S.streak,prevStreak,earned,buffs,daysLeft:S.daysLeft};
  const rx=buildReactions(res);
  res.tier=rx.tier; res.list=rx.list;
  S.lastResult=res;
  rollPending(); // 다음 라운드 패턴/신호를 새로 뽑는다(라운드가 끝날 때만)
  saveRun(); render();
  showResultModal(S.lastResult,()=>{
    S.lastResult=null;
    if(checkBankrupt())return;
    if(!endOfDay())render();
  });
}
/* 부드러운 곡선(2차 베지어 보간) + x/y축을 라운드 시작 시점에 고정해서
   그래프가 항상 왼쪽 끝(0초)에서 자라나 보이게 한다 */
function smoothPathD(pts){
  if(!pts.length)return '';
  if(pts.length===1)return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1],cur=pts[i];
    const midX=(prev[0]+cur[0])/2, midY=(prev[1]+cur[1])/2;
    d+=` Q${prev[0].toFixed(1)} ${prev[1].toFixed(1)} ${midX.toFixed(1)} ${midY.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  d+=` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  return d;
}
function renderTradeTabs(){
  /* 종목이 넷 이상이면 한 줄에 다 못 넣는다. 가로 스크롤은 안 쓴다 —
     ETF·동전주가 들어오면 신호를 보고 종목을 고르게 되어 매 판 바꾸는 값이 되는데,
     그걸 매번 옆으로 굴려 찾게 할 수는 없다. 줄을 나눠서 전부 보이게 한다. */
  const n=TRADE_STOCKS.length;
  const cols=n<=3?n:(n===4?2:3);
  $('stockTabs').style.gridTemplateColumns=`repeat(${cols},1fr)`;
  $('stockTabs').innerHTML=TRADE_STOCKS.map(s=>{
    if(!stockOpen(s))return `<div class="stock-tab locked"><div class="e">${s.emo}</div>
      <div class="n">${s.name}</div><div class="v">${s.lock}</div></div>`;
    return `<div class="stock-tab ${s.id===S.selectedStock?'sel':''}" data-stock="${s.id}">
      <div class="e">${s.emo}</div><div class="n">${s.name}</div>
      <div class="v">${s.ds}</div></div>`;
  }).join('');
  $('stockTabs').querySelectorAll('.stock-tab').forEach(el=>{
    if(el.classList.contains('locked'))return;
    el.onclick=()=>{sfx.tap();S.selectedStock=el.dataset.stock;saveRun();renderTrade();
      $('stockTabs').querySelectorAll('.stock-tab').forEach(x=>x.classList.toggle('sel',x.dataset.stock===S.selectedStock));};
  });
}
function renderTrade(){
  const maxLev=leverageMultOf();
  /* 예전에는 여기 "빚 때문에 최소 3배"가 있었다. 고를 배율이 하나뿐이면 아무 선택도
     안 바꾸는 문장이다(설명은 인트로에 남아 있다). 베팅금을 고르는 자리에 필요한 건
     "얼마를 언제까지"다 — 탑바 칩과 같은 3단계 색을 쓴다. */
  const gc=$('tpGoal');
  if(gateDone()){
    gc.className='tp-goal';
    gc.innerHTML=t('goalDone');
  }else{
    const gr=riskAt(S.cash,S.daysLeft);
    gc.className=`tp-goal ${gr.cls}${gr.last?' last':''}`;
    gc.innerHTML=ic('chain')+` <b>${fmtMoney(gateOf().goal)}</b><span class="sep">·</span>`+
      `<span class="dd">${gr.last?t('lastDay'):t('dday',{n:S.daysLeft})}</span>`;
  }
  if(S.activeRound){renderRoundView();return;}
  RV=null; /* 아래에서 tradeBody를 통째로 갈아엎으므로 라운드 뷰 노드 캐시를 버린다 */
  /* 티켓은 위쪽 스트립에 큰 카드로 두지 않고, 시작 버튼 바로 위에 한 줄로만 알린다 —
     "지금 시작할 이 판"에 걸리는 것이므로 그 자리가 맞다. */
  const bl=(S.buffs||[]);
  const buffLine=bl.length?`<div class="buff-line">${bl.map(b=>BUFFS[b].emo).join('')}
      <span>${t('buffLine',{names:bl.map(b=>BUFFS[b].name).join(' + ')})}</span></div>`:'';
  const minLev=minLevOf();
  const levOptions=LEVERAGE_MULTS.filter(m=>m>=minLev&&m<=maxLev);
  const curLev=Math.min(Math.max(minLev,S.betLeverage||minLev),maxLev);
  const liq=liqMultOf(curLev);
  /* 청산선은 배율마다 다른 값이라 버튼 안에 적는 게 맞다.
     라벨 + 버튼 + 경고 세 줄(79px)이 한 줄로 줄어든다. */
  const canShort=metaHas('short');
  const levRow=`<div class="btn-row lev-row">${levOptions.map(m=>{
      const lL=liqMultOf(m,1), lS=liqMultOf(m,-1);
      /* 공매도를 열면 청산선이 방향마다 다르다. 두 값을 같이 적어야 배율을 고를 때
         "숏은 1배도 2배에서 죽는다"가 보인다. */
      const txt=canShort?t('liqBoth',{a:lL>0?lL.toFixed(2):'—',b:lS.toFixed(2)})
                        :(lL>0?t('liqAt',{v:lL.toFixed(2)}):t('liqNone'));
      return `<button data-lev="${m}" class="${curLev===m?'sel':''}">${t('levUnit',{n:m})}
        <small>${txt}</small></button>`;
    }).join('')}</div>`;
  ensurePending();
  /* 🔎 정보 확신권이 걸려 있으면 신호를 참값으로 보여준다 */
  const sigId=(S.buffs||[]).includes('info')?S.pending.tier:S.pending.sig;
  const sg=SIGNAL_INFO[sigId];
  const acc=Math.round(infoAccOf()*100);
  const signalRow=`<div class="signal ${sigId}">
      <div class="sg-left"><span class="sg-emo">${sg.emo}</span><span class="sg-name">${sg.name}</span></div>
      <div class="sg-mid"><div class="sg-ds">${sg.ds}</div>
        <div class="sg-acc">${(S.buffs||[]).includes('info')?t('sigSure'):t('sigAcc',{p:acc})}</div></div>
      ${metaHas('dex')?`<button class="dex-btn" id="dexBtn" title="${t('dexBtnT')}">${ic('dexlist')}</button>`:''}
    </div>`;
  const canGo=S.betAmount>=MIN_BET && S.betAmount<=S.cash;
  /* "얼마가 모자라나" 칩은 뺐다. 카드 머리의 목표·D-day 칩이 같은 말을 하고,
     그 자리를 비우면 방향 토글이 한 줄을 통째로 써서 오발이 줄어든다. */
  const dirRow=canShort
    ? `<span class="dir-toggle" id="dirToggle">
         <button data-d="1" class="${S.betDir!==-1?'sel':''}">${t('dirLong')}</button>
         <button data-d="-1" class="${S.betDir===-1?'sel short':''}">${t('dirShort')}</button>
       </span>`
    : '';
  /* 페이스 경고는 위험할 때만 뜬다 — 늘 떠 있으면 단타 화면만 더 빽빽해지고 경고 구실을 못 한다 */
  const pr=gateDone()?null:riskAt(S.cash,S.daysLeft);
  const paceLine=(pr&&pr.cls!=='p-ok')?`<div class="pace-line ${pr.cls}">${pr.last?t('paceLast'):t('dday',{n:S.daysLeft})} · ${t('paceNeed',{p:pr.txt})}</div>`:'';
  $('tradeBody').innerHTML=`

      <div class="bet-row"><button id="betMinus">−</button><div class="amt">${fmtMoney(S.betAmount)}</div><button id="betPlus">+</button></div>
      <div class="bet-quicks"><button data-q="0.25">25%</button><button data-q="0.5">50%</button><button data-q="0.75">75%</button><button data-q="1">${t('qMax')}</button></div>
      ${levRow}
      ${dirRow?`<div class="opt-row">${dirRow}</div>`:''}
    </div>
    ${buffLine}
    ${paceLine}
    ${goRowHTML(canGo,canShort,curLev,pr)}
    ${(S.today.rounds<3)?`<div class="trade-note">${t('tradeNote')}</div>`:''}`;
  const step=Math.max(MIN_BET,Math.round(S.cash*0.05));
  $('betMinus').onclick=()=>{sfx.tap();setBet(S.betAmount-step);};
  $('betPlus').onclick=()=>{sfx.tap();setBet(S.betAmount+step);};
  $('tradeBody').querySelectorAll('.bet-quicks button').forEach(b=>b.onclick=()=>{sfx.tap();setBet(S.cash*parseFloat(b.dataset.q));});
  $('tradeBody').querySelectorAll('.btn-row button[data-lev]').forEach(b=>b.onclick=()=>{sfx.tap();S.betLeverage=parseFloat(b.dataset.lev);saveRun();renderTrade();});
  if($('dirToggle'))$('dirToggle').querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{
    sfx.tap(); S.betDir=parseInt(b.dataset.d,10); saveRun(); renderTrade(); });
  if($('dexBtn'))$('dexBtn').onclick=()=>{sfx.tap();showDexModal();};
  $('tradeGo').onclick=()=>startRound(S.betDir);
}
/* 시작 버튼은 하나다. 방향은 위 토글에서 이미 골랐고, 버튼은 색과 문구로 그걸
   다시 한 번 확인시킨다 — 이 게임은 기본 버튼도 파랑이라 색만으로는 구분이 안 된다. */
function goRowHTML(canGo,canShort,lev,pr){
  if(!canGo)return `<button class="trade-go" id="tradeGo" disabled>${t('goNoFunds')}</button>`;
  const amt=t('amtLev',{v:fmtMoney(S.betAmount),n:lev});

  return `<button class="trade-go ${short?'go-short':'go-long'}" id="tradeGo">${amt}</button>`;
