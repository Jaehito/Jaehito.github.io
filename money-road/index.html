  /* ═══════════════════════════════════════════════════════════════════
     윈도우 98 — 낡은 업무용 PC의 응용 프로그램 창 하나.

     안 1(평가 계좌)과 맞물린다. 회사가 지원자에게 좋은 장비를 줄 리 없다.
     창 하나가 곧 세계관 설명이다.

     상표 규칙(tools/README.md에 여섯 줄): 제품명에 그 OS 이름을 쓰지 않는다.
     로고·깃발·시작 버튼·작업 표시줄을 두지 않는다 — 응용 프로그램 창 하나뿐이다.
     아이콘은 전부 직접 그린다(ic()). 서체는 OFL만(Galmuri11).

     서체는 픽셀이 아니다. 창틀·베벨·아이콘은 1998년인데 글자만 Pretendard다.
     도트로 갔다가 되돌아온 자리다 — demo/fonts.html에 후보 여덟을 나란히 재 뒀다.
     아이콘은 그대로 16×16 픽셀이라, 게임 느낌은 글자가 아니라 그림이 진다.

     크기 체계(그 데모의 안 1):
       12px   제목표 · 메뉴바 · 그룹 제목 · 상태표시줄 — 창틀의 글자
       12.5px 설명문 · 부가 정보 — 화면 글자의 대부분
       15px   본문 기준 · 19px 강조 · 26px 손익 · 40px 배율
     ═══════════════════════════════════════════════════════════════════ */
  :root{
    /* 이름은 그대로 두고 값만 98로 옮긴다 — 참조하는 자리가 200곳이 넘는다 */
    --blue:#000080; --blue-weak:#dfdfdf; --blue-press:#00005a;
    --red:#c00000; --red-weak:#f2dede; --green:#008000; --gold:#808000;
    --ink:#000000; --gray:#000000; --gray2:#404040; --gray3:#808080;
    --line:#808080; --bg:#008080; --card:#c0c0c0; --field:#ffffff;
    --radius:0; --shadow:none;
    /* 베벨 네 색 — 98의 입체는 테두리 색 넷과 안쪽 그림자 둘로만 만들어진다 */
    --face:#c0c0c0; --hi:#ffffff; --lt:#dfdfdf; --sh:#808080; --dk:#000000;
    --safe-b:env(safe-area-inset-bottom,0px);
    /* ── 책상 ── 창틀(제목표·메뉴바·상태표시줄·대화상자)은 98 회색 그대로 두고,
       창 안쪽만 책상 위 서류로 바꾼다. 98 회색은 물러나라고 만든 언어라
       버튼도 글자도 전부 같은 값이 되고, 그래서 무엇을 먼저 볼지가 안 나왔다.
       종이는 반대다 — 검정 잉크 대 밝은 바탕이라 위계가 저절로 생긴다. */
    --desk:#4a4234; --paper:#f4ecd8; --paper-hi:#fffdf3; --paper-line:#c4b088;
    --paper-ink:#2b2113; --paper-dim:#6b5c38; --paper-memo:#ece1c6;
    --tab:#c4b088; --stamp:#b3261e;
  }
  /* 돌출(버튼)과 침강(입력·목록·차트) — 화면의 모든 입체가 이 둘 중 하나다 */
  .out{border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .in{border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  html{overscroll-behavior-y:contain;}
  body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; letter-spacing:-.02em;
    overflow-x:hidden; overscroll-behavior-y:contain; font-size:15px;
    -webkit-font-smoothing:antialiased;}
  /* 창 — 앱 전체가 창 하나다. 좁은 화면에서는 화면을 꽉 채운다.

     높이를 화면에 고정하고 안쪽 .body만 구르게 한다. 98 창이 원래 그렇게 생겼다 —
     제목표·메뉴바·상태표시줄은 창의 틀이고 구르는 것은 클라이언트 영역뿐이다.
     모바일에서 "상단 바 고정"은 새 장치를 다는 일이 아니라 창을 창으로 만드는 일이다.
     dvh를 쓰는 이유는 주소창이 접히고 펴지는 만큼 100vh가 거짓말을 하기 때문이다. */
  #app{max-width:460px; margin:0 auto; height:100vh; height:100dvh; overflow:hidden;
    position:relative;
    background:var(--face); display:flex; flex-direction:column;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
    padding-bottom:var(--safe-b);}
  button{font-family:inherit;}
  svg.ic{display:inline-block; vertical-align:-3px; flex-shrink:0; image-rendering:pixelated;}

  /* ── 제목표 ── 대화상자가 뜨면 .off로 회색이 된다(98의 초점 표시) */
  .topbar{display:flex; align-items:center; gap:6px; padding:4px 4px 4px 7px; flex-shrink:0;
    position:relative; z-index:30;
    background:linear-gradient(90deg,#000080,#1084d0); color:#fff;}
  .topbar.off{background:linear-gradient(90deg,#808080,#b5b5b5);}
  .topbar .brand{font-size:12px; font-weight:700; white-space:nowrap; overflow:hidden;
    text-overflow:ellipsis; min-width:0;}
  .topbar .brand span{color:#fff;}
  .tb-left{display:flex; align-items:center; gap:6px; min-width:0; flex:1;}
  .top-right{display:flex; align-items:center; gap:2px; margin-left:auto; flex-shrink:0;}
  .top-right-row{display:flex; align-items:center; gap:2px;}
  /* 제목표 버튼 — 장식이 아니라 실제로 음소거·도구를 연다 */
  .icon-btn{background:var(--face); color:var(--ink); width:26px; height:24px; padding:0;
    display:grid; place-items:center; cursor:pointer;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .lv-chip,.tier-chip{font-size:12.5px; color:#fff; background:transparent; padding:0 4px; white-space:nowrap;}
  /* 잔고 줄 — 목표 바로 아래. 98의 제목표는 창 이름의 자리라 값을 띄우지 않는다. */
  .cash-row{display:flex; align-items:baseline; gap:8px; margin-top:2px; padding-bottom:7px;}
  .cash-row .k{font-size:12.5px; color:var(--gray2);}
  .cash-top{margin-left:auto; font-size:19px; font-weight:700;}

  /* ── 설정 메뉴 ── 메뉴바(51px) 자리에 톱니 하나. 제목표에 매달린다. */
  .icon-btn.on{border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .menu{position:absolute; top:100%; right:4px; z-index:31; min-width:196px;
    background:var(--face); padding:3px;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0,0,0,.3);}
  .menu button{display:flex; align-items:center; gap:8px; width:100%; height:38px; padding:0 10px;
    background:transparent; border:0; color:var(--ink); font-size:12.5px; cursor:pointer; text-align:left;}
  .menu button:hover,.menu button.on{background:var(--blue); color:#fff;}
  .menu .rd{width:11px; text-align:center; flex-shrink:0;}
  .menu hr{border:0; border-top:1px solid var(--sh); border-bottom:1px solid var(--hi); margin:3px 2px;}

  /* ── 본문 ── 창 안쪽. 그룹박스들이 세로로 쌓인다. */
  .body{flex:1 1 auto; padding:9px; display:flex; flex-direction:column; gap:10px;
    min-width:0; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    background:var(--desk);
    background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 2px,transparent 2px 7px);}
  /* 본문이 스크롤 통이 된 이상 자식은 줄어들면 안 된다. ACCOUNT 패널은 .trm이라
     overflow:hidden이 걸려 있어서, 안 막으면 높이 0으로 접힌다 — 목업에서 당했다. */
  .body > *{flex-shrink:0;}

  /* ── 접힌 계좌줄 ── 내려가면 메뉴바 아래에 한 줄로 남는다. 마감이 걸린 게임에서
     마감은 늘 보여야 한다. 잔고·목표·D-day 셋만 둔다 — 판당 필요 수익률은
     아래 ACCOUNT 패널과 시작 버튼 위 페이스 경고가 이미 두 번 말한다. */
  .acct-mini{display:flex; align-items:center; gap:8px; flex-shrink:0;
    background:#05080a; color:#33ff77; padding:5px 9px;
    border-top:1px solid #16351f; border-bottom:2px solid #000;}
  .acct-mini[hidden]{display:none;}
  .acct-mini .m-k{font-size:11px; color:#1f8f47; flex-shrink:0;}
  .acct-mini .m-cash{font-family:'Galmuri11',monospace; font-size:15px;
    -webkit-font-smoothing:none; font-smooth:never; letter-spacing:0; white-space:nowrap;}
  .acct-mini .m-r{margin-left:auto; font-size:11.5px; color:#1f8f47;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .acct-mini .m-r b{color:#ffb000; font-weight:400;}
  .acct-mini .m-r b.warn{color:#ff5a5a;}
  /* 그룹박스 — 98의 정체성. 제목이 테두리를 끊고 앉는다. */
  /* 그룹 상자가 종이 한 장이 된다. 98의 groove 테두리는 회색 위에서만 입체로
     읽히므로 종이에서는 걷어내고, 대신 책상에 놓인 그림자를 준다. */
  .grp{position:relative; padding:15px 10px 11px; color:var(--paper-ink);
    background:var(--paper); border:1px solid #6e5c3a;
    background-image:repeating-linear-gradient(0deg,rgba(120,100,60,.045) 0 1px,transparent 1px 4px);
    box-shadow:0 2px 0 rgba(0,0,0,.25);}
  /* 크기는 창 체계(12/12.5/15/17/19/26/40)를 벗어나지 않는다 — phase32가 본다.
     11.5px를 들여왔다가 바로 잡혔다. 서류 라벨은 창틀 글자와 같은 12px다. */
  .grp > .lg{position:absolute; top:-1px; left:10px; padding:2px 0 0;
    font-size:12px; line-height:1.5; white-space:nowrap; color:var(--paper-dim);
    letter-spacing:.06em;}

  /* ── 상환 그룹 ── 예전 탑바 칩 둘 + 진행바가 여기로 모였다 */
  .level-strip{}
  .lv-row{display:flex; align-items:center; gap:8px;}
  .lv-name{font-size:12.5px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .lv-name b{font-weight:700;}
  .lv-name small{font-size:12.5px; color:var(--gray2); margin-left:4px;}
  .lv-pct{font-size:12.5px; color:var(--green); flex-shrink:0;}
  /* 진행바 — 98은 이어진 막대가 아니라 칸으로 끊어 찬다. 여기서는 채우는 게 아니라
     남은 거래일이 하루에 한 칸씩 꺼지는 연료계다. */
  .lv-bar{height:26px; padding:2px; display:flex; gap:2px; overflow:hidden; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .lv-bar>i{display:block; height:100%; width:12px; flex-shrink:0; background:var(--blue);}
  .lv-bar>i.e{background:transparent;}
  .lv-bar.p-warn>i{background:var(--gold);}
  .lv-bar.p-bad>i{background:var(--red);}
  .dday{font-size:12.5px; flex-shrink:0;}
  .dday.p-warn{color:var(--gold);} .dday.p-bad,.dday.last{color:var(--red);}
  .repay-sub{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px;
    font-size:12.5px; color:var(--gray2);}
  .repay-sub b{color:var(--ink);}
  .repay-sub.p-warn b{color:var(--gold);} .repay-sub.p-bad b{color:var(--red);}
  .repay-chip{display:flex; align-items:center; gap:6px; width:100%; background:transparent;
    border:0; padding:0 0 6px; cursor:pointer; font-family:inherit; font-size:19px;
    color:var(--ink); text-align:left;}
  .repay-chip .goal{margin-left:auto; font-weight:700;}
  .repay-chip .sep{display:none;} .repay-chip .dd{display:none;}
  .extend{background:var(--face); color:var(--ink); font-size:12.5px; cursor:pointer;
    padding:7px 10px; min-height:34px; white-space:nowrap;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}

  /* ── 탭 컨트롤 ── 알약 셋을 98의 폴더 탭으로 */
  /* 탭은 서류철 탭이다 — 세 가지 서류를 꺼내 보는 것이지 화면을 바꾸는 게 아니다 */
  .tabpane{padding:11px 10px 11px; color:var(--paper-ink);
    background:var(--paper); border:1px solid #6e5c3a;
    background-image:repeating-linear-gradient(0deg,rgba(120,100,60,.045) 0 1px,transparent 1px 4px);
    box-shadow:0 2px 0 rgba(0,0,0,.25);}

  /* ── 단타 패널 ── */
  /* 단타 탭은 서류 한 장이다 — 종목·투자금·조건·소견이 각각 다른 종이가 아니라
     같은 주문표의 칸이다. 그래서 안쪽 그룹은 카드가 아니라 점선으로 끊긴 절이 된다. */
  .trade-panel{display:flex; flex-direction:column; gap:0; color:var(--paper-ink);
    background:var(--paper); border:1px solid #6e5c3a; padding:11px 11px 12px;
    background-image:repeating-linear-gradient(0deg,rgba(120,100,60,.045) 0 1px,transparent 1px 4px);
    box-shadow:0 2px 0 rgba(0,0,0,.25);}
  .form-head{font-size:15px; font-weight:800; letter-spacing:.22em;
    border-bottom:2px solid var(--paper-ink); padding-bottom:5px; display:flex; align-items:baseline;}
  .form-head .no{margin-left:auto; font-size:12px; font-weight:400; letter-spacing:0; color:var(--paper-dim);}
  .trade-panel .grp{background:none; border:none; box-shadow:none; background-image:none;
    padding:9px 0 10px; border-bottom:1px dashed var(--paper-line);}
  /* 주문표의 칸 이름은 테두리에 걸터앉지 않는다 — 걸칠 테두리가 없으니
     절대배치를 풀고 흐름에 두어야 첫 줄을 덮지 않는다(종목 목록이 덮였었다). */
  .trade-panel .grp > .lg{position:static; display:block; margin-bottom:5px;}
  .trade-panel .grp.last{border-bottom:none; padding-bottom:2px;}
  /* 도장 — 서류 맨 아래 결재란. 폭 전체를 쓴다.
     한때 화면 아래에 붙여 따라오게 했는데(sticky), 체결 통지의 「다 음 판」
     바로 밑에 매수 도장이 겹쳐 서서 도장이 둘로 보였다. 창틀을 줄여 종이가
     한 화면에 들어오게 하는 쪽이 맞다 — 고정은 증상만 가린다. */
  .stamp-foot{margin-top:12px;}
  .stamp-foot .trade-go{width:100%; min-height:62px;}
  .foot-note{margin-top:7px; font-size:12px; color:var(--paper-dim); text-align:center;
    line-height:1.45;}
  .tp-head{display:none;}   /* 목표·D-day는 상환 그룹이 이미 말한다 — 같은 값을 두 번 쓰지 않는다 */
  /* 종목은 2열 격자다. 세로 목록(N4)은 여섯 줄에 303px을 먹어서, 종목 맨 위에서
     투자금 맨 아래까지가 513px이 됐다 — 쓸 수 있는 자리가 494px이라 19px 차이로
     둘이 같이 안 보였다. 화면에서 제일 자주 같이 봐야 하는 둘이다.

     세로 목록을 고른 이유는 「여섯 막대가 같은 왼쪽 눈금에서 출발해야 길이 비교가
     된다」였다. 격자로 가면 그 눈금이 두 줄로 갈린다. 그래서 막대를 버리고
     작은 그래프를 넣는다 — 선 모양이 성격을, 세로 진폭이 크기를 말하므로
     한 칸이 둘을 다 말한다. 막대를 넣었던 이유가 그 둘이었다.

     2열(세 줄)에서 3열(두 줄)로 다시 줄였다. 여섯을 다 보이는 것은 그대로고
     62px이 빠진다. 잠긴 칸의 조건 글자는 3열 폭에 이름 옆으로 안 들어가서
     뺐다 — 대신 잠긴 칸을 누르면 아래 한 줄이 조건을 말한다. */
  .stock-tabs{display:grid; grid-template-columns:1fr 1fr 1fr; gap:5px;}
  .stock-tab{background:var(--paper-hi); color:var(--paper-ink); cursor:pointer; min-height:48px;
    padding:5px 7px 4px; font-size:12.5px; line-height:1.3;
    display:flex; flex-direction:column; align-items:stretch; gap:2px;
    border:1px solid var(--paper-line); border-radius:3px; box-shadow:none;}
  /* 고른 종목은 테를 굵게 — 잉크로 채우면 그래프가 안 보인다 */
  .stock-tab.sel{border:2px solid var(--paper-ink); padding:4px 6px 3px;}
  /* 잠긴 칸도 누를 수 있다 — 고르지는 못하고 아래 한 줄이 조건을 말한다.
     예전에는 눌러도 아무 일이 없었고, 왜 잠겼는지는 칸 안에 적혀 있었다. */
  .stock-tab.locked{color:#a2977c; text-shadow:none;
    background:none; border-style:dashed;}
  .stock-tab.locked.ask{border-color:var(--paper-dim); color:var(--paper-dim);}
  .stock-tab .hd{display:flex; align-items:baseline; gap:6px;}
  .stock-tab .n{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .stock-tab.sel .n{font-weight:700;}
  .stock-tab .v{flex:0 0 auto; color:#a2977c; font-size:12px;}
  .inst-chart{display:block; width:100%; height:24px; flex:1 1 auto;
    color:var(--paper-dim); overflow:visible;}
  .stock-tab.sel .inst-chart{color:var(--paper-ink);}
  .stock-tab.locked .inst-chart{color:#c4b088;}
  .inst-chart .ic-base{stroke:var(--paper-line); stroke-width:1; stroke-dasharray:3 3;
    vector-effect:non-scaling-stroke;}
  .stock-tab.sel .inst-chart .ic-base{stroke:var(--stamp); opacity:.45;}
  .ink-spark{display:block; margin:0 auto;}
  /* 범위 막대 — span이라 display:block을 꼭 줘야 한다. 인라인에는 width가 안 먹어서
     폭 0으로 눌린다(목업에서 두 번 당했다). */
  /* 눈금 설명 — 막대가 무엇인지 한 번은 말해야 한다. 로그 눈금이라 가운데가 1.00x가 아니다. */
  .stock-note{display:flex; align-items:center; gap:8px; margin-top:7px; padding:5px 9px;
    background:var(--paper-memo); border-left:3px solid #8a5a00; font-size:12.5px;}
  .stock-note b{font-size:12.5px;} .stock-note span{color:var(--paper-dim);}
  .stock-tab .n{font-weight:700;}
  .stock-tab .v{color:var(--paper-dim);}
  .stock-tab.locked .n,.stock-tab.locked .v{color:#a2977c;}

  /* ── 투자금 ── 금액은 항목 줄에 적히고, 조절은 아래 한 줄이다 */
  /* 투자금 — 「투자금 … 2만원」이 서류의 한 기입 항목으로 한 줄에 읽힌다.
     예전에는 −·금액·+가 같은 크기로 나란해서 셋 다 똑같이 중요해 보였고,
     기입란 밑줄이 가운데 토막이라 빈칸으로도 안 읽혔고, ±와 비율 넉 칸이 같은
     생김새라 그냥 버튼 여덟 개였다. 금액은 읽는 것이고 손이 가는 것은 아래
     한 줄뿐이다 — 39px이 빠지면서 장세 소견이 접힘선 위로 올라온다. */
  .bet-head{display:flex; align-items:baseline; gap:8px; margin-bottom:5px;}
  .bet-head .lg{position:static; display:block; margin:0;}
  .bet-head .amt{margin-left:auto; padding-right:2px; font-size:26px; font-weight:800;
    color:var(--paper-ink); line-height:1;}
  .bet-row{display:flex; gap:5px;}
  .bet-row button,.btn-row button,.dir-toggle button{flex:1; min-height:48px; font-size:12.5px;
    background:var(--paper-hi); color:var(--paper-dim); cursor:pointer; padding:6px 4px;
    border:1px solid var(--paper-line); border-radius:3px; box-shadow:none;}
  /* ±는 양 끝이다 — 비율 칸 사이에 끼면 옆 칸을 누른다 */
  .bet-row button.pm{flex:0 0 52px; padding:0; font-size:26px; line-height:1;
    color:var(--paper-ink);}
  .btn-row{display:flex; gap:6px;}
  /* 고른 칸은 잉크로 채운다 — 체크 표시가 아니라 "여기에 적혔다" */
  .btn-row button.sel,.dir-toggle button.sel,.bet-row button:active{
    background:var(--paper-ink); color:var(--paper); border-color:var(--paper-ink);
    box-shadow:none; font-weight:700;}
  /* 레버리지 칸은 내용만큼만 넓다. 처음 계좌는 3배 하나뿐이라 고를 것이 없는데,
     그 한 칸이 가로를 다 채우고 잉크로 차 있으니 화면에서 제일 크고 제일 검은
     덩어리가 됐다 — 매수 도장이 화면 밖에 있을 때 그걸 눌렀다.
     청산선은 칸 밖 한 줄로 내린다: 배율이 셋이 되면 버튼 안에 안 들어간다. */
  .lev-row button{flex:0 1 auto; padding:0 18px; font-size:15px; font-weight:700;
    white-space:nowrap; color:var(--paper-ink);}
  .lev-note{font-size:12.5px; color:var(--paper-dim); margin-top:6px;}
  .dir-toggle{flex:1; display:flex; gap:6px;}
  .dir-toggle button.sel{background:var(--stamp); border-color:var(--stamp); color:#fff2ef;}
  .dir-toggle button.sel.short{background:#1c5d99; border-color:#1c5d99; color:#eef6ff;}
  .opt-row{display:flex; gap:6px;}
  .lev-row + .opt-row{margin-top:6px;}
  .opt{flex:1; min-height:48px; background:var(--paper-hi); color:var(--paper-ink); cursor:pointer;
    font-size:12.5px; padding:6px 9px; display:flex; align-items:center; gap:5px; text-align:left;
    border:1px solid var(--paper-line); border-radius:3px; box-shadow:none;}
  .opt b{margin-left:auto; font-weight:700;}
  .opt.open{border-color:var(--paper-ink); box-shadow:none;}
  .opt.room{flex:0 0 auto; cursor:default;}

  /* ── 기본 버튼 ── 대화상자 확인은 98 그대로다. 회사가 띄우는 창이니까. */
  .modal .ok{
    width:100%; min-height:62px; font-size:17px; font-weight:800; cursor:pointer;
    background:var(--face); color:var(--ink); padding:8px 10px;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);
    outline:1px solid var(--dk); outline-offset:1px;}
  /* 시작은 도장이다 — 서류에 결재를 찍는 것이지 버튼을 누르는 게 아니다.
     이중 테두리는 고무 도장의 테고, 눌리면 종이에 닿듯 내려앉는다. */
  .trade-go,.retire-btn{
    width:100%; min-height:62px; font-size:17px; font-weight:800; cursor:pointer;
    background:rgba(179,38,30,.05); color:var(--stamp); padding:8px 10px;
    border:3px double var(--stamp); border-radius:4px; letter-spacing:.06em;
    box-shadow:0 3px 0 rgba(110,24,18,.3); outline:0;
    transition:transform .07s ease-out, box-shadow .07s ease-out;}
  .trade-go:active,.retire-btn:active{transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,0);}
  .trade-go:disabled{color:#a2977c; border-color:var(--paper-line); background:transparent;
    text-shadow:none; cursor:default; box-shadow:none;}
  /* 매도는 책상 위 물리 버튼이다. 15초 동안 손이 가는 유일한 자리라
     종이 위 도장과 다른 물건이어야 한다. */
  .sell-btn{
    width:100%; min-height:62px; font-size:17px; font-weight:800; cursor:pointer;
    background:linear-gradient(#e0473c,#b3261e); color:#fff2ef; padding:8px 10px;
    border:none; border-radius:5px; outline:0;
    box-shadow:0 4px 0 #6e1712, inset 0 1px 0 rgba(255,255,255,.3);
    transition:transform .07s ease-out, box-shadow .07s ease-out;}
  .sell-btn:active{transform:translateY(4px);
    box-shadow:0 0 0 #6e1712, inset 0 1px 0 rgba(255,255,255,.3);}
  .trade-go small,.sell-btn small{display:block; font-size:12.5px; font-weight:400; margin-top:3px;}
  .trade-go.go-long,.trade-go.go-short,.trade-go.danger{color:var(--stamp);}
  .split-row,.sell-row{display:flex; gap:7px;}
  .split-row .trade-go,.sell-row .sell-btn{flex:1;}
  .sell-btn.sell-half{flex:.8; outline:0; font-weight:700; font-size:14px;
    background:var(--paper-hi); color:var(--paper-ink); box-shadow:0 3px 0 #9a8f74;}
  .sell-btn.sell-half:active{transform:translateY(3px); box-shadow:0 0 0 #9a8f74;}
  .retire-btn{margin-top:10px;}
  .trade-note{font-size:12.5px; color:var(--gray2); text-align:center; line-height:1.5; margin-top:4px;}
  .pace-line{font-size:12.5px; text-align:center; padding:8px; margin-bottom:0;
    border:1px dashed var(--paper-line); background:transparent; color:var(--paper-dim);}
  .pace-line.p-warn{color:var(--gold);} .pace-line.p-bad{color:var(--red);}

  /* ── 장세 신호 ── 색만으로 구분하지 않는다. 화살표 아이콘이 같이 말한다. */
  /* 장세는 담당자 소견 메모다 — 왼쪽에 굵은 괘선 하나가 그 문법이다 */
  .signal{display:flex; align-items:center; gap:9px; padding:8px 10px;
    border:none; border-left:3px solid #8a5a00; background:var(--paper-memo);}
  .signal .sg-left{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .signal .sg-emo{line-height:0;}
  /* 도표의 틀은 놓인 바탕을 따라간다 — 종이 위에서는 괘선, 98 회색 창 안에서는 회색 */
  .sg-chart{display:block;} .sg-chart .fr{stroke:var(--paper-line);}
  .modal .dlg .sg-chart .fr{stroke:var(--gray3);}
  .signal .sg-name{font-size:19px; font-weight:700;}
  .signal.strong .sg-name{color:var(--green);}
  .signal.mid .sg-name{color:var(--gold);}
  .signal.weak .sg-name{color:var(--blue);}
  .signal .sg-mid{min-width:0; flex:1;}
  .signal .sg-ds{font-size:12.5px;}
  .signal .sg-acc{font-size:12.5px; color:var(--paper-dim); margin-top:2px;}
  .dex-btn{margin-left:auto; flex-shrink:0; width:38px; height:38px; cursor:pointer; padding:0;
    background:var(--paper-hi); display:grid; place-items:center;
    border:1px solid var(--paper-line); border-radius:3px; box-shadow:none;}
  .liq-note,.min-note,.debt-note,.buff-line{font-size:12.5px; padding:7px 9px; background:var(--paper-memo);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .liq-note b{color:var(--red); font-weight:700;}
  .debt-note,.buff-line{color:var(--gray2);}
  .buff-line{display:flex; align-items:center; gap:7px;}

  /* ══ 터미널 ══════════════════════════════════════════════════════════
     98 창 안에 뜬 1998년 금융 단말기. 창틀은 회색인데 화면만 검다.

     왜 여기만 파는가 — 98 크롬은 원래 물러나라고 만든 언어라, 게임 전체를
     그걸로 만들면 안 보이려고 설계된 디자인으로 게임을 만든 셈이 된다.
     그리고 정작 이 게임의 전부인 차트가 흰 바탕에 얇은 선 하나였다.

     도트 서체가 여기로 돌아온다. 터미널 안에는 한글 문장이 없다 —
     목표·잔고·배율·손익·남은 시간, 전부 숫자와 기호다. 도트가 무너졌던
     조건(한글 음절을 11×11 상자에 넣는 것)이 여기엔 없다.
     주사선·비네팅도 이 패널에만 건다. 본문 가독성은 건드리지 않는다. */
  .trm{position:relative; overflow:hidden; background:#05080a; color:#33ff77;
    font-family:'Galmuri11',monospace; -webkit-font-smoothing:none; font-smooth:never;
    letter-spacing:0; font-size:11px; line-height:1.5;
    border:2px solid; border-color:#000 #3a4a3a #3a4a3a #000;
    box-shadow:inset 0 0 22px rgba(51,255,119,.13), inset 1px 1px 0 #000;}
  .trm::after,.trm::before{content:''; position:absolute; inset:0; pointer-events:none;}
  .trm::after{z-index:5; background:repeating-linear-gradient(0deg,rgba(0,0,0,.30) 0 1px,transparent 1px 3px);}
  .trm::before{z-index:6; background:radial-gradient(ellipse 125% 125% at 50% 45%,transparent 48%,rgba(0,0,0,.6) 100%);}
  .trm > *{position:relative; z-index:1;}
  .trm .k,.trm .dim{color:#1f8f47;}
  .trm .up{color:#ff5a5a; text-shadow:0 0 6px rgba(255,90,90,.55);}
  .trm .down,.trm .dn2{color:#42d9ff; text-shadow:0 0 6px rgba(66,217,255,.5);}
  .trm .warn{color:#ffb000; text-shadow:0 0 6px rgba(255,176,0,.5);}
  /* 터미널 안의 칸 게이지는 인광으로 탄다 */
  .trm .lv-bar,.trm .round-bar{background:transparent; border:0; box-shadow:none; padding:0; height:14px;}
  .trm .lv-bar>i,.trm .round-bar i{width:auto; flex:1; background:#33ff77;
    box-shadow:0 0 5px rgba(51,255,119,.6);}
  .trm .lv-bar>i.e,.trm .round-bar i.e{background:#132b1b; box-shadow:none;}

  /* 상환 그룹 — 그룹박스 대신 터미널 블록이 된다 */
  #repayGrp{border:0; padding:0;}
  #repayGrp > .lg{display:none;}
  .trm-pad{padding:8px 9px; display:flex; flex-direction:column; gap:2px;}
  .trm-hd{display:flex; gap:8px; font-size:11px; line-height:1.5; color:#1f8f47;
    border-bottom:1px solid #16351f; padding-bottom:5px; margin-bottom:5px;}
  .trm-hd .r{margin-left:auto;}
  .trm .repay-chip{color:#33ff77; font-size:11px; padding:0;}
  .trm .repay-chip .goal{font-size:22px; text-shadow:0 0 7px rgba(51,255,119,.7);}
  .trm .cash-row{padding-bottom:4px;}
  .trm .cash-row .k{font-size:11px;}
  .trm .cash-top{font-size:22px; color:#33ff77;}
  /* 터미널 안이라도 한글이 들어가는 줄은 아웃라인이다. 도트가 무너지는 건
     낱말이 아니라 문장이고, "사성전자"를 11px 격자에 넣으면 이번에 고친 문제가
     그대로 돌아온다. 숫자와 기호만 도트로 남는다 — 그게 이 패널을 판 이유다. */
  .trm .ko,.trm .repay-sub,.trm .round-timer .rt-l{
    font-family:'Pretendard',system-ui,sans-serif; -webkit-font-smoothing:antialiased;
    font-size:12.5px; letter-spacing:-.02em;}
  /* 차트 안에 박히는 라벨도 같은 이유로 아웃라인이다. 9~10px짜리라 11px 격자에
     아예 못 올라가는데다 "청산까지"처럼 한글이 들어오는 자리다. 크기는 SVG의
     font-size 속성이 쥐고 있으니 여기서 font-size를 건드리면 라벨이 커진다. */
  .trm .rv-txt{font-family:'Pretendard',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; letter-spacing:-.02em;}
  .trm .repay-sub{color:#1f8f47; margin-top:5px;}
  .trm .repay-sub b{color:#33ff77;}
  .trm .dday{font-size:11px; color:#ffb000;}
  .trm .extend{background:#0a1a10; color:#33ff77; border:1px solid #1d5c33; box-shadow:none;
    font-family:'Galmuri11',monospace; font-size:11px;}

  /* ── 진행중인 라운드 ── 창은 전부 픽셀인데 차트 선만 안티앨리어싱이다.
     15초 동안 눈이 붙어 있는 유일한 곳이라, 여기서 계단이 보이면 판단이 흐려진다. */
  .round-view{display:flex; flex-direction:column; gap:10px;}
  .round-timer{font-size:12.5px; display:flex; justify-content:space-between; gap:8px;}
  .round-timer .rt-l{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .round-timer .rt-r.warn{color:var(--red);}
  .round-mult{font-size:40px; line-height:48px; font-weight:700; text-align:center;
    transition:color .18s;}
  .round-mult.up{color:var(--red);} .round-mult.down{color:var(--blue);} .round-mult.flat{color:var(--gray2);}
  .round-chartbox{position:relative; padding:4px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .round-chart{width:100%; height:150px; display:block; background:var(--field);}
  .round-view.tense .round-chartbox{animation:rvEdge .5s ease-in-out infinite alternate;}
  @keyframes rvEdge{ from{border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
                     to{border-color:var(--red) var(--red) var(--red) var(--red);} }
  .round-count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:40px; font-weight:700; color:var(--red); opacity:0; pointer-events:none;}
  .round-count.on{animation:rvCnt .95s ease-out;}
  @keyframes rvCnt{ 0%{opacity:.55;} 70%{opacity:.16;} 100%{opacity:0;} }
  .rv-txt{stroke:#05080a; stroke-width:2.5px; paint-order:stroke fill; stroke-linejoin:round;}
  .rv-pulse{transform-box:fill-box; transform-origin:center; animation:rvPulse 1.15s ease-out infinite;}
  @keyframes rvPulse{ 0%{transform:scale(1); opacity:.5;} 100%{transform:scale(3.4); opacity:0;} }
  @media(prefers-reduced-motion:reduce){
    .rv-pulse,.round-view.tense .round-chartbox,.round-count.on{animation:none;}
    .round-mult{transition:none;}
  }
  /* ── 모니터(MT-14) ── 라운드는 책상 위 기기 안에서 돈다.
     판이 없으면 대기 줄로 눕고, 판이 돌면 불이 들어와 서류를 치우고 화면을 차지한다.
     화면 안쪽은 게임 것을 그대로 쓴다 — .trm에서 빼는 것은 자기 테두리와 그림자
     한 줄뿐이다(기기 안에서는 화면이 곧 유리라서). 차트 코드는 한 줄도 안 건드렸다. */
  .dev{margin-top:9px;}
  .bezel{background:linear-gradient(#d9d0b8,#b9ae92); border-radius:9px 9px 3px 3px;
    padding:7px 7px 6px;
    box-shadow:0 5px 0 rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.65),
      inset 0 -2px 0 rgba(0,0,0,.18);}
  .scrn{position:relative; border-radius:14px/9px; overflow:hidden; background:#05080a;
    box-shadow:inset 0 0 30px rgba(0,0,0,.9);}
  .scrn::after{content:''; position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);}
  .glare{position:absolute; left:-10%; top:-28%; width:70%; height:70%; pointer-events:none;
    z-index:2; transform:rotate(-16deg);
    background:radial-gradient(ellipse at center,rgba(255,255,255,.07),transparent 62%);}
  .scrn .trm{border:0; box-shadow:inset 0 0 22px rgba(51,255,119,.13);}
  .chin{display:flex; align-items:center; gap:8px; padding:4px 11px;
    background:linear-gradient(#c9bfa4,#a89c7e); border-radius:0 0 5px 5px;
    box-shadow:0 4px 0 rgba(0,0,0,.3);}
  .plate{font-family:'Galmuri11',monospace; font-size:12px; color:#5a5240;
    -webkit-font-smoothing:none; font-smooth:never; letter-spacing:0;}
  .led{width:7px; height:7px; border-radius:50%; margin-left:auto; background:#39ff88;
    box-shadow:0 0 7px #39ff88, inset 0 0 2px rgba(0,0,0,.4);}
  .round-view .dev{margin-top:0;}

  .trm .round-timer{font-size:11px; color:#1f8f47; padding:0 0 5px; margin-bottom:4px;
    border-bottom:1px solid #16351f;}
  .trm .round-timer .rt-r{color:#ffb000;}
  .trm .round-timer .rt-r.warn{color:#ff5a5a;}
  .trm .round-mult{font-size:44px; line-height:1; letter-spacing:.02em;}
  /* 특정도 주의 — .round-mult.down이 아래에 또 있어서, 여기서 이름을 다 붙여야 이긴다.
     검은 화면에서 남색(#000080)은 그냥 안 보인다. */
  .trm .round-mult.up,.trm .round-pnl.up{color:#ff5a5a; text-shadow:0 0 10px rgba(255,90,90,.6);}
  .trm .round-mult.down,.trm .round-pnl.down{color:#42d9ff; text-shadow:0 0 10px rgba(66,217,255,.55);}
  .trm .round-mult.flat{color:#33ff77;}
  .trm .round-chartbox{background:transparent; border:0; box-shadow:none; padding:0; margin:6px 0 4px;}
  .trm .round-chart{background:transparent;}
  .trm .round-pnl{font-size:26px; line-height:1.2;}
  .trm .rv-wallet{font-size:11px; color:#1f8f47;}
  .trm .rv-wallet b{color:#33ff77;}
  .trm .round-count{font-size:44px; color:#ff5a5a;}
  .round-pnl{font-size:26px; line-height:37px; font-weight:700; text-align:right;}
  .round-pnl.up{color:var(--red);} .round-pnl.down{color:var(--blue);}
  .rv-wallet{font-size:12.5px; color:var(--gray2); text-align:right;}
  .rv-wallet b{color:var(--ink); font-weight:700;}
  /* 남은 시간도 같은 칸 진행바다 — 상환 게이지와 같은 부품이라 따로 배울 것이 없다 */
  .round-bar{height:26px; padding:2px; display:flex; gap:2px; overflow:hidden; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .round-bar i{display:block; height:100%; width:12px; flex-shrink:0; background:var(--blue);}
  .round-bar i.e{background:transparent;}
  .round-view.tense .round-bar i{background:var(--red);}
  /* 물타기는 책상 위 버튼이다 — 라운드 화면에서 유일하게 98 회색으로 남아
     기기 아래에 혼자 떠 있었다. 매도 버튼과 같은 물건이어야 손이 그리로 간다. */
  .water{display:flex; align-items:center; gap:8px; min-height:48px; padding:8px 10px;
    font-size:12.5px; cursor:pointer; background:var(--paper-hi); color:var(--paper-ink);
    border:1px solid var(--paper-line); border-radius:4px;
    box-shadow:0 3px 0 rgba(0,0,0,.28);}
  .water b{font-weight:700;}
  .water .r{margin-left:auto; color:var(--paper-dim);}
  .water.off{color:#a2977c; background:var(--paper-memo); text-shadow:none; cursor:default;
    box-shadow:none;}
  .water.off .r{color:#a2977c;}

  /* 짧은 화면 — 라운드는 스크롤이 절대 안 되는 화면이다(15초 동안 차트와 매도
     버튼이 같이 보여야 한다). 차트는 손대지 않기로 한 자리라, 줄일 수 있는 것은
     기기 껍데기의 여백뿐이다. 320×568에서 1.8px이 모자랐다. */
  @media(max-height:640px){
    .bezel{padding:4px 4px 3px;}
    .chin{padding:2px 9px;}
    .trm-pad{padding:5px 9px;}
    .round-view{gap:7px;}
    /* 도트 서체는 11px 격자에 그려져서, 터미널 안 크기는 11의 배수로만 내린다 */
    .trm .round-mult{font-size:33px;}
    .trm .round-chartbox{margin:3px 0 2px;}
    /* 48px은 터치 규격이라 그 아래로는 못 내린다 — 62에서 54까지만 */
    .sell-btn{min-height:54px;}
  }

  /* ── 오늘의 기록 ── 상태표시줄로 내려갔다. 98에 원래 그 자리가 있다. */
  .strip{display:flex; gap:2px; padding:3px; flex-shrink:0; background:var(--face); cursor:pointer;
    border-top:1px solid var(--hi);}
  .strip-row{display:flex; align-items:center; gap:6px; width:100%; font-size:12px;}
  .strip-row > span{padding:4px 7px; white-space:nowrap; display:flex; align-items:center; gap:5px;
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .strip-row .fire{flex:1; min-width:0; overflow:hidden; color:var(--ink);}
  .strip-row .cv{color:var(--gray2);}
  /* 펼친 기록판은 상태표시줄 위에 뜬다 */
  .rec-grid{position:absolute; left:9px; right:9px; bottom:40px; z-index:25;
    display:grid; grid-template-columns:1fr 1fr; gap:2px; padding:3px; background:var(--face);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0,0,0,.3);}
  .rec{padding:6px 8px; background:var(--field);
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .rec .k{font-size:12.5px; color:var(--gray2);}
  .rec .v{font-size:12.5px; font-weight:700; margin-top:2px;}
  .strip-buff{display:flex; align-items:center; gap:8px; padding:8px 9px; margin-top:8px;
    background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .strip-buff .e{line-height:0;}
  .strip-buff .t{font-size:12.5px; font-weight:700;}
  .strip-buff .d{font-size:12.5px; color:var(--gray2); margin-top:2px;}

  /* ── 상점 · 해금 ── 98 리스트박스. 고른 줄은 남색 반전. */
  .section-title{font-size:12.5px; color:var(--paper-dim); margin-bottom:8px;}
  .section-title small{color:var(--paper-dim) !important;}
  /* 상점과 권한은 탭이 아니라 서류 두 장이다 — 비품 신청서와 권한 대장.
     흰 리스트박스에 픽셀 아이콘을 얹어 두니 종이 위에서 혼자 놀았다(종목
     타일에서 이미 겪은 자리다). 장부 행으로 바꾼다: 값과 상태가 같은
     세로줄에 서야 위에서 아래로 훑어 읽힌다. */
  #shopList,#unlockList{background:none; border:0; box-shadow:none;}
  .biz{display:flex; align-items:center; gap:10px; padding:10px 0; min-height:62px;
    font-size:12.5px; background:none; border-bottom:1px dashed var(--paper-line);}
  .biz:last-child{border-bottom:0;}
  .biz .logo{display:none;}
  .biz .mid{flex:1; min-width:0;}
  .biz .nm{font-size:17px; font-weight:700; color:var(--paper-ink);
    display:flex; align-items:baseline; gap:6px;}
  .biz .cnt{font-size:12.5px; font-weight:400; color:var(--paper-dim);}
  .biz .ds{font-size:12.5px; color:var(--paper-dim); margin-top:3px;}
  /* 승인란은 장부의 마지막 칸 — 괘선 하나로 갈라서 오른쪽에 세운다 */
  .unlock-tag{flex-shrink:0; min-width:78px; padding:6px 0 6px 11px; font-size:12.5px;
    text-align:right; color:var(--paper-dim); border-left:1px solid var(--paper-line);}
  .unlock-tag b{display:block; font-weight:700; font-size:12.5px; margin-bottom:2px;
    color:var(--paper-ink);}
  .unlock-tag.open{color:#1f7a3a;}
  .unlock-tag.closed{color:#a2977c; text-shadow:none;}
  .unlock-tag.closed b{color:#a2977c;}
  /* 서류 머리 — 주문표와 같은 꼴이라야 세 탭이 같은 서류철로 읽힌다 */
  .doc-head{font-size:15px; font-weight:800; letter-spacing:.22em; color:var(--paper-ink);
    border-bottom:2px solid var(--paper-ink); padding-bottom:5px; margin-bottom:2px;
    display:flex; align-items:baseline;}
  .doc-head small{margin-left:auto; font-size:12px; font-weight:400; letter-spacing:0;
    color:var(--paper-dim);}

  /* ── 대화상자 ── 98은 배경을 어둡게 덮지 않는다. 부모 제목표가 회색이 되는 것으로
     초점을 옮긴다(showModal이 .topbar에 .off를 건다). */
  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center;
    justify-content:center; padding:14px;} .modal.on{display:flex;}
  .modal .dlg{width:100%; max-width:360px; max-height:94vh; display:flex; flex-direction:column;
    background:var(--face);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 3px 3px 0 rgba(0,0,0,.35);}
  .modal .dlg .topbar{flex-shrink:0;}
  .modal .dlg .icon-btn{width:24px; height:22px; font-size:12.5px; line-height:1;}
  .modal .box{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; text-align:left;}
  .modal .emo{display:flex; justify-content:center; margin-bottom:4px; line-height:0;}
  .modal .tt{font-size:19px; font-weight:700; text-align:center; margin:6px 0;}
  .modal .dc{font-size:12.5px; color:var(--gray2); line-height:1.6; text-align:center;}
  .modal .ok{margin-top:12px;}
  .modal .ok.bankrupt{color:var(--red);}
  .stat-grid{display:flex; gap:7px; margin:12px 0 4px;}
  .stat-grid .s{flex:1; padding:8px 6px; background:var(--field); text-align:center;
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .stat-grid .s .k{font-size:12.5px; color:var(--gray2);}
  .stat-grid .s .v{font-size:12.5px; font-weight:700; margin-top:3px;}
  .lv-gain{margin-top:8px; font-size:12.5px; padding:8px 9px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .lv-gain b{font-weight:700;}
  .lv-gain.early b{color:var(--gold);}
  /* 서류의 본문 첫 줄 — 제목 아래에서 한 번 못을 박는 자리 */
  .doc-lead{font-size:17px; font-weight:800; color:var(--paper-ink); margin:8px 0 4px;
    line-height:1.4; word-break:keep-all;}
  /* 조항 — 번호가 왼쪽에 서고 본문이 그 옆으로 흐른다 */
  .cl{display:flex; gap:9px; font-size:12.5px; line-height:1.6; margin-top:8px; clear:both;}
  .cl .no{flex:0 0 auto; color:var(--paper-dim); font-weight:700;}
  .tier-list{display:flex; flex-direction:column; gap:6px; margin-top:12px;}
  .diff-card{display:block; width:100%; min-height:62px; padding:9px 10px; text-align:left;
    cursor:pointer; font-family:inherit; font-size:12.5px; background:var(--face); color:var(--ink);
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh);}
  .diff-card.sel{border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    box-shadow:inset 1px 1px 0 var(--dk), inset -1px -1px 0 var(--lt);}
  .diff-card.lock{color:var(--gray3); text-shadow:1px 1px 0 var(--hi); cursor:default;}
  .diff-top{display:flex; align-items:baseline; gap:8px;}
  .diff-nm{font-size:19px; font-weight:700;}
  .diff-card.lock .diff-nm{color:var(--gray3);}
  .diff-clear{color:var(--green);}
  .diff-xp{margin-left:auto; flex-shrink:0;}
  .diff-de{margin-top:4px; color:var(--gray2);}
  .diff-de.none{color:var(--gray3);}

  /* ── 서류로 오는 대화상자 ── 체결 통지 · 계좌 회수.
     창틀은 98 회색 그대로 둔다(회사가 띄운 창이니까) — 바뀌는 것은 그 안에
     든 종이뿐이다. 승인·체결·회수가 같은 양식이라야 실패가 특별한 사건이
     아니라 절차로 읽힌다. 그게 이 게임의 주제다. */
  .modal .dlg.doc{background:var(--paper); color:var(--paper-ink);
    background-image:repeating-linear-gradient(0deg,rgba(120,100,60,.045) 0 1px,transparent 1px 4px);}
  .dlg.doc .box{padding:11px; position:relative;}
  /* 서류의 본문은 가운데로 몰지 않는다 — 대화상자 기본값(.dc)이 가운데 정렬이라
     종이 위에서만 왼쪽으로 돌린다 */
  .dlg.doc .rs-sub,.dlg.doc .dc{color:var(--paper-dim); text-align:left;}
  .dlg.doc .rs-badge,.dlg.doc .rs-chip{background:var(--paper-memo); color:var(--paper-dim);
    border:1px solid var(--paper-line); border-radius:3px; box-shadow:none;}
  .dlg.doc .rm,.dlg.doc .rs-close,.dlg.doc .stat-grid,.dlg.doc .lv-gain{clear:both;}
  .dlg.doc .rs-close,.dlg.doc .stat-grid .s,.dlg.doc .lv-gain{
    background:var(--paper-memo); border:1px solid var(--paper-line); border-radius:3px;
    box-shadow:none;}
  .dlg.doc .stat-grid .s .k,.dlg.doc .rs-wallet{color:var(--paper-dim);}
  .dlg.doc .rm{clear:both;}
  .dlg.doc .rm .who{color:var(--paper-dim);}
  .dlg.doc .rm .msg{background:var(--paper-memo); color:var(--paper-ink);
    border:1px solid var(--paper-line); border-left:3px solid var(--paper-dim);
    border-radius:3px; box-shadow:none;}
  /* 한국어는 낱말 안에서 끊으면 안 된다 — 「등급이 없 / 습니다」가 났다 */
  .dlg.doc .rs-sub,.dlg.doc .dc{word-break:keep-all;}
  .dlg.doc .rs-wallet{border-top:1px dashed var(--paper-line);}
  .dlg.doc .rs-wallet b,.dlg.doc .stat-grid .s .v{color:var(--paper-ink);}
  /* 도장은 종이에 비스듬히 찍힌다 — 서류 머리 오른쪽, 금액을 가리지 않는 자리 */
  /* 도장은 띄워(float) 찍는다. 절대배치로 얹었더니 문서마다 줄 높이가 달라서
     어떤 화면에서는 금액 옆 빈자리에, 어떤 화면에서는 글자 위에 앉았다.
     띄우면 뒤따르는 줄들이 알아서 도장을 피해 흐른다 — 종이에 찍힌 것처럼. */
  .doc-stamp{float:right; margin:2px 3px 6px 12px; pointer-events:none;
    font-size:17px; font-weight:800; letter-spacing:.2em; opacity:.82;
    color:var(--stamp); border:3px double var(--stamp); border-radius:4px;
    padding:4px 10px; transform:rotate(-13deg);}
  .doc-stamp.bad{color:var(--paper-dim); border-color:var(--paper-dim);}
  /* 통보하는 메모는 이 서류의 주인공이다 — 본문 12.5px 위에 한 단 올라간다 */
  .dlg.doc .rm.lead .msg{font-size:15px; line-height:1.72; padding:11px 12px;}
  /* 사건 띠 — 종이 위에서 제일 센 대비다. 차수 번호는 그 오른쪽 작은 글씨로 물러난다 */
  .ev-band{background:var(--paper-ink); color:var(--paper); font-size:17px; font-weight:800;
    letter-spacing:.2em; padding:8px 10px; margin:2px 0 10px; clear:both;
    display:flex; align-items:baseline; gap:8px;}
  .ev-band span{margin-left:auto; font-size:12px; font-weight:400; letter-spacing:0; opacity:.8;}
  .ev-sub{font-size:12.5px; color:var(--paper-dim); margin:2px 0 8px; clear:both;}
  /* 제약은 도장색으로 따로 세운다 — 본문에 섞으면 안 읽힌다 */
  .limit-band{border:2px solid var(--stamp); color:var(--stamp); font-size:12.5px; font-weight:700;
    padding:7px 9px; margin:8px 0; text-align:center; clear:both;}
  /* 행동 카드 — 제목만 남는다. 무엇을 받는지는 도장을 찍은 뒤에 통보된다. */
  .pick.act{padding:12px; margin-top:8px;}
  .pick.act .pk-n{font-size:19px;}
  .pick.act.sel{padding:12px; background:var(--paper-ink); border-color:var(--paper-ink);}
  .pick.act.sel .pk-n{color:var(--paper);}
  .pick.act.sel .pk-x{color:var(--paper); border-top-color:rgba(244,236,216,.35);}
  /* 승진 통지의 카드 — 고르는 것이지 누르는 것이 아니라 도장 테두리는 안 쓴다 */
  .pick{background:var(--paper-hi); border:1px solid var(--paper-line); border-radius:3px;
    padding:8px 11px; margin-top:7px; cursor:pointer; clear:both;}
  .pick.sel{border:2px solid var(--stamp); background:rgba(179,38,30,.05); padding:7px 10px;}
  .pk-hd{display:flex; align-items:baseline; gap:8px;}
  .pk-n{font-size:17px; font-weight:700; color:var(--paper-ink);}
  .pick.sel .pk-n{color:var(--stamp);}
  .pk-e{margin-left:auto; font-size:12px; color:var(--paper-dim); text-align:right;}
  .pk-d{font-size:12.5px; color:var(--paper-dim); margin-top:2px;}
  .pk-x{font-size:12px; color:var(--paper-ink); margin-top:5px; padding-top:5px;
    border-top:1px dashed var(--paper-line); line-height:1.5;}
  .pk-e{white-space:nowrap;}
  .pk-lead{font-size:12.5px; color:var(--paper-dim); margin-top:12px; clear:both;}
  /* 직급이 바뀌는 줄 — 지운 이름과 새 이름을 나란히 */
  .rankline{display:flex; align-items:baseline; gap:9px; justify-content:center;
    margin:6px 0 10px; clear:both; flex-wrap:wrap;}
  .rk-from{font-size:12.5px; color:var(--paper-dim); text-decoration:line-through; white-space:nowrap;}
  .rk-ar{color:var(--paper-dim);}
  .rk-to{font-size:26px; font-weight:800; color:var(--paper-ink); white-space:nowrap;}
  /* 결재란 — 주문표의 승인 도장과 같은 물건이다 */
  .modal .ok.stamp{background:rgba(179,38,30,.05); color:var(--stamp);
    border:3px double var(--stamp); border-radius:4px; letter-spacing:.06em;
    box-shadow:0 3px 0 rgba(110,24,18,.3); outline:0; text-shadow:none;
    transition:transform .07s ease-out, box-shadow .07s ease-out;}
  .modal .ok.stamp:active{transform:translateY(3px); box-shadow:0 0 0 rgba(0,0,0,0);}
  .modal .ok.stamp.bad{color:var(--paper-dim); border-color:var(--paper-dim);
    background:rgba(107,92,56,.05); box-shadow:0 3px 0 rgba(107,92,56,.28);}

  /* ── 거래 결과 ── */
  .rs-box{text-align:left;}
  .cm-head{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px;}
  .cm-title{font-size:12.5px;}
  .rs-badge{font-size:12.5px; padding:3px 7px; background:var(--field);
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .rs-badge.hot{color:var(--red);} .rs-badge.cold{color:var(--gray2);}
  .rs-money{font-size:26px; line-height:37px; font-weight:700; text-align:center;}
  .rs-money.up{color:var(--red);} .rs-money.down{color:var(--blue);}
  .rs-sub{font-size:12.5px; color:var(--gray2); text-align:center; margin-top:4px;}
  .rs-chips{display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; justify-content:center;}
  .rs-chip{font-size:12.5px; padding:4px 8px; background:var(--field);
    border:1px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);
    display:flex; align-items:center; gap:4px;}
  .rs-chip.grade{color:var(--green);} .rs-chip.grade.low{color:var(--blue);}
  .rs-chip.short,.rs-chip.lev{color:var(--blue);}
  .rs-chip.streak{color:var(--red);}
  .rs-sum{font-size:19px; font-weight:700;}
  .rs-sum.up{color:var(--red);} .rs-sum.down{color:var(--blue);}
  .rs-wallet{margin-top:10px; padding-top:8px; border-top:1px solid var(--sh); font-size:12.5px;}
  .rs-wallet b{font-weight:700;}
  .rs-close{margin-top:10px; padding:8px 10px; text-align:center; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .cl-top{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px;}
  .cl-top.one{justify-content:center;}
  .cl-dd b{font-weight:700;}
  .rs-close.p-warn .cl-dd{color:var(--gold);}
  .rs-close.p-bad .cl-dd{color:var(--red);}
  .rs-close.p-done .cl-dd{color:var(--green);}

  /* ── 경험치 정산 ── */
  .xp-tbl{display:flex; flex-direction:column; gap:5px; margin-top:12px; font-size:12.5px;}
  .xp-tbl>div{display:flex; justify-content:space-between; align-items:baseline; gap:12px;}
  .xp-tbl b{font-weight:700; flex-shrink:0;}
  .xp-tbl .pen, .xp-tbl .pen b{color:var(--red);}
  .xp-tbl .sum{border-top:1px solid var(--sh); padding-top:6px; margin-top:2px;
    font-size:19px; font-weight:700;}
  .xp-head{display:flex; justify-content:space-between; align-items:baseline; gap:10px;
    margin-top:14px; font-size:12.5px;}
  .xp-head small{color:var(--gray2); flex-shrink:0;}
  .xp-bar{height:22px; padding:2px; margin-top:5px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .xp-bar>i{display:block; height:100%; background:var(--blue); transition:width .5s ease-out;}
  .unlock-pop{display:flex; align-items:center; gap:9px; padding:9px 10px; margin-top:9px;
    background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .unlock-pop .e{flex-shrink:0; line-height:0;}
  .unlock-pop .t{display:block; font-size:12.5px; font-weight:700; color:var(--blue);}
  .unlock-pop .d{display:block; font-size:12.5px; color:var(--gray2); margin-top:2px;}

  /* ── 패턴 도감 ── */
  .dex-note{font-size:12.5px; padding:8px 9px; margin:9px 0 4px; line-height:1.55; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .dex-note b{font-weight:700;}
  .scroller{max-height:56vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .dex-sec{margin-top:11px;}
  .dex-head{font-size:12.5px; font-weight:700; padding:5px 8px; display:flex; align-items:center; gap:6px;}
  .dex-head small{font-weight:400; margin-left:5px; color:var(--gray2);}
  .dex-head.strong{color:var(--green);} .dex-head.mid{color:var(--gold);} .dex-head.weak{color:var(--blue);}
  .dex-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:6px;}
  .dex{padding:7px 8px; background:var(--field);
    border:2px solid; border-color:var(--sh) var(--hi) var(--hi) var(--sh);}
  .dex.unseen{color:var(--gray3);} .dex.none{opacity:.45;}
  .dex-top{display:flex; align-items:baseline; gap:6px;}
  .dex-nm{font-size:12.5px; font-weight:700;}
  .dex-pct{margin-left:auto; font-size:12.5px;}
  .dex svg{display:block; margin-top:4px;}
  .dex-st{font-size:12.5px; color:var(--gray2); margin-top:3px;}

  .hide{display:none !important;}
  /* display를 정한 클래스(.water의 flex 등)가 UA의 [hidden]{display:none}을 이겨서
     hidden을 걸어도 그대로 보인다. 한 줄로 막아둔다. */
  [hidden]{display:none !important;}

  /* 토스트 — 상태표시줄 위에 잠깐 뜬다 */
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:56px; z-index:70;
    background:var(--face); color:var(--ink); font-size:12.5px; padding:9px 12px; max-width:86%;
    text-align:center; opacity:0; pointer-events:none; transition:opacity .2s;
    border:2px solid; border-color:var(--lt) var(--dk) var(--dk) var(--lt);
    box-shadow:inset 1px 1px 0 var(--hi), inset -1px -1px 0 var(--sh), 2px 2px 0 rgba(0,0,0,.3);}
  .toast.on{opacity:1;}

  /* 🛠 테스트 도구 — 상단 로고를 2번 연타하면 열린다. 평소엔 아무 흔적이 없다. */
  .dv-top{display:flex; align-items:center; gap:8px; padding-bottom:9px;
    border-bottom:1px solid var(--line);}
  .dv-title{font-size:15px; font-weight:900; color:var(--ink);}
  .dv-state{flex:1; font-size:10.5px; font-weight:700; color:var(--gray3);
    font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .dv-wipe{border:none; background:var(--red-weak); color:var(--red); font-size:13px;
    width:28px; height:28px; border-radius:9px; cursor:pointer; flex-shrink:0;}
  .dv-tabs{display:grid; grid-template-columns:repeat(5,1fr); gap:3px; margin:9px 0 10px;
    background:var(--field); border-radius:11px; padding:3px;}
  .dv-tab{border:none; background:transparent; font-family:inherit; font-size:10.5px;
    font-weight:800; color:var(--gray2); padding:7px 2px; border-radius:8px; cursor:pointer;
    line-height:1.25;}
  .dv-tab b{display:block; font-size:13px; font-weight:400;}
  .dv-tab.on{background:var(--card); color:var(--ink); box-shadow:var(--shadow);}
  .dv-scroll{max-height:50vh; overflow-y:auto; -webkit-overflow-scrolling:touch; text-align:left;}
  .dv-sec{font-size:10.5px; font-weight:800; color:var(--gray3); margin:11px 0 6px;}
  .dv-sec:first-child{margin-top:0;}
  .dv-row{display:flex; gap:5px; align-items:center; margin-bottom:5px;}
  .dv-row.wrap{flex-wrap:wrap;}
  .dv-btn{flex:1; border:1px solid var(--line); background:var(--field); color:var(--gray);
    font-family:inherit; font-size:11.5px; font-weight:800; padding:8px 6px; border-radius:9px;
    cursor:pointer; white-space:nowrap;}
  .dv-btn.sm{flex:0 0 auto; padding:6px 9px; font-size:11px;}
  .dv-btn.sel{border-color:var(--blue); background:var(--blue-weak); color:var(--blue);}
  .dv-btn.danger{border-color:var(--red); background:var(--red-weak); color:var(--red);}
  .dv-lab{font-size:11px; font-weight:800; color:var(--gray3); flex-shrink:0;}
  .dv-val{flex:1; text-align:center; font-size:14px; font-weight:900; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .dv-val small{display:block; font-size:10px; font-weight:700; color:var(--gray3);}
  .dv-note{font-size:10.5px; font-weight:700; color:var(--gray3); margin-top:7px; line-height:1.55;}
  .dv-note b{color:var(--blue);}
  /* 탭 바닥 — 값을 만져도 새 판이라야 듣는 것이 있어서 재시작이 늘 손 닿는 곳에 있어야 한다 */
  .dv-foot{display:flex; gap:5px; margin-top:11px; padding-top:9px;
    border-top:1px solid var(--line);}
  .dv-foot .dv-btn{font-size:11px; padding:9px 6px;}
  .dv-foot .go{border-color:var(--blue); background:var(--blue-weak); color:var(--blue);}
  /* 패턴 탭 */
  .dv-mix{display:flex; gap:5px; margin-bottom:9px;}
  .dv-mix span{flex:1; text-align:center; font-size:10.5px; font-weight:800; padding:6px 2px;
    border-radius:8px; font-variant-numeric:tabular-nums;}
  .dv-mix .s{background:#e9f9f0; color:#00a862;}
  .dv-mix .m{background:#fff9ec; color:#8a5a00;}
  .dv-mix .k{background:var(--red-weak); color:var(--red);}
  .dv-mix .e{background:var(--blue-weak); color:var(--blue);}
  .pat-row{display:flex; gap:8px; align-items:center; padding:6px; border-radius:11px;
    border:1px solid var(--line); background:var(--card); margin-bottom:5px; cursor:pointer;}
  .pat-row.forced{border-color:var(--blue); background:var(--blue-weak);}
  .pat-chart{width:62px; height:38px; flex-shrink:0; background:var(--field); border-radius:7px;}
  .pat-mid{flex:1; min-width:0;}
  .pat-nm{font-size:12px; font-weight:900; color:var(--ink); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis;}
  .pat-nm em{font-style:normal; font-size:10px; font-weight:800; margin-left:4px;}
  .pat-nm em.s{color:#00a862;} .pat-nm em.m{color:#c98600;} .pat-nm em.k{color:var(--red);}
  .pat-w{display:flex; align-items:center; gap:3px; margin-top:3px;}
  .pat-w button{border:1px solid var(--line); background:var(--field); color:var(--gray);
    font-family:inherit; font-size:11px; font-weight:900; width:21px; height:21px;
    border-radius:6px; cursor:pointer; padding:0; flex-shrink:0;}
  .pat-w span{width:30px; text-align:center; font-size:11px; font-weight:900; color:var(--ink);
    font-variant-numeric:tabular-nums;}
  .pat-w span.pat-early{width:auto; text-align:left; font-size:10px; font-weight:700;
    color:var(--gray3); margin-left:5px; white-space:nowrap;}
  .pat-early b{color:var(--blue);}
  .pat-prob{width:44px; text-align:right; font-size:12px; font-weight:900; color:var(--gray);
    font-variant-numeric:tabular-nums; flex-shrink:0;}
  /* 값 옆에 "무엇이고 어느 쪽이 어려워지나"를 붙인다 — 숫자만 있으면 못 만진다 */
  .dv-help{font-size:10.5px; font-weight:700; color:var(--gray3); line-height:1.55;
    background:var(--field); border-radius:10px; padding:8px 10px; margin:-2px 0 8px;}
  .dv-help b{color:var(--ink);}
  .dv-help .up{color:var(--red); font-weight:800;}
  .dv-help .dn{color:var(--blue); font-weight:800;}

       세계관 설명을 제목 한 줄이 대신한다. 대화상자가 뜨면 .off로 회색이 된다. -->
  <div class="topbar" id="topbar">

         옮기니 "얼마 있고 얼마 만들어야 하나"가 두 줄로 읽힌다. -->

         선택이 아니었다 — 둘뿐이고 사실상 자동이었다), 배정표는 제목표의 직급 칩을
         눌러 여는 대화상자가 됐다. 책상에 놓이는 것은 지금 결재할 종이 한 장이다. -->
    <div id="tabsWrap">

    <div id="roundHost" hidden></div>

/* 브라우저 설정으로 첫 언어를 정한다. 고른 뒤에는 저장값이 이긴다. */
function detectLang(){
  try{ return String(navigator.language||'').toLowerCase().indexOf('ko')===0?'ko':'en'; }
  catch(e){ return 'ko'; }
}
let LANG=(function(){
  try{ const v=localStorage.getItem(LANG_KEY); if(v==='ko'||v==='en')return v; }catch(e){}
  return detectLang();
})();
function t(k,v){
  const d=L[LANG]||L.ko;
  const s=(d&&d[k]!=null)?d[k]:(L.ko[k]!=null?L.ko[k]:k);
  return v?String(s).replace(/\{(\w+)\}/g,function(_,n){return v[n]!=null?v[n]:'';}):s;
}
function setLang(l){
  if(l!=='ko'&&l!=='en')return;
  LANG=l;
  try{ localStorage.setItem(LANG_KEY,l); }catch(e){}
  if(typeof render==='function')render();
}

/* 같은 줄에서 여러 번 불리므로 만든 것을 들고 있는다 — 한 판에 수십 번 다시 그린다. */
const ICO_CACHE={};
function ic(name,scale){
  const s=scale||2, key=name+'@'+s;
  if(ICO_CACHE[key])return ICO_CACHE[key];
  let r='';
  if(ICO[name]){
    const rows=ICO[name];
    for(let y=0;y<16;y++){
      const line=rows[y];
      let x=0;
      while(x<16){
        const c=line[x];
        if(c==='.'){x++;continue;}
        let w=1; while(x+w<16&&line[x+w]===c)w++;
        r+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="1" fill="'+ICO_PAL[c]+'"/>';
        x+=w;
      }
    }
  }else if(ICO_SPARK[name]){
    const ys=ICO_SPARK[name], col=ICO_SPCOL[name];
    r='<rect x="0" y="0" width="16" height="16" fill="#ffffff"/>'
     +'<rect x="0" y="7" width="16" height="1" fill="#c0c0c0"/>';
    for(let x=0;x<16;x++){
      const y=ys[x];
      r+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+col+'"/>';
      if(x){const p=ys[x-1],a=Math.min(p,y),b=Math.max(p,y);
        if(b-a>1)r+='<rect x="'+x+'" y="'+(a+1)+'" width="1" height="'+(b-a-1)+'" fill="'+col+'"/>';}
    }
  }else return '';
  const out='<svg class="ic" width="'+16*s+'" height="'+16*s+'" viewBox="0 0 16 16" '
    +'shape-rendering="crispEdges" aria-hidden="true">'+r+'</svg>';
  ICO_CACHE[key]=out;
  return out;
}

/* ===== 돈 표기 =====
   내부 숫자는 하나다 — 원 단위 그대로 두고 표시할 때만 바꾼다. 잔고·목표·투자금이
   전부 같은 정수를 쓰니 밸런스와 세이브는 언어와 무관하다.

   영어판은 100으로 나눠 달러로 쓴다. 환율이 100이라는 뜻이 아니라, 밸런스를 한 줄도
   안 건드리고 영어권 눈에 자연스러운 자릿수로 떨어지는 값이라 골랐다 —
   시드 $1,000 · 1차 목표 $5,000 · 최종 목표 $500M. 시드·최소 베팅·게이트 일곱 개가
   전부 100으로 나누어지므로 잔돈이 생기지 않는다.

   두 언어 다 아래 자리를 버린다(50만원 · $12.3K). 한국어판이 처음부터 그렇게
   써왔고, 이유도 그대로다 — 판마다 바뀌는 큰 수를 끝자리까지 읽히면 자릿수
   감각이 사라진다. 지금 얼마인지가 아니라 목표에 얼마나 가까운지가 중요하다. */
const USD_PER_WON=1/100;
function fmtWonKo(v){const neg=v<0;let x=Math.round(Math.abs(v));if(x<10000)return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000),man=Math.floor((x%100000000)/10000);let s='';if(eok)s+=eok+'억';if(man)s+=(s?' ':'')+man.toLocaleString()+'만';return (neg?'-':'')+s+'원';}
function fmtUsd(v){
  const neg=v<0, d=Math.round(Math.abs(v)*USD_PER_WON);
  let s=d.toLocaleString('en-US');
  /* 1만 달러 미만은 끝자리까지 쓴다 — 한국어가 1만원 미만을 그대로 쓰는 것과 같은 기준.
     그 위는 K·M·B로 소수 한 자리만 남긴다. 반올림이 1000을 넘으면 다음 단위로
     올라간다 — 1000K가 아니라 1M이다. */
  if(d>=1e4){
    for(const [base,u] of [[1e3,'K'],[1e6,'M'],[1e9,'B']]){
      const x=Math.round(d/base*10)/10;
      if(x<1000||u==='B'){ s=(x%1?x.toFixed(1):String(x))+u; break; }
    }
  }
  return (neg?'-':'')+'$'+s;
}
function fmtMoney(v){return LANG==='en'?fmtUsd(v):fmtWonKo(v);}
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

let AC=null;
function beep(f,d,t='sine',vol=.15){if(META.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(720,.05,'triangle',.09),buy:()=>{beep(520,.07,'square',.1);setTimeout(()=>beep(780,.09,'square',.1),60);},pay:()=>{beep(880,.08,'sine',.13);setTimeout(()=>beep(1180,.12,'sine',.12),70);},warn:()=>beep(300,.15,'sawtooth',.12),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.14),i*100));},bankrupt:()=>{[400,340,280,220].forEach((f,i)=>setTimeout(()=>beep(f,.22,'sawtooth',.1),i*130));}};

/* 범위 눈금 — 로그다. 선형으로 하면 ETF(0.7~1.57)가 점 하나로 뭉개진다.
   지금은 종목 칸 그래프의 세로 진폭을 정하는 데 쓴다(instAmp). */
const RNG_LO=0.05, RNG_HI=3.5;
function rngPos(v){
  const l=Math.log(RNG_LO), h=Math.log(RNG_HI);
  return Math.max(0,Math.min(100,(Math.log(v)-l)/(h-l)*100));
}
/* 종목 칸의 작은 그래프. 선 모양이 성격(ETF는 완만한 한 줄, 코인은 톱니)을,
   세로 진폭이 크기를 말한다 — 격자로 가면서 선과 막대로 나눠 그리던 둘을
   한 칸에 합쳤다. 진폭은 손으로 정한 값이 아니라 실측 범위(rng)에서 나온다.
   가운데 점선이 진입가(1.00x)라, 칸마다 같은 기준선을 갖는다. */
function instAmp(st){
  if(!st.rng)return 0.5;
  return Math.max(0.18, Math.min(1,(rngPos(st.rng[3])-rngPos(st.rng[2]))/100));
}
function instChart(st){

    `<g transform="translate(0 11) scale(1 ${instAmp(st).toFixed(2)}) translate(0 -10)">`+
    `<path d="${d}" fill="none" stroke="currentColor" stroke-width="1.6"`+

/* 라운드 길이는 종목마다 다를 수 있다. ROUND_TICKS는 기본값(15초)이고, 종목이 ticks로
   덮어쓴다 — 코인만 20초다. 틱 간격(50ms)은 어느 종목이나 같다. */

/* 여러 구간(keypoint)을 사인 이징으로 잇는 범용 경로 생성기 — 구간을 몇 개, 어떤 값으로

function buildMultiPhase(keypoints,noiseAmt,T){
  T=T||ROUND_TICKS;
  const kps=[[0,1],...keypoints];
  const path=[1]; let noise=0;
  for(let i=1;i<=T;i++){
    const frac=i/T;
    let seg=kps.length-2;
    for(let k=0;k<kps.length-1;k++){ if(frac<=kps[k+1][0]){seg=k;break;} }
    const [f0,v0]=kps[seg],[f1,v1]=kps[seg+1];
    const segFrac=(f1-f0)>0?(frac-f0)/(f1-f0):1;
    const s=Math.sin(Math.min(1,Math.max(0,segFrac))*Math.PI/2);
    const val=v0+(v1-v0)*s;
    noise+=noiseAmt*randn(); noise*=0.75;
    path.push(Math.max(0.05,val+noise));

    path.push(Math.max(0.05,1+drift*(i/T)+noise));
  }
  return path;
}

   다섯 줄도 같이 바뀐다. */
let DOWN_NO_BOUNCE=0.30;     // 반등 없이 미끄러짐
let DOWN_WEAK_BOUNCE=0.35;   // 본전을 못 넘는 반등 (나머지는 1.00~1.14까지)
const DOWN_NO_BOUNCE_BASE=DOWN_NO_BOUNCE, DOWN_WEAK_BOUNCE_BASE=DOWN_WEAK_BOUNCE;
function pickPattern(){
  let r=Math.random(),acc=0;
  for(const p of PATTERNS){acc+=p.weight; if(r<=acc)return p;}
  return PATTERNS[PATTERNS.length-1];

/* 신호가 말하는 건 "등급"까지고, 그 등급 안에서 어떤 패턴이 나올지는 종목이 정한다.
   이 분리가 중요하다 — 등급 분포는 종목과 무관하므로 종목을 바꿔도 신호가 그대로
   유효하고(그래서 다시 뽑을 필요가 없고), 동시에 종목마다 다른 판이 나온다.
   등급까지 종목이 바꾸게 두면 "좋은 신호가 뜰 때까지 종목 돌리기"가 열린다. */
function pickInTier(tier,stock){
  const w=(stock&&stock.patW)||null;
  const pool=PATTERNS.filter(p=>PATTERN_TIER[p.id]===tier);
  const ws=pool.map(p=>p.weight*((w&&w[p.id]!==undefined)?w[p.id]:1));
  const tot=ws.reduce((a,x)=>a+x,0);
  if(!(tot>0))return pool[0];   // 종목이 한 등급을 통째로 막는 일은 없어야 한다
  let r=Math.random()*tot,acc=0;
  for(let i=0;i<pool.length;i++){ acc+=ws[i]; if(r<=acc)return pool[i]; }
  return pool[pool.length-1];

/* 📰 장중 뉴스는 삭제했다. 15초 라운드에서 눈은 선과 매도 버튼에 묶여 있는데
   문장을 읽으려면 1초가 든다 — 자리를 옮겨도 안 읽히는 건 형태 탓이었다.
   클리어율을 21%→27%로 올리던 장치라 지우는 쪽이 밸런스로도 맞다.
   적중률을 재던 시뮬은 sim/news.js에 기록으로 남겼다. */

function genRound(stock,tier){
  /* 테스트 도구로 패턴을 고정했으면 등급을 무시하고 그걸 쓴다. 신호는 따로 굴러가므로
     신호와 실제가 어긋날 수 있는데, 확인용으로는 그게 오히려 맞다. */
  const pat=(DEV.pat&&PATTERNS.find(x=>x.id===DEV.pat))||pickInTier(tier||'mid',stock);
  const T=ticksOf(stock);
  return {patternId:pat.id, patternEmo:pat.emo, path:pat.gen(stock,T), ticks:T};
}

/* ===== 장세 신호 =====
   패턴을 "도달 가능한 고점이 얼마나 큰가"로 3단계로 묶는다. 베팅 전에 이 등급을
   확률적으로만 알려줘서, 레버리지를 지를 "근거"는 주되 확신은 주지 않는다.
   (패턴 힌트처럼 정답을 알려주면 게임이 무너지므로 일부러 틀릴 수 있게 둔다.)
   시뮬레이션 검증: 5배 사용 시 전액 손실률이 신호 없음 43% → 기본신호 15% → 정보력
   최대 4.6%로 떨어진다. 신호의 값어치는 수익 증가가 아니라 "사고를 줄이는 것"에 있다. */
/* 급등급락(spike)은 강세에서 보통으로 내렸다. 끝값이 평균 0.67이고 강세 가중치의
   34%를 차지했다 — 3배에서 0.67은 청산이라, 강세 신호를 믿고 들고 있으면 셋 중
   하나꼴로 죽었다. 그래서 "강세여도 일단 빨리 털어라"가 학습됐다. */
const PATTERN_TIER={up:'strong',delayup:'strong',
  v:'mid',w:'mid',m:'mid',invv:'mid',spike:'mid',earlypop:'mid',
  down:'weak',flat:'weak',delaydown:'weak',crash:'weak'};
/* 하락 가중치 — 상승/하락 패턴의 등장 비율을 옮겨 판당 기댓값을 조절하는 다이얼.
   예전에는 고정 상수(DOWN_SHIFT=0.04) 하나였다. 이제 난이도 단계가 정하므로
   판을 시작할 때마다 다시 계산한다. 원본 비율은 BASE_WEIGHTS에 남겨둬야
   단계를 바꿀 때 이전 단계의 보정 위에 또 보정하는 일이 안 생긴다. */
const BASE_WEIGHTS=PATTERNS.map(p=>p.weight);
function applyTierWeights(){
  const d=tierOf().down, HALF=0.29;   // strong 합 = weak 합 = 0.29
  PATTERNS.forEach((p,i)=>{
    const t=PATTERN_TIER[p.id], w0=(DEV.w&&DEV.w[p.id]!==undefined)?DEV.w[p.id]:BASE_WEIGHTS[i];
    p.weight = t==='weak' ? w0+d*(w0/HALF)
             : t==='strong' ? w0-d*(w0/HALF)
             : w0;
  });
  const tot=PATTERNS.reduce((a,p)=>a+p.weight,0);
  PATTERNS.forEach(p=>p.weight/=tot);
}
const SIGNAL_TIERS=['strong','mid','weak'];
/* 장세 표시는 도트 삼각형이었다 — 95의 정렬 화살표라 종이 위에서 혼자 튀었다.
   종목 칸의 작은 그래프와 같은 말(선이 오르면 강세, 내리면 약세)을 쓰는
   작은 도표로 바꾼다. 16×16 격자를 벗어나니 획이 반듯하게 떨어진다. */
const SIG_LINE={strong:'3,16 9,12 14,13 19,7 25,4',
                mid:   '3,10 9,8 14,11 19,9 25,10',

/* 정보력 — 예전엔 30만/120만/500만에 85%까지 올라가서 Lv.4 전에 다 살 수 있었다.
   시뮬(각 500회, 목표 1억): 적중률 55% → 85%가 도달률은 97% → 98%로 거의 안 바꾸고
   도달 속도만 41판 → 29판으로 줄인다. 즉 정보력의 값어치는 "난이도"가 아니라 "속도"인데
   가격이 속도값에 비해 터무니없이 쌌다. 상한을 78%로 낮추고 가격을 성장 곡선에 맞춘다. */
const INFO_ACC=[0.55,0.62,0.70,0.78];
const INFO_COSTS=[30000000,400000000,5000000000];
function infoAccOf(){
  return INFO_ACC[Math.min(INFO_ACC.length-1,S.upg.infoLv||0)];
}
/* 다음 라운드의 패턴을 미리 뽑아두고 그에 대한 신호를 만든다. 라운드가 끝날 때만
   새로 뽑기 때문에, 탭을 옮기거나 종목을 바꿔서 좋은 신호가 뜰 때까지 돌리는 건 불가능. */
function rollPending(){
  const tier=PATTERN_TIER[pickPattern().id]||'mid';   // 전역 가중치가 등급 분포를 정한다
  let sig=tier;
  if(Math.random()>=infoAccOf()){
    const others=SIGNAL_TIERS.filter(t=>t!==tier);
    sig=others[Math.floor(Math.random()*others.length)];
  }
  S.pending={tier, sig};
}
function ensurePending(){ if(!S.pending||!S.pending.tier)rollPending(); }
/* 레버리지 청산선 — 손실이 투자금 전액이 되는 가격.
   롱: (mult-1)*L = -1  →  mult = 1 - 1/L   (아래쪽, 1배면 0에 수렴하므로 청산 없음)
   숏: (1-mult)*L = -1  →  mult = 1 + 1/L   (위쪽, 1배도 2배에서 청산된다)
   숏이 비대칭으로 위험한 건 이 때문이다. 가격은 아래로 0까지지만 위로는 상한이 없어서
   spike 패턴(최대 3.5배)이면 1배 숏도 전액 손실이 난다. */
let LIQ_K=1.0;                 /* 🛠 청산 여유 — 1.00이 원금 전액 손실선 */
const LIQ_K_BASE=LIQ_K;
function liqMultOf(lev,dir,entry){
  const e=entry||1;                      // 물타기로 평단이 움직이면 청산선도 같이 움직인다
  if((dir||1)<0)return e*(1+LIQ_K/lev);  // 숏은 배율 1배에서도 청산선이 있다
  return lev>1?e*Math.max(0,1-LIQ_K/lev):0;
}

/* ===== 상환 기한 =====
   시드머니가 대출이므로 채권자가 상환 일정을 준다. 라운드 한 판 = 하루 장(거래일).
   기한 안에 상환금에 못 닿으면 반대매매로 런 종료.

   왜 필요한가 — 시뮬레이션(각 500~800회)으로 다른 길을 전부 막아봤다:
     신호를 아예 삭제해도 클리어 99%, 신호를 100% 정확하게 하면 오히려 65판 → 49판,
     자산의 70%를 매 판 강제로 걸게 해도 88%, 목표를 100만 배 올려도 73판 → 154판.
     판당 기댓값이 3배에서 1.68이라 어떤 베팅 규칙도 복리를 못 이긴다.
   관문만 넣으면 패턴 밸런스를 하나도 안 건드리고 클리어 99% → 23%,
   성공 런 22분 / 실패 런 8분으로 길이도 균형이 잡힌다.

   관문마다 정해진 일수로 새로 시작한다 — 남은 거래일은 이월되지 않는다. */
const GATES=[
  {get n(){return t('gate1');}, goal:500000,     days:13},
  {get n(){return t('gate2');}, goal:3000000,    days:13},
  {get n(){return t('gate3');}, goal:20000000,   days:13},
  {get n(){return t('gate4');}, goal:150000000,  days:15},
  {get n(){return t('gate5');}, goal:1000000000, days:15},
  {get n(){return t('gate6');}, goal:8000000000, days:17},
  {get n(){return t('gateFinal');}, goal:50000000000, days:17},
];
let EXTEND_DAYS=3, EXTEND_COST_FRAC=0.25;   // 기한 연장: 자산의 25%로 3거래일 (🛠 도구가 민다)
const EXTEND_DAYS_BASE=EXTEND_DAYS, EXTEND_COST_BASE=EXTEND_COST_FRAC;
/* ===== 조기 상환 보너스 (이월을 대체한다) =====
   예전에는 남은 거래일을 다음 관문으로 이월했다(상한 5일). 그런데 거래일은 복리로 붙는다 —
   판당 기댓값이 3배에서 1.68이라 5일이면 13배의 여유다. 그래서 관문을 넘을 때마다 다음
   관문이 눈에 띄게 헐거워졌고(sim/carry.js: 이월 상한 0 → 무제한에서 클리어 22% → 41%),
   "보상이 선택을 넓히는 게 아니라 난이도를 낮춘다"는 문제의 가장 큰 몫이기도 했다.

   대신 남은 거래일 1일당 방금 갚은 관문 목표의 10%를 현금으로 준다. 통과 시점의 현금이
   대략 목표와 같으므로 이건 매 관문에 같은 비율로 주는 선불이고, 판수를 늘리지 않으니
   복리로 불어나지 않는다 — 계수 하나로 조절되는 다이얼이 된다.
   상한은 두지 않는다. 상한 5일을 걸면 클리어가 19% → 15%로 현행보다 어려워져서,
   결국 조율할 상수만 하나 더 느는 셈이었다(sim/bonus.js 5번 블록).

   sim/bonus.js 실측(각 500회, 3배·보험0%·하락+4%p):
     현행(이월5)                        클리어 18%
     이월만 삭제                        클리어  9%   ← 그냥 없애면 너무 가혹하다
     이월0 + 보너스 10%/일              클리어 14%
     이월0 + 보너스 10%/일 + 일수 +1    클리어 19%   ← 채택. 현행과 같은 난이도
   그래서 GATES 일수를 전부 +1 했다(12→13, 14→15, 16→17). */
let EARLY_BONUS_RATE=0.10;     /* 🛠 테스트 도구가 민다 */
const EARLY_BONUS_BASE=EARLY_BONUS_RATE;

/* ===== 난이도 단계 =====
   새 판을 시작할 때 고른다. 1단계만 열려 있고, 그 단계를 "완제"해야 다음이 열린다 —
   파산으로는 안 열린다. 디메리트는 누적이고 선택 화면에 전부 펼쳐 둔다.

   쓸 수 있는 축은 셋이었는데 하나는 버렸다. sim/tier.js 실측(각 500회):
     최소 레버리지 1배 클리어 10% · 2배 23% · 3배 35% · 5배 41%
   배율을 낮추면 파산은 사라지지만(1배 파산률 0%) 복리가 느려져 관문을 못 채운다
   (1배 관문실패 90%). 즉 레버리지는 난이도가 아니라 속도 다이얼이라, 디메리트로
   쓰면 방향이 뒤집힌다. 최소 배율은 MIN_LEVERAGE=3 고정으로 두고 빼버렸다.

   남은 두 축은 단조롭다:
     하락 가중  +0%p 33% · +2 28% · +4 19% · +6 13% · +8 7% · +12 1%
     관문 일수  +2 27% · +0 21% · −2 11% · −4 7%
   3단계가 지금까지의 난이도(하락 +4%p)와 같다. 기존 플레이를 사다리 한가운데 두면
   위아래 양쪽으로 갈 곳이 남는다.

   사다리 실측: 37% → 27% → 17% → 13% → 7% */
const TIERS=[
  {get n(){return t('tier1');}, down:0.00, dday:0,  xp:1.0, get de(){return [];}},
  {get n(){return t('tier2');}, down:0.02, dday:0,  xp:1.3,

/* META.cleared = 완제한 단계의 수. 1단계를 완제하면 1이 되고 2단계가 열린다. */

function gateOf(){
  const g=GATES[Math.min(GATES.length-1,S.gate||0)], m=evModOf();
  if(!m||m.k!=='g')return g;
  /* n은 getter라 사본을 만들 때 프로토타입으로 물려야 한다 */
  const o=Object.create(g); o.goal=Math.round(g.goal*(1+EV_GOAL_UP)); return o;
}
/* 관문 기한은 난이도가 깎는다. 4일 밑으로는 안 내린다 — 한 관문을 세 판에 넘으라는 건
   기한이 아니라 그냥 못 하는 판이 된다. */
/* 🛠 테스트 도구가 일수를 통째로 밀 수 있게 사본을 둔다. GATES 원본은 기본값으로 남는다. */
let GATE_DAYS=GATES.map(g=>g.days);

  const m=evModOf(i);

  return Math.max(4,GATE_DAYS[Math.min(GATE_DAYS.length-1,i)]+tierOf().dday-cut);

/* 거래일 → 날짜. 주말은 건너뛴다(장이 안 서니까). */
function dateOfDay(n){
  const d=new Date(2026,2,2);            // 3월 2일 월요일에서 시작
  let left=n;
  while(left>0){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6)left--; }
  return t('dateFmt',{mon:t('dateMon').split(',')[d.getMonth()],

/* 판당 필요 수익률 = (목표 ÷ 현금)^(1 ÷ 남은 거래일) − 1.
   D 숫자만으로는 위험한지 알 수가 없다 — 같은 D-5라도 목표의 90%를 모았으면 여유고
   10%면 사실상 끝난 판이다. 복리 기준으로 "판당 몇 % 필요"로 환산해야 한 눈에 읽힌다.
   판당 기댓값이 3배에서 1.68이라 20%는 여유, 45%를 넘으면 사실상 한 방이 필요하다. */
const PACE_OK=0.20, PACE_WARN=0.45;
function riskAt(cash,days){
  const g=gateOf();
  const need=Math.pow(g.goal/Math.max(cash,MIN_BET),1/Math.max(1,days))-1;
  let cls='p-ok';
  if(need>PACE_WARN)cls='p-bad'; else if(need>PACE_OK)cls='p-warn';
  if(days<=1)cls='p-bad'; else if(days<=3&&cls==='p-ok')cls='p-warn';
  const p=Math.max(0,need)*100;
  return {need,cls,last:days<=1,txt:`+${p<10?p.toFixed(1):Math.round(p)}%`};
}

const UNLOCK_NEED_BASE=META_UNLOCKS.map(u=>u.need);   /* 🛠 도구가 need를 밀므로 원본을 남긴다 */

/* ===== 관문의 사유 =====

/* ── 사건 풀 세 벌 ──

const REASON_LOW=['quarter','audit','deficit','payout','limit',

const REASON_MID=['mdelay','mnominee','mrookie','mprev','mbranch',

const REASON_HIGH=['hsource','hshare','hreg','hwhistle','hreaudit',
                   'hheir','hbook','hpol','hmerge','hname'];
/* ── 사건이 거는 조임 ──
   지금까지 사유는 문구였다. 목표도 기한도 안 바꾸니 인(因)이 될 수가 없었고,
   그래서 뒤에 오는 3택이 답할 것 없는 답이었다. 이제 사건이 이번 차수에
   조건을 하나 건다 — 기한을 하루 깎거나 목표를 8% 올린다.

   숨통은 회사가 안 준다. 3택 중 하나가 그 조임을 푸는 행동이고(EV_RELIEF),
   고르면 이번 차수에 한해 조건이 사라진다. 무엇을 풀었는지는 도장을 찍은

const EV_GOAL_UP=0.08;

function reasonPool(){ const lv=metaLv(); return lv>=6?REASON_HIGH:lv>=3?REASON_MID:REASON_LOW; }

  if(!S.reasons||S.reasons.length<GATES.length){

function metaLv(){ return Math.min(META_UNLOCKS.length+1, 1+promoCount()); }
/* 사다리가 둘인데 둘 다 「Lv.」였다 — 그래서 「1회차 끝내고 2회차에 사원이

/* 서류 번호 — 회차-일련. 고정값을 박아 두면 스무 판을 돌려도 0142라 금방 들킨다. */

/* ===== 승진과 권한 =====
   권한은 이제 XP 문턱이 「자동으로」 여는 것이 아니라, 승진할 때 **고른 것**이다.
   XP 문턱(UNLOCK_NEED_BASE)은 그대로 남아서 **언제 승진하는가**만 정한다 —
   속도는 그대로고 순서만 플레이어의 것이 된다. 일곱 번이면 결국 일곱을 다 받으므로
   최종 보유는 늘 같다(900 XP로 연 코인이 런마다 안 나오는 사고가 없다).

   티어가 밸런스를 지킨다 — 동전주(클리어 70%)·코인(52%)을 1순위로 뽑으면

const UNLOCK_TIER={split:1, water:1, etf:1, short:2, dex:2, penny:3, coin:3};
const TIER_OPENS_AT={1:1, 2:3, 3:5};
function granted(){ return META.granted||(META.granted=[]); }

     · 🛠 도구의 XP 손잡이 — XP를 밀면 권한도 같이 따라와야 손잡이 구실을 한다

/* 방금 끝난 판의 정산 내역. penalty는 파산/반대매매에만 붙는다. */

/* ===== 매도 등급 =====
   그 판에 실제로 지나간 가격 범위 안에서 어디에 팔았나. 고점 매도 100%, 바닥 매도 0%.
   처음엔 "고점 대비"((매도−1)÷(최고−1))로 잡았는데, 하락장에서는 매도 시점이 곧 그 순간의
   최저점이라 모든 플레이어가 D를 받는 결함이 있었다. 최저~최고 범위로 바꾸면 상승장·하락장
   구분 없이 항상 정의되고 실력순으로 갈린다. */
const GRADE_CUT=[[0.90,'S','gradeS'],[0.70,'A','gradeA'],[0.45,'B','gradeB'],
                 [0.20,'C','gradeC'],[-1,'D','gradeD']];
const GRADE_MIN_RANGE=0.04;   /* 이보다 덜 움직인 판은 등급이 노이즈라 매기지 않는다 */
function gradeOf(mult,lo,hi,dir){
  const rng=hi-lo;
  if(rng<GRADE_MIN_RANGE)return null;
  /* 롱은 높이 팔수록, 숏은 낮게 덮을수록 잘한 것이다 */
  const e=Math.max(0,Math.min(1,((dir||1)<0?hi-mult:mult-lo)/rng));
  const g=GRADE_CUT.find(c=>e>=c[0]);
  return {pct:Math.round(e*100), g:g[1], txt:t(g[2])};
}
