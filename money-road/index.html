<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 자동화 방치 게임</title>
<meta name="description" content="탭으로 시작해 수입을 자동화하고, 3분마다 돌아오는 상환일을 넘기며 빚 없는 인생을 만드는 방치형 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00c471; --gold:#ffb020;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; letter-spacing:-.02em; overflow-x:hidden;
    overscroll-behavior-y:contain;}
  html{overscroll-behavior-y:contain;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(24px + var(--safe-b));}

  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px;}
  .topbar .brand{font-size:18px; font-weight:800;} .topbar .brand span{color:var(--blue);}
  .icon-btn{border:none; background:var(--card); color:var(--gray); width:36px; height:36px; border-radius:12px; font-size:15px; box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer;}

  /* 상환 스트립 */
  .debt-strip{margin:2px 20px 0; background:var(--card); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow); border:2px solid transparent; transition:border-color .3s, background .3s;}
  .debt-strip.warn{border-color:var(--gold); background:#fffaf0;}
  .debt-strip.danger{border-color:var(--red); background:var(--red-weak);}
  .ds-top{display:flex; justify-content:space-between; align-items:baseline;}
  .ds-label{font-size:12.5px; font-weight:800; color:var(--gray2);}
  .ds-timer{font-size:13px; font-weight:900; color:var(--ink); font-variant-numeric:tabular-nums;}
  .ds-timer.hot{color:var(--red);}
  .ds-amt{font-size:22px; font-weight:900; margin-top:4px; letter-spacing:-.03em;}
  .ds-bar{height:6px; background:var(--line); border-radius:999px; overflow:hidden; margin-top:9px;}
  .ds-bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--blue),#00c2ff); transition:width .2s linear, background .3s;}
  .debt-strip.warn .ds-bar>i{background:linear-gradient(90deg,var(--gold),#ff9f43);}
  .debt-strip.danger .ds-bar>i{background:linear-gradient(90deg,var(--red),#ff6b78);}
  .ds-sub{font-size:11.5px; font-weight:700; color:var(--gray2); margin-top:6px;}
  .ds-sub b{color:var(--red);}

  /* 히어로: 현금/수입 */
  .hero{margin:14px 20px 0; padding:20px 20px 18px; border-radius:24px; position:relative; overflow:hidden;
    background:linear-gradient(135deg,#0b1b3a 0%,#12336e 55%,#1d4fb0 100%); color:#fff;}
  .hero::after{content:""; position:absolute; top:-40%; right:-20%; width:220px; height:220px; border-radius:50%; background:radial-gradient(circle,#4c8dff55,transparent 70%);}
  .hero .k{font-size:12.5px; font-weight:700; color:#9fc0ff; position:relative;}
  .hero .cash{font-size:34px; font-weight:900; letter-spacing:-.04em; margin-top:4px; position:relative; font-variant-numeric:tabular-nums;}
  .hero .income{font-size:14px; font-weight:800; color:#7ee0a8; margin-top:6px; position:relative;}

  /* 탭 버튼 */
  .tap-wrap{margin:16px 20px 0; position:relative;}
  .tap-btn{width:100%; border:none; border-radius:22px; padding:26px 20px; cursor:pointer;
    background:linear-gradient(135deg,#3182F6,#4c8dff); color:#fff; box-shadow:0 10px 26px rgba(49,130,246,.34);
    display:flex; flex-direction:column; align-items:center; gap:4px; transition:transform .06s;}
  .tap-btn:active{transform:scale(.97);}
  .tap-btn .e{font-size:34px;}
  .tap-btn .t{font-size:15.5px; font-weight:900;}
  .tap-btn .s{font-size:12.5px; font-weight:700; opacity:.85;}
  .float-pop{position:absolute; left:50%; top:44px; transform:translateX(-50%); font-size:16px; font-weight:900; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.25);
    pointer-events:none; animation:floatUp .7s ease-out forwards; z-index:5;}
  @keyframes floatUp{0%{opacity:0; transform:translate(-50%,0) scale(.8);}15%{opacity:1; transform:translate(-50%,-6px) scale(1.05);}100%{opacity:0; transform:translate(-50%,-34px) scale(1);}}

  .section-title{font-size:13.5px; font-weight:800; color:var(--gray2); margin:20px 20px 8px;}

  .biz{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:12px 14px; margin:0 20px 8px; box-shadow:var(--shadow);}
  .biz .logo{width:42px; height:42px; border-radius:13px; background:var(--field); display:grid; place-items:center; font-size:21px; flex-shrink:0;}
  .biz .mid{flex:1; min-width:0;}
  .biz .nm{font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px;}
  .biz .cnt{font-size:11px; font-weight:800; color:var(--blue); background:var(--blue-weak); padding:1px 7px; border-radius:999px;}
  .biz .ds{font-size:12px; color:var(--gray2); font-weight:650; margin-top:2px;}
  .biz-buy{flex-shrink:0; border:none; border-radius:13px; padding:11px 14px; font-size:13px; font-weight:800; cursor:pointer; text-align:right; min-width:92px;}
  .biz-buy.can{background:var(--ink); color:#fff;}
  .biz-buy.cant{background:var(--field); color:var(--gray3);}
  .biz-buy .p{display:block; font-size:13.5px; font-weight:900;}
  .biz-buy .l{display:block; font-size:10.5px; font-weight:700; opacity:.75; margin-top:1px;}

  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:28px; background:rgba(0,0,0,.5);} .modal.on{display:flex;}
  .modal .box{width:100%; max-width:360px; background:var(--card); border-radius:26px; padding:30px 24px 22px; text-align:center; animation:pop .3s cubic-bezier(.2,1.2,.4,1);}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal .emo{font-size:56px;}
  .modal .tt{font-size:21px; font-weight:900; margin:12px 0 6px;} .modal .dc{font-size:14.5px; color:var(--gray); font-weight:600; line-height:1.5;}
  .modal .ok{margin-top:18px; width:100%; border:none; color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:15px; cursor:pointer; background:linear-gradient(135deg,#3182F6,#4c8dff);}
  .modal .ok.danger{background:linear-gradient(135deg,#f04452,#ff6b78);}
  .stat-grid{display:flex; gap:10px; margin:16px 0 4px;} .stat-grid .s{flex:1; background:var(--field); border-radius:14px; padding:12px 6px;} .stat-grid .s .k{font-size:11px; color:var(--gray2); font-weight:700;} .stat-grid .s .v{font-size:15px; font-weight:800; margin-top:3px;}

  .toast{position:fixed; left:50%; bottom:28px; translate:-50% 0; background:rgba(25,31,40,.92); color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:14px; z-index:70; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;} .toast.on{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">머니<span>로드</span></div>
    <button class="icon-btn" id="muteBtn">🔊</button>
  </div>

  <div class="debt-strip" id="debtStrip">
    <div class="ds-top"><span class="ds-label" id="dsLabel">다음 상환까지</span><span class="ds-timer" id="dsTimer">3:00</span></div>
    <div class="ds-amt" id="dsAmt">100,000원</div>
    <div class="ds-bar"><i id="dsBar"></i></div>
    <div class="ds-sub" id="dsSub"></div>
  </div>

  <div class="hero">
    <div class="k">보유 현금</div>
    <div class="cash" id="cashView">0원</div>
    <div class="income" id="incomeView">+0원 / 초</div>
  </div>

  <div class="tap-wrap">
    <button class="tap-btn" id="tapBtn">
      <span class="e">💰</span>
      <span class="t" id="tapLabel">탭해서 벌기</span>
      <span class="s" id="tapSub">+1,000원</span>
    </button>
  </div>

  <div class="section-title">🏢 자동 수입원</div>
  <div id="bizList"></div>
</div>

<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const RUN_KEY='moneyroad2_run_v1', META_KEY='moneyroad2_meta_v1';

function fmtWon(v){const neg=v<0;let x=Math.round(Math.abs(v));if(x<10000)return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000),man=Math.floor((x%100000000)/10000);let s='';if(eok)s+=eok+'억';if(man)s+=(s?' ':'')+man.toLocaleString()+'만';return (neg?'-':'')+s+'원';}
const won=n=>Math.round(n).toLocaleString()+'원';

/* audio */
let AC=null;
function beep(f,d,t='sine',vol=.15){if(META.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(720,.05,'triangle',.09),buy:()=>{beep(520,.07,'square',.1);setTimeout(()=>beep(780,.09,'square',.1),60);},pay:()=>{beep(880,.08,'sine',.13);setTimeout(()=>beep(1180,.12,'sine',.12),70);},warn:()=>beep(300,.15,'sawtooth',.12),bankrupt:()=>{[400,300,200].forEach((f,i)=>setTimeout(()=>beep(f,.2,'sawtooth',.12),i*140));}};

/* config */
const BUSINESSES=[
  {id:'alba',   emo:'🏪', name:'편의점 알바',   cost:20000,       income:200},
  {id:'rider',  emo:'🛵', name:'배달 라이더',   cost:150000,      income:1200},
  {id:'box',    emo:'📦', name:'무인 택배함',   cost:1000000,     income:7000},
  {id:'cafe',   emo:'☕', name:'무인 카페',     cost:6000000,     income:40000},
  {id:'rent',   emo:'🏢', name:'상가 임대',     cost:35000000,    income:220000},
  {id:'factory',emo:'🏭', name:'자동화 공장',   cost:200000000,   income:1300000},
  {id:'holding',emo:'🏦', name:'지주회사',      cost:1200000000,  income:8000000},
];
const COST_MULT=1.15;
const DEBT_CYCLE_MS=180000; // 3분
const DEBT_BASE=100000;
const DEBT_MULT=1.45;
const costOf=(biz,count)=>Math.round(biz.cost*Math.pow(COST_MULT,count));
const dueOf=n=>Math.round(DEBT_BASE*Math.pow(DEBT_MULT,n-1)); // n번째 상환액(1-indexed)

/* meta (설정만) */
let META;
function loadMeta(){try{const r=localStorage.getItem(META_KEY);if(r){META=JSON.parse(r);return;}}catch(e){}META={mute:false};}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(META));}catch(e){}}

/* run state */
let S=null;
function newState(){
  const now=Date.now();
  return {cash:0, incomePerSec:0, counts:BUSINESSES.map(()=>0),
    paymentCount:0, overdue:0, nextDebtAt:now+DEBT_CYCLE_MS, lastTick:now, totalTaps:0};
}
function saveRun(){try{localStorage.setItem(RUN_KEY,JSON.stringify(S));}catch(e){}}
function clearRun(){try{localStorage.removeItem(RUN_KEY);}catch(e){}}
function recomputeIncome(){S.incomePerSec=BUSINESSES.reduce((a,b,i)=>a+b.income*S.counts[i],0);}

/* 저장된 시점 이후 흐른 시간을 catch-up: 수동 탭 없이 패시브 수입만 반영하고,
   그 사이 지나간 상환일이 있으면 그 시점 기준으로 순차 정산한다(오프라인 정산의 최소 버전) */
function catchUp(){
  const now=Date.now();
  let t=S.lastTick;
  let missedCycles=0, paidCycles=0, seizedCount=0, wentBankrupt=false;
  while(true){
    if(S.nextDebtAt<=now && S.nextDebtAt>=t){
      const dt=(S.nextDebtAt-t)/1000;
      S.cash+=dt*S.incomePerSec;
      const due=dueOf(S.paymentCount+1);
      if(S.cash>=due){S.cash-=due;S.paymentCount++;S.overdue=0;paidCycles++;}
      else{S.paymentCount++;S.overdue++;missedCycles++;
        if(S.overdue===2){const idx=seizeOne();if(idx>=0)seizedCount++;}
        if(S.overdue>=3){wentBankrupt=true;t=S.nextDebtAt;break;}
      }
      t=S.nextDebtAt; S.nextDebtAt+=DEBT_CYCLE_MS;
    }else break;
  }
  const dt=(now-t)/1000;
  if(dt>0 && !wentBankrupt) S.cash+=dt*S.incomePerSec;
  S.lastTick=now;
  return {missedCycles,paidCycles,seizedCount,wentBankrupt,awaySec:(now-t)/1000};
}
function seizeOne(){
  let bestIdx=-1,bestVal=-1;
  for(let i=0;i<BUSINESSES.length;i++){if(S.counts[i]>0 && BUSINESSES[i].income>bestVal){bestVal=BUSINESSES[i].income;bestIdx=i;}}
  if(bestIdx>=0){S.counts[bestIdx]--;recomputeIncome();}
  return bestIdx;
}

function loadRun(){
  try{const r=localStorage.getItem(RUN_KEY);if(r){S=JSON.parse(r);
    if(!Array.isArray(S.counts)||S.counts.length!==BUSINESSES.length)S.counts=BUSINESSES.map(()=>0);
    recomputeIncome();
    return true;}
  }catch(e){}
  return false;
}
function startRun(){S=newState();saveRun();}

/* boot */
loadMeta();
$('muteBtn').textContent=META.mute?'🔇':'🔊';
let awayReport=null;
if(loadRun()){ awayReport=catchUp(); } else { startRun(); }
saveRun();

/* render */
function renderBiz(){
  $('bizList').innerHTML=BUSINESSES.map((b,i)=>{
    const cnt=S.counts[i], cost=costOf(b,cnt), can=S.cash>=cost;
    return `<div class="biz"><div class="logo">${b.emo}</div>
      <div class="mid"><div class="nm">${b.name}${cnt>0?`<span class="cnt">${cnt}개</span>`:''}</div>
      <div class="ds">${cnt>0?`+${fmtWon(b.income*cnt)}/초 생산중`:`+${fmtWon(b.income)}/초`}</div></div>
      <button class="biz-buy ${can?'can':'cant'}" data-i="${i}"><span class="p">${fmtWon(cost)}</span><span class="l">구매</span></button>
      </div>`;
  }).join('');
  $('bizList').querySelectorAll('.biz-buy').forEach(btn=>btn.onclick=()=>buyBiz(+btn.dataset.i));
}
function buyBiz(i){
  const b=BUSINESSES[i], cost=costOf(b,S.counts[i]);
  if(S.cash<cost)return;
  S.cash-=cost; S.counts[i]++; recomputeIncome();
  sfx.buy(); toast(`${b.name} 구매!`);
  saveRun(); render();
}
function renderHero(){
  $('cashView').textContent=fmtWon(S.cash);
  $('incomeView').textContent=`+${fmtWon(S.incomePerSec)} / 초`;
}
function renderDebt(){
  const now=Date.now();
  const remain=Math.max(0,S.nextDebtAt-now);
  const sec=Math.ceil(remain/1000);
  const mm=Math.floor(sec/60), ss=sec%60;
  $('dsTimer').textContent=`${mm}:${String(ss).padStart(2,'0')}`;
  $('dsTimer').classList.toggle('hot',sec<=20);
  const due=dueOf(S.paymentCount+1);
  $('dsAmt').textContent=fmtWon(due);
  const pct=100-Math.max(0,Math.min(100,remain/DEBT_CYCLE_MS*100));
  $('dsBar').style.width=pct+'%';
  const strip=$('debtStrip');
  strip.classList.toggle('warn',S.overdue===1);
  strip.classList.toggle('danger',S.overdue>=2);
  if(S.overdue===1)$('dsSub').innerHTML=`⚠️ 지난 상환 연체 <b>1회</b> — 한 번 더 놓치면 자산이 압류돼요`;
  else if(S.overdue>=2)$('dsSub').innerHTML=`🚨 연체 <b>${S.overdue}회</b> — 다음에도 놓치면 파산이에요`;
  else $('dsSub').textContent=`${S.paymentCount+1}번째 상환 · 3분마다 자동으로 빠져나가요`;
}
function renderTap(){
  $('tapSub').textContent=`+${fmtWon(tapIncome())}`;
}
function render(){renderHero();renderDebt();renderBiz();renderTap();}
const tapIncome=()=>1000+Math.floor(S.incomePerSec*0.5);

/* tap */
let tapPopId=0;
$('tapBtn').onclick=()=>{
  S.cash+=tapIncome(); S.totalTaps++;
  sfx.tap();
  const pop=document.createElement('div');
  pop.className='float-pop'; pop.textContent='+'+fmtWon(tapIncome());
  pop.style.left=(46+Math.random()*8)+'%';
  $('tapBtn').parentElement.appendChild(pop);
  setTimeout(()=>pop.remove(),700);
  renderHero(); renderBiz(); renderTap();
};

/* debt cycle */
function processDebt(){
  const due=dueOf(S.paymentCount+1);
  if(S.cash>=due){
    S.cash-=due; S.paymentCount++; S.overdue=0;
    sfx.pay(); toast(`✅ ${S.paymentCount}번째 상환 완료! -${fmtWon(due)}`);
  }else{
    S.paymentCount++; S.overdue++;
    sfx.warn();
    if(S.overdue===1){
      showModal('⚠️','상환 연체','이번 상환액을 갚지 못했어요. 한 번 더 놓치면 자산이 압류돼요.',()=>{});
    }else if(S.overdue===2){
      const idx=seizeOne();
      const nm=idx>=0?BUSINESSES[idx].name:'자산';
      showModal('📉','자산 압류','두 번 연속 연체돼서 채권자가 자산을 압류했어요.',()=>{},`${nm} 1개가 압류됐어요`);
    }else{
      sfx.bankrupt();
      showBankrupt();
      return;
    }
  }
  S.nextDebtAt+=DEBT_CYCLE_MS;
  saveRun(); render();
}
function showBankrupt(){
  $('modalBox').innerHTML=`<div class="emo">💸</div><div class="tt">파산</div>
    <div class="dc">3회 연속 상환에 실패해서 모든 걸 잃었어요.<br>처음부터 다시 시작해봐요.</div>
    <div class="stat-grid"><div class="s"><div class="k">도달 수입</div><div class="v">${fmtWon(S.incomePerSec)}/초</div></div><div class="s"><div class="k">상환 횟수</div><div class="v">${S.paymentCount-1}회</div></div></div>
    <button class="ok danger" id="mRestart">다시 시작</button>`;
  $('modal').classList.add('on');
  $('mRestart').onclick=()=>{sfx.tap();$('modal').classList.remove('on');clearRun();startRun();render();};
}
function showModal(emo,tt,dc,onClose,extra){
  $('modalBox').innerHTML=`<div class="emo">${emo}</div><div class="tt">${tt}</div><div class="dc">${dc}</div>${extra?`<div class="dc" style="margin-top:8px;color:var(--red);font-weight:800">${extra}</div>`:''}<button class="ok" id="mOk">확인</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');onClose&&onClose();};
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}

$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';if(!META.mute)sfx.tap();};

/* main tick — 100ms 간격으로 부드럽게 현금 증가, 상환 데드라인 체크 */
setInterval(()=>{
  const now=Date.now();
  const dt=(now-S.lastTick)/1000;
  S.cash+=dt*S.incomePerSec;
  S.lastTick=now;
  if(now>=S.nextDebtAt){processDebt();}
  else{renderHero();renderDebt();renderBiz();}
}, 100);
setInterval(saveRun, 3000);
window.addEventListener('pagehide', saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

render();
if(awayReport && (awayReport.missedCycles>0 || awayReport.paidCycles>0)){
  const bits=[];
  if(awayReport.paidCycles>0)bits.push(`자동 상환 ${awayReport.paidCycles}회 성공`);
  if(awayReport.missedCycles>0)bits.push(`연체 ${awayReport.missedCycles}회`);
  toast(`돌아오신 동안: ${bits.join(' · ')}`);
}
</script>
