<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 파이어족 도전</title>
<meta name="description" content="주식 투자로 차·집·결혼·여행을 이루고 파이어족에 도전하는 인생 시뮬레이션 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00b894;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; line-height:1.4;
    letter-spacing:-.02em;
  }
  #app{max-width:460px; margin:0 auto; min-height:100vh; background:var(--bg);
       position:relative; padding-bottom:calc(120px + var(--safe-b));}
  /* ===== Header ===== */
  .topbar{position:sticky; top:0; z-index:20; background:var(--bg);
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 20px 8px;}
  .topbar .brand{font-size:18px; font-weight:800; letter-spacing:-.03em;}
  .topbar .brand span{color:var(--blue);}
  .date-chip{font-size:13px; font-weight:600; color:var(--gray);
    background:var(--card); padding:7px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .icon-btn{border:none; background:var(--card); color:var(--gray);
    width:36px; height:36px; border-radius:12px; font-size:16px; box-shadow:var(--shadow);
    display:grid; place-items:center; cursor:pointer;}
  /* ===== Net worth hero ===== */
  .hero{padding:8px 20px 4px;}
  .hero .label{font-size:14px; color:var(--gray); font-weight:600;}
  .hero .net{font-size:34px; font-weight:800; letter-spacing:-.04em; margin:4px 0 2px;
    display:flex; align-items:baseline; gap:8px;}
  .hero .delta{font-size:14px; font-weight:700;}
  .hero .delta.up{color:var(--red);} .hero .delta.down{color:var(--blue);}
  .spark{width:100%; height:56px; margin-top:6px; display:block;}
  .breakdown{display:flex; gap:8px; margin:12px 0 4px;}
  .bd{flex:1; background:var(--card); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow);}
  .bd .k{font-size:12px; color:var(--gray2); font-weight:600;}
  .bd .v{font-size:15px; font-weight:800; margin-top:3px; letter-spacing:-.03em;}
  .bd .v.debt{color:var(--red);}
  /* ===== FIRE progress ===== */
  .fire{margin:14px 20px 4px; background:var(--card); border-radius:var(--radius); padding:16px 18px; box-shadow:var(--shadow);}
  .fire .row{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .fire .t{font-size:14px; font-weight:800;} .fire .t b{color:var(--blue);}
  .fire .pct{font-size:14px; font-weight:800; color:var(--blue);}
  .bar{height:10px; background:var(--line); border-radius:999px; overflow:hidden;}
  .bar>i{display:block; height:100%; background:linear-gradient(90deg,#3182F6,#00c2ff); border-radius:999px; transition:width .5s cubic-bezier(.2,.8,.2,1);}
  .fire .sub{font-size:12px; color:var(--gray2); margin-top:8px; font-weight:600;}
  /* ===== Tabs ===== */
  .tabs{display:flex; gap:6px; padding:16px 20px 8px; position:sticky; top:52px; background:var(--bg); z-index:10;}
  .tab{flex:1; text-align:center; padding:10px; border-radius:14px; font-size:14px; font-weight:700;
    color:var(--gray2); background:transparent; border:none; cursor:pointer; transition:.15s;}
  .tab.on{background:var(--ink); color:#fff;}
  .panel{padding:4px 16px;}
  .panel.hide{display:none;}
  /* ===== Stock card ===== */
  .stock{background:var(--card); border-radius:18px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:10px;
    display:flex; align-items:center; gap:12px; cursor:pointer; transition:transform .1s;}
  .stock:active{transform:scale(.985);}
  .logo{width:44px; height:44px; border-radius:14px; display:grid; place-items:center; font-size:22px; flex-shrink:0;}
  .stock .mid{flex:1; min-width:0;}
  .stock .nm{font-size:15px; font-weight:800; letter-spacing:-.03em;}
  .stock .own{font-size:12px; color:var(--gray2); font-weight:600; margin-top:2px;}
  .stock .own b{color:var(--gray);}
  .stock .rt{text-align:right;}
  .stock .price{font-size:15px; font-weight:800; letter-spacing:-.03em;}
  .stock .chg{font-size:13px; font-weight:700; margin-top:2px;}
  .chg.up{color:var(--red);} .chg.down{color:var(--blue);} .chg.flat{color:var(--gray2);}
  /* ===== Life cards ===== */
  .life{background:var(--card); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-bottom:10px;
    display:flex; align-items:center; gap:14px;}
  .life .emo{font-size:30px; width:52px; height:52px; border-radius:16px; background:var(--field); display:grid; place-items:center; flex-shrink:0;}
  .life .mid{flex:1; min-width:0;}
  .life .nm{font-size:15px; font-weight:800;}
  .life .ds{font-size:12.5px; color:var(--gray2); font-weight:600; margin-top:3px; line-height:1.35;}
  .life .cost{font-size:13px; color:var(--gray); font-weight:700; margin-top:5px;}
  .mini-btn{border:none; background:var(--blue); color:#fff; font-weight:800; font-size:14px;
    padding:10px 16px; border-radius:12px; cursor:pointer; white-space:nowrap; flex-shrink:0;}
  .mini-btn:active{background:var(--blue-press);}
  .mini-btn.done{background:var(--line); color:var(--gray2);}
  .mini-btn.off{background:var(--field); color:var(--gray3);}
  .section-title{font-size:13px; font-weight:800; color:var(--gray2); margin:14px 6px 8px;}
  /* ===== Bottom CTA ===== */
  .cta-wrap{position:fixed; left:0; right:0; bottom:0; z-index:30; pointer-events:none;
    display:flex; justify-content:center;}
  .cta-inner{width:100%; max-width:460px; padding:12px 16px calc(14px + var(--safe-b));
    background:linear-gradient(180deg,rgba(242,244,246,0) 0%,var(--bg) 32%); pointer-events:auto;}
  .cta{width:100%; border:none; background:var(--blue); color:#fff; font-size:17px; font-weight:800;
    padding:17px; border-radius:16px; cursor:pointer; letter-spacing:-.02em; box-shadow:0 8px 24px rgba(49,130,246,.32);
    transition:transform .08s, background .15s;}
  .cta:active{transform:translateY(1px); background:var(--blue-press);}
  .cta .yr{font-size:12px; font-weight:700; opacity:.8; display:block; margin-top:2px;}
  /* ===== Bottom sheet ===== */
  .scrim{position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:40; opacity:0; pointer-events:none; transition:.25s;}
  .scrim.on{opacity:1; pointer-events:auto;}
  .sheet{position:fixed; left:0; right:0; bottom:0; z-index:50; margin:0 auto; max-width:460px;
    background:var(--card); border-radius:24px 24px 0 0; padding:8px 20px calc(20px + var(--safe-b));
    transform:translateY(110%); transition:transform .3s cubic-bezier(.2,.9,.2,1); box-shadow:0 -8px 30px rgba(0,0,0,.12);}
  .sheet.on{transform:translateY(0);}
  .grab{width:40px; height:4px; background:var(--line); border-radius:999px; margin:6px auto 14px;}
  .sh-head{display:flex; align-items:center; gap:12px; margin-bottom:16px;}
  .sh-head .nm{font-size:18px; font-weight:800;}
  .sh-head .px{font-size:13px; color:var(--gray); font-weight:700; margin-top:2px;}
  .qty{display:flex; align-items:center; justify-content:space-between; background:var(--field); border-radius:16px; padding:8px 10px; margin-bottom:12px;}
  .qty button{width:44px; height:44px; border:none; background:var(--card); border-radius:12px; font-size:22px; font-weight:700; color:var(--ink); box-shadow:var(--shadow); cursor:pointer;}
  .qty .q{font-size:24px; font-weight:800; letter-spacing:-.03em;}
  .qty .q small{font-size:13px; color:var(--gray2); font-weight:700; margin-left:3px;}
  .quicks{display:flex; gap:7px; margin-bottom:14px;}
  .quicks button{flex:1; border:none; background:var(--field); color:var(--gray); font-weight:700; font-size:13px; padding:11px 0; border-radius:12px; cursor:pointer;}
  .quicks button:active{background:var(--blue-weak); color:var(--blue);}
  .sh-info{display:flex; justify-content:space-between; font-size:14px; font-weight:600; color:var(--gray); padding:6px 2px;}
  .sh-info b{color:var(--ink); font-weight:800;}
  .sh-actions{display:flex; gap:10px; margin-top:14px;}
  .sh-actions button{flex:1; border:none; padding:16px; border-radius:15px; font-size:16px; font-weight:800; cursor:pointer;}
  .btn-buy{background:var(--red); color:#fff;} .btn-buy:active{filter:brightness(.94);}
  .btn-sell{background:var(--blue); color:#fff;} .btn-sell:active{filter:brightness(.94);}
  .btn-buy:disabled,.btn-sell:disabled{background:var(--line); color:var(--gray3); cursor:default; filter:none;}
  /* ===== Event / result modal ===== */
  .modal{position:fixed; inset:0; z-index:60; display:none; align-items:center; justify-content:center; padding:28px;
    background:rgba(0,0,0,.45);}
  .modal.on{display:flex;}
  .modal .box{width:100%; max-width:360px; background:var(--card); border-radius:26px; padding:30px 24px 22px; text-align:center;
    animation:pop .3s cubic-bezier(.2,1.2,.4,1);}
  @keyframes pop{from{transform:scale(.85); opacity:0;} to{transform:scale(1); opacity:1;}}
  .modal .emo{font-size:56px;}
  .modal .tt{font-size:20px; font-weight:800; margin:12px 0 6px;}
  .modal .dc{font-size:14.5px; color:var(--gray); font-weight:600; line-height:1.5;}
  .modal .impact{font-size:17px; font-weight:800; margin:14px 0 4px;}
  .impact.up{color:var(--red);} .impact.down{color:var(--blue);}
  .modal .ok{margin-top:20px; width:100%; border:none; background:var(--blue); color:#fff; font-size:16px; font-weight:800; padding:15px; border-radius:15px; cursor:pointer;}
  .modal .ok:active{background:var(--blue-press);}
  .modal .ok.ghost{background:var(--field); color:var(--gray); margin-top:8px;}
  .stat-grid{display:flex; gap:10px; margin:16px 0 4px;}
  .stat-grid .s{flex:1; background:var(--field); border-radius:14px; padding:12px 6px;}
  .stat-grid .s .k{font-size:11px; color:var(--gray2); font-weight:700;}
  .stat-grid .s .v{font-size:15px; font-weight:800; margin-top:3px;}
  .toast{position:fixed; left:50%; bottom:150px; translate:-50% 0;
    background:rgba(25,31,40,.92); color:#fff; font-size:13.5px; font-weight:700; padding:11px 18px; border-radius:14px;
    z-index:70; opacity:0; transition:.25s; pointer-events:none; max-width:88%; text-align:center;}
  .toast.on{opacity:1; bottom:160px;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">머니<span>로드</span></div>
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="date-chip" id="dateChip">27세 · 2026년 1월</div>
      <button class="icon-btn" id="resetBtn" title="새 게임">↺</button>
    </div>
  </div>

  <div class="hero">
    <div class="label">순자산</div>
    <div class="net"><span id="netWorth">0원</span><span class="delta" id="netDelta"></span></div>
    <svg class="spark" id="spark" viewBox="0 0 420 56" preserveAspectRatio="none"></svg>
    <div class="breakdown">
      <div class="bd"><div class="k">현금</div><div class="v" id="bdCash">0원</div></div>
      <div class="bd"><div class="k">투자자산</div><div class="v" id="bdStock">0원</div></div>
      <div class="bd"><div class="k">부채</div><div class="v debt" id="bdDebt">0원</div></div>
    </div>
  </div>

  <div class="fire">
    <div class="row">
      <div class="t">🔥 <b>파이어족</b>까지</div>
      <div class="pct" id="firePct">0%</div>
    </div>
    <div class="bar"><i id="fireBar" style="width:0%"></i></div>
    <div class="sub" id="fireSub">목표: 순자산 0원 · 월 생활비의 300배</div>
  </div>

  <div class="tabs">
    <button class="tab on" data-tab="stock" id="tabStock">📈 투자</button>
    <button class="tab" data-tab="life" id="tabLife">🏡 인생</button>
  </div>

  <div class="panel" id="panelStock"></div>
  <div class="panel hide" id="panelLife"></div>
</div>

<div class="cta-wrap"><div class="cta-inner">
  <button class="cta" id="nextBtn">다음 달로 <span class="yr" id="ctaYr"></span></button>
</div></div>

<!-- Trade sheet -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <div class="sh-head">
    <div class="logo" id="shLogo"></div>
    <div><div class="nm" id="shName"></div><div class="px" id="shPx"></div></div>
  </div>
  <div class="qty">
    <button id="qMinus">−</button>
    <div class="q"><span id="qNum">0</span><small>주</small></div>
    <button id="qPlus">+</button>
  </div>
  <div class="quicks">
    <button data-q="1">+1</button>
    <button data-q="10">+10</button>
    <button data-q="100">+100</button>
    <button data-q="max" id="qMax">최대</button>
  </div>
  <div class="sh-info"><span>주문 금액</span><b id="shTotal">0원</b></div>
  <div class="sh-info"><span id="shBalLbl">주문 후 현금</span><b id="shBal">0원</b></div>
  <div class="sh-actions">
    <button class="btn-buy" id="doBuy">매수</button>
    <button class="btn-sell" id="doSell">매도</button>
  </div>
</div>

<!-- Event / result modal -->
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const KEY='moneyroad_save_v1';
const $=id=>document.getElementById(id);

/* ---------- money format ---------- */
function fmtWon(v){
  const neg=v<0; let x=Math.round(Math.abs(v));
  if(x<10000) return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000), man=Math.floor((x%100000000)/10000);
  let s='';
  if(eok) s+=eok+'억';
  if(man) s+=(s?' ':'')+man.toLocaleString()+'만';
  return (neg?'-':'')+s+'원';
}
const won=n=>Math.round(n).toLocaleString()+'원';

/* ---------- game config ---------- */
const STOCKS=[
  {id:'tom', name:'토마토전자',  emo:'📱', bg:'#fdece8', drift:0.008, vol:0.09, div:0,     price:68000},
  {id:'kim', name:'김치반도체',  emo:'💾', bg:'#e8f2ff', drift:0.013, vol:0.16, div:0,     price:132000},
  {id:'bnk', name:'국민은행지주',emo:'🏦', bg:'#eafaf3', drift:0.004, vol:0.045,div:0.004, price:56000},
  {id:'ram', name:'라면식품',    emo:'🍜', bg:'#fff6e5', drift:0.005, vol:0.06, div:0.002, price:42000},
  {id:'spc', name:'우주항공',    emo:'🚀', bg:'#efeaff', drift:0.016, vol:0.24, div:0,     price:24000},
];
const EVENTS=[
  {emo:'💥',t:'반도체 슈퍼사이클',d:'AI 수요 폭발로 김치반도체가 급등했어요.',s:'kim',pct:.26},
  {emo:'🚀',t:'우주선 발사 성공',d:'우주항공이 유인 우주선 발사에 성공했어요!',s:'spc',pct:.42},
  {emo:'📉',t:'제품 리콜 사태',d:'배터리 결함으로 토마토전자 주가가 급락했어요.',s:'tom',pct:-.22},
  {emo:'🏦',t:'기준금리 인상',d:'금리 인상으로 은행주가 강세를 보였어요.',s:'bnk',pct:.10},
  {emo:'🍜',t:'물가 상승 수혜',d:'외식비 상승으로 라면식품 매출이 뛰었어요.',s:'ram',pct:.14},
  {emo:'🛰️',t:'위성 발사 실패',d:'우주항공 위성이 궤도 진입에 실패했어요.',s:'spc',pct:-.30},
  {emo:'📊',t:'전체 시장 조정',d:'글로벌 악재로 증시가 전반적으로 하락했어요.',s:'all',pct:-.09},
  {emo:'🐂',t:'깜짝 실적 랠리',d:'기업 실적 호조로 증시가 일제히 상승했어요.',s:'all',pct:.08},
  {emo:'💰',t:'성과급 지급!',d:'회사에서 두둑한 성과급을 받았어요.',cash:'bonus'},
  {emo:'🎁',t:'세금 환급',d:'연말정산 환급금이 들어왔어요.',cash:3000000},
  {emo:'🩺',t:'갑작스런 병원비',d:'예상치 못한 치료비가 나갔어요.',cash:-2500000},
  {emo:'📱',t:'중고거래 대박',d:'안 쓰던 물건을 팔아 용돈을 벌었어요.',cash:1200000},
];
const LIFE=[
  {id:'travel', emo:'✈️', nm:'여행 가기',   ds:'번아웃 방지! 언제든 다녀올 수 있어요.',   cost:5000000,  repeat:true},
  {id:'car',    emo:'🚗', nm:'자동차 구입',  ds:'출퇴근이 편해져요. 매달 유지비 15만원.',   cost:30000000, repeat:false},
  {id:'wed',    emo:'💍', nm:'결혼하기',     ds:'맞벌이 시작! 배우자 소득 월 250만원 추가.',cost:50000000, repeat:false},
  {id:'home',   emo:'🏠', nm:'내 집 마련',   ds:'5억 아파트. 계약금 2억, 대출 3억(연4%).',  cost:200000000,repeat:false},
];

/* ---------- state ---------- */
let S;
function newGame(){
  S={
    month:0, cash:30000000, salary:3000000,
    hold:{tom:0,kim:0,bnk:0,ram:0,spc:0},
    price:{}, car:false, married:false, home:null, // home:{value,loan}
    baseExpense:1500000, prevNet:null, hist:[], tab:'stock',
  };
  STOCKS.forEach(s=>S.price[s.id]=s.price);
  S.hist=[netWorth()];
  save();
}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){S=JSON.parse(r); return true;}}catch(e){}
  return false;
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }

/* ---------- derived ---------- */
function portfolio(){ return STOCKS.reduce((a,s)=>a+S.hold[s.id]*S.price[s.id],0); }
function debt(){ return S.home?S.home.loan:0; }
function netWorth(){
  const homeEq=S.home?S.home.value-S.home.loan:0;
  return S.cash + portfolio() + homeEq;
}
function monthlyExpense(){
  let e=S.baseExpense;
  if(!S.home) e+=600000;          // 월세
  else e+=200000;                  // 관리비 (대출상환은 별도 처리)
  if(S.car) e+=150000;             // 차 유지비
  if(S.married) e+=800000;         // 생활비 증가 (배우자 소득은 income에서 +)
  return e;
}
function fireTarget(){ return monthlyExpense()*12*25; } // 4% 룰
function ageYear(){
  const y=2026+Math.floor(S.month/12), m=S.month%12+1;
  return {age:27+Math.floor(S.month/12), y, m};
}

/* ---------- rng ---------- */
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random();
  return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

/* ---------- advance a month ---------- */
function advance(){
  S.prevNet=netWorth();
  // 1. 수입
  S.cash+=S.salary;
  if(S.married) S.cash+=2500000;
  // 배당
  STOCKS.forEach(s=>{ if(s.div) S.cash+=S.hold[s.id]*S.price[s.id]*s.div; });
  // 2. 주택 대출 상환
  if(S.home && S.home.loan>0){
    const interest=S.home.loan*0.04/12;
    const principal=Math.min(S.home.loan,500000);
    S.home.loan-=principal;
    S.cash-=interest+principal;
  }
  // 3. 생활비
  S.cash-=monthlyExpense();
  // 4. 마이너스통장 이자
  if(S.cash<0) S.cash-=(-S.cash)*0.006;
  // 5. 주가 변동
  STOCKS.forEach(s=>{
    let r=s.drift+s.vol*randn();
    S.price[s.id]=Math.max(1000,Math.round(S.price[s.id]*(1+r)));
  });
  // 6. 부동산 상승
  if(S.home) S.home.value=Math.round(S.home.value*(1+0.003+0.004*randn()));
  // 7. 이벤트
  let ev=null;
  if(Math.random()<0.42){
    ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    applyEvent(ev);
  }
  // 8. 시간
  S.month++;
  S.hist.push(netWorth());
  if(S.hist.length>60) S.hist.shift();
  save();
  render();
  // 9. 결과 판정
  if(netWorth()>=fireTarget()){ showResult(true); return; }
  if(S.cash<-20000000){ showResult(false); return; }
  if(ev) showEvent(ev);
}
function applyEvent(ev){
  if(ev.s){
    if(ev.s==='all') STOCKS.forEach(s=>S.price[s.id]=Math.max(1000,Math.round(S.price[s.id]*(1+ev.pct))));
    else S.price[ev.s]=Math.max(1000,Math.round(S.price[ev.s]*(1+ev.pct)));
  }
  if(ev.cash!==undefined){
    let amt = ev.cash==='bonus' ? S.salary*Math.ceil(1+Math.random()*2) : ev.cash;
    ev._amt=amt; S.cash+=amt;
  }
}

/* ---------- render ---------- */
function render(){
  const {age,y,m}=ageYear();
  $('dateChip').textContent=`${age}세 · ${y}년 ${m}월`;
  $('ctaYr').textContent=`${y}년 ${m}월`;
  const net=netWorth();
  $('netWorth').textContent=fmtWon(net);
  // delta
  const de=$('netDelta');
  if(S.prevNet!==null){
    const d=net-S.prevNet;
    de.textContent=(d>=0?'▲ ':'▼ ')+fmtWon(Math.abs(d));
    de.className='delta '+(d>=0?'up':'down');
  } else de.textContent='';
  $('bdCash').textContent=fmtWon(S.cash);
  $('bdCash').style.color=S.cash<0?'var(--red)':'';
  $('bdStock').textContent=fmtWon(portfolio()+(S.home?S.home.value:0));
  $('bdDebt').textContent=fmtWon(debt());
  // fire
  const tgt=fireTarget(), pct=Math.max(0,Math.min(100,net/tgt*100));
  $('firePct').textContent=Math.floor(pct)+'%';
  $('fireBar').style.width=pct+'%';
  $('fireSub').textContent=`목표 순자산 ${fmtWon(tgt)} · 월 생활비 ${fmtWon(monthlyExpense())}`;
  drawSpark();
  renderStocks();
  renderLife();
}
function drawSpark(){
  const h=S.hist, svg=$('spark'); if(h.length<2){svg.innerHTML='';return;}
  const W=420,H=56,pad=4;
  const min=Math.min(...h), max=Math.max(...h), rng=(max-min)||1;
  const pts=h.map((v,i)=>{
    const x=pad+i/(h.length-1)*(W-2*pad);
    const yy=H-pad-(v-min)/rng*(H-2*pad);
    return [x,yy];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L${W-pad} ${H} L${pad} ${H} Z`;
  const up=h[h.length-1]>=h[0];
  const col=up?'#f04452':'#3182F6';
  svg.innerHTML=`
    <defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".18"/>
      <stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#sg)"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
}
function renderStocks(){
  const el=$('panelStock');
  el.innerHTML='<div class="section-title">국내 주식</div>'+STOCKS.map(s=>{
    const p=S.price[s.id], base=s.price, chg=(p-base)/base*100;
    const own=S.hold[s.id];
    const cls=chg>0.05?'up':chg<-0.05?'down':'flat';
    const arw=chg>0.05?'▲':chg<-0.05?'▼':'−';
    const ownTxt=own>0?`보유 <b>${own}주</b> · ${fmtWon(own*p)}`:'미보유';
    return `<div class="stock" data-stock="${s.id}">
      <div class="logo" style="background:${s.bg}">${s.emo}</div>
      <div class="mid"><div class="nm">${s.name}</div><div class="own">${ownTxt}</div></div>
      <div class="rt"><div class="price">${won(p)}</div>
        <div class="chg ${cls}">${arw} ${Math.abs(chg).toFixed(1)}%</div></div>
    </div>`;
  }).join('');
  el.querySelectorAll('.stock').forEach(n=>n.onclick=()=>openSheet(n.dataset.stock));
}
function renderLife(){
  const el=$('panelLife');
  let cards=LIFE.map(l=>{
    let done=false, cost=l.cost, extra='';
    if(l.id==='car') done=S.car;
    if(l.id==='wed') done=S.married;
    if(l.id==='home'){ done=!!S.home; extra=' · 계약금'; cost=200000000; }
    const affordable = l.id==='home' ? S.cash>=200000000 : S.cash>=cost;
    let btn;
    if(done && !l.repeat) btn=`<button class="mini-btn done">완료</button>`;
    else if(!affordable) btn=`<button class="mini-btn off">잔액부족</button>`;
    else btn=`<button class="mini-btn" data-life="${l.id}">${l.repeat&&done?'또 가기':'구입'}</button>`;
    return `<div class="life">
      <div class="emo">${l.emo}</div>
      <div class="mid"><div class="nm">${l.nm}</div><div class="ds">${l.ds}</div>
        <div class="cost">− ${fmtWon(cost)}${extra}</div></div>
      ${btn}</div>`;
  }).join('');
  el.innerHTML='<div class="section-title">인생 이벤트</div>'+cards;
  el.querySelectorAll('[data-life]').forEach(n=>n.onclick=()=>buyLife(n.dataset.life));
}

/* ---------- life purchases ---------- */
function buyLife(id){
  const l=LIFE.find(x=>x.id===id);
  if(id==='travel'){ S.cash-=l.cost; toast('✈️ 즐거운 여행을 다녀왔어요!'); }
  if(id==='car'){ S.cash-=l.cost; S.car=true; toast('🚗 새 차를 구입했어요!'); }
  if(id==='wed'){ S.cash-=l.cost; S.married=true; toast('💍 결혼을 축하해요! 맞벌이 시작'); }
  if(id==='home'){
    if(S.cash<200000000){ toast('계약금 2억이 부족해요'); return; }
    S.cash-=200000000; S.home={value:500000000, loan:300000000};
    toast('🏠 내 집 마련 성공! 대출 3억');
  }
  save(); render();
}

/* ---------- trade sheet ---------- */
let sheetStock=null, qty=0;
function openSheet(id){
  sheetStock=STOCKS.find(s=>s.id===id); qty=0;
  $('shLogo').textContent=sheetStock.emo; $('shLogo').style.background=sheetStock.bg;
  $('shName').textContent=sheetStock.name;
  $('shPx').textContent=won(S.price[id])+' / 주 · 보유 '+S.hold[id]+'주';
  updateSheet();
  $('scrim').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('scrim').classList.remove('on'); $('sheet').classList.remove('on'); }
function updateSheet(){
  const p=S.price[sheetStock.id];
  $('qNum').textContent=qty;
  const total=qty*p;
  $('shTotal').textContent=won(total);
  $('shBal').textContent=fmtWon(S.cash-total);
  const canBuy=qty>0 && total<=S.cash;
  const canSell=qty>0 && qty<=S.hold[sheetStock.id];
  $('doBuy').disabled=!canBuy; $('doSell').disabled=!canSell;
}
function setQty(n){ qty=Math.max(0,n); updateSheet(); }
$('qPlus').onclick=()=>setQty(qty+1);
$('qMinus').onclick=()=>setQty(qty-1);
document.querySelectorAll('.quicks button').forEach(b=>b.onclick=()=>{
  if(b.dataset.q==='max'){ setQty(Math.floor(S.cash/S.price[sheetStock.id])); }
  else setQty(qty+parseInt(b.dataset.q));
});
$('doBuy').onclick=()=>{
  const p=S.price[sheetStock.id], total=qty*p;
  if(total>S.cash||qty<=0) return;
  S.cash-=total; S.hold[sheetStock.id]+=qty;
  toast(`${sheetStock.name} ${qty}주 매수`); closeSheet(); save(); render();
};
$('doSell').onclick=()=>{
  if(qty<=0||qty>S.hold[sheetStock.id]) return;
  const p=S.price[sheetStock.id];
  S.cash+=qty*p; S.hold[sheetStock.id]-=qty;
  toast(`${sheetStock.name} ${qty}주 매도`); closeSheet(); save(); render();
};
$('scrim').onclick=closeSheet;

/* ---------- event / result modal ---------- */
function showEvent(ev){
  let impact='';
  if(ev.s){
    const dir=ev.pct>0?'up':'down';
    impact=`<div class="impact ${dir}">${ev.s==='all'?'전체 시장':STOCKS.find(x=>x.id===ev.s).name} ${ev.pct>0?'+':''}${(ev.pct*100).toFixed(0)}%</div>`;
  }else if(ev._amt!==undefined){
    const dir=ev._amt>0?'up':'down';
    impact=`<div class="impact ${dir}">${ev._amt>0?'+':'-'}${fmtWon(Math.abs(ev._amt))}</div>`;
  }
  $('modalBox').innerHTML=`<div class="emo">${ev.emo}</div>
    <div class="tt">${ev.t}</div><div class="dc">${ev.d}</div>${impact}
    <button class="ok" id="mOk">확인</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>$('modal').classList.remove('on');
}
function showResult(win){
  const {age,y}=ageYear();
  const net=netWorth();
  const box=win
    ?`<div class="emo">🔥🎉</div><div class="tt">파이어족 달성!</div>
      <div class="dc">${age}세, ${y}년에 경제적 자유를 이뤘어요.<br>이제 일하지 않아도 돼요.</div>
      <div class="stat-grid">
        <div class="s"><div class="k">최종 순자산</div><div class="v">${fmtWon(net)}</div></div>
        <div class="s"><div class="k">걸린 기간</div><div class="v">${Math.floor(S.month/12)}년 ${S.month%12}개월</div></div>
      </div>`
    :`<div class="emo">💸</div><div class="tt">파산했어요</div>
      <div class="dc">마이너스 통장 한도를 초과했어요.<br>다음엔 현금을 조금 남겨두세요!</div>`;
  $('modalBox').innerHTML=box+`<button class="ok" id="mOk">다시 시작</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{ $('modal').classList.remove('on'); newGame(); render(); };
}

/* ---------- toast ---------- */
let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),1600);
}

/* ---------- tabs & buttons ---------- */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  S.tab=t.dataset.tab; save();
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===S.tab));
  $('panelStock').classList.toggle('hide',S.tab!=='stock');
  $('panelLife').classList.toggle('hide',S.tab!=='life');
});
$('nextBtn').onclick=advance;
$('resetBtn').onclick=()=>{
  $('modalBox').innerHTML=`<div class="emo">↺</div><div class="tt">새 게임을 시작할까요?</div>
    <div class="dc">지금까지의 진행 상황이 모두 사라져요.</div>
    <button class="ok" id="mYes">새로 시작</button>
    <button class="ok ghost" id="mNo">취소</button>`;
  $('modal').classList.add('on');
  $('mYes').onclick=()=>{$('modal').classList.remove('on'); newGame(); render();};
  $('mNo').onclick=()=>$('modal').classList.remove('on');
};

/* ---------- boot ---------- */
if(!load()) newGame();
// restore tab
document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===(S.tab||'stock')));
$('panelStock').classList.toggle('hide',(S.tab||'stock')!=='stock');
$('panelLife').classList.toggle('hide',(S.tab||'stock')!=='life');
render();
</script>
</body>
