}

/* 최대 배율은 빚과 무관한 별도 축이다. 빚 3배로 시작하니 최대도 3배(leverageLv=2)에서
   출발하고, 레벨 보상으로만 올라간다(Lv.6 → 5배, Lv.8 → 10배).
   최소 배율(빚)과 최대 배율을 한 값에 섞으면 빚을 갚을 때 최대까지 같이 내려간다. */
function leverageMultOf(){return LEVERAGE_MULTS[Math.min(LEVERAGE_MULTS.length-1,S.upg.leverageLv||0)];}
const START_LEVERAGE_LV=2;   // = 3배. 빚 3배로 시작하므로 최대도 3배부터.

/* meta (설정 + 판이 끝나도 남는 경험치)
   pendingSettle에는 정산 내역을 통째로 넣어둔다. 정산 화면을 띄운 채로 앱을 닫아도
   다시 켰을 때 같은 내역을 보여줘야 하는데, boolean만으로는 복원할 수가 없다. */
let META;
function loadMeta(){
  try{const r=localStorage.getItem(META_KEY);
    if(r){META=JSON.parse(r);
      if(typeof META.xp!=='number')META.xp=0;
      if(typeof META.cleared!=='number')META.cleared=0;
      if(!META.dex||typeof META.dex!=='object')META.dex={};
      if(typeof META.introV!=='number')META.introV=0;
      /* 회차 — 재신청한 횟수다. 「재신청은 언제든 가능합니다」가 코드 주석에
         「반복되는 실패가 서사를 완성하는 유일한 장치」라고 적혀 있었는데,
         정작 게임이 그 재신청을 세지 않고 있었다. */
      if(typeof META.apply!=='number')META.apply=1;
      /* 권한이 XP 자동 해금에서 「승진 때 고른 것」으로 바뀌었다. 이미 XP로 열어
         쓰던 계정은 **원래 순서대로 받은 것**으로 옮긴다 — 갑자기 권한이 사라지면
         안 된다. 그 뒤의 승진부터 고르게 된다. */
      if(!Array.isArray(META.granted))grantByXp();
      return;}
    /* v4까지의 레거시 포인트는 1pt = 1XP로 옮겨준다. 트리는 사라졌지만
       그때까지 쌓은 판들을 없던 일로 만들 이유는 없다. */
    const old=localStorage.getItem('moneyroad2_meta_v4');
    if(old){const o=JSON.parse(old)||{};
      META={mute:!!o.mute, xp:Math.max(0,o.legacyPoints|0), cleared:0, dex:{}, pendingSettle:null, introV:0, apply:1, granted:[]};
      saveMeta(); return;}
  }catch(e){}
  META={mute:false, xp:0, cleared:0, dex:{}, pendingSettle:null, introV:0, apply:1, granted:[]};
}
function saveMeta(){if(WIPING)return;try{localStorage.setItem(META_KEY,JSON.stringify(META));}catch(e){}}

/* run state */
let S=null;
/* 그날 밤에 태운 금액. 화면 문구에만 쓰고 밸런스 계산에는 안 들어간다 —
   5차(10억)를 넘길 즈음 갚을 수 있는 크기로 잡았다. */
const DEBT0=482000000;
/* 엔딩에서 내가 발송하는 통지의 금액. 내 것보다 작다 — 그 사람은 나보다
   조금 덜 태웠고, 그래도 똑같이 여기로 온다. */
const DEBT_NEXT=314000000;
let START_CASH=100000;   // 시드머니는 늘 여기서 시작한다(레거시 "시드머니" 강화 삭제)
const START_CASH_BASE=START_CASH;   /* 🛠 테스트 도구가 민다 */
function newState(tier){
  const now=Date.now();
  const minLev=minLevOf();
  const s={cash:START_CASH, level:1, peakCash:START_CASH,
    themeUnlocked:false,
    upg:{leverageLv:START_LEVERAGE_LV, stoplossLv:0, infoLv:0, surge:false},
    selectedStock:'stable', betAmount:Math.min(START_CASH,MIN_BET*5), betDir:1, betLeverage:minLev,
    activeRound:null, pending:null, lastResult:null, mainTab:'trade', lastTick:now,
    streak:0, buffs:[], today:null, stripOpen:false,
    gate:0, dayCount:0, earlyXp:0,
    tier:Math.min(TIERS.length-1,Math.max(0,tier|0))};
  S=s;
  s.daysLeft=gateDaysOf(0);   // tier가 정해진 뒤라야 기한을 계산할 수 있다
  ensureToday();
  return s;
}
/* WIPING이 서면 저장이 멎는다. location.reload()는 pagehide를 발생시키고 거기
   saveRun이 걸려 있어서, 잠그지 않으면 방금 지운 판이 리로드 직전에 다시 쓰인다.
   3초 주기 자동 저장도 같은 틈에 끼어든다. */
let WIPING=false;
function saveRun(){if(WIPING)return;try{localStorage.setItem(RUN_KEY,JSON.stringify(S));}catch(e){}}
function clearRun(){try{localStorage.removeItem(RUN_KEY);}catch(e){}}
function bumpPeak(){if(S.cash>S.peakCash)S.peakCash=S.cash;}

/* 라운드 손익에 손절 보험을 적용 — 손실일 때만 일부를 되돌려준다 */
function applyStoploss(profit){
  if(profit>=0)return profit;
  const pct=STOPLOSS_PCT[S.upg.stoplossLv||0];
  if(!pct)return profit;
  return profit+Math.abs(profit)*pct;
}

/* 저장된 시점 이후 흐른 시간을 catch-up: 자리를 비운 사이 돈이 불어나 있거나
   사라져 있는 건 이상하니(지켜보지 않은 결과로 보상/손실을 주지 않는다), 떠나있는
   동안 라운드가 15초를 넘겨버렸으면 손익 없이 베팅한 금액만 그대로 돌려준다. */
function catchUp(){
  const now=Date.now();
  const awaySec=(now-S.lastTick)/1000;
  let roundRefunded=null;
  if(S.activeRound){
    const idx=currentTickIdx();
    if(idx>=S.activeRound.path.length-1){
      S.cash+=S.activeRound.bet;
      roundRefunded={bet:S.activeRound.bet};
      S.activeRound=null;
      S.lastResult=null;
      rollPending(); // 이미 흘러가버린 라운드의 신호는 버리고 새로 뽑는다
    }
  }
  S.lastTick=now;
  return {awaySec,roundRefunded};
}

function loadRun(){
  try{const r=localStorage.getItem(RUN_KEY);if(r){S=JSON.parse(r);
    if(!S.upg)S.upg={leverageLv:START_LEVERAGE_LV,stoplossLv:0,infoLv:0,surge:false};
    if(typeof S.earlyXp!=='number')S.earlyXp=0;
    if(typeof S.upg.leverageLv!=='number')S.upg.leverageLv=0;
    if(typeof S.upg.infoLv!=='number')S.upg.infoLv=0;
    if(typeof S.betLeverage!=='number')S.betLeverage=minLevOf();
    if(typeof S.streak!=='number')S.streak=0;
    if(!Array.isArray(S.buffs))S.buffs=[];
    if(S.betDir!==-1)S.betDir=1;
    if(typeof S.tier!=='number')S.tier=0;
    if(typeof S.gate!=='number'){S.gate=0;S.daysLeft=gateDaysOf(0);S.dayCount=0;}
    ensureToday();
    return true;}
  }catch(e){}
  return false;
}
function startRunAt(tier){ clearRun(); S=newState(tier); applyTierWeights(); saveRun(); }
function startRun(){ startRunAt(0); }

/* ===== 난이도 선택 화면 =====
   정산이 끝나고 새 판에 들어가기 직전에만 뜬다. 판이 시작되면 다시 볼 일이 없다.
   잠긴 단계도 목록에 남겨서 "무엇이 기다리는지"는 보이게 하고, 디메리트는 접지 않는다 —
   고르기 전에 무엇을 짊어지는지 알아야 선택이다. */
let tierPick=0;
/* 도감은 신호 카드에서 연다 — "이 신호가 무슨 뜻이지?" 하는 바로 그 자리다.
   메인 탭을 넷으로 늘리지 않는다. */
function showDexModal(){
  const st=TRADE_STOCKS.find(x=>x.id===S.selectedStock)||TRADE_STOCKS[0];
  const rows=tier=>{
    const pool=PATTERNS.filter(p=>PATTERN_TIER[p.id]===tier);
    const w=st.patW||null;
    const ws=pool.map(p=>p.weight*((w&&w[p.id]!==undefined)?w[p.id]:1));
    const tot=ws.reduce((a,x)=>a+x,0)||1;
    const col=tier==='strong'?'#f04452':tier==='weak'?'#3182F6':'#8b95a1';
    return pool.map((p,i)=>{
      const pct=Math.round(ws[i]/tot*100);
      const d=dexOf(p.id), seen=d.n>0;
      const avgHi=seen?(d.hi/d.n).toFixed(2):null, avgLo=seen?(d.lo/d.n).toFixed(2):null;
      return `<div class="dex ${seen?'':'unseen'}${pct===0?' none':''}">
        <div class="dex-top"><span class="dex-nm">${p.name}</span>
          <span class="dex-pct">${pct}%</span></div>
        <svg width="100%" height="22" viewBox="0 0 72 24" preserveAspectRatio="none" aria-hidden="true">
          <path d="${p.spark}" fill="none" stroke="${seen?col:'#d3d8de'}" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div class="dex-st">${seen?t('dexSeen',{n:d.n,lo:avgLo,hi:avgHi}):t('dexUnseen')}</div>
      </div>`;
    }).join('');
  };
  const sec=tier=>{
    const g=SIGNAL_INFO[tier];
    return `<div class="dex-sec"><div class="dex-head ${tier}">${g.emo} ${g.name}
      <small>${g.ds}</small></div><div class="dex-grid">${rows(tier)}</div></div>`;
  };
  $('modalBox').innerHTML=`
    <div class="cm-head"><span class="cm-title">${t('dexTitle')}</span>
      <span class="rs-badge cold">${t('dexCount',{n:dexSeen(),m:PATTERNS.length})}</span></div>
    <div class="dex-note">${t('dexNote',{e:st.emo,n:st.name})}</div>
    <div class="scroller">${SIGNAL_TIERS.map(sec).join('')}</div>
    <button class="ok" id="mOk">${t('btnClose')}</button>`;
  openModal();
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');};
}
/* 대화상자 하나가 두 얼굴로 뜬다 — 회색 창(회사가 띄우는 안내)과 종이(회사가
   내미는 서류). .dlg에 클래스가 남으면 다음 대화상자가 그 얼굴을 물려받으므로
   열 때마다 정해 준다. */
function openModal(kind){
  const d=document.querySelector('.modal .dlg');
  if(d)d.classList.toggle('doc',kind==='doc');
  $('modal').classList.add('on');
}
function showTierModal(){ tierPick=maxTierIdx(); renderTierModal(); openModal(); }
function renderTierModal(){
  const maxI=maxTierIdx();
  /* TIERS.map의 인자 이름을 ti로 바꿨다 — t는 번역 함수라 가리면 안 된다 */
  $('modalBox').innerHTML=`<div class="emo">${ic('lever',3)}</div><div class="tt">${t('tmTitle')}</div>
    <div class="dc">${t('tmDesc')}</div>
    <div class="tier-list">${TIERS.map((ti,i)=>{
      if(i>maxI)return `<div class="diff-card lock">
        <div class="diff-top"><span class="diff-nm">${ic('stampOff')} ${t('tmCard',{i:i+1,n:ti.n})}</span></div>
        <div class="diff-de">${t('tmLockDe',{n:i})}</div></div>`;
      const cleared=(META.cleared||0)>i;
      return `<button class="diff-card ${i===tierPick?'sel':''}" data-tier="${i}">
        <div class="diff-top"><span class="diff-nm">${t('tmCard',{i:i+1,n:ti.n})}</span>
          ${cleared?`<span class="diff-clear">${t('tmCleared')}</span>`:''}
          <span class="diff-xp">XP ×${ti.xp.toFixed(1)}</span></div>
        <div class="diff-de${ti.de.length?'':' none'}">${ti.de.length?ti.de.join(' · '):t('tmNoDe')}</div>
      </button>`;
    }).join('')}</div>
    <button class="ok" id="mOk">${t('tmStart',{n:tierPick+1})}</button>`;
  $('modalBox').querySelectorAll('.diff-card[data-tier]').forEach(b=>b.onclick=()=>{
    sfx.tap(); tierPick=+b.dataset.tier; renderTierModal(); });
  $('mOk').onclick=()=>{ sfx.tap(); $('modal').classList.remove('on');
    startRunAt(tierPick); render(); };
}

/* boot */
loadMeta();
/* 아이콘이 상태를 말한다 — 부팅과 토글이 같은 한 줄을 쓴다 */
function paintMute(){ $('muteBtn').innerHTML=META.mute?ic('mute',1):ic('sound',1); }
paintMute();
$('setBtn').innerHTML=ic('gear',1);
let awayReport=null;
if(loadRun()){ awayReport=catchUp(); } else { startRun(); }
applyTierWeights();   // 이어하는 판이든 새 판이든, 그 판의 단계로 패턴 비율을 맞춘다
saveRun();

/* ===== 상점(유료 · 투자성) ===== */
/* 상점은 "단타를 더 잘하게" 돕는 것만 판다. 배당주(자동 수입)는 삭제했다 —
   단타를 대체하지 않도록 일부러 미미하게 만든 항목이라, 존재감이 없는 게 설계대로 작동한 결과였다.
   그러면 있을 이유가 없다. 레버리지도 팔지 않는다(빚/레벨 보상으로만 움직인다). */

/* ===== 해금 탭 = 레벨 보상 로드맵 전체 (무료로 열리는 건 전부 여기 모아둔다) ===== */
/* 정산 화면은 탭에 깔지 않는다. 파산하거나 은퇴한 "직후"에만 여는 화면이다 —
   죽고 나서 강해지고 다시 들어가는 게 로그라이크의 리듬이고, 평소 화면도 깨끗해진다.
   예전 레거시 화면과 달리 고르거나 살 것이 없다. 경험치가 차면 그냥 열린다. */
/* ===== 승진 통지 =====
   선형 줄거리는 여기가 진다 — 회차와 무관하게 일곱 장면이 순서대로 한 번씩만 나온다.
   승진하는 것은 사람이고 회수되는 것은 계좌라서, 회차가 아무리 쌓여도 이 일곱은
   앞으로만 간다. 장면 아래에 권한 후보가 붙고, 고르는 것이 곧 분기다.

   버튼은 「승 인」이 아니라 「요 청」이다 — 카드 문구가 이미 요청이라
   (「버틸 수 있게 해 주십시오」) 승인까지 내가 하면 내가 나를 승인하는 꼴이 된다.
   승인하는 쪽은 회사다. */
let promoPick=null;
function showPromoModal(after){
  const n=promoCount()+1;                   /* 몇 번째 승진인가 = 장면 번호 */
  const cands=promoCandidates();
  promoPick=cands.length?cands[0].id:null;
  const draw=()=>{
    /* 오른쪽은 짧은 효과 딱지다 — 설명(ds)을 그대로 넣었더니 두 줄로 깨져서
       이름을 밀어냈다. 자세한 설명은 **고른 카드에만** 붙인다: 찍기 직전에
       한 번 읽으면 되는 값이고, 셋에 다 붙이면 카드가 문단이 된다. */
    const cards=cands.map(u=>`<div class="pick${u.id===promoPick?' sel':''}" data-p="${u.id}">
      <div class="pk-hd"><span class="pk-n">${u.name}</span><span class="pk-e">${t('pe'+u.id)}</span></div>
      <div class="pk-d">&ldquo;${t('pw'+u.id)}&rdquo;</div>
      ${u.id===promoPick?`<div class="pk-x">${u.ds}</div>`:''}</div>`).join('');
    $('modalBox').innerHTML=`<div class="doc-head">${t('docPromo')}<small>No. ${docNo()}</small></div>
      <div class="doc-stamp">${t('stampPromo')}</div>
      <div class="rankline"><span class="rk-from">${rankName(n)}</span>
        <span class="rk-ar">&rarr;</span><span class="rk-to">${rankName(n+1)}</span></div>
      ${rmLine2([t('pr'+n+'a'),t('pr'+n+'b')],'lead')}
      ${n===2?`<div class="doc-head" style="margin-top:12px">${t('pdT')}<small>${t('pdS')}</small></div>
        ${rmLine2([t('pd1',{v:fmtMoney(DEBT0)}),t('pd2')])}
        ${deedsHTML()}
        ${rmLine2([t('pd3')])}
        <div class="foot-note">${t('pdFoot')}</div>`:''}
      ${cands.length>1?`<div class="pk-lead">${t('promoLead')}</div>`:
        `<div class="pk-lead">${t('promoLast')}</div>`}
      ${cards}
      <div class="foot-note">${t('prf'+n)}</div>
      <button class="ok stamp" id="mOk">${n>=META_UNLOCKS.length?t('stampSign'):t('stampAsk')}</button>`;
    $('modalBox').querySelectorAll('.pick').forEach(el=>el.onclick=()=>{
      sfx.tap(); promoPick=el.dataset.p; draw(); });
    $('mOk').onclick=()=>{
      sfx.tap();
      if(promoPick&&!metaHas(promoPick)){ granted().push(promoPick); saveMeta(); }
      $('modal').classList.remove('on');
      /* 한 번에 두 단계를 넘었을 수도 있다 — 남아 있으면 다음 장면으로 잇는다 */
      if(promoDue()){ showPromoModal(after); return; }
      /* 마지막 승격이었다면 그 다음이 엔딩이다 */
      if(promoCount()>=META_UNLOCKS.length&&!META.sent){
        META.sent=1; saveMeta(); showEndingModal(after); return;
      }
      after&&after();
    };
  };
  draw();
  openModal('doc');
  sfx.win();
}
/* ===== 엔딩 =====
   마지막 승격(이사 → 채권자)을 닫으면 이 한 장이 온다. 게임의 첫 화면과 같은
   양식·같은 세 조항이고, 다른 것은 수신인과 금액과 담당란뿐이다.
   「수 령」이 「발 송」이 된다 — 끝나는 것은 게임이 아니라 역할이다.
   한 번만 뜬다(META.sent). 닫으면 평소처럼 다음 판으로 간다. */
function showEndingModal(after){
  const cl=(n,tx)=>`<div class="cl"><span class="no">${t('inCl',{n})}</span><span>${tx}</span></div>`;
  $('modalBox').innerHTML=`<div class="doc-head">${t('docFund')}<small>No. 01-0001</small></div>
    <div class="doc-stamp">${t('stampAssign')}</div>
    <div class="ev-sub">${t('edTo',{n:t('edWho')})}</div>
    ${rmLine2([t('edN1'),t('edN2',{v:fmtMoney(DEBT_NEXT)}),t('edN3')],'lead')}
    ${cl(1,t('in1'))}${cl(2,t('in2'))}${cl(3,t('in3',{p:Math.round(EARLY_BONUS_RATE*100)}))}
    <div class="foot-note">${t('edFoot',{r:rankName()})}</div>
    <button class="ok stamp" id="mOk">${t('edGo')}</button>`;
  openModal('doc');
  sfx.pay();
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');after&&after();};
}
function showSettleModal(st){
  const after=META.xp||0;
  const nx=nextUnlock();
  /* 진행바는 "직전 승진 → 다음 승진" 구간을 채운다. 첫 승진 전에는 0에서 출발한다.
     예전에는 여기서 「이번에 넘어선 해금」을 같이 띄웠는데, 이제 그 발표는
     승진 통지가 한다 — 정산 화면은 XP만 세고 끝난다. */
  const n=promoCount();
  const lo=n>0?UNLOCK_NEED_BASE[n-1]:0;
  const pct=nx?Math.max(0,Math.min(100,(after-lo)/Math.max(1,nx.need-lo)*100)):100;
  const penLabel=st.penalty>0?t('sePen',{p:Math.round(st.penalty*100)}):null;
  $('modalBox').innerHTML=`<div class="emo">${ic('badge',3)}</div><div class="tt">${t('seTitle')}</div>
    <div class="xp-tbl">
      <div><span>${t('sePeak',{v:fmtMoney(st.peak)})}</span><b>+${st.base}</b></div>
      ${st.early>0?`<div><span>${t('seEarly')}</span><b>+${st.early}</b></div>`:''}
      ${st.mult&&st.mult!==1?`<div><span>${t('seTier',{e:st.tierEmo||'',n:(st.tier||0)+1,name:st.tierName||''})}</span><b>×${st.mult.toFixed(1)}</b></div>`:''}
      ${penLabel?`<div class="pen"><span>${penLabel}</span><b>−${Math.round(st.penalty*100)}%</b></div>`:''}
      <div class="sum"><span>${t('seSum')}</span><span>+${st.total} XP</span></div>
    </div>
    <div class="xp-head"><span>${rankName()} <small>${t('seCum',{v:after})}</small></span>
      <small>${nx?t('seToNext',{e:nx.emo,n:nx.name,v:Math.max(0,nx.need-after)}):t('seAllOpen')}</small></div>
    <div class="xp-bar"><i style="width:${pct}%"></i></div>
    <button class="ok" id="mOk">${t('seStart')}</button>`;
  openModal();
  /* 축하음은 승진 통지가 낸다 — 정산 화면은 XP만 센다 */
  if(promoDue())sfx.win();
  $('mOk').onclick=()=>{
    sfx.tap(); META.pendingSettle=null; saveMeta();
    /* 정산 → 승진 통지 → 난이도 → 새 계좌. 승진은 정산 뒤라야 XP가 반영돼 있다. */
    const go=()=>{
      /* 단계를 하나라도 깼으면 고를 것이 생긴다. 아직 1단계뿐이면 물어볼 이유가 없다. */
      if(maxTierIdx()>0){ showTierModal(); return; }
      $('modal').classList.remove('on');
      startRunAt(0); render();
    };
    if(promoDue()){ showPromoModal(go); return; }
    go();
  };
}

  const taken=(S.grants||[]).length;

/* ===== 체결 통지의 논평 =====
   커뮤니티 댓글이 있던 자리다. 체결 통지는 **회사가 발행한 문서**인데 거기에
   「공감 65」가 붙어 있으면 톤이 맞지 않는다 — 사내 문서에 바깥 목소리가
   섞여 있었다. 이제 리스크 관리팀이 읽는다.

   무작위로 고르지 않는다. 리스크 관리팀은 즉흥으로 말하지 않는다 —
   조건이 맞는 첫 줄을 쓴다. 같은 판에는 같은 말이 나온다.
   칭찬하지 않고 위로하지 않는다. 최대치가 「기록해 두겠습니다」다. */
/* 지하노역장은 한 번에 설명하지 않는다. 판이 끝날 때마다 한 조각씩 흘려서
   열 판쯤 하면 전모가 그려지게 한다. 무작위가 아니라 거래일에서 나오므로
   같은 판을 몇 번 읽어도 같은 말이다 — 회사는 즉흥으로 말하지 않는다. */
const PIT_N=10;
/* 단계에 맞는 말투를 고른다. 변형이 없으면 기본으로 떨어진다 —
   t()가 없는 키를 키 이름 그대로 돌려주므로 그것만 비교하면 된다. */
function rmT(k,v){ const lv=metaLv(), suf=lv>=6?'H':lv>=3?'M':'';
  if(!suf)return t(k,v);
  return t(k+suf)===k+suf ? t(k,v) : t(k+suf,v); }
function pitLine(){ return rmT('pit'+(1+Math.abs((S.dayCount||0)*7+(S.gate||0)*3)%PIT_N)); }
const RM_EVENT=[
  {id:'rmStreak', when:R=>R.streak>=5},
  {id:'rmJack',   when:R=>R.bet>0&&R.profit/R.bet>=1.0},
  {id:'rmBreak',  when:R=>R.prevStreak>=3&&R.profit<=0},
  {id:'rmLast',   when:R=>R.daysLeft<=1},
];
function rmResultLines(R){
  /* 청산은 등급을 말할 자리가 아니다 — 판단이 아니라 사고다 */
  if(R.bet>0&&R.profit<=-R.bet*0.95)return [rmT('rmLiq1'),rmT('rmLiq2')];
  const out=[R.grade?rmT('rmGr'+R.grade.g):rmT('rmFlat')];
  const ev=RM_EVENT.find(e=>{try{return e.when(R);}catch(x){return false;}});
  if(ev){ out.push(rmT(ev.id,{n:R.streak})); return out; }
  /* 아무 사건도 없는 판이면 회사는 사유를 다시 말한다 — 이 게임에서 제일 자주
     나오는 줄이므로, 그 자리가 「왜 이 돈을 이 기한에 버는가」를 붙들고 있어야 한다.
     관문이 바뀌면 이 줄도 바뀐다. */
  if(!gateDone())out.push((S.dayCount||0)%3===2?pitLine():reasonL(reasonOf()));
  return out;
}

function resultModalHTML(R){
  const up=R.profit>=0, g=R.grade;
  /* 대박·참사 배지는 커뮤니티가 떠드는 크기를 재던 값이다. 사내 문서에는
     그런 감탄이 없다 — 리스크 관리팀 줄이 그 자리를 대신한다. */
  const chips=[];
  if(g)chips.push(`<span class="rs-chip grade${g.pct<45?' low':''}">${t('rsGrade',{g:g.g,p:g.pct})}</span>`);
  /* 뉴스가 맞았는지는 판이 끝나야 안다. 사후에 알려줘야 "다음엔 얼마나 믿을까"를 배운다. */
  if(R.watered)chips.push(`<span class="rs-chip water">${t('rsWater',{v:R.entry.toFixed(2)})}</span>`);
  if(R.half)chips.push(`<span class="rs-chip split">${t('rsSplit')}</span>`);
  if((R.dir||1)<0)chips.push(`<span class="rs-chip short">${t('rsShort')}</span>`);
  if(R.lev>1)chips.push(`<span class="rs-chip lev">${t('rsLev',{n:R.lev})}</span>`);
  if(R.streak>=2)chips.push(`<span class="rs-chip streak">${t('rsStreak',{n:R.streak})}</span>`);
  (R.buffs||[]).forEach(b=>chips.push(`<span class="rs-chip">${BUFFS[b].emo} ${BUFFS[b].name}</span>`));
  const earnRow=(R.earned&&R.earned.length)?`<div class="strip-buff" style="margin-top:11px">
      <span class="e">${R.earned.map(b=>BUFFS[b].emo).join('')}</span>
      <div><div class="t">${t('rsEarn',{n:R.streak,names:R.earned.map(b=>BUFFS[b].name).join(' + ')})}</div>
        <div class="d">${t('rsEarnD')}</div></div></div>`:'';
  /* 숏도 "팔았다"로 통일한다 — 버튼이 하는 일은 어느 방향이든 "이 판을 끝낸다"다 */
  const where=R.half?t('rsSoldHalf',{a:R.half.mult.toFixed(2),b:R.mult.toFixed(2)})
                    :t('rsSold',{v:R.mult.toFixed(2)});
  const sub=g?where:t('rsNoGrade',{where:where});
  /* 같은 종이가 통지서로 돌아온다 — 주문표에 도장을 찍었더니 체결 통지가 왔다.
     머리 모양이 주문표와 같아야 「내가 낸 그 서류」로 읽힌다. */
  return `<div class="doc-head">${t('docResult')}<small>No. ${docNo()}</small></div>
    <div class="doc-stamp">${t('stampFill')}</div>
    <div class="rs-money ${up?'up':'down'}">${up?'+':''}${fmtMoney(R.profit)}</div>
    <div class="rs-sub">${sub}</div>
    <div class="rs-chips">${chips.join('')}</div>
    ${earnRow}
    ${rmLine2(rmResultLines(R))}
    <div class="rs-wallet">${t('rsWallet',{v:fmtMoney(S.cash)})}</div>
    ${closeRowHTML()}`;
}
/* 한 판이 끝나면 하루가 간다 — 그런데 팝업을 닫는 순간 D가 조용히 줄면
   처음 하는 사람은 마감이 갑자기 닥친 걸로 느낀다. 소모되는 하루만 여기서 보여준다.

   날짜·목표까지 남은 금액·판당 필요 수익률은 일부러 뺐다. 셋 다 상단 상환 스트립과
   시작 버튼 위 경고줄에 이미 같은 값이 있어서, 결과 팝업에 또 적으면 한 판 끝날 때마다
   같은 숫자를 세 번 읽히는 꼴이 된다. 위험도는 문구 대신 배경색(.p-ok/.p-warn/.p-bad)이
   전달한다 — 색은 이미 스트립·진행바와 같은 3단계라 따로 배울 것도 없다.
   endOfDay()는 이 팝업을 닫은 뒤에 돌기 때문에 여기 값은 아직 줄기 전이다. */
function closeRowHTML(){
  if(gateDone())return '';
  const g=gateOf(), before=S.daysLeft, after=before-1;
  const row=(cls,inner)=>`<div class="rs-close ${cls}"><div class="cl-top one">${inner}</div></div>`;
  if(S.peakCash>=g.goal)return row('p-done',`<span class="cl-dd"><b>${t('clRepay',{n:g.n})}</b></span>`);
  if(after<=0)return row('p-bad',`<span class="cl-dd"><b>${t('clExpired')}</b></span>`);
  return row(riskAt(S.cash,after).cls,`<span class="cl-dd">D-${before} → <b>D-${after}</b></span>`);
}
function showResultModal(R,after){
  /* 버튼 색으로 손익을 또 말하지 않는다 — 금액이 이미 빨강/파랑으로 크게 서 있고,
     98의 버튼은 언제나 회색이다. 색을 넣으면 그 순간 98이 아니게 된다. */
  $('modalBox').innerHTML=`<div class="rs-box">${resultModalHTML(R)}</div>

/* ===== 지하노역장 카운트다운 =====
   사건(차수 사유)이 아니라 끼어드는 통보다. 기한이 사흘 남으면 그때부터 하루에
   한 장씩 오고, 그 전에 채우면 한 장도 안 뜬다 — 일찍 갚은 사람은 평생 못 보는
   화면이라 「빨리 채울 이유」가 처음으로 숫자가 아니라 감정이 된다.
   무서운 건 형벌이 아니라 근무 조건이다: 열여섯 시간, 마스크 자비, 사백 년. */

/* ===== 레벨 ===== */
/* 라운드가 끝날 때마다 하루가 간다. 상환 판정을 먼저 하고 기한을 따진다 —
   마지막 날에 목표를 채우면 통과해야 하니까. */
function endOfDay(){
  if(gateDone())return false;
  S.dayCount++; S.daysLeft--;
  if(checkLevelUp())return true;              // 상환 완료(=레벨업) 모달
  if(S.daysLeft<=0){ showDefaultModal(); return true; }
  /* 사흘 · 이틀 · 마지막날에 한 장씩. 같은 날을 두 번 보여주지 않는다. */
  if(S.daysLeft<=3&&(S.pitShown||0)!==S.daysLeft){
    S.pitShown=S.daysLeft; saveRun();
    showPitModal(S.daysLeft,()=>{ if(!checkBankrupt())render(); });
    return true;
  }
  return false;
}
/* ===== 차수 배정 =====
   예전에는 차수를 넘으면 LEVELS에 적힌 보상이 **자동으로** 떨어졌다 — 일곱 번 모두
   정해져 있어서 매 런이 똑같이 흘러갔다. 이제 셋 중 하나를 고른다.

   상점(비품 신청서)도 여기로 들어온다. 「돈이 모이면 산다」는 선택이 아니었다 —
   두 개뿐이고 사실상 자동이었다. 「무엇을 포기할 것인가」로 바꾼다.

   ⚠️ **한 축의 최대치는 예전 도달 가능치를 안 넘긴다.** 레버리지는 예전에도 두 번
   올랐고 정보력·손절 보험은 상점에서 끝까지 살 수 있었다. 카드로 옮기면서 그 천장을
   그대로 두면(cap) 이미 실측해 둔 밸런스 봉투 안에 머문다 — 바뀌는 것은 「무엇을
   몇 번째로 받는가」뿐이다. 종목 접근을 안 고르면 그 계좌는 더 어려워지는데,
   그건 선택의 값이지 밸런스 구멍이 아니다. */
const GRANTS=[
  {id:'cash',  cap:3, ok:()=>true,
   f:()=>{ const v=Math.max(200000,Math.round(gateOf().goal*0.10)); S.cash+=v; bumpPeak(); },
   amt:()=>fmtMoney(Math.max(200000,Math.round(gateOf().goal*0.10)))},
  {id:'theme', cap:1, ok:()=>!S.themeUnlocked, f:()=>{S.themeUnlocked=true;}},
  {id:'surge', cap:1, ok:()=>!S.upg.surge,     f:()=>{S.upg.surge=true;}},
  {id:'lev',   cap:2, ok:()=>(S.upg.leverageLv||0)<LEVERAGE_MULTS.length-1,
   f:()=>{S.upg.leverageLv=Math.min(LEVERAGE_MULTS.length-1,(S.upg.leverageLv||0)+1);},
   amt:()=>t('gvLevTo',{v:LEVERAGE_MULTS[Math.min(LEVERAGE_MULTS.length-1,(S.upg.leverageLv||0)+1)]})},
  {id:'info',  cap:3, ok:()=>(S.upg.infoLv||0)<INFO_ACC.length-1,
   f:()=>{S.upg.infoLv=Math.min(INFO_ACC.length-1,(S.upg.infoLv||0)+1);},
   amt:()=>t('gvInfoTo',{a:Math.round(INFO_ACC[S.upg.infoLv||0]*100),
                         b:Math.round(INFO_ACC[Math.min(INFO_ACC.length-1,(S.upg.infoLv||0)+1)]*100)})},
  {id:'stop',  cap:3, ok:()=>(S.upg.stoplossLv||0)<STOPLOSS_PCT.length-1,
   f:()=>{S.upg.stoplossLv=Math.min(STOPLOSS_PCT.length-1,(S.upg.stoplossLv||0)+1);},
   amt:()=>t('gvStopTo',{p:Math.round(STOPLOSS_PCT[Math.min(STOPLOSS_PCT.length-1,(S.upg.stoplossLv||0)+1)]*100)})},
];
function grantTaken(id){ return ((S.grants||[]).filter(x=>x===id)).length; }
/* ── 사건이 3택을 쓴다 ──
   예전에는 (S.gate)%pool로 돌렸다. 같은 3차면 사유가 무엇이든 같은 셋이 나왔고,
   카드에 적힌 것은 「운용 한도」 같은 기능 이름이라 **왜 그걸 고르는지**가 없었다.
   이제 사유가 자기 3택을 들고 온다 — 감독 조사면 기록을 보거나 지우거나 크게 지른다.

   ⚠️ 효과도 cap도 한 줄 안 건드린다. 바뀌는 것은 「무엇을 몇 번째로 받는가」뿐이라
   실측해 둔 밸런스 봉투 안에 그대로 머문다(2935행 주석과 같은 이유다). */
const REASON_ACTS={
  /* 1~2단계 */
  quarter  :[['info',1], ['stop',2], ['cash',3]],
  audit    :[['info',1], ['stop',2], ['lev',3]],
  deficit  :[['cash',1], ['theme',2], ['stop',3]],
  payout   :[['cash',1], ['stop',2], ['info',3]],
  limit    :[['cash',1], ['lev',2], ['info',3]],
  desk     :[['info',1], ['stop',2], ['cash',3]],
  rival    :[['cash',1], ['info',2], ['surge',3]],
  carry    :[['cash',1], ['theme',2], ['stop',3]],
  listing  :[['info',1], ['cash',2], ['stop',3]],
  vacancy  :[['stop',1], ['cash',2], ['lev',3]],
  /* 3~5단계 */
  mdelay   :[['cash',1], ['stop',2], ['lev',3]],
  mnominee :[['cash',1], ['info',2], ['stop',3]],
  mrookie  :[['info',1], ['cash',2], ['lev',3]],
  mprev    :[['cash',1], ['theme',2], ['stop',3]],
  mbranch  :[['lev',1], ['cash',2], ['info',3]],
  minside  :[['cash',1], ['info',2], ['stop',3]],
  mquota   :[['lev',1], ['cash',2], ['stop',3]],
  mcover   :[['cash',1], ['info',2], ['lev',3]],
  mskim    :[['cash',1], ['stop',2], ['surge',3]],
  mlist    :[['stop',1], ['cash',2], ['lev',3]],
  /* 6~8단계 */
  hsource  :[['info',1], ['cash',2], ['stop',3]],
  hshare   :[['cash',1], ['stop',2], ['lev',3]],
  hreg     :[['stop',1], ['cash',2], ['info',3]],
  hwhistle :[['cash',1], ['info',2], ['stop',3]],
  hreaudit :[['stop',1], ['cash',2], ['lev',3]],
  hheir    :[['info',1], ['cash',2], ['stop',3]],
  hbook    :[['info',1], ['stop',2], ['cash',3]],
  hpol     :[['cash',1], ['surge',2], ['stop',3]],
  hmerge   :[['stop',1], ['cash',2], ['lev',3]],
  hname    :[['cash',1], ['stop',2], ['info',3]],
};
function grantCandidates(){
  const r=reasonOf(), acts=REASON_ACTS[r]||[];
  const can=g=>g&&g.ok()&&grantTaken(g.id)<g.cap;
  const out=[], seen=new Set();
  for(const [id,n] of acts){
    const g=GRANTS.find(x=>x.id===id);
    if(can(g)&&!seen.has(id)){ out.push({id, act:'ac'+r+n}); seen.add(id); }
  }
  /* 천장에 닿은 축이 있으면 남은 것으로 채운다 — 회전은 차수에서 나오므로
     같은 판에서는 늘 같은 셋이고, 그때는 예전처럼 기능 이름을 쓴다. */
  const pool=GRANTS.filter(g=>can(g)&&!seen.has(g.id));
  for(let i=0;out.length<3&&i<pool.length;i++){
    const g=pool[((S.gate||0)+i)%pool.length];
    if(seen.has(g.id))continue;
    out.push({id:g.id, act:null}); seen.add(g.id);
  }
  return out;
}
/* 하신 일은 저희가 보관합니다 — 고른 행동이 증거와 함께 기록에 쌓인다.
   이 목록이 곧 목줄이라, 빚을 다 갚아도 안 지워진다. */
function deedEv(d){ return d.act?t('ax'+d.act.slice(2)):t('ev'+d.id); }
function addDeed(id,act){
  (S.deeds||(S.deeds=[])).push({no:docNo(), id, act:act||null});
}
function checkLevelUp(){
  if(gateDone())return false;
  const g=gateOf();
  if(S.peakCash<g.goal)return false;
  const nl=LEVELS.find(l=>l.lv===S.level+1);
  S.gate++; S.level=nl?nl.lv:S.level+1;
  /* 완제하면 그 단계를 깬 것으로 치고 다음 난이도가 열린다. 파산으로는 안 열린다. */
  if(gateDone()&&(META.cleared||0)<tierIdx()+1){ META.cleared=tierIdx()+1; saveMeta(); }
  /* 기한보다 며칠 일찍 갚았나 → 그만큼 현금으로 받는다. 거래일은 이월되지 않고,
     다음 관문은 언제나 GATES에 적힌 일수로 새로 시작한다. */
  const early=Math.max(0,S.daysLeft);
  const bonus=Math.round(g.goal*EARLY_BONUS_RATE*early);
  if(bonus>0){ S.cash+=bonus; bumpPeak(); }
  S.earlyXp=(S.earlyXp||0)+early*EARLY_XP_PER_DAY;   // 판이 끝날 때 정산에 더해진다
  if(!gateDone())S.daysLeft=gateDaysOf(S.gate);
  /* 카운트다운을 본 판인지 먼저 집어 두고 센 것을 지운다 — 순서를 바꾸면
     명단 정정이 영영 안 뜬다(실제로 그랬다). */
  const sawPit=!!S.pitShown; S.pitShown=0;
  /* LEVELS의 고정 보상은 더 이상 자동으로 안 떨어진다 — 차수 통과 화면에서 고른다 */
  saveRun(); render();
  /* 카운트다운을 이미 본 판이면 먼저 명단에서 지워 준다 */
  if(sawPit&&!gateDone()) showPitClearModal(()=>showRepayModal(g,early,bonus));
  else showRepayModal(g,early,bonus);
  return true;
}
/* 완제(마지막 관문 통과)는 그 판의 끝이다. 예전에는 "계속 플레이" 버튼이 팝업만 닫아서,
   더 넘을 관문도 받을 보상도 없는 판에 그대로 방치됐다(정산하려면 해금 탭에 들어가
   은퇴를 따로 눌러야 했다). 이제 버튼 하나로 100% 정산하고 레거시 화면으로 넘어간다
   — 은퇴와 같은 대우다. 기한 안에 다 갚은 사람을 은퇴보다 불리하게 둘 이유가 없다. */

/* 리스크 관리팀 한 줄. 차수가 오를수록 말이 짧아지고 덜 친절해진다. */
function rmLine(key){ return rmLine2([t(key)]); }
/* 계좌 회수 서류의 리스크 관리팀 줄. 첫 줄은 회차와 무관하게 늘 같다 —
   그 한 줄이 열 번째에 다르게 읽히는 것이 이 게임의 서사 장치다. */
function rmBackLines(){
  const n=META.apply||1;
  if(n>=10)return [rmT('rmBack'),t('rmApplyLong',{n})];
  if(n>=5) return [rmT('rmBack'),t('rmApply',{n})];
  return [rmT('rmBack')];
}
function rmLine2(lines,cls){
  return `<div class="rm ${cls||''}"><div class="who">${t('rmWho')}</div>
    <div class="msg">${lines.map(l=>'&gt; '+l).join('<br>')}</div></div>`;
}
/* 차수 통과 — 이제 서류다. 통과 도장이 찍히고, 다음 차수의 사유가 통보되고,
   이 계좌에 배정할 것 하나를 고른다. 완제(마지막 차수)에는 고를 것이 없다. */
let grantPick=null;
function showRepayModal(g,early,bonus){
  const done=gateDone();
  const next=done?null:GATES[S.gate];
  const st=done?settleOf(0):null;
  const cands=done?[]:grantCandidates();
  grantPick=cands.length?cands[0].id:null;
  /* 서류 한 장에 두 상태가 산다. 고를 때는 행동 이름만 적히고, 도장을 찍으면
     같은 종이에 「승인」이 겹쳐 찍히면서 그제서야 무엇을 받았는지 통보된다 —
     권리를 고르는 화면이 아니라 요청을 올리고 회사가 승인하는 절차로 읽힌다. */
  let okd=false, relieved=false;
  const label=c=>c.act?t(c.act):t('gn'+c.id);
  /* 고른 행동이 이번 차수의 조임을 푸는 것인가 — 행동 번호로 가린다 */
  const isRelief=c=>{ const m=evModOf(S.gate); if(!m||!c||!c.act)return false;
    return +c.act.slice(-1)===EV_RELIEF[reasonOf(S.gate)]; };
  const draw=()=>{
    const pickObj=cands.find(c=>c.id===grantPick);
    const gr=GRANTS.find(x=>x.id===grantPick);
    const cards=okd
      ? (pickObj?`<div class="pick act sel"><div class="pk-hd">
          <span class="pk-n">${label(pickObj)}</span></div>
          <div class="pk-x">${t('apGot',{n:t('gn'+pickObj.id),
            v:gr&&gr.amt?gr.amt():t('ge'+pickObj.id)})}<br>${
            t('apKeep',{e:deedEv({id:pickObj.id,act:pickObj.act})})}${
            relieved?'<br>'+t('mdOff'):''}</div></div>`:'')
      : cands.map(c=>`<div class="pick act${c.id===grantPick?' sel':''}" data-g="${c.id}">
          <div class="pk-hd"><span class="pk-n">${label(c)}</span></div></div>`).join('');
    $('modalBox').innerHTML=`<div class="doc-head">${done?t('docDone'):t('docGate')}<small>No. ${docNo()}</small></div>
      <div class="doc-stamp">${done?t('stampDone'):(okd?t('stampOk'):t('stampPass'))}</div>
      ${done?`<div class="dc">${t('rpDoneDesc')}</div>`:
        `<div class="rankline"><span class="rk-from">${g.n}</span>
          <span class="rk-ar">&rarr;</span><span class="rk-to">${next.n}</span></div>`}
      ${bonus>0?`<div class="lv-gain early"><b>${t('rpEarly',{n:early})}</b>
        — <b>${fmtMoney(bonus)}</b> · ${t('kXp')} <b>+${early*EARLY_XP_PER_DAY}</b></div>`:''}
      ${next?`<div class="ev-band">${reasonN(reasonOf(S.gate))}<span>${next.n}</span></div>
        ${rmLine2(okd?[t('apLead'),t('rm'+Math.min(6,S.gate))]
                     :[reasonD(reasonOf(S.gate)),t('rm'+Math.min(6,S.gate))],'lead')}
        ${evModText(S.gate)?`<div class="limit-band">${evModText(S.gate)}</div>`:''}
        <div class="stat-grid">
        <div class="s"><div class="k">${t('kNextGoal',{n:next.n})}</div><div class="v">${fmtMoney(gateOf().goal)}</div></div>
        <div class="s"><div class="k">${t('kDeadline')}</div><div class="v">${t('vDays',{n:S.daysLeft})}</div></div></div>`:''}
      ${done?`<div class="stat-grid">
        <div class="s"><div class="k">${t('kRunPeak')}</div><div class="v">${fmtMoney(S.peakCash)}</div></div>
        <div class="s"><div class="k">${t('kXp')}</div><div class="v" style="color:var(--gold)">+${st.total} XP</div></div></div>
        ${rmLine('rmFinal')}`:''}
      ${cards?`${cards}<div class="foot-note">${okd?t('grantFoot'):t('actFoot')}</div>`:''}
      <button class="ok stamp" id="mOk">${done?t('rpSettle'):(okd?t('btnOk'):t('stampDo'))}</button>`;
    if(!okd)$('modalBox').querySelectorAll('.pick').forEach(el=>el.onclick=()=>{
      sfx.tap(); grantPick=el.dataset.g; draw(); });
    $('mOk').onclick=done
      ? ()=>{sfx.tap();finishRun(st);}
      : (okd
        ? ()=>{ sfx.tap(); $('modal').classList.remove('on'); saveRun(); render(); checkLevelUp(); }
        : ()=>{
            sfx.tap();
            const c=GRANTS.find(x=>x.id===grantPick);
            if(c){ c.f(); (S.grants||(S.grants=[])).push(c.id);
                   addDeed(c.id, pickObj?pickObj.act:null); }
            if(isRelief(pickObj)){
              const m=evModOf(S.gate);
              (S.relief||(S.relief={}))[S.gate]=1;
              if(m.k==='d')S.daysLeft++;                 // 깎였던 하루를 돌려준다
              relieved=true;
            }
            okd=true; saveRun(); render(); draw(); sfx.pay();
          });
  };
  draw();
  openModal('doc');
  sfx.win();
}
/* 기한 내 미상환 — 반대매매로 런 종료 */

     실패가 특별한 사건이 아니라 절차로 읽혀야 한다. 경고 아이콘을 뺀 이유다. */

/* 기한 연장 — 실제로도 만기 연장은 있다. 대신 자산을 낸다. */
function extendDeadline(){
  if(gateDone())return;
  const cost=Math.floor(S.cash*EXTEND_COST_FRAC);
  if(cost<=0||S.cash-cost<MIN_BET)return;
  S.cash-=cost; S.daysLeft+=EXTEND_DAYS;
  sfx.buy(); toast(t('exToast',{n:EXTEND_DAYS,v:fmtMoney(cost)}));
  saveRun(); render();
}
/* 98의 진행바는 이어진 막대가 아니라 칸으로 끊어 찬다. 칸 수를 고정해 두면
   "몇 칸 남았나"를 세게 되고, 그게 마감이 다가온다는 걸 숫자보다 먼저 알려준다. */
const BAR_CELLS=13;
function blocks(done,total,cls){
  let s='';
  for(let i=0;i<total;i++)s+='<i'+(i<done?'':' class="e"')+'></i>';
  return `<div class="lv-bar ${cls||''}">${s}</div>`;
}
function renderLevel(){
  /* 칩은 직급이다 — 차수(S.level)는 ACCOUNT 패널이 「1차」로 이미 말한다.
     여기 있어야 할 것은 계좌가 회수돼도 안 없어지는 쪽이다. */
  $('lvChip').textContent=rankName();
  /* 난이도는 1단계에서 숨긴다 — 고를 것이 없던 사람에게는 있으나 마나 한 정보고,
     탑바는 이미 잔고·상환·레벨로 꽉 차 있다. */
  const tc=$('tierChip'), ti=tierIdx();
  tc.classList.toggle('hide', ti===0);
  if(ti>0)tc.textContent=t('tierChip',{n:ti+1});
  const chip=$('repayChip'), el=$('repayStrip');
  /* 차수 옆에 이번 관문의 사유를 붙인다 — 「1차 · 분기 마감」.
     늘 보이면서 높이를 안 먹는 유일한 자리다. */
  const ph=$('trmPhase');
  if(ph)ph.textContent=gateDone()?'':`${gateOf().n} · ${reasonN(reasonOf())}`;
  if(gateDone()){
    chip.className='repay-chip';
    chip.innerHTML=t('gateDoneChip');
    el.innerHTML=`<div class="lv-row"><span class="lv-name">${t('gateDoneRow',{v:fmtMoney(S.peakCash)})}</span>
      <span class="lv-pct">100%</span></div>${blocks(BAR_CELLS,BAR_CELLS)}`;
    $('cashView').textContent=fmtMoney(S.cash);
    return;
  }
  const g=gateOf();
  const d=S.daysLeft, urgent=d<=3;
  const cells=Math.max(0,Math.min(BAR_CELLS,d));
  const r=riskAt(S.cash,d);
  const canExtend=S.cash*(1-EXTEND_COST_FRAC)>=MIN_BET;
  /* 상환금과 D-day는 이 칩이 들고 있고, 화면에서 밀려나면 접힌 계좌줄
     (.acct-mini)이 같은 값을 창틀에 붙여 대신 말한다 — 마감이 걸린 게임에서
     마감은 늘 보여야 한다. 그래서 스트립에서는 같은 줄을 빼고 진행바와
     설명줄만 남긴다(관문 이름은 설명줄 앞으로 옮겼다). */
  chip.className=`repay-chip ${r.cls}${r.last?' last':''}`;
  chip.innerHTML=`<span class="goal">${fmtMoney(g.goal)}</span><span class="sep">·</span>` +
    `<span class="dd">${r.last?t('lastDay'):t('dday',{n:d})}</span>`;
  el.innerHTML=`${blocks(cells,BAR_CELLS,r.cls)}
    <div class="repay-sub ${r.cls}">
      <span>${t('repaySub',{g:g.n,d:dateOfDay(S.dayCount),p:r.txt})}</span>
      ${urgent&&canExtend?`<button class="extend" id="extendBtn">${t('extendBtn',{n:EXTEND_DAYS,v:fmtMoney(Math.floor(S.cash*EXTEND_COST_FRAC))})}</button>`:''}
    </div>`;
  if($('extendBtn'))$('extendBtn').onclick=()=>{sfx.tap();extendDeadline();};
}

/* ===== 파산 ===== */

  if($('modal').classList.contains('on'))return false;

  return false;
}

/* ===== 단타 라운드 ===== */
function currentTickIdx(){
  if(!S.activeRound)return 0;
  const elapsed=Date.now()-S.activeRound.startedAt;
  return Math.min(S.activeRound.path.length-1,Math.floor(elapsed/ROUND_TICK_MS));
}
function roundDir(){return (S.activeRound&&S.activeRound.dir)||1;}
function setBet(n){
  const hi=Math.floor(S.cash);
  S.betAmount=Math.max(Math.min(MIN_BET,hi),Math.min(hi,Math.round(n)));
  renderTrade();
}
/* dir: +1 롱(상승에 베팅) · -1 숏(하락에 베팅). 공매도를 안 열었으면 언제나 +1이다. */
function startRound(dir){
  if(dir===undefined)dir=S.betDir||1;
  if(S.activeRound)return;
  const stock=TRADE_STOCKS.find(s=>s.id===S.selectedStock);
  const bet=S.betAmount;
  if(bet<MIN_BET||bet>S.cash)return;
  ensurePending();
  const {patternId,patternEmo,path,ticks}=genRound(stock,S.pending.tier);
  const maxLev=leverageMultOf(), minLev=minLevOf();
  const leverage=Math.min(Math.max(minLev,S.betLeverage||minLev),maxLev);
  S.cash-=bet;
  S.activeRound={stockId:stock.id,bet,path,ticks,patternId,patternEmo,leverage,
    dir:(metaHas('short')&&dir<0)?-1:1,
    entry:1, bet0:bet, watered:false,   // entry = 평균 단가. 물타기로만 움직인다
    startedAt:Date.now(), yMin:0.96, yMax:1.04, boundsIdx:0, dispYMin:0.96, dispYMax:1.04,
    peak:1, peakIdx:0, low:1, lowIdx:0,
    buffs:(S.buffs||[]).slice()};
  S.buffs=[];              // 티켓은 이 한 판에만 — 남겨두지 않는다
  ensureToday(); S.today.rounds++;
  S.lastResult=null;
  sfx.buy();
  saveRun(); render();
}
/* 투자금 중 part만큼을 지금 가격에 청산했을 때의 손익.
   티켓 효과(⚡부스터·🛟청산 면제)와 손절 보험은 청산하는 금액을 기준으로 건마다 적용한다.
   두 번에 나눠 팔아도 금액의 합이 원래 투자금이므로 효과가 불어나지 않는다. */
function cashOutOf(part,mult,lev,dir,entry){
  let raw=Math.round(part*(mult/(entry||1)-1)*lev*dir);   // 숏이면 가격이 내려야 이익
  if(raw>0&&roundHas('boost'))raw=Math.round(raw*1.5);    // ⚡ 이익만 1.5배
  let profit=applyStoploss(raw);
  let payout=Math.max(0,part+profit);
  if(roundHas('liq')&&payout<part*0.30){ payout=Math.round(part*0.30); profit=payout-part; }  // 🛟 청산 면제
  return {profit,payout};
}
/* ✂️ 분할 매도 — 절반만 실현하고 나머지는 계속 들고 간다. 판당 한 번뿐이다.
   W·M 같은 이중 패턴에서 "반만 먹고 남기기"가 처음으로 가능해진다. */
function sellHalf(){
  const R=S.activeRound;
  if(!R||R.half||!metaHas('split'))return;
  const part=Math.floor(R.bet/2);
  if(part<1)return;
  const mult=R.path[currentTickIdx()];
  const {profit,payout}=cashOutOf(part,mult,R.leverage||1,roundDir(),R.entry);
  R.half={bet:part,mult,profit};
  R.bet-=part;                       // 남은 절반만 계속 굴린다
  S.cash+=payout; bumpPeak();
  sfx[profit>=0?'pay':'warn']();
  saveRun(); renderRoundView();
}
/* 💧 물타기 — 라운드 중 투자금을 더 얹는다. 판당 한 번, 손실 중일 때만.
   금액 B를 가격 p에 사면 수량은 B/p이므로 평단은 총투입 ÷ 총수량으로 내려가고,
   청산선(평단 × (1−1/L))도 같이 내려간다. 버틸 여력이 생기는 대신 투입금이 늘어
   더 밀리면 손실도 같이 커진다.

   수수료는 안 붙인다. sim/water.js 실측(3단계 기준): 기계적으로 쓰면 클리어율이
   17% → 12%로 떨어지고 파산률은 11% → 14%로 오른다 — 지는 판에만 더 걸고 이기는
   판엔 안 거는 역-켈리라, 판당 기댓값이 양수여도 성장률이 깎인다. 이미 충분히
   위험해서 수수료까지 물리면(5%에 8%) 아무도 안 쓰는 죽은 버튼이 된다.
   잘 쓰면 이득이고 막 쓰면 손해인 것 — 그게 이 버튼이 선택인 이유다. */
const WATER_FRAC=0.5;                       // 최초 베팅의 절반을 얹는다
function waterAmountOf(R){return Math.floor((R.bet0||R.bet)*WATER_FRAC);}
function canWater(R,mult){
  if(!R||R.watered||!metaHas('water'))return false;
  const add=waterAmountOf(R);
  if(add<1||S.cash<add)return false;
  const m=(mult===undefined)?R.path[currentTickIdx()]:mult;
  return (m-(R.entry||1))*(R.dir||1)<0;     // 손실 중일 때만 — 이익 중에 얹는 건 물타기가 아니다
}
function addWater(){
  const R=S.activeRound;
  const mult=R?R.path[currentTickIdx()]:0;
  if(!canWater(R,mult))return;
  const add=waterAmountOf(R), entry=R.entry||1;
  const q0=R.bet/entry, q1=add/mult;        // 수량 = 금액 ÷ 가격
  R.entry=(R.bet+add)/(q0+q1);
  R.bet+=add; R.watered=true;
  S.cash-=add;
  sfx.buy();
  saveRun(); renderRoundView();
}
function sellRound(auto){
  if(!S.activeRound)return;
  const idx=currentTickIdx();
  const mult=S.activeRound.path[idx];
  const bet=S.activeRound.bet;
  const lev=S.activeRound.leverage||1;
  const dir=roundDir();
  const {profit,payout}=cashOutOf(bet,mult,lev,dir,S.activeRound.entry);
  /* 매도 등급 — 그 판 "전 구간"의 최저~최고 안에서 내가 판 위치.
     매도 시점까지(본 구간)로 잡으면, 하락장에서는 매도 순간이 곧 그때까지의 최저점이라
     D가 47% 쏟아진다(실측). 전 구간으로 잡아야 "일찍 빠져나온 것"이 제대로 A/S를 받는다.
     플레이어가 못 본 뒷구간까지 쓰는 셈이지만, 등급은 사후 채점이고
     "안 팔았으면 어디까지 갔는지"를 알려주는 게 이 게임의 후회/안도 훅이기도 하다. */
  const R=S.activeRound;
  let lo=R.path[0], hi=R.path[0];
  for(let i=0;i<R.path.length;i++){ if(R.path[i]<lo)lo=R.path[i]; if(R.path[i]>hi)hi=R.path[i]; }
  /* 분할 매도를 했으면 두 번의 매도를 금액으로 가중평균한 배율에 등급을 매긴다 —
     한쪽만 보면 "반은 고점에 팔고 반은 흘렸다"가 등급에 안 잡힌다. */
  const half=R.half||null;
  const totalBet=bet+(half?half.bet:0);
  const totalProfit=profit+(half?half.profit:0);
  const effMult=half?(half.mult*half.bet+mult*bet)/totalBet:mult;
  const grade=gradeOf(effMult,lo,hi,dir);
  if(metaHas('dex'))recordPattern(R.patternId,lo,hi);   // 도감은 판이 끝날 때 한 번만 쌓인다
  const buffs=(R.buffs||[]).slice();
  S.cash+=payout; bumpPeak();
  sfx[totalProfit>=0?'pay':'warn']();
  S.activeRound=null;
  /* 연승: 익절이면 +1, 아니면 0. 단계에 닿으면 다음 한 판에 걸릴 티켓을 준다 */
  const won=totalProfit>0;
  const prevStreak=S.streak||0;
  S.streak=won?prevStreak+1:0;
  const earned=(won&&STREAK_REWARD[S.streak])?STREAK_REWARD[S.streak].slice():[];
  if(earned.length)grantBuffs(earned);
  ensureToday();
  const T=S.today;
  if(won)T.wins++;
  if(effMult>T.bestMult)T.bestMult=effMult;
  if(totalProfit>T.bestProfit)T.bestProfit=totalProfit;
  if(S.streak>T.bestStreak)T.bestStreak=S.streak;
  if(grade&&grade.g==='S')T.sCount++;
  const res={mult,effMult,half,entry:R.entry||1,watered:!!R.watered,
    profit:totalProfit,bet:totalBet,lev,dir,
    grade,lo,hi,streak:S.streak,prevStreak,earned,buffs,daysLeft:S.daysLeft};
  S.lastResult=res;
  rollPending(); // 다음 라운드 패턴/신호를 새로 뽑는다(라운드가 끝날 때만)
  saveRun(); render();
  showResultModal(S.lastResult,()=>{
    S.lastResult=null;
    if(checkBankrupt())return;
    if(!endOfDay())render();
  });
}
/* 부드러운 곡선(2차 베지어 보간) + x/y축을 라운드 시작 시점에 고정해서
   그래프가 항상 왼쪽 끝(0초)에서 자라나 보이게 한다 */
function smoothPathD(pts){
  if(!pts.length)return '';
  if(pts.length===1)return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1],cur=pts[i];
    const midX=(prev[0]+cur[0])/2, midY=(prev[1]+cur[1])/2;
    d+=` Q${prev[0].toFixed(1)} ${prev[1].toFixed(1)} ${midX.toFixed(1)} ${midY.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  d+=` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  return d;
}
function renderTradeTabs(){

     매 판 바꾸는 값이 되는데, 그걸 매번 옆으로 굴려 찾게 할 수는 없다. 여섯을

function renderTrade(){
  /* 판이 돌면 서류를 치우고 모니터가 화면을 차지한다. 예전에는 라운드 뷰가
     주문표 안(#tradeBody)에 들어가서, 15초 동안 볼 것은 차트 하나인데
     그 위에 주문표 머리와 종목 여섯 줄이 그대로 남아 차트를 접힘선 아래로
     밀어냈다. 스크롤이 절대 안 되는 화면은 라운드뿐이라 그 자리부터 비운다. */
  const live=!!S.activeRound;
  $('tabsWrap').hidden=live; $('roundHost').hidden=!live;
  if(!live)$('roundHost').innerHTML='';
  /* ACCOUNT 패널(156px)도 접어서 창틀의 계좌줄(44px)로 내린다. 목표와 D-day는
     15초 동안에도 "언제 팔까"를 고르는 값이라 지워선 안 되지만, 큰 판때기로
     둘 자리는 없다 — 360×640에서 매도 버튼이 상태표시줄 아래로 밀려났다. */
  const bd=$('appBody');
  $('repayGrp').hidden=live;
  $('acctMini').hidden=!(live||bd.scrollTop>40);
  if(!$('acctMini').hidden)renderAcctMini();
  const maxLev=leverageMultOf();
  /* 예전에는 여기 "빚 때문에 최소 3배"가 있었다. 고를 배율이 하나뿐이면 아무 선택도
     안 바꾸는 문장이다(설명은 인트로에 남아 있다). 투자금을 고르는 자리에 필요한 건
     "얼마를 언제까지"다 — 탑바 칩과 같은 3단계 색을 쓴다. */
  { const fn=$('formNo'); if(fn)fn.textContent='No. '+docNo(); }
  const gc=$('tpGoal');
  if(gateDone()){
    gc.className='tp-goal';
    gc.innerHTML=t('goalDone');
  }else{
    const gr=riskAt(S.cash,S.daysLeft);
    gc.className=`tp-goal ${gr.cls}${gr.last?' last':''}`;
    gc.innerHTML=ic('chain')+` <b>${fmtMoney(gateOf().goal)}</b><span class="sep">·</span>`+
      `<span class="dd">${gr.last?t('lastDay'):t('dday',{n:S.daysLeft})}</span>`;
  }
  if(S.activeRound){renderRoundView();return;}
  RV=null; /* 아래에서 tradeBody를 통째로 갈아엎으므로 라운드 뷰 노드 캐시를 버린다 */
  /* 티켓은 위쪽 스트립에 큰 카드로 두지 않고, 시작 버튼 바로 위에 한 줄로만 알린다 —
     "지금 시작할 이 판"에 걸리는 것이므로 그 자리가 맞다. */
  const bl=(S.buffs||[]);
  const buffLine=bl.length?`<div class="buff-line">${bl.map(b=>BUFFS[b].emo).join('')}
      <span>${t('buffLine',{names:bl.map(b=>BUFFS[b].name).join(' + ')})}</span></div>`:'';
  const minLev=minLevOf();
  const levOptions=LEVERAGE_MULTS.filter(m=>m>=minLev&&m<=maxLev);
  const curLev=Math.min(Math.max(minLev,S.betLeverage||minLev),maxLev);
  const liq=liqMultOf(curLev);
  /* 청산선은 칸 밖 한 줄에 적는다 — 고른 배율의 값 하나만. 배율이 셋이 되면
     버튼마다 청산선까지 적을 폭이 안 나오고, 어차피 고르기 전에 읽는 값이
     아니라 고른 뒤에 확인하는 값이다. */
  const canShort=metaHas('short');
  const liqL=liqMultOf(curLev,1), liqS=liqMultOf(curLev,-1);
  const liqTxt=canShort?t('liqBoth',{a:liqL>0?liqL.toFixed(2):'—',b:liqS.toFixed(2)})
                       :(liqL>0?t('liqAt',{v:liqL.toFixed(2)}):t('liqNone'));
  /* 줄이 하나 생겼으니 값만 적고 끝내지 않는다 — 청산선은 매 판 보는 값인데
     "0.67x"가 무엇인지는 인트로에서 한 번 말하고 말았다.
     이 줄은 배율과 방향이 같이 정하는 값이라 칸의 맨 아래, 방향 토글 밑에 둔다. */
  const levNote=(canShort||liqL>0)?t('liqNote',{v:liqTxt}):liqTxt;
  const levRow=`<div class="btn-row lev-row">${levOptions.map(m=>
      `<button data-lev="${m}" class="${curLev===m?'sel':''}">${t('levUnit',{n:m})}</button>`
    ).join('')}</div>`;
  ensurePending();
  /* 🔎 정보 확신권이 걸려 있으면 신호를 참값으로 보여준다 */
  const sigId=(S.buffs||[]).includes('info')?S.pending.tier:S.pending.sig;
  const sg=SIGNAL_INFO[sigId];
  const acc=Math.round(infoAccOf()*100);
  const signalRow=`<div class="signal ${sigId}">
      <div class="sg-left"><span class="sg-emo">${sg.emo}</span><span class="sg-name">${sg.name}</span></div>
      <div class="sg-mid"><div class="sg-ds">${sg.ds}</div>
        <div class="sg-acc">${(S.buffs||[]).includes('info')?t('sigSure'):t('sigAcc',{p:acc})}</div></div>
      ${metaHas('dex')?`<button class="dex-btn" id="dexBtn" title="${t('dexBtnT')}">${ic('binder')}</button>`:''}
    </div>`;
  const canGo=S.betAmount>=MIN_BET && S.betAmount<=S.cash;
  /* "얼마가 모자라나" 칩은 뺐다. 카드 머리의 목표·D-day 칩이 같은 말을 하고,
     그 자리를 비우면 방향 토글이 한 줄을 통째로 써서 오발이 줄어든다. */
  const dirRow=canShort
    ? `<span class="dir-toggle" id="dirToggle">
         <button data-d="1" class="${S.betDir!==-1?'sel':''}">${t('dirLong')}</button>
         <button data-d="-1" class="${S.betDir===-1?'sel short':''}">${t('dirShort')}</button>
       </span>`
    : '';
  /* 페이스 경고는 위험할 때만 뜬다 — 늘 떠 있으면 단타 화면만 더 빽빽해지고 경고 구실을 못 한다 */
  const pr=gateDone()?null:riskAt(S.cash,S.daysLeft);
  const paceLine=(pr&&pr.cls!=='p-ok')?`<div class="pace-line ${pr.cls}">${pr.last?t('paceLast'):t('dday',{n:S.daysLeft})} · ${t('paceNeed',{p:pr.txt})}</div>`:'';
  /* 서류의 칸 순서다 — 무엇을(종목) 얼마에(투자금) 어떤 조건으로(배율·방향),
     그리고 담당자 소견을 읽고 도장을 찍는다. 소견이 도장 바로 위에 있어야
     "읽고 결재한다"는 순서가 된다. 예전에는 장세가 맨 위에 있어서 얼마를
     걸지 정하기 전에 읽고 잊어버렸다.
     사유와 안내 줄은 도장 아래 각주다 — 서류의 주석이 찍는 자리 위에 끼면
     읽고 결재하는 순서가 한 칸 밀린다. */
  $('tradeBody').innerHTML=`
    <div class="grp">
      <div class="bet-head"><span class="lg">${t('gBet')}</span>
        <span class="amt">${fmtMoney(S.betAmount)}</span></div>
      <div class="bet-row"><button class="pm" id="betMinus">−</button>
        <button data-q="0.25">25%</button><button data-q="0.5">50%</button>
        <button data-q="0.75">75%</button><button data-q="1">${t('qMax')}</button>
        <button class="pm" id="betPlus">+</button></div>
    </div>
    <div class="grp"><span class="lg">${t('gCond')}</span>
      ${levRow}
      ${dirRow?`<div class="opt-row">${dirRow}</div>`:''}
      <div class="lev-note">${levNote}</div>
    </div>
    <div class="grp last"><span class="lg">${t('gSig')}</span>${signalRow}</div>
    ${buffLine}
    ${paceLine}
    <div class="stamp-foot">${goRowHTML(canGo,canShort,curLev,pr)}</div>
    ${gateDone()?'':`<div class="foot-note"><b>${reasonN(reasonOf())}</b> — ${reasonD(reasonOf())}</div>`}
    ${(S.today.rounds<3)?`<div class="trade-note">${t('tradeNote')}</div>`:''}`;
  const step=Math.max(MIN_BET,Math.round(S.cash*0.05));
  $('betMinus').onclick=()=>{sfx.tap();setBet(S.betAmount-step);};
  $('betPlus').onclick=()=>{sfx.tap();setBet(S.betAmount+step);};
  $('tradeBody').querySelectorAll('.bet-row button[data-q]').forEach(b=>b.onclick=()=>{sfx.tap();setBet(S.cash*parseFloat(b.dataset.q));});
  $('tradeBody').querySelectorAll('.btn-row button[data-lev]').forEach(b=>b.onclick=()=>{sfx.tap();S.betLeverage=parseFloat(b.dataset.lev);saveRun();renderTrade();});
  if($('dirToggle'))$('dirToggle').querySelectorAll('button[data-d]').forEach(b=>b.onclick=()=>{
    sfx.tap(); S.betDir=parseInt(b.dataset.d,10); saveRun(); renderTrade(); });
  if($('dexBtn'))$('dexBtn').onclick=()=>{sfx.tap();showDexModal();};
  $('tradeGo').onclick=()=>startRound(S.betDir);
}
/* 시작 버튼은 하나다. 방향은 위 토글에서 이미 골랐고, 버튼은 색과 문구로 그걸
   다시 한 번 확인시킨다 — 이 게임은 기본 버튼도 파랑이라 색만으로는 구분이 안 된다. */
/* 도장은 "승인"이고, 무엇을 승인하는지는 작은 줄로 받친다.
   예전에는 버튼 한 줄에 "5만원 × 3배로 시작"이 전부였는데, 도장이 된 뒤로는
   찍는 행위(승인)와 내용(5만원 × 3배)이 다른 크기로 갈리는 게 맞다. */
/* 도장은 폭 전체를 쓴다. 예전에는 128px짜리 도장 옆에 「기한 안에 목표를 못
   채우면…」이 두 줄로 붙어 있었는데, 그 문구는 매 판 똑같고 상단 D-day가 이미
   같은 말을 한다 — 읽히지도 않으면서 화면에서 제일 중요한 버튼을 반으로 줄이고
   있었다. 작은 줄에는 고른 종목 이름을 같이 적는다: 목록을 다시 안 봐도
   무엇을 사는지 보인다. */
function goRowHTML(canGo,canShort,lev,pr){
  if(!canGo)return `<button class="trade-go" id="tradeGo" disabled>${t('goNoFunds')}</button>`;
  const st=TRADE_STOCKS.find(x=>x.id===S.selectedStock)||TRADE_STOCKS[0];
  const amt=t('amtLev',{v:fmtMoney(S.betAmount),n:lev})+' · '+st.name;
  const cls=canShort?(S.betDir===-1?'go-short':'go-long'):(pr&&pr.cls==='p-bad'?'danger':'');
  return `<button class="trade-go ${cls}" id="tradeGo">${t('stampGo')}<small>${amt}</small></button>`;
}

/* 라운드 뷰는 "한 번 만들고 좌표만 갱신"한다.
   예전에는 50ms마다 tradeBody.innerHTML을 통째로 다시 썼는데, 그러면
   (a) CSS transition/animation이 매 틱 초기화돼서 어떤 연출도 살아남지 못하고
   (b) 매도 버튼 핸들러를 초당 20번 다시 붙이게 된다.
   그래서 노드를 RV에 캐시해 두고 update만 돌린다. */
let RV=null;
const RV_H=150, RV_PADX=8, RV_PADY=16;
/* 기기 이름은 번역하지 않는다 — 책상 위 물건에 찍힌 모델명이지 UI 문구가 아니다 */
const DEV_PLATE='MERIDIAN \u00b7 MT-14';

function buildRoundView(r,stock){
  const lev=r.leverage||1;
  /* 배율·차트·손익·남은 시간을 한 덩어리로 묶어 터미널에 넣는다.
     여기가 15초 동안 눈이 붙어 있는 자리고, 지금까지 이 화면에서 가장
     디자인이 안 된 곳이었다. */
  $('roundHost').innerHTML=`<div class="round-view" id="rvRoot">
    <div class="dev live">
    <div class="bezel"><div class="scrn">
    <div class="trm"><div class="trm-pad">
    <div class="round-timer"><span class="rt-l" id="rvT1"></span><span class="rt-r" id="rvT2"></span></div>
    <div class="round-mult" id="rvMult">1.00x</div>
    <div class="round-chartbox">
      <svg class="round-chart" id="rvSvg" viewBox="0 0 320 ${RV_H}">
        <defs>
          <clipPath id="rvClipUp"><rect id="rvRectUp" x="0" y="0" width="320" height="${RV_H}"/></clipPath>
          <clipPath id="rvClipDn"><rect id="rvRectDn" x="0" y="0" width="320" height="0"/></clipPath>
        </defs>
        <rect id="rvZone" x="0" width="320" fill="#ff5a5a" opacity="0"/>
        <line id="rvBase" x1="0" x2="320" stroke="#1f8f47" stroke-width="1" stroke-dasharray="4 4" opacity=".9"/>
        <text id="rvBaseT" class="rv-txt" text-anchor="end" font-size="9" font-weight="700" fill="#1f8f47" opacity="1">${t('rEntry')}</text>
        <path id="rvAreaUp" fill="#ff5a5a" opacity=".16" clip-path="url(#rvClipUp)"/>
        <path id="rvAreaDn" fill="#42d9ff" opacity=".16" clip-path="url(#rvClipDn)"/>
        <line id="rvLiq" x1="0" x2="320" stroke="#ff5a5a" stroke-width="1.5" stroke-dasharray="5 4" opacity="0"/>
        <path id="rvLine" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line id="rvPkL" stroke="#ffb000" stroke-width="1" stroke-dasharray="2 2" opacity="0"/>
        <circle id="rvPkD" r="3.2" fill="none" stroke="#ffb000" stroke-width="2" opacity="0"/>
        <text id="rvPkT" class="rv-txt" font-size="10" font-weight="800" fill="#ffb000" opacity="0"/>
        <circle id="rvPulse" class="rv-pulse" r="4" fill="none" stroke-width="2"/>
        <circle id="rvHead" r="4.2" stroke="#05080a" stroke-width="2"/>
        <text id="rvTHi" class="rv-txt" x="6" font-size="9" font-weight="700" fill="#1f8f47"/>
        <text id="rvTLo" class="rv-txt" x="6" font-size="9" font-weight="700" fill="#1f8f47"/>
        <text id="rvLiqT" class="rv-txt" text-anchor="end" font-size="10" font-weight="800" fill="#ff5a5a" opacity="0"/>
      </svg>
      <div class="round-count" id="rvCount"></div>
    </div>
    <div class="round-pnl up" id="rvPnl">+${fmtMoney(0)}</div>
    <div class="rv-wallet" id="rvWallet"></div>
    <div class="round-bar" id="rvBar"></div>
    </div></div>
    <div class="glare"></div>
    </div></div>
    <div class="chin"><span class="plate">${DEV_PLATE}</span><i class="led"></i></div>
    </div>
    <div class="water" id="rvWater" hidden>
      <span>${t('rvWaterLab')} <b id="rvWaterAmt"></b></span><span class="r" id="rvWaterNote"></span></div>
    <div class="sell-row">
      <button class="sell-btn sell-half" id="sellHalf" hidden>${t('rSellHalf')}<small id="rvHalfAmt"></small></button>
      <button class="sell-btn" id="sellBtn"><span id="rvSellLab"></span><small id="rvFullAmt"></small></button>
    </div>
  </div>`;
  const g=id=>$(id);
  RV={round:r, lev, cw:320, lastCnt:-1, lastMult:1,
    root:g('rvRoot'), t1:g('rvT1'), t2:g('rvT2'), mult:g('rvMult'), svg:g('rvSvg'),
    rectUp:g('rvRectUp'), rectDn:g('rvRectDn'), zone:g('rvZone'), base:g('rvBase'), baseT:g('rvBaseT'),
    areaUp:g('rvAreaUp'), areaDn:g('rvAreaDn'), liq:g('rvLiq'), line:g('rvLine'),
    pkL:g('rvPkL'), pkD:g('rvPkD'), pkT:g('rvPkT'), pulse:g('rvPulse'), head:g('rvHead'),
    tHi:g('rvTHi'), tLo:g('rvTLo'), liqT:g('rvLiqT'), count:g('rvCount'),
    pnl:g('rvPnl'), bar:g('rvBar'), wallet:g('rvWallet'),
    halfBtn:g('sellHalf'), halfAmt:g('rvHalfAmt'), sellLab:g('rvSellLab'), fullAmt:g('rvFullAmt'),
    water:g('rvWater'), waterAmt:g('rvWaterAmt'), waterNote:g('rvWaterNote'),
    };
  /* viewBox 폭 = 실제 픽셀 폭으로 맞춰야 SVG 안의 글자가 가로로 늘어나지 않는다 */
  const fit=w=>{ w=Math.round(w); if(w<40||w===RV.cw)return;
    RV.cw=w; RV.svg.setAttribute('viewBox',`0 0 ${w} ${RV_H}`);
    RV.rectUp.setAttribute('width',w); RV.rectDn.setAttribute('width',w);
    RV.zone.setAttribute('width',w); RV.base.setAttribute('x2',w); RV.liq.setAttribute('x2',w); };
  if(window.ResizeObserver){ RV.ro=new ResizeObserver(es=>fit(es[0].contentRect.width)); RV.ro.observe(RV.svg); }
  fit(RV.svg.clientWidth||320);
  $('sellBtn').onclick=()=>sellRound(false);
  $('sellHalf').onclick=()=>{sfx.tap();sellHalf();};
  $('rvWater').onclick=()=>{ if(canWater(S.activeRound)){sfx.tap();addWater();} };
}

function renderRoundView(){
  const r=S.activeRound, stock=TRADE_STOCKS.find(s=>s.id===r.stockId);
  if(!RV || RV.round!==r || !document.body.contains(RV.root)) buildRoundView(r,stock);
  const idx=currentTickIdx(), mult=r.path[idx];
  const entry=r.entry||1;
  const T=r.ticks||(r.path.length-1);
  const remain=Math.max(0,(T-idx)*ROUND_TICK_MS/1000);
  /* 색은 진입가(물탔으면 평단) 대비다 — 물탄 뒤에도 "지금 이익인가"와 맞아야 한다 */
  const dir=mult>entry*1.01?'up':mult<entry*0.99?'down':'flat';
  const W=RV.cw, H=RV_H, padX=RV_PADX, padY=RV_PADY;
  /* y축은 "지금까지 실제로 본 값"만 확장형(expand-only)으로 반영한다 — 미래 전체 경로의
     최고/최저로 미리 고정하면, 선이 차트 위/아래 끝에 닿는 순간 "이게 그 라운드의 진짜
     고점/저점이다"를 그래프가 스포일러처럼 알려줘서 패턴을 볼 필요가 없어짐. 하지만
     상승/하락이 쭉 이어지는 구간에서는 "진짜 새 고점/저점"이 거의 매 틱 갱신되기 때문에,
     목표 경계(yMin/yMax)를 그대로 그리기에 쓰면 이미 그려둔 예전 구간의 픽셀 위치까지
     매 틱 같이 밀려서 그래프가 통째로 다시 그려지는 것처럼 흔들려 보임. 그래서 실제
     그리기에 쓰는 화면상 경계(dispYMin/dispYMax)는 목표치를 향해 서서히(이징) 따라가게
     만들어서, 예전 구간은 순간이동하지 않고 부드럽게만 자리를 조정하도록 한다 */
  if(typeof r.yMin!=='number'){r.yMin=0.96;r.yMax=1.04;r.boundsIdx=0;}
  if(typeof r.peak!=='number'){r.peak=1;r.peakIdx=0;} /* 예전 세이브에서 이어붙은 라운드 대비 */
  if(typeof r.low!=='number'){r.low=1;r.lowIdx=0;}
  if(typeof r.lowIdx!=='number')r.lowIdx=0;
  if(idx>r.boundsIdx){
    for(let i=r.boundsIdx+1;i<=idx;i++){
      if(r.path[i]<r.yMin)r.yMin=r.path[i];
      if(r.path[i]>r.yMax)r.yMax=r.path[i];
      if(r.path[i]>r.peak){r.peak=r.path[i];r.peakIdx=i;}
      if(r.path[i]<r.low){r.low=r.path[i];r.lowIdx=i;}
    }
    r.boundsIdx=idx;
  }
  if(typeof r.dispYMin!=='number'){r.dispYMin=r.yMin;r.dispYMax=r.yMax;}
  const rawRng=(r.yMax-r.yMin)||0.001, pad=rawRng*0.15;
  /* 아래 여백은 0에서 자른다 — 가격은 0.05가 하한이라 음수 눈금이 나올 수가 없다.
     진폭이 큰 종목(코인·유메이드)에서 pad가 커지면 축이 "-0.20x"까지 내려갔었다. */
  const targetYMin=Math.max(0,r.yMin-pad), targetYMax=r.yMax+pad;
  const EASE=0.2;
  r.dispYMin+=(targetYMin-r.dispYMin)*EASE;
  r.dispYMax+=(targetYMax-r.dispYMax)*EASE;
  const yMin=r.dispYMin, yMax=r.dispYMax;
  const rng=(yMax-yMin)||0.001;
  const xOf=i=>padX+(i/T)*(W-2*padX);
  const yOf=v=>H-padY-((v-yMin)/rng)*(H-2*padY);
  const clampY=y=>Math.max(2,Math.min(H-2,y));
  const pts=[];
  for(let i=0;i<=idx;i++)pts.push([xOf(i),yOf(r.path[i])]);
  const d=smoothPathD(pts);
  /* 인광 팔레트 — 검은 화면에서 파랑(#3182F6)은 잠기므로 청록으로 올린다 */
  const col=dir==='up'?'#ff5a5a':dir==='down'?'#42d9ff':'#1f8f47';
  const lev=r.leverage||1, sdir=r.dir||1;
  const profit=Math.round(r.bet*(mult/entry-1)*lev*sdir);

  RV.line.setAttribute('d',d);
  RV.line.setAttribute('stroke',col);

  /* 진입선(물탔으면 평단) + 그 위/아래를 손익 색으로 채워서 "내가 산 자리" 기준 손익이 면적으로 읽히게 */
  const baseY=clampY(yOf(entry));
  RV.base.setAttribute('y1',baseY.toFixed(1)); RV.base.setAttribute('y2',baseY.toFixed(1));
  RV.baseT.setAttribute('x',W-6); RV.baseT.setAttribute('y',(baseY-4).toFixed(1));
  RV.baseT.textContent=r.watered?t('rAvg',{v:entry.toFixed(2)}):t('rEntry');
  const first=pts[0], last=pts[pts.length-1];
  const areaD=d+` L${last[0].toFixed(1)} ${baseY.toFixed(1)} L${first[0].toFixed(1)} ${baseY.toFixed(1)} Z`;
  RV.areaUp.setAttribute('d',areaD); RV.areaDn.setAttribute('d',areaD);
  /* 면적 색은 "내 손익"이다. 롱은 진입선 위가 이익(빨강)이지만 숏은 아래가 이익이라
     두 클립의 색을 맞바꾼다. 선 색은 그대로 가격 방향을 가리킨다. */
  RV.areaUp.setAttribute('fill',sdir>0?'#ff5a5a':'#42d9ff');
  RV.areaDn.setAttribute('fill',sdir>0?'#42d9ff':'#ff5a5a');
  RV.rectUp.setAttribute('height',baseY.toFixed(1));
  RV.rectDn.setAttribute('y',baseY.toFixed(1)); RV.rectDn.setAttribute('height',(H-baseY).toFixed(1));

  /* 청산선 + 가까워질수록 짙어지는 경고 영역.
     롱은 선 아래가 위험 구간이고 숏은 선 위가 위험 구간이라 방향마다 반대로 칠한다. */
  const liq=liqMultOf(lev,sdir,entry);
  const hasLiq=sdir<0||lev>1;
  const liqY=hasLiq?yOf(liq):null;
  const liqOn=(liqY!==null&&liqY>padY&&liqY<H-padY);
  RV.liq.setAttribute('opacity',liqOn?'.75':'0');
  if(liqOn){ RV.liq.setAttribute('y1',liqY.toFixed(1)); RV.liq.setAttribute('y2',liqY.toFixed(1)); }
  let zoneOp=0;
  if(hasLiq){
    const gap=Math.max(0.02,Math.abs(liq-entry));
    const head=(sdir>0?mult-liq:liq-mult)/gap;
    zoneOp=Math.max(0,Math.min(.42,(1-head)*.55));
  }
  /* 위험 구간은 청산선 바깥쪽 전부다 — 롱은 선 아래, 숏은 선 위.
     청산선이 화면 밖으로 나가도 맞아야 하므로 경계를 0~H로 자른다:
     선이 화면 위로 나간 숏은 "아직 멀다"(높이 0), 아래로 나간 숏은 "이미 지났다"(높이 H). */
  const edge=Math.max(0,Math.min(H, liqY===null?(sdir>0?H:0):liqY));
  if(sdir>0){ RV.zone.setAttribute('y',edge.toFixed(1)); RV.zone.setAttribute('height',(H-edge).toFixed(1)); }
  else      { RV.zone.setAttribute('y','0');             RV.zone.setAttribute('height',edge.toFixed(1)); }
  RV.zone.setAttribute('opacity',zoneOp.toFixed(3));
  const liqWarn=hasLiq&&zoneOp>0.08;
  RV.liqT.setAttribute('opacity',liqWarn?'1':'0');
  if(liqWarn){
    const dead=sdir>0?mult<=liq:mult>=liq;
    RV.liqT.setAttribute('x',W-6);
    RV.liqT.setAttribute('y',(liqOn?(sdir>0?Math.min(H-5,liqY+12):Math.max(11,liqY-6)):H-6).toFixed(1));
    RV.liqT.textContent=dead?t('rWiped'):t('rToLiq',{v:Math.abs(mult-liq).toFixed(2)});
  }

  /* 극점 마커 — "아까 얼마까지 갔었는지"가 매도 타이밍 게임의 학습이자 후회 훅이다.
     롱은 최고점이 그 자리지만 숏은 최저점이라, 방향에 따라 보는 쪽을 바꾼다. */
  const mk=sdir>0?{v:r.peak,i:r.peakIdx,lab:t('rHigh')}:{v:r.low,i:r.lowIdx,lab:t('rLow')};
  const pkOn=mk.i>0&&Math.abs(mk.v-1)>0.005;
  RV.pkD.setAttribute('opacity',pkOn?'1':'0');
  RV.pkL.setAttribute('opacity',pkOn?'.5':'0');
  RV.pkT.setAttribute('opacity',pkOn?'1':'0');
  if(pkOn){
    const px=xOf(mk.i), py=clampY(yOf(mk.v));
    RV.pkD.setAttribute('cx',px.toFixed(1)); RV.pkD.setAttribute('cy',py.toFixed(1));
    RV.pkL.setAttribute('x1',px.toFixed(1)); RV.pkL.setAttribute('x2',px.toFixed(1));
    RV.pkL.setAttribute('y1',py.toFixed(1)); RV.pkL.setAttribute('y2',(H-2).toFixed(1));
    const rightish=px>W-78;
    RV.pkT.setAttribute('x',(rightish?Math.min(W-6,px-6):px+6).toFixed(1));
    RV.pkT.setAttribute('text-anchor',rightish?'end':'start');
    RV.pkT.setAttribute('y',Math.max(11,py-7).toFixed(1));
    RV.pkT.textContent=`${mk.lab} ${mk.v.toFixed(2)}x`;
  }

  /* 현재가 지점 — 눈이 여기를 보게 만든다 */
  const hx=last[0], hy=clampY(last[1]);
  RV.head.setAttribute('cx',hx.toFixed(1)); RV.head.setAttribute('cy',hy.toFixed(1));
  RV.head.setAttribute('fill',col);
  RV.pulse.setAttribute('cx',hx.toFixed(1)); RV.pulse.setAttribute('cy',hy.toFixed(1));
  RV.pulse.setAttribute('stroke',col);

  RV.tHi.setAttribute('y',11); RV.tHi.textContent=yMax.toFixed(2)+'x';
  RV.tLo.setAttribute('y',H-4); RV.tLo.textContent=yMin.toFixed(2)+'x';

  /* 배율 숫자는 변동폭에 반응해서 살짝 튄다 */
  RV.mult.textContent=mult.toFixed(2)+'x';
  RV.mult.className='round-mult '+dir;
  RV.mult.style.transform='scale('+(1+Math.min(0.14,Math.abs(mult-RV.lastMult)*9)).toFixed(3)+')';
  RV.lastMult=mult;

  /* 절반을 이미 실현했으면 손익은 "실현 + 지금 팔면"의 합으로 읽혀야 한다 */
  const realized=r.half?r.half.profit:0;
  const shown=profit+realized;
  RV.pnl.textContent=(shown>=0?'+':'')+fmtMoney(shown);
  RV.pnl.className='round-pnl '+(shown>=0?'up':'down');
  RV.wallet.innerHTML=r.half
    ? t('rHalfDone',{m:r.half.mult.toFixed(2),p:(realized>=0?'+':'')+fmtMoney(realized),rest:fmtMoney(r.bet)})
    : (r.watered
        ? t('rWatered',{v:entry.toFixed(2),bet:fmtMoney(r.bet)})
        : t('rIfSell',{v:fmtMoney(S.cash+Math.max(0,r.bet+profit))}));
  /* 분할 매도는 판당 한 번. 쓰고 나면 버튼이 하나로 돌아간다. */
  /* 📰 장중 뉴스 — 뜨는 순간부터 3초만. 놓치면 그만이고, 그게 이 기능의 긴장이다.
     그래프 위에 겹치면 선을 가린다(y축이 "본 값만"으로 확장돼서 세로로 꽉 차고, 3초면
     가로도 20%가 더 채워진다). 그래서 상단 줄을 3초간 빌려 쓴다 — 거기 있는 종목명·
     배율·청산선은 라운드 내내 안 변하는 정보라 잠깐 가려도 잃는 게 없다. */
  /* 💧 물타기 줄 — 해금했고 아직 안 썼으면 보인다. 조건이 안 맞으면 왜 못 누르는지 적어둔다. */
  const waterOn=metaHas('water')&&!r.watered;
  RV.water.hidden=!waterOn;
  if(waterOn){
    const add=waterAmountOf(r), ok=canWater(r,mult);
    RV.water.classList.toggle('off',!ok);
    RV.waterAmt.textContent='+'+fmtMoney(add);
    RV.waterNote.textContent = ok?t('rWaterOnce')
      : (S.cash<add?t('rWaterNoCash'):(sdir>0?t('rWaterBelow'):t('rWaterAbove')));
  }
  const canSplit=metaHas('split')&&!r.half;
  RV.halfBtn.hidden=!canSplit;
  /* 숏도 "매도"로 쓴다. 정확한 용어는 숏 커버지만 버튼이 하는 일은 "이 판을 끝낸다"이고,
     방향은 위 줄의 📉 숏이 이미 말하고 있다. */
  RV.sellLab.textContent=canSplit?t('rSellAll'):(r.half?t('rSellRest',{v:fmtMoney(r.bet)}):t('rSellNow'));
  RV.fullAmt.textContent=(profit>=0?'+':'')+fmtMoney(profit);
  if(canSplit){
    const hp=cashOutOf(Math.floor(r.bet/2),mult,lev,sdir,entry).profit;
    RV.halfAmt.textContent=(hp>=0?'+':'')+fmtMoney(hp);
  }

  const dirTxt=sdir<0?t('rDirShort'):'';
  const levTxt=hasLiq?t('rLevLiq',{n:lev,v:liq.toFixed(2)}):(lev>1?t('rLev',{n:lev}):'');

  const buffTxt=(r.buffs&&r.buffs.length)?' · '+r.buffs.map(b=>BUFFS[b].emo).join(''):'';
  /* 종목 아이콘은 뺀다 — 흰 바탕 스파크라인이라 검은 화면에서 흰 상자로 뜨고,
     이름이 바로 옆에 있어서 그림이 하는 일도 없다. */
  RV.t1.textContent=`${stock.name}${dirTxt}${levTxt}${buffTxt}`;
  RV.t2.textContent=t('secs',{v:remain.toFixed(1)});

  /* 마지막 3초 — 강제 매도 직전의 압박 */
  const tense=remain<=3&&remain>0;
  RV.t2.className='rt-r'+(tense?' warn':'');
  RV.root.classList.toggle('tense',tense);
  const c=Math.ceil(remain);
  if(tense&&c>0&&c!==RV.lastCnt){
    RV.lastCnt=c; RV.count.textContent=c;
    RV.count.className='round-count'; void RV.count.offsetWidth; RV.count.className='round-count on';
  }
  /* 상환 게이지와 같은 방향 — 채워지는 게 아니라 남은 것이 줄어든다.
     칸을 세는 편이 퍼센트보다 초읽기로 읽힌다. */
  const cells=Math.max(0,Math.min(BAR_CELLS,Math.ceil((1-idx/T)*BAR_CELLS)));
  if(RV.barCells!==cells){
    RV.barCells=cells;
    let b=''; for(let i=0;i<BAR_CELLS;i++)b+='<i'+(i<cells?'':' class="e"')+'></i>';
    RV.bar.innerHTML=b;
  }
}

function nextStreakTxt(st){
  const steps=Object.keys(STREAK_REWARD).map(Number).sort((a,b)=>a-b);
  const nx=steps.find(n=>n>st);
  return nx?t('winsToGo',{n:nx-st}):'—';
}

/* 정적 HTML로 박혀 있는 라벨은 render에서 채운다 — 언어를 바꾸면 여기도 같이 돈다 */
function applyStaticLabels(){
  const set=(id,html)=>{const e=$(id); if(e)e.innerHTML=html;};
  /* 탭은 아이콘이 앞에 선다 — 98의 탭 컨트롤이 늘 그랬다 */
  /* 탭에는 아이콘을 안 붙인다. 98의 탭 컨트롤에 원래 없었고, 길안내는
     소품으로 그릴 수 있는 자리가 아니다 — 억지로 붙이면 다시 표지판이 된다. */
  /* 탭에는 짧은 이름(상점·권한)이 앉고, 펼친 서류에는 그 서류의 이름이 적힌다 —
     단타 탭이 「주 문 표」를 머리에 이고 있는 것과 같은 꼴이다. */
  /* 제목표는 98 관용구대로 "문서 — 프로그램"이다. 한 판이 곧 문서 하나라는 뜻이고,
     '머니로드'와 'MONEY ROAD'는 같은 이름이다 — 표기만 옮긴다. */
  set('appIcon',ic('app',1));

  set('repayLg',t('gGoal'));

  set('trmLab',t('trmAcct'));
  set('cashLab',t('kCash'));
  set('stockLg',t('gStock'));
  set('formTitle',t('gForm'));
  try{ document.title=t('docTitle'); }catch(e){}
}

}

/* 규칙을 모른 채 맞는 마감이 제일 억울하다 — 첫 판 시작 전에 한 번 알려준다.

   "봤다/안 봤다" 불리언이 아니라 버전을 저장한다. 불리언은 한 번 서면 영원히
   서 있어서, 게임이 통째로 바뀌어도 예전에 한 번 본 사람은 다시 못 봤다.
   규칙이 크게 바뀌면 INTRO_V만 올리면 모두가 한 번 더 본다. */
const INTRO_V=2;
/* 첫 화면도 회사가 내미는 종이다. 그림 셋(시계·경고·동전)을 앞세운 안내문이었는데,
   차수 통과·계좌 회수가 전부 서류가 된 마당에 여기만 안내문이면 이 게임이 무엇을
   시키는 중인지가 첫 장부터 흐려진다. 조항은 번호로 센다 — 서류에 그림은 안 들어간다. */

     못 채운 차액은 다시 내 빚이 된다. 그래서 이 게임에는 나가는 문이 없다. */

     내 빚일 때는 몇 번째 계좌인지가 메모에 남는다 — 같은 서류가 또 온다. */

              : ap>=10?t('apFoot10') : ap>=5?t('apFoot5') : t('inFoot');

    <div class="doc-stamp">${t('stampAssign')}</div>

    <div class="stat-grid">
      <div class="s"><div class="k">${t('inGoalK')}</div><div class="v">${fmtMoney(g.goal)}</div></div>
      <div class="s"><div class="k">${t('kDeadline')}</div><div class="v">${t('vDays',{n:gateDaysOf(0)})}</div></div></div>
    <div class="lv-gain"><b>${t('grLab')}: ${reasonN(reasonOf(0))}</b> — ${reasonD(reasonOf(0))}</div>
    ${cl(1,t('in1'))}${cl(2,mgr?t('mc2'):trust?t('tc2'):t('in2'))}${cl(3,t('in3',{p:Math.round(EARLY_BONUS_RATE*100)})) }
    <div class="foot-note">${iFoot}</div>
    <button class="ok stamp" id="mOk">${t('inGo')}</button>`;
  openModal('doc');

/* ===== 🛠 테스트 도구 =====
   밸런스를 만질 때마다 새 판을 처음부터 굴려야 확인이 된다 — 해금 하나 보려고
   900 XP를 모으고, 마지막 상환 단계를 보려고 100판을 돌린다. 그걸 건너뛴다.

   상단 로고를 1.5초 안에 2번 누르면 열린다. 평소 화면에는 아무 흔적이 없고,
   모달 하나만 쓰므로 게임 구조도 안 건드린다.

   DEV.pat / DEV.dip 은 저장하지 않는다 — 새로고침하면 원래대로 돌아온다.
   XP를 임의로 넣어 기록이 오염되면 "메타만 초기화"로 되돌리면 된다. */
/* 키를 이름으로 하나씩 지우면 놓친다. loadMeta는 meta_v5가 없으면 옛 meta_v4에서
   XP를 다시 끌어오므로, v5만 지우면 경험치가 되살아난다. 예전 버전 키가 몇 개나
   남아 있는지도 알 수 없다. 그래서 접두어로 훑는다. */
function devWipe(what){
  WIPING=true;
  try{
    const kill=[];
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(!k||!/^moneyroad/.test(k))continue;
      if(/devtpl/.test(k))continue;      // 맞춰둔 템플릿 슬롯은 살린다
      if(k===LANG_KEY)continue;          // 언어는 진행도가 아니라 환경설정이다

const DEV_TIER_NAME={strong:['s','강세'], mid:['m','보통'], weak:['k','약세']};

/* 패턴별 "초반↑" — 라운드 25% 안에 +5% 이상 오르는 판의 비율. 지금 고치고 있는 그 숫자다.
   경로를 실제로 뽑아서 세기 때문에 비싸다(10종 × 150판). 모양을 바꾸는 값이 그대로면
   다시 안 센다 — 탭을 옮길 때마다 400ms씩 멈추면 도구를 못 쓴다. */
let devEarlyMemo={k:'',v:null};
function devEarly(){
  const st=devStock(), k=st.id+'|'+DIP+'|'+MID_DIP;
  if(devEarlyMemo.k===k)return devEarlyMemo.v;
  const v={}, N=150, T=ticksOf(st);
  PATTERNS.forEach(p=>{
    let up=0;
    for(let i=0;i<N;i++){
      const a=p.gen(st,T), q=Math.floor((a.length-1)*0.25);
      for(let j=1;j<=q;j++) if(a[j]>=1.05){ up++; break; }
    }
    v[p.id]=up/N;
  });
  devEarlyMemo={k,v};
  return v;
}

/* 도감의 스파크라인은 "대표 모양" 하나라, 같은 패턴이 판마다 다르게 열린다는 걸
   못 보여준다(midHead를 넣은 뒤로는 더 그렇다). 그래서 매번 세 번 뽑아 겹쳐 그린다. */
function devChart(p){
  const st=devStock(), T=ticksOf(st), W=76, H=40, N=52;
  const runs=[]; let lo=1, hi=1;
  for(let k=0;k<3;k++){
    const a=p.gen(st,T), pts=[];
    for(let i=0;i<N;i++){
      const v=a[Math.round(i/(N-1)*(a.length-1))];
      pts.push(v); if(v<lo)lo=v; if(v>hi)hi=v;
    }
    runs.push(pts);
  }
  const pad=(hi-lo)*0.08||0.02, top=hi+pad, bot=lo-pad;
  const y=v=>((top-v)/(top-bot)*H).toFixed(1);
  const c=DEV_TIER_COLOR[PATTERN_TIER[p.id]];
  const line=(pts,op)=>`<polyline points="${pts.map((v,i)=>(i/(N-1)*W).toFixed(1)+','+y(v)).join(' ')}"`+
    ` fill="none" stroke="${c}" stroke-width="1.6" stroke-linejoin="round" opacity="${op}"/>`;
  return `<svg class="pat-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`+
    `<line x1="0" x2="${W}" y1="${y(1)}" y2="${y(1)}" stroke="#b0b8c1" stroke-width="1" stroke-dasharray="2 2" opacity=".6"/>`+
    line(runs[0],.95)+line(runs[1],.35)+line(runs[2],.35)+`</svg>`;
}

    <div class="dv-help">청산선 <b>${liqMultOf(3,1).toFixed(2)}</b> 밑으로 내리면 열자마자 죽어요.
      올리면 덜 떨어져 <b>쉬워져요.</b></div>
    <div class="dv-sec">신호 적중률 — 🟢🟡🔴가 맞을 확률</div>
    <div class="dv-row">${INFO_ACC.map((a,i)=>
      `<button class="dv-btn ${lv===i?'sel':''}" data-acc="${i}">${Math.round(a*100)}%</button>`).join('')}</div>
    <div class="dv-help">올리면 예측이 쉬워져 <b>쉬워져요.</b> ${Math.round(INFO_ACC[INFO_ACC.length-1]*100)}%는 정보력을 최대로 강화한 상태예요.</div>
    <div class="dv-sec">조기 상환 보너스 — 남은 1일당</div>
    <div class="dv-row">
      <button class="dv-btn" data-bonus="-0.05">−5%p</button>
      <span class="dv-val">${Math.round(EARLY_BONUS_RATE*100)}%<small>상환금의 몇 %를 현금으로</small></span>
      <button class="dv-btn" data-bonus="0.05">+5%p</button></div>
    <div class="dv-help">기한보다 일찍 갚으면 남은 하루마다 받아요. <b>후반이 헐거워지는 주범</b>이에요.</div>
    <div class="dv-note">여기 값들은 저장 안 해요 — 새로고침하면 돌아와요.</div>`;
