    <div class="dv-note">여기 값들은 저장 안 해요 — 새로고침하면 돌아와요.</div>`;
}

/* 그 탭이 만지는 값만 되돌린다. 다른 탭에서 맞춰둔 건 안 건드린다 — 그게 이 버튼의 요지다. */
function devTabReset(){
  if(DEV.tab==='pat'){ DEV.w=null; DEV.pat=null; applyTierWeights(); }
  else if(DEV.tab==='meta'){ XP_LOG_MULT=XP_LOG_MULT_BASE; EARLY_XP_PER_DAY=EARLY_XP_BASE;
    TIER_XP_MULT=TIER_XP_BASE; BANKRUPT_PENALTY=BANKRUPT_BASE;
    META_UNLOCKS.forEach((u,i)=>u.need=UNLOCK_NEED_BASE[i]); }
  else if(DEV.tab==='start'){ START_CASH=START_CASH_BASE; MIN_LEVERAGE=MIN_LEVERAGE_BASE;
    S.upg.leverageLv=START_LEVERAGE_LV; GATE_DAYS=GATES.map(g=>g.days);
    S.daysLeft=gateDaysOf(S.gate||0); }
  else if(DEV.tab==='broke'){ MIN_BET=MIN_BET_BASE; BROKE_LIMIT=MIN_BET; LIQ_K=LIQ_K_BASE;
    EXTEND_DAYS=EXTEND_DAYS_BASE; EXTEND_COST_FRAC=EXTEND_COST_BASE; setBet(S.betAmount); }
  else if(DEV.tab==='bal'){ MID_DIP=MID_DIP_BASE; DIP=DIP_BASE; S.upg.infoLv=0;
    EARLY_BONUS_RATE=EARLY_BONUS_BASE; }
}

/* ===== 📋 템플릿 =====
   앱에서 값을 맞추고 JSON으로 넘기면 그대로 코드에 박는다. 이게 이 도구의 목적이다.
   측정값(초반↑ 같은 것)은 안 담는다 — 받아서 직접 다시 재는 쪽이 안전하다. */
const DEV_TPL_KEY='moneyroad2_devtpl_v1';
function devTplData(){
  const w={};
  PATTERNS.forEach((p,i)=>w[p.id]=+((DEV.w&&DEV.w[p.id]!==undefined)?DEV.w[p.id]:BASE_WEIGHTS[i]).toFixed(3));
  return {v:2, 패턴:w, MID_DIP:+MID_DIP.toFixed(2), DIP:+DIP.toFixed(2),
    신호적중률:+infoAccOf().toFixed(2), 조기상환:+EARLY_BONUS_RATE.toFixed(2),
    레버리지:{최소:MIN_LEVERAGE, 최대:leverageMultOf()},
    시작현금:START_CASH, 거래일:GATE_DAYS.slice(),
    메타:{XP계수:XP_LOG_MULT, 조기상환XP:EARLY_XP_PER_DAY,
      난이도배수:+TIER_XP_MULT.toFixed(2), 파산페널티:+BANKRUPT_PENALTY.toFixed(2),
      해금문턱:META_UNLOCKS.map(u=>u.need)},
    파산:{파산선:MIN_BET, 청산여유:+LIQ_K.toFixed(2),
      연장일수:EXTEND_DAYS, 연장비용:+EXTEND_COST_FRAC.toFixed(2)}};
}
function devTplApply(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return '읽을 수 없는 형식이에요';
  if(o.패턴&&typeof o.패턴==='object'){
    DEV.w={};
    PATTERNS.forEach((p,i)=>DEV.w[p.id]=typeof o.패턴[p.id]==='number'?o.패턴[p.id]:BASE_WEIGHTS[i]);
    applyTierWeights();
  }
  if(typeof o.MID_DIP==='number')MID_DIP=o.MID_DIP;
  if(typeof o.DIP==='number')DIP=o.DIP;
  if(typeof o.신호적중률==='number'){
    let best=0;
    INFO_ACC.forEach((a,i)=>{ if(Math.abs(a-o.신호적중률)<Math.abs(INFO_ACC[best]-o.신호적중률))best=i; });
    S.upg.infoLv=best;
  }
  if(typeof o.조기상환==='number')EARLY_BONUS_RATE=o.조기상환;
  if(o.레버리지&&typeof o.레버리지==='object'){
    if(typeof o.레버리지.최소==='number')MIN_LEVERAGE=o.레버리지.최소;
    const i=LEVERAGE_MULTS.indexOf(o.레버리지.최대);
    if(i>=0)S.upg.leverageLv=i;
  }
  if(typeof o.시작현금==='number')START_CASH=o.시작현금;
  if(Array.isArray(o.거래일))GATE_DAYS=GATES.map((g,i)=>+o.거래일[i]||g.days);
  const m=o.메타;
  if(m&&typeof m==='object'){
    if(typeof m.XP계수==='number')XP_LOG_MULT=m.XP계수;
    if(typeof m.조기상환XP==='number')EARLY_XP_PER_DAY=m.조기상환XP;
    if(typeof m.난이도배수==='number')TIER_XP_MULT=m.난이도배수;
    if(typeof m.파산페널티==='number')BANKRUPT_PENALTY=m.파산페널티;
    if(Array.isArray(m.해금문턱))META_UNLOCKS.forEach((u,i)=>{
      if(typeof m.해금문턱[i]==='number')u.need=m.해금문턱[i]; });
  }
  const k=o.파산;
  if(k&&typeof k==='object'){
    if(typeof k.파산선==='number'){ MIN_BET=Math.max(1,Math.round(k.파산선)); BROKE_LIMIT=MIN_BET; }
    if(typeof k.청산여유==='number')LIQ_K=k.청산여유;
    if(typeof k.연장일수==='number')EXTEND_DAYS=k.연장일수;
    if(typeof k.연장비용==='number')EXTEND_COST_FRAC=k.연장비용;
  }
  S.daysLeft=gateDaysOf(S.gate||0);
  setBet(S.betAmount);
  return '';
}
/* 슬롯은 전부 초기화에서 빠진다(devWipe가 devtpl 키를 건너뛴다). 맞춰둔 값을
   실수로 잃으면 그 시간이 통째로 날아가니까. */
function devSlots(){ try{ const a=JSON.parse(localStorage.getItem(DEV_TPL_KEY)); return Array.isArray(a)?a:[]; }catch(e){ return []; } }
function devSlotsSave(a){ try{ localStorage.setItem(DEV_TPL_KEY,JSON.stringify(a)); }catch(e){} }

function devTplScreen(){
  const js=JSON.stringify(devTplData(),null,1);
  const slots=devSlots(), rows=[];
  for(let i=0;i<3;i++){
    const s=slots[i];
    rows.push(s
      ? `<div class="dv-slot"><span class="nm">${devEsc(s.name)}
           <small>MID_DIP ${s.data.MID_DIP} · DIP ${s.data.DIP} · ${devEsc(s.at||'')}</small></span>
         <button class="dv-btn sm" data-slotload="${i}">불러오기</button>
         <button class="dv-btn sm danger" data-slotdel="${i}">✕</button></div>`
      : `<div class="dv-slot empty"><span class="nm">빈 슬롯</span>
         <button class="dv-btn sm" data-slotsave="${i}">지금 설정 저장</button></div>`);
  }
  return `<div class="dv-hd"><button class="bk" data-tplback="1">←</button>
      <span class="dv-title">📋 템플릿</span></div>
    <div class="dv-sec">지금 설정</div>
    <textarea class="dv-tplbox ${DEV.tplEdit?'edit':''}" id="dvTpl" ${DEV.tplEdit?'':'readonly'}>${devEsc(js)}</textarea>
    <div class="dv-row">${DEV.tplEdit
      ? `<button class="dv-btn" data-tpledit="0">취소</button><button class="dv-btn go" data-tplok="1">적용</button>`
      : `<button class="dv-btn go" data-tplsel="1">전체 선택</button><button class="dv-btn" data-tpledit="1">불러오기</button>`}</div>
    <div class="dv-note">${DEV.tplEdit
      ? '통째로 지우고 받은 JSON을 붙여넣은 뒤 <b>적용</b>을 눌러주세요.'
      : '길게 눌러 복사한 뒤 그대로 넘겨주시면 코드에 박아 드려요.'}</div>
    <div class="dv-sec">저장 슬롯</div>
    ${rows.join('')}
    <div class="dv-note">슬롯은 <b>전부 초기화에도 안 지워져요</b> — 맞춰둔 값을 잃으면 안 되니까요.</div>`;
}

function showDevModal(){
  const body = DEV.tpl ? devTplScreen()
    : DEV.tab==='meta'  ? devMetaTab()
    : DEV.tab==='start' ? devStartTab()
    : DEV.tab==='broke' ? devBrokeTab()
    : DEV.tab==='bal'   ? devBalTab()
    :                     devPatTab();
  const tabs = DEV.tpl ? '' : `<div class="dv-tabs">${DEV_TABS.map(([id,e,n])=>
    `<button class="dv-tab ${DEV.tab===id?'on':''}" data-tab="${id}"><b>${e}</b>${n}</button>`).join('')}</div>`;
  const foot = DEV.tpl ? '' : `<div class="dv-foot">
    <button class="dv-btn" data-tabreset="1">↺ 이 탭 기본값</button>
    <button class="dv-btn go" data-restart="1">▶ 재시작</button></div>`;
  $('modalBox').innerHTML=`
    <div class="dv-top"><span class="dv-title">🛠 테스트 도구</span>
      <span class="dv-state">${devState()}</span>
      <button class="dv-wipe" data-tpl="1">📋</button>
      <button class="dv-wipe" data-wipe="all">🧹</button></div>
    ${tabs}
    <div class="dv-scroll">${body}</div>
    ${foot}
    <button class="ok dark" id="mOk">닫기</button>`;
  openModal();
  bindDevModal();
}

function bindDevModal(){
  const box=$('modalBox');
  const q=(sel,fn)=>box.querySelectorAll(sel).forEach(fn);
  const again=()=>{ saveRun(); render(); showDevModal(); };

  q('[data-tab]',b=>b.onclick=()=>{ sfx.tap(); DEV.tab=b.dataset.tab; showDevModal(); });
  q('[data-tpl]',b=>b.onclick=()=>{ sfx.tap(); DEV.tpl=true; DEV.tplEdit=false; showDevModal(); });
  q('[data-tplback]',b=>b.onclick=()=>{ sfx.tap(); DEV.tpl=false; DEV.tplEdit=false; showDevModal(); });
  q('[data-wipe]',b=>b.onclick=()=>{ sfx.tap();
    const w=b.dataset.wipe; if(w==='all')showDevWipeModal(); else devWipe(w); });
  q('[data-tabreset]',b=>b.onclick=()=>{ sfx.tap(); devTabReset(); again(); });
  q('[data-restart]',b=>b.onclick=()=>{ sfx.pay();
    const t=tierIdx(); startRunAt(t);
    $('modal').classList.remove('on'); render(); toast('지금 설정으로 새 판을 열었어요'); });

  /* 패턴 */
  q('[data-patrow]',r=>r.onclick=e=>{
    if(e.target.closest('.pat-w'))return;          // ± 는 강제 선택이 아니다
    sfx.tap(); const id=r.dataset.patrow;
    DEV.pat = DEV.pat===id ? null : id; showDevModal(); });
  q('[data-w]',b=>b.onclick=()=>{ sfx.tap();
    const id=b.dataset.w;
    if(!DEV.w){ DEV.w={}; PATTERNS.forEach((p,k)=>DEV.w[p.id]=BASE_WEIGHTS[k]); }
    DEV.w[id]=Math.max(0,Math.min(0.6,+(DEV.w[id]+ +b.dataset.d).toFixed(2)));
    applyTierWeights(); showDevModal(); });
  q('[data-redraw]',b=>b.onclick=()=>{ sfx.tap(); showDevModal(); });

  /* 🧬 메타 — 공식과 문턱 */
  q('[data-xpm]',b=>b.onclick=()=>{ sfx.tap();
    XP_LOG_MULT=Math.max(2,Math.min(80,XP_LOG_MULT + +b.dataset.xpm)); showDevModal(); });
  q('[data-exp]',b=>b.onclick=()=>{ sfx.tap();
    EARLY_XP_PER_DAY=Math.max(0,Math.min(40,EARLY_XP_PER_DAY + +b.dataset.exp)); showDevModal(); });
  q('[data-txm]',b=>b.onclick=()=>{ sfx.tap();
    TIER_XP_MULT=Math.max(0.1,Math.min(5,+(TIER_XP_MULT + +b.dataset.txm).toFixed(1))); showDevModal(); });
  q('[data-bp]',b=>b.onclick=()=>{ sfx.tap();
    BANKRUPT_PENALTY=Math.max(0,Math.min(1,+(BANKRUPT_PENALTY + +b.dataset.bp).toFixed(2))); showDevModal(); });
  q('[data-need]',b=>b.onclick=()=>{ sfx.tap();
    const u=META_UNLOCKS[+b.dataset.need];
    u.need=Math.max(0,u.need + +b.dataset.d); again(); });
  q('[data-needall]',b=>b.onclick=()=>{ sfx.tap();
    const f=+b.dataset.needall;
    META_UNLOCKS.forEach(u=>u.need=Math.max(0,Math.round(u.need*f))); again(); });

  /* 🎬 시작 — XP·해금·난이도는 상태라서 여기다 */
  q('[data-lang]',b=>b.onclick=()=>{ sfx.tap(); setLang(b.dataset.lang); again(); });
  q('[data-xp]',b=>b.onclick=()=>{ sfx.tap();
    const v=b.dataset.xp;
    META.xp = v[0]==='+' ? (META.xp|0)+ +v.slice(1) : +v;
    /* 권한은 이제 승진에서 고르는 것이라 XP만 밀면 안 따라온다 —
       도구에서는 XP만큼을 원래 순서대로 맞춰 준다(grantByXp). */
    grantByXp(); saveMeta(); again(); });
  q('[data-tier]',b=>b.onclick=()=>{ sfx.tap();
    S.tier=+b.dataset.tier; applyTierWeights(); S.daysLeft=gateDaysOf(S.gate||0); again(); });

  /* 시작 */
  q('[data-scash]',b=>b.onclick=()=>{ sfx.tap(); START_CASH=+b.dataset.scash; showDevModal(); });
  q('[data-cash]',b=>b.onclick=()=>{ sfx.tap();
    S.cash=Math.round(S.cash*(+b.dataset.cash));
    S.peakCash=Math.max(S.peakCash||0,S.cash); setBet(S.betAmount); again(); });
  q('[data-goal]',b=>b.onclick=()=>{ sfx.tap();
    if(!gateDone()){ S.cash=Math.max(MIN_BET,gateOf().goal-10000);
      S.peakCash=Math.max(S.peakCash||0,S.cash); setBet(S.betAmount); } again(); });
  q('[data-minlev]',b=>b.onclick=()=>{ sfx.tap();
    MIN_LEVERAGE=+b.dataset.minlev;
    S.betLeverage=Math.max(MIN_LEVERAGE,S.betLeverage||MIN_LEVERAGE); again(); });
  q('[data-maxlev]',b=>b.onclick=()=>{ sfx.tap();
    const i=LEVERAGE_MULTS.indexOf(+b.dataset.maxlev);
    if(i>=0)S.upg.leverageLv=i; again(); });
  q('[data-gate]',b=>b.onclick=()=>{ sfx.tap();
    if(b.dataset.gate==='last'){ S.gate=GATES.length-1; S.level=GATES.length; }
    else S.gate=Math.min(GATES.length-1,(S.gate||0)+1);
    S.daysLeft=gateDaysOf(S.gate);
    S.cash=Math.max(MIN_BET,Math.round(GATES[S.gate].goal*0.5));
    S.peakCash=Math.max(S.peakCash||0,S.cash); setBet(S.betAmount); again(); });
  q('[data-days]',b=>b.onclick=()=>{ sfx.tap(); S.daysLeft=+b.dataset.days; again(); });
  q('[data-gdays]',b=>b.onclick=()=>{ sfx.tap();
    const d=+b.dataset.gdays;
    GATE_DAYS=GATE_DAYS.map(x=>Math.max(1,x+d));
    S.daysLeft=gateDaysOf(S.gate||0); again(); });

  /* 💸 파산 — 수치 */
  q('[data-minbet]',b=>b.onclick=()=>{ sfx.tap();
    MIN_BET=Math.max(100,Math.min(1e8,Math.round(MIN_BET*(+b.dataset.minbet))));
    BROKE_LIMIT=MIN_BET; setBet(S.betAmount); again(); });
  q('[data-liq]',b=>b.onclick=()=>{ sfx.tap();
    LIQ_K=Math.max(0.2,Math.min(2,+(LIQ_K + +b.dataset.liq).toFixed(2))); again(); });
  q('[data-exd]',b=>b.onclick=()=>{ sfx.tap();
    EXTEND_DAYS=Math.max(1,Math.min(20,EXTEND_DAYS + +b.dataset.exd)); again(); });
  q('[data-exc]',b=>b.onclick=()=>{ sfx.tap();
    EXTEND_COST_FRAC=Math.max(0,Math.min(0.9,+(EXTEND_COST_FRAC + +b.dataset.exc).toFixed(2))); again(); });
  q('[data-broke]',b=>b.onclick=()=>{ sfx.tap();
    const now=b.dataset.broke==='now';
    S.cash = now ? 0 : MIN_BET;
    S.betAmount=MIN_BET; saveRun(); render();
    if(now){ $('modal').classList.remove('on'); checkBankrupt(); }
    else showDevModal(); });
  q('[data-screen]',b=>b.onclick=()=>{ sfx.tap();
    $('modal').classList.remove('on');
    if(b.dataset.screen==='default')showDefaultModal();
    else showSettleModal(settleOf(0)); });

  /* 밸런스 */
  q('[data-mid]',b=>b.onclick=()=>{ sfx.tap();
    MID_DIP=Math.max(0,Math.min(1.5,+(MID_DIP + +b.dataset.mid).toFixed(1))); showDevModal(); });
  q('[data-dip]',b=>b.onclick=()=>{ sfx.tap();
    DIP=Math.max(0.60,Math.min(0.98,+(DIP + +b.dataset.dip).toFixed(2))); showDevModal(); });
  q('[data-acc]',b=>b.onclick=()=>{ sfx.tap(); S.upg.infoLv=+b.dataset.acc; again(); });
  q('[data-bonus]',b=>b.onclick=()=>{ sfx.tap();
    EARLY_BONUS_RATE=Math.max(0,Math.min(0.5,+(EARLY_BONUS_RATE + +b.dataset.bonus).toFixed(2)));
    showDevModal(); });

  /* 템플릿 */
  q('[data-tplsel]',b=>b.onclick=()=>{ sfx.tap();
    const t=$('dvTpl'); t.focus(); t.setSelectionRange(0,t.value.length);
    toast('길게 눌러 복사하세요'); });
  q('[data-tpledit]',b=>b.onclick=()=>{ sfx.tap();
    DEV.tplEdit=b.dataset.tpledit==='1'; showDevModal(); });
  q('[data-tplok]',b=>b.onclick=()=>{ sfx.tap();
    let o=null;
    try{ o=JSON.parse($('dvTpl').value); }catch(e){ toast('JSON을 못 읽었어요'); return; }
    const err=devTplApply(o);
    if(err){ toast(err); return; }
    DEV.tplEdit=false; toast('설정을 불러왔어요'); again(); });
  q('[data-slotsave]',b=>b.onclick=()=>{ sfx.tap();
    const i=+b.dataset.slotsave, a=devSlots();
    const nm=(prompt('이름을 붙여주세요','안 '+(i+1))||'').trim();
    if(!nm)return;
    const d=new Date();
    a[i]={name:nm.slice(0,20), at:`${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, data:devTplData()};
    devSlotsSave(a); showDevModal(); });
  q('[data-slotload]',b=>b.onclick=()=>{ sfx.tap();
    const s=devSlots()[+b.dataset.slotload];
    if(!s)return;
    const err=devTplApply(s.data);
    toast(err||`"${s.name}" 불러왔어요`); again(); });
  q('[data-slotdel]',b=>b.onclick=()=>{ sfx.tap();
    const a=devSlots(); a[+b.dataset.slotdel]=null; devSlotsSave(a); showDevModal(); });

  $('mOk').onclick=()=>{ sfx.tap(); $('modal').classList.remove('on'); saveRun(); render(); };
}
/* 로고 연타 — 2번을 1.5초 "안에 전부" 눌러야 한다. 탭 간격만 재면 느긋하게
   눌러도 계속 쌓여서 실수로 열릴 수 있다. 연타 전체를 창 안에 가둔다.
   2번은 브라우저 더블탭 확대와 겹치므로 .brand에 touch-action:manipulation을 걸어뒀다. */
let devTaps=0, devFirst=0;
$('lvChip').onclick=()=>{
  if(S.activeRound||$('modal').classList.contains('on'))return;
  sfx.tap(); showRecordModal();
};
$('brandTap').onclick=()=>{
  const now=Date.now();
  if(now-devFirst>1500){ devFirst=now; devTaps=1; } else devTaps++;
  if(devTaps>=2){ devTaps=0; devFirst=0;
    if(!$('modal').classList.contains('on') && !S.activeRound){ sfx.pay(); showDevModal(); } }
};
/* ===== 메뉴바 =====
   언어 전환이 사는 자리. 번역이 끝나기 전까지는 🛠 도구 안에 숨겨 뒀는데,
   master가 곧 실서비스라 반쪽짜리 영어가 그대로 나가는 걸 막으려던 것이었다.
   이제 영어에 한글이 한 곳도 안 남아서 꺼냈다.

   항목 높이는 38px이다. 48px 규칙에서 뺀 유일한 자리인데, 메뉴는 손가락을
   휘둘러 누르는 곳이 아니라 연 다음 정확히 겨냥하는 곳이기 때문이다.
   대신 여는 버튼(언어(L))은 48px을 지킨다. */
let MENU_OPEN=null;
function closeMenu(){
  MENU_OPEN=null;
  const d=document.querySelector('.menu'); if(d)d.remove();
  const b=$('setBtn'); if(b)b.classList.remove('on');
}
/* 메뉴바 두 개(언어·도움말)가 톱니 하나로 합쳐졌다. 항목이 넷뿐이라 한 장에
   다 들어가고, 51px짜리 줄을 상시로 이고 있을 이유가 없어졌다. */
function openMenu(){
  closeMenu();
  MENU_OPEN='set';
  const host=$('topbar'), btn=$('setBtn');
  btn.classList.add('on');
  const d=document.createElement('div');
  d.className='menu';
  const rd=on=>`<span class="rd">${on?'\u25cf':''}</span>`;   // 98의 라디오 표시
  d.innerHTML=`<button data-set="ko">${rd(LANG==='ko')}${t('mnKo')}</button>`
    +`<button data-set="en">${rd(LANG==='en')}${t('mnEn')}</button>`
    +`<button data-set="auto">${rd(false)}${t('mnAuto')}</button>`
    +`<hr><button data-do="intro"><span class="rd"></span>${t('mnIntro')}</button>`;
  host.appendChild(d);
  d.querySelectorAll('[data-set]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); sfx.tap();
    const v=b.dataset.set;
    /* '브라우저 설정 따르기'는 저장값을 지운다 — 이미 detectLang이 하던 일을
       사용자에게 드러낸 것뿐이다. */
    if(v==='auto'){ try{ localStorage.removeItem(LANG_KEY); }catch(x){} setLang(detectLang()); }
    else setLang(v);
    closeMenu();
  });
  d.querySelectorAll('[data-do]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); sfx.tap(); closeMenu(); showIntroModal();
  });
}
document.addEventListener('click',e=>{
  if(e.target.closest('#setBtn')){ e.stopPropagation(); sfx.tap(); MENU_OPEN?closeMenu():openMenu(); return; }
  if(!e.target.closest('.menu'))closeMenu();
});

/* 대화상자가 뜨고 닫힐 때 부모 창의 제목표를 죽이고 살린다. 98은 배경을 어둡게
   덮지 않고 제목표 색 하나로만 초점을 옮긴다 — 그걸 알아보는 사람이 많다.
   modal에 .on이 붙고 떨어지는 자리가 열 곳이 넘어서, 관찰자로 한 번에 묶는다. */
(function watchModal(){
  const m=$('modal'), tb=$('topbar');
  if(!m||!tb)return;
  /* 제목표의 × — 98에서 X는 "취소"다. 고를 것이 있는 대화상자(은퇴)는 취소 쪽을,
     확인만 있는 대화상자는 그 버튼을 누른다. 버튼이 하나도 없으면 그냥 닫는다.
     죽은 X를 달아 두느니 각 대화상자가 이미 가진 출구로 보낸다. */
  $('modalX').onclick=()=>{
    const no=$('mNo'), ok=$('mOk');
    if(no)no.click(); else if(ok)ok.click(); else m.classList.remove('on');
  };
  const sync=()=>{
    const on=m.classList.contains('on');
    tb.classList.toggle('off', on);
    if(!on)return;
    /* 대화상자 제목표 — 제목은 프로그램 이름이다. 98의 메시지 상자가 그랬고,
       무엇보다 본문의 .tt가 이미 그 판의 문장을 크게 말하고 있어서, 여기에
       같은 문장을 또 올리면 한 화면에서 같은 말을 두 번 읽힌다.
       아이콘만 본문 것을 16px로 줄여 가져온다 — 그래야 무슨 대화상자인지가
       제목표만 봐도 구분된다. */
    const emo=$('modalBox').querySelector('.emo');
    $('modalBarTitle').textContent=t('brandA').replace('&nbsp;',' ')+t('brandB');
    $('modalBarIcon').innerHTML=emo
      ? emo.innerHTML.replace('width="48" height="48"','width="16" height="16"')
      : ic('app',1);
  };
  new MutationObserver(sync).observe(m,{attributes:true,attributeFilter:['class']});
  sync();
})();
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}

$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();paintMute();if(!META.mute)sfx.tap();};
/* 규칙을 다시 볼 곳이 필요하다 — 인트로는 한 번 닫으면 끝이었다.
   칩은 이미 탑바에 있으니 블록이 늘지 않는다. */
$('repayChip').onclick=()=>{
  if($('modal').classList.contains('on')||S.activeRound)return;
  sfx.tap(); showIntroModal();
};

/* main tick — 0.05초 간격으로 라운드 진행/자동익절/파산 체크 */
setInterval(()=>{
  const now=Date.now();
  S.lastTick=now;
  if($('modal').classList.contains('on'))return;
  if(S.activeRound){
    const idx=currentTickIdx();
    const mult=S.activeRound.path[idx];
    if(idx>=S.activeRound.path.length-1){ sellRound(false); return; }
    renderRoundView();
  }else{
    checkBankrupt();
  }
}, ROUND_TICK_MS);
setInterval(saveRun, 3000);
window.addEventListener('pagehide', saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

render();
if(META.pendingSettle){ showSettleModal(META.pendingSettle); }
if(!checkBankrupt() && awayReport && awayReport.awaySec>=60) showAwayModal(awayReport);
if(!$('modal').classList.contains('on') && META.introV!==INTRO_V && !gateDone() && S.dayCount===0) showIntroModal();
</script>
</body>
</html>
