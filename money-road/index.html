<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>머니로드 · 단타 게임</title>
<meta name="description" content="10만원 시드로 시작해서 15초 단타로 자산을 불리는 게임">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --blue:#3182F6; --blue-weak:#e8f2ff; --blue-press:#1b64da;
    --red:#f04452; --red-weak:#fdecee; --green:#00c471; --gold:#ffb020;
    --ink:#191f28; --gray:#4e5968; --gray2:#8b95a1; --gray3:#b0b8c1;
    --line:#f2f4f6; --bg:#f2f4f6; --card:#ffffff; --field:#f9fafb;
    --radius:20px; --shadow:0 4px 20px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;}
  body{font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.4; letter-spacing:-.02em; overflow-x:hidden;
    overscroll-behavior-y:contain;}
  html{overscroll-behavior-y:contain;}
  #app{max-width:460px; margin:0 auto; min-height:100vh; position:relative; padding-bottom:calc(24px + var(--safe-b));}

  .topbar{position:sticky; top:0; z-index:20; background:var(--bg); display:flex; align-items:flex-start;
    justify-content:space-between; gap:10px; padding:12px 20px 8px;
    box-shadow:0 6px 12px -8px rgba(0,0,0,.12);}
  .topbar .brand{font-size:18px; font-weight:800;} .topbar .brand span{color:var(--blue);}
  .top-right{display:flex; flex-direction:column; align-items:flex-end; gap:6px;}
  .top-right-row{display:flex; align-items:center; gap:8px;}
  .rank-chip{font-size:11.5px; font-weight:800; color:var(--blue); background:var(--blue-weak); padding:5px 10px; border-radius:999px; white-space:nowrap; font-variant-numeric:tabular-nums;}
  .lv-chip{font-size:13px; font-weight:800; color:var(--gray); background:var(--card); padding:7px 12px; border-radius:999px; box-shadow:var(--shadow);}
  .icon-btn{border:none; background:var(--card); color:var(--gray); width:36px; height:36px; border-radius:12px; font-size:15px; box-shadow:var(--shadow); display:grid; place-items:center; cursor:pointer;}

  /* 레벨 진행바 */
  .level-strip{margin:2px 20px 0; padding:0 2px;}
  .lv-row{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:5px;}
  .lv-name{font-size:12.5px; font-weight:800; color:var(--gray); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lv-name small{font-weight:700; color:var(--gray3); font-size:11px; margin-left:4px;}
  .lv-pct{font-size:12.5px; font-weight:800; color:var(--green); flex-shrink:0;}
  .lv-bar{height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .lv-bar>i{display:block; height:100%; width:0; border-radius:999px; background:linear-gradient(90deg,var(--green),#00e5a0); transition:width .3s;}
  .lv-name b{color:var(--ink); font-weight:900;}
  .dday{font-size:13px; font-weight:900; color:var(--gray2); font-variant-numeric:tabular-nums; flex-shrink:0;}
  .repay-sub{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:5px;
    font-size:10.5px; font-weight:700; color:var(--gray3);}
  .extend{border:none; background:var(--red-weak); color:var(--red); font-size:10.5px; font-weight:900;
    border-radius:8px; padding:4px 9px; cursor:pointer; white-space:nowrap;}
  /* 기한 경고 3단계 — D 숫자만 작아지면 "갑자기 마감"으로 느껴진다. 색과 문구가 같이 움직여야 다가오는 게 보인다. */
  .dday.p-warn{color:var(--gold);}
  .dday.p-bad{color:var(--red);}
  .dday.last{color:var(--red); animation:ddayPulse 1.5s ease-in-out infinite;}
  @keyframes ddayPulse{0%,100%{opacity:1} 50%{opacity:.4}}
  .repay-sub b{font-weight:900; color:var(--gray2);}
  .repay-sub.p-warn b{color:var(--gold);}
  .repay-sub.p-bad b{color:var(--red);}
  /* 진행바도 같이 물든다 — 색이 한 곳에서만 변하면 경고로 안 읽힌다 */
  .lv-bar.p-warn>i{background:linear-gradient(90deg,#f0a500,var(--gold));}
  .lv-bar.p-bad>i{background:linear-gradient(90deg,#d32f3c,var(--red));}
  /* 시작 버튼 위 한 줄 — 평소엔 안 뜨고, 페이스가 위험할 때만 나온다 */
  .pace-line{font-size:11.5px; font-weight:800; text-align:center; padding:8px; border-radius:11px; margin-bottom:9px;}
  .pace-line.p-warn{background:#fff8e8; color:#b57800;}
  .pace-line.p-bad{background:var(--red-weak); color:var(--red);}
  .trade-go.danger{background:linear-gradient(135deg,#f04452,#ff6b78); box-shadow:0 8px 20px rgba(240,68,82,.3);}
  /* 결과 팝업 맨 아래 장 마감 줄 */
  .rs-close{margin-top:12px; padding:10px 12px; border-radius:12px; background:var(--field); border:1px solid var(--line);}
  .cl-top{display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-size:11.5px; font-weight:800; color:var(--gray2);}
  .cl-top.one{justify-content:center;}
  .cl-dd{font-variant-numeric:tabular-nums; color:var(--gray); flex-shrink:0;}
  .cl-dd b{font-size:14px;}
  .rs-close.p-warn{background:#fff8e8; border-color:#ffe3ad;}
  .rs-close.p-warn .cl-dd{color:#b57800;}
  .rs-close.p-bad{background:var(--red-weak); border-color:#fbd2d6;}
  .rs-close.p-bad .cl-dd{color:var(--red);}
  .rs-close.p-done{background:#e7f9f1; border-color:#b8ecd6;}
  .rs-close.p-done .cl-dd{color:var(--green);}
  .intro-li{display:flex; gap:9px; align-items:flex-start; text-align:left; font-size:12.5px;
    font-weight:700; color:var(--gray); line-height:1.55; margin-top:9px;}
  .intro-li .e{flex-shrink:0; font-size:14px; line-height:1.4;}
  @media (prefers-reduced-motion:reduce){ .dday.last{animation:none;} }

  /* 잔고는 sticky 상단바에 둔다 — 히어로 카드는 스크롤하면 사라져서 정작 베팅할 때 안 보였고,
     지갑 줄·파산선 안내까지 합쳐 같은 숫자가 화면에 세 번 나왔다. */
  .tb-left{min-width:0;}
  .cash-top{font-size:23px; font-weight:900; letter-spacing:-.04em; margin-top:1px;
    font-variant-numeric:tabular-nums; white-space:nowrap;}

  /* 메인 탭 스위처 */
  .main-tabs{display:flex; gap:6px; margin:14px 20px 0; background:var(--card); border-radius:15px; padding:5px; box-shadow:var(--shadow);}
  .main-tab{flex:1; text-align:center; padding:11px; border-radius:11px; font-size:14px; font-weight:800; color:var(--gray2); background:transparent; border:none; cursor:pointer;}
  .main-tab.on{background:var(--ink); color:#fff;}

  /* 단타 패널 */
  .trade-panel{margin:12px 20px 0; background:var(--card); border-radius:20px; padding:14px 16px 16px; box-shadow:var(--shadow);}
  .tp-head{display:flex; justify-content:flex-start; align-items:center; margin-bottom:9px;}
  .tp-limit{font-size:11.5px; font-weight:700; color:var(--gray2); background:var(--field); padding:4px 9px; border-radius:999px;}
  .stock-tabs{display:flex; gap:7px; margin-bottom:11px;}
  .stock-tab{flex:1; border:2px solid var(--line); background:var(--card); border-radius:14px; padding:9px 8px; cursor:pointer; text-align:center;}
  .stock-tab.sel{border-color:var(--blue); background:var(--blue-weak);}
  .stock-tab.locked{opacity:.45; cursor:default;}
  .stock-tab.mini{flex:0 0 auto; padding:9px 11px;}
  .stock-tab.mini .n{font-size:10.5px; color:var(--gray2);}
  .stock-tab .e{font-size:19px;}
  .stock-tab .n{font-size:12px; font-weight:800; margin-top:2px;}
  .stock-tab .v{font-size:10px; font-weight:700; color:var(--gray2); margin-top:1px;}

  .bet-row{display:flex; align-items:center; gap:8px; background:var(--field); border-radius:14px; padding:8px 10px; margin-bottom:9px;}
  .bet-row button{width:38px; height:38px; border:none; background:var(--card); border-radius:11px; font-size:18px; font-weight:800; color:var(--ink); box-shadow:var(--shadow); cursor:pointer;}
  .bet-row .amt{flex:1; text-align:center; font-size:17px; font-weight:900; font-variant-numeric:tabular-nums;}
  .bet-quicks{display:flex; gap:6px; margin-bottom:9px;}
  .bet-quicks button{flex:1; border:none; background:var(--field); color:var(--gray); font-weight:800; font-size:12px; padding:8px 0; border-radius:10px; cursor:pointer;}
  .bet-quicks button:active{background:var(--blue-weak); color:var(--blue);}
  .auto-row{display:flex; gap:6px; margin-bottom:11px;}
  .auto-row button{flex:1; border:2px solid var(--line); background:var(--card); color:var(--gray); font-weight:800; font-size:11.5px; padding:8px 0; border-radius:10px; cursor:pointer;}
  .auto-row button.sel{border-color:var(--blue); background:var(--blue-weak); color:var(--blue);}
  .lev-row button{padding:7px 0 6px; line-height:1.15;}
  .lev-row button small{display:block; font-size:9.5px; font-weight:700; color:var(--gray3); margin-top:2px;}
  .lev-row button.sel small{color:var(--blue); opacity:.8;}
  .auto-label{font-size:11px; font-weight:700; color:var(--gray3); margin-bottom:6px;}
  .trade-go{width:100%; border:none; border-radius:14px; padding:14px; font-size:15.5px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#3182F6,#4c8dff); box-shadow:0 8px 20px rgba(49,130,246,.3);}
  .trade-go:disabled{background:var(--line); color:var(--gray3); box-shadow:none; cursor:default;}
  .trade-note{font-size:11.5px; color:var(--gray3); font-weight:600; text-align:center; margin-top:9px; line-height:1.5;}

  /* 진행중인 라운드 */
  .round-view{text-align:center;}
  .round-timer{font-size:11.5px; font-weight:800; color:var(--gray2); font-variant-numeric:tabular-nums;
    display:flex; justify-content:space-between; gap:8px;}
  .round-timer .rt-r{transition:color .2s;}
  .round-timer .rt-r.warn{color:var(--red);}
  .round-mult{font-size:40px; font-weight:900; letter-spacing:-.03em; margin:4px 0; font-variant-numeric:tabular-nums;
    transition:transform .12s cubic-bezier(.2,1.6,.4,1), color .18s;}
  .round-mult.up{color:var(--red);} .round-mult.down{color:var(--blue);} .round-mult.flat{color:var(--gray2);}
  .round-chartbox{position:relative; margin:4px 0 10px; border-radius:12px;}
  .round-chart{width:100%; height:150px; display:block; background:var(--field); border-radius:12px;}
  .round-view.tense .round-chartbox{animation:rvEdge .5s ease-in-out infinite alternate;}
  @keyframes rvEdge{ from{box-shadow:inset 0 0 0 0 rgba(240,68,82,0);} to{box-shadow:inset 0 0 0 2px var(--red);} }
  .round-count{position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:56px; font-weight:900; color:var(--red); opacity:0; pointer-events:none;
    font-variant-numeric:tabular-nums;}
  .round-count.on{animation:rvCnt .95s ease-out;}
  @keyframes rvCnt{ 0%{opacity:.5; transform:scale(.7);} 70%{opacity:.16;} 100%{opacity:0; transform:scale(1.4);} }
  .rv-txt{stroke:var(--field); stroke-width:2.5px; paint-order:stroke fill; stroke-linejoin:round;}
  .rv-pulse{transform-box:fill-box; transform-origin:center; animation:rvPulse 1.15s ease-out infinite;}
  @keyframes rvPulse{ 0%{transform:scale(1); opacity:.5;} 100%{transform:scale(3.4); opacity:0;} }
  @media(prefers-reduced-motion:reduce){
    .rv-pulse,.round-view.tense .round-chartbox,.round-count.on{animation:none;}
    .round-mult{transition:none;}
  }
  .round-pnl{font-size:13px; font-weight:800; margin-bottom:8px;}
  .round-pnl.up{color:var(--red);} .round-pnl.down{color:var(--blue);}
  .round-bar{height:3px; background:var(--line); border-radius:2px; margin-bottom:12px; overflow:hidden;}
  .round-bar i{display:block; height:100%; width:0%; background:var(--gray3);}
  .round-view.tense .round-bar i{background:var(--red);}
  .sell-btn{width:100%; border:none; border-radius:14px; padding:15px; font-size:16px; font-weight:900; color:#fff; cursor:pointer;
    background:linear-gradient(135deg,#f04452,#ff6b78); box-shadow:0 8px 20px rgba(240,68,82,.3);}

  /* 연승/오늘의 기록 스트립 */
  .strip{margin:9px 20px 0; background:var(--card); border-radius:16px; padding:10px 14px;
    box-shadow:var(--shadow); cursor:pointer;}
  .strip-row{display:flex; align-items:center; gap:10px; font-size:12px; font-weight:800; color:var(--gray);}
  .strip-row .fire{color:var(--red); font-weight:900;}
  .strip-row .cv{margin-left:auto; color:var(--gray3); font-weight:900; font-size:11px;}
  .strip-buff{display:flex; align-items:center; gap:8px; background:#fff9ec; border:2px solid #ffb02040;
    border-radius:12px; padding:8px 11px; margin-top:9px;}
  .strip-buff .e{font-size:17px;}
  .strip-buff .t{font-size:11.5px; font-weight:900; color:#8a5a00;}
  .strip-buff .d{font-size:10.5px; font-weight:700; color:var(--gray2); margin-top:1px;}
  .rec-grid{display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:10px;}
  .rec{background:var(--field); border-radius:11px; padding:8px 10px;}
  .rec .k{font-size:10px; font-weight:700; color:var(--gray2);}
  .rec .v{font-size:14px; font-weight:900; margin-top:1px; font-variant-numeric:tabular-nums;}
  .main-tab.locked{opacity:.35;}

  .section-title{font-size:13.5px; font-weight:800; color:var(--gray2); margin:18px 20px 8px;}

  .biz{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:16px; padding:12px 14px; margin:0 20px 8px; box-shadow:var(--shadow);}
  .biz .logo{width:42px; height:42px; border-radius:13px; background:var(--field); display:grid; place-items:center; font-size:21px; flex-shrink:0;}
  .biz .mid{flex:1; min-width:0;}
  .biz .nm{font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:6px;}
  .biz .cnt{font-size:11px; font-weight:800; color:var(--blue); background:var(--blue-weak); padding:1px 7px; border-radius:999px;}
  .biz .ds{font-size:12px; color:var(--gray2); font-weight:650; margin-top:2px;}
  .biz-buy{flex-shrink:0; border:none; border-radius:13px; padding:11px 14px; font-size:13px; font-weight:800; cursor:pointer; text-align:right; min-width:92px;}
  .biz-buy.can{background:var(--ink); color:#fff;}
  .biz-buy.cant{background:var(--field); color:var(--gray3);}
  .biz-buy .p{display:block; font-size:13.5px; font-weight:900;}
  .biz-buy .l{display:block; font-size:10.5px; font-weight:700; opacity:.75; margin-top:1px;}

  /* 장세 신호 */
  .signal{display:flex; align-items:center; gap:10px; border-radius:14px; padding:9px 12px; margin-bottom:10px; border:2px solid transparent;}
  .signal.strong{background:#e9f9f0; border-color:#00c47133;}
  .signal.mid{background:#fff6e5; border-color:#ffb02033;}
  .signal.weak{background:var(--red-weak); border-color:#f0445233;}
  .signal .sg-left{display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .signal .sg-emo{font-size:16px;}
  .signal .sg-name{font-size:13.5px; font-weight:900;}
  .signal.strong .sg-name{color:#00a862;} .signal.mid .sg-name{color:#c98600;} .signal.weak .sg-name{color:var(--red);}
  .signal .sg-mid{min-width:0;}
  .signal .sg-ds{font-size:11.5px; font-weight:700; color:var(--gray);}
  .signal .sg-acc{font-size:10.5px; font-weight:700; color:var(--gray3); margin-top:1px;}
  .liq-note{font-size:11px; font-weight:700; color:var(--gray2); background:var(--field); border-radius:10px; padding:7px 10px; margin-bottom:11px;}
  .liq-note b{color:var(--red); font-weight:900;}

  /* 거래 결과 카드 */
  .rs-badge{font-size:11px; font-weight:800; padding:3px 9px; border-radius:999px;}
  .rs-badge.hot{background:var(--red-weak); color:var(--red);}
  .rs-badge.cold{background:var(--field); color:var(--gray2);}
  .rs-sum{font-size:19px; font-weight:900; font-variant-numeric:tabular-nums;}
  .rs-sum.up{color:var(--red);} .rs-sum.down{color:var(--blue);}
  .rs-rank{font-size:11.5px; font-weight:700; color:var(--gray2); margin-top:3px; font-variant-numeric:tabular-nums;}
  .rs-rank b{color:var(--ink); font-weight:800;}
  .rs-rank .up{color:var(--green); font-weight:800;} .rs-rank .down{color:var(--red); font-weight:800;}
  .rs-like{color:var(--gray3); font-weight:800; font-size:11px; margin-left:5px; white-space:nowrap;}
  /* 거래 결과 — 번 돈이 주인공, 나머지는 칩으로 분리(쩜으로 이어붙이지 않는다) */
  .rs-money{font-size:28px; font-weight:900; letter-spacing:-.04em; font-variant-numeric:tabular-nums;
    line-height:1.15; margin-top:2px;}
  .rs-money.up{color:var(--red);} .rs-money.down{color:var(--blue);}
  .rs-sub{font-size:12.5px; font-weight:700; color:var(--gray2); margin-top:2px;}
  .rs-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px;}
  .rs-chip{font-size:11px; font-weight:800; border-radius:9px; padding:5px 9px;
    background:var(--field); color:var(--gray);}
  .rs-chip.grade{background:#e9f9f0; color:#00a862;}
  .rs-chip.grade.low{background:var(--blue-weak); color:var(--blue);}
  .rs-chip.lev{background:var(--blue-weak); color:var(--blue);}
  .rs-chip.streak{background:#fff9ec; color:#8a5a00;}
  .rs-rankline{margin-top:10px; padding-top:10px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; font-size:12px; font-weight:800; color:var(--gray);
    font-variant-numeric:tabular-nums;}
  .rs-rankline .u{color:var(--green);} .rs-rankline .d{color:var(--red);}
  .rs-box{text-align:left; max-height:56vh; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .rs-wallet{margin-top:12px; padding-top:10px; border-top:1px solid var(--line);
    font-size:12px; font-weight:700; color:var(--gray2); font-variant-numeric:tabular-nums;}
  .rs-wallet b{color:var(--ink); font-weight:900;}
  /* 최소 베팅/빚 안내 */
  .min-note{font-size:11px; font-weight:700; color:var(--gray2); background:var(--field);
    border-radius:10px; padding:7px 10px; margin-bottom:9px;}
  .min-note b{color:var(--ink); font-weight:900;}
  .opt-row{display:flex; gap:6px; margin-bottom:9px;}
  .opt{flex:1; border:none; background:var(--field); border-radius:10px; padding:8px 10px;
    font-size:11px; font-weight:800; color:var(--gray2); text-align:left; cursor:pointer;
    display:flex; align-items:center; gap:5px;}
  .opt b{color:var(--blue); font-weight:900; margin-left:auto;}
  .opt.open{background:var(--blue-weak);}
  .opt.room{flex:0 0 auto; cursor:default; font-variant-numeric:tabular-nums;}
  .buff-line{display:flex; align-items:center; gap:7px; background:#fff9ec; border:1.5px solid #ffb02040;
    border-radius:10px; padding:7px 10px; margin-bottom:9px; font-size:11px; font-weight:800;
    color:#8a5a00;}
  .rv-wallet{font-size:11px; font-weight:700; color:var(--gray3); margin-bottom:8px;
    font-variant-numeric:tabular-nums;}
  .rv-wallet b{color:var(--gray); font-weight:800;}
  .debt-note{font-size:11px; font-weight:700; color:#8a5a00; background:#fff9ec;
    border-radius:10px; padding:7px 10px; margin-bottom:9px;}
  /* 판이 끝난 뒤 경험치 정산 */
  .xp-tbl{text-align:left; margin-top:15px; display:flex; flex-direction:column; gap:5px;
    font-size:13px; font-weight:700; color:var(--gray);}
  .xp-tbl>div{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
    font-variant-numeric:tabular-nums;}
  .xp-tbl b{font-weight:800; color:var(--ink); flex-shrink:0;}

<script>
"use strict";
const $=id=>document.getElementById(id);
const RUN_KEY='moneyroad2_run_v12', META_KEY='moneyroad2_meta_v5';

function fmtWon(v){const neg=v<0;let x=Math.round(Math.abs(v));if(x<10000)return (neg?'-':'')+x.toLocaleString()+'원';
  const eok=Math.floor(x/100000000),man=Math.floor((x%100000000)/10000);let s='';if(eok)s+=eok+'억';if(man)s+=(s?' ':'')+man.toLocaleString()+'만';return (neg?'-':'')+s+'원';}
const won=n=>Math.round(n).toLocaleString()+'원';
function randn(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

/* audio */
let AC=null;
function beep(f,d,t='sine',vol=.15){if(META.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t;o.frequency.value=f;o.connect(g);g.connect(AC.destination);g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.start();o.stop(AC.currentTime+d);}catch(e){}}
const sfx={tap:()=>beep(720,.05,'triangle',.09),buy:()=>{beep(520,.07,'square',.1);setTimeout(()=>beep(780,.09,'square',.1),60);},pay:()=>{beep(880,.08,'sine',.13);setTimeout(()=>beep(1180,.12,'sine',.12),70);},warn:()=>beep(300,.15,'sawtooth',.12),win:()=>{[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.16,'triangle',.14),i*100));},bankrupt:()=>{[400,340,280,220].forEach((f,i)=>setTimeout(()=>beep(f,.22,'sawtooth',.1),i*130));}};

/* config: 현금은 오직 단타로만 는다. 상점(유료)은 단타를 더 잘/크게 하도록 돕기만 하고,
   스스로 현금을 만드는 장치는 두지 않는다. 해금(무료)은 레벨로 열린다. */
const LEVERAGE_MULTS=[1,2,3,5,10];
const STOPLOSS_COSTS=[80000,300000,900000];
const STOPLOSS_PCT=[0,0.15,0.30,0.45];
/* 최소 베팅액이 곧 파산선이다. 이 밑으로 떨어지면 한 판도 더 못 하므로 파산.
   레벨에 따라 올리지 않는다 — 후반에는 파산 위험이 사라지고 거기서부터는 은퇴가 마무리를 맡는다. */
const MIN_BET=10000;
const BROKE_LIMIT=MIN_BET;

/* ===== 빚내서 시작 =====
   시드머니는 내 돈이 아니라 대출이다. 빚이 남아 있는 동안 최소 레버리지가 강제된다.
   시뮬레이션(각 800회, sim/debt.js·sim/ruin.js): 3배 초보 파산률 76%(중앙 23판) → 2배 17% → 1배 0%.
   같은 3배라도 손절을 배우면 76% → 2%로 떨어진다 — 최소 배율은 이 게임에서 가장 센 난이도 다이얼이다.
   (파산선을 낮추거나 수수료·폭락 이벤트를 넣는 방법은 전부 실패했다. 1배 플레이는 손절이
    항상 먹혀서 한 판 손실이 손절폭으로 상한이 잡히고, 판당 기댓값이 1.09~1.34배라 돈이 마르지 않는다.
    큰 손실을 만들 수 있는 장치는 청산뿐이다.)

   예전에는 레거시 "빚 청산"을 사서 3 → 2 → 1로 내렸다. 반복 플레이의 보상이 곧 난이도
   완화였던 셈이라 트리와 함께 걷어냈고, 이 축은 난이도 선택으로 옮긴다(높은 단계를
   고를수록 최소 배율이 올라간다). 그 전까지는 현행 1회차와 같은 3배 고정. */
const MIN_LEVERAGE=3;
function minLevOf(){return MIN_LEVERAGE;}
function hasDebt(){return minLevOf()>1;}

/* 단타 종목 — 종목마다 변동성(pMult/noiseMult)이 다르다. 실제 가격 흐름은
   아래 PATTERNS(5종)이 만들고, 종목은 그 흐름의 진폭만 키운다. */
const TRADE_STOCKS=[
  {id:'stable', emo:'🏦', name:'사성전자', pMult:1.0, noiseMult:1.0},
  {id:'theme',  emo:'🚀', name:'네코프로', pMult:1.6, noiseMult:1.8},
  {id:'surge',  emo:'🔥', name:'유메이드', pMult:2.3, noiseMult:2.6},
];
const ROUND_TICKS=300, ROUND_TICK_MS=50; // 15초를 0.05초 단위로 나눠서 더 부드럽고 잦게 움직이게
const NOISE_SCALE=Math.sqrt(30/ROUND_TICKS); // 기존 30틱 기준으로 검증한 노이즈 강도를 촘촘한 해상도에 맞게 보정

function dev(base,mult){return Math.max(0.05,1+(base-1)*mult);}
/* 여러 구간(keypoint)을 사인 이징으로 잇는 범용 경로 생성기 — 구간을 몇 개, 어떤 값으로
   두느냐에 따라 상승/하락/V자는 물론 이중 바닥(W)·이중 고점(M)·지연 반응까지 전부 표현 가능 */
function buildMultiPhase(keypoints,noiseAmt){
  const kps=[[0,1],...keypoints];
  const path=[1]; let noise=0;
  for(let i=1;i<=ROUND_TICKS;i++){
    const frac=i/ROUND_TICKS;
    let seg=kps.length-2;
    for(let k=0;k<kps.length-1;k++){ if(frac<=kps[k+1][0]){seg=k;break;} }
    const [f0,v0]=kps[seg],[f1,v1]=kps[seg+1];
    const segFrac=(f1-f0)>0?(frac-f0)/(f1-f0):1;
    const s=Math.sin(Math.min(1,Math.max(0,segFrac))*Math.PI/2);
    const val=v0+(v1-v0)*s;
    noise+=noiseAmt*randn(); noise*=0.75;
    path.push(Math.max(0.05,val+noise));
  }
  return path;
}
function buildFlat(noiseAmt,driftAmt){
  const path=[1]; let noise=0; const drift=(Math.random()-0.5)*driftAmt;
  for(let i=1;i<=ROUND_TICKS;i++){
    noise+=noiseAmt*randn(); noise*=0.8;
    path.push(Math.max(0.05,1+drift*(i/ROUND_TICKS)+noise));
  }
  return path;
}
/* 10개 패턴 — 시뮬레이션으로 검증: 막눈 홀드 평균 0.955x(손해) vs 숙련 플레이 평균 1.498x(이득).
   패턴마다 요구하는 대응이 전부 달라서(즉시매도/버티기/중간에익절/초반무시 등),
   "일단 홀드"나 "일단 반응만 보고 팔기" 같은 단일 정답이 통하지 않는다. */
const PATTERNS=[
  {id:'up',emo:'📈',weight:.12,gen:st=>{
    const peakFrac=0.55+Math.random()*0.20, peakV=dev(1.4+Math.random()*0.7,st.pMult), endV=dev(1.15+Math.random()*0.35,st.pMult);
    return buildMultiPhase([[peakFrac,peakV],[1,endV]],0.012*NOISE_SCALE*st.noiseMult);
  }},
  {id:'down',emo:'📉',weight:.15,gen:st=>{
    const bottomFrac=0.5+Math.random()*0.25, botV=dev(0.4+Math.random()*0.3,st.pMult), endV=1+(botV-1)*(0.9+Math.random()*0.15);
    return buildMultiPhase([[bottomFrac,botV],[1,endV]],0.01*NOISE_SCALE*st.noiseMult);
  }},
  {id:'v',emo:'✅',weight:.12,gen:st=>{
    const bottomFrac=0.22+Math.random()*0.16, botV=dev(0.5+Math.random()*0.25,st.pMult), endV=dev(1.05+Math.random()*0.45,st.pMult);
    return buildMultiPhase([[bottomFrac,botV],[1,endV]],0.014*NOISE_SCALE*st.noiseMult);
  }},
  {id:'spike',emo:'🎢',weight:.10,gen:st=>{
    const peakFrac=0.08+Math.random()*0.17, peakV=dev(1.8+Math.random()*1.7,st.pMult), endV=dev(0.5+Math.random()*0.35,st.pMult);
    return buildMultiPhase([[peakFrac,peakV],[1,endV]],0.02*NOISE_SCALE*st.noiseMult);
  }},
  {id:'flat',emo:'➖',weight:.08,gen:st=>buildFlat(0.01*NOISE_SCALE*st.noiseMult,0.15*st.pMult)},
  {id:'invv',emo:'⛰️',weight:.10,gen:st=>{
    const peakFrac=0.4+Math.random()*0.2, peakV=dev(1.4+Math.random()*0.7,st.pMult), endV=dev(0.55+Math.random()*0.3,st.pMult);
    return buildMultiPhase([[peakFrac,peakV],[1,endV]],0.014*NOISE_SCALE*st.noiseMult);
  }},
  {id:'w',emo:'🌊',weight:.10,gen:st=>{
    const d1=dev(0.5+Math.random()*0.25,st.pMult), b1=dev(1.15+Math.random()*0.25,st.pMult), d2=dev(0.55+Math.random()*0.25,st.pMult), endV=dev(0.95+Math.random()*0.2,st.pMult);
    return buildMultiPhase([[0.22,d1],[0.5,b1],[0.75,d2],[1,endV]],0.013*NOISE_SCALE*st.noiseMult);
  }},
  {id:'m',emo:'🐫',weight:.10,gen:st=>{
    const p1=dev(1.35+Math.random()*0.35,st.pMult), d1=dev(0.75+Math.random()*0.2,st.pMult), p2=dev(1.05+Math.random()*0.2,st.pMult), endV=dev(0.65+Math.random()*0.2,st.pMult);
    return buildMultiPhase([[0.22,p1],[0.5,d1],[0.75,p2],[1,endV]],0.013*NOISE_SCALE*st.noiseMult);
  }},
  {id:'delayup',emo:'⏫',weight:.07,gen:st=>{
    const flatV=dev(0.98+Math.random()*0.08,1), endV=dev(1.6+Math.random()*0.5,st.pMult);
    return buildMultiPhase([[0.55,flatV],[1,endV]],0.008*NOISE_SCALE*st.noiseMult);
  }},
  {id:'delaydown',emo:'⏬',weight:.06,gen:st=>{
    const flatV=dev(0.98+Math.random()*0.08,1), endV=dev(0.4+Math.random()*0.25,st.pMult);
    return buildMultiPhase([[0.55,flatV],[1,endV]],0.008*NOISE_SCALE*st.noiseMult);
  }},
];
function pickPattern(){
  let r=Math.random(),acc=0;
  for(const p of PATTERNS){acc+=p.weight; if(r<=acc)return p;}
  return PATTERNS[PATTERNS.length-1];
}
function genRound(stock,patId){
  const pat=PATTERNS.find(p=>p.id===patId)||pickPattern();
  return {patternId:pat.id, patternEmo:pat.emo, path:pat.gen(stock)};
}

/* ===== 장세 신호 =====
   패턴을 "도달 가능한 고점이 얼마나 큰가"로 3단계로 묶는다. 베팅 전에 이 등급을
   확률적으로만 알려줘서, 레버리지를 지를 "근거"는 주되 확신은 주지 않는다.
   (패턴 힌트처럼 정답을 알려주면 게임이 무너지므로 일부러 틀릴 수 있게 둔다.)
   시뮬레이션 검증: 5배 사용 시 전액 손실률이 신호 없음 43% → 기본신호 15% → 정보력
   최대 4.6%로 떨어진다. 신호의 값어치는 수익 증가가 아니라 "사고를 줄이는 것"에 있다. */
const PATTERN_TIER={up:'strong',spike:'strong',delayup:'strong',
  v:'mid',w:'mid',m:'mid',invv:'mid',
  down:'weak',flat:'weak',delaydown:'weak'};
/* 하락 가중치 — 상승/하락 패턴의 등장 비율을 옮겨 판당 기댓값을 조절하는 다이얼.
   실측(각 800회, 관문+이월 5일 기준): +0%p 클리어 33% → +4%p 20% → +8%p 5%.
   1회차는 +4%p로 시작한다(클리어 20% · 성공 런 29분 · 실패 런 9분).
   나중에 회차 난이도를 붙이면 이 값을 회차마다 올리면 된다. */
const DOWN_SHIFT=0.04;
(function shiftPatternWeights(){
  const HALF=0.29;   // strong 합 = weak 합 = 0.29
  PATTERNS.forEach(p=>{
    const t=PATTERN_TIER[p.id];
    if(t==='weak')p.weight+=DOWN_SHIFT*(p.weight/HALF);
    else if(t==='strong')p.weight-=DOWN_SHIFT*(p.weight/HALF);
  });
  const tot=PATTERNS.reduce((a,p)=>a+p.weight,0);
  PATTERNS.forEach(p=>p.weight/=tot);
})();
const SIGNAL_TIERS=['strong','mid','weak'];
const SIGNAL_INFO={
  strong:{emo:'🟢',name:'강세',ds:'큰 고점이 나올 만한 장'},
  mid:   {emo:'🟡',name:'보통',ds:'적당한 고점은 기대해 볼 만한 장'},
  weak:  {emo:'🔴',name:'약세',ds:'고점 없이 흘러내리기 쉬운 장'},
};
/* 정보력 — 예전엔 30만/120만/500만에 85%까지 올라가서 Lv.4 전에 다 살 수 있었다.
   시뮬(각 500회, 목표 1억): 적중률 55% → 85%가 도달률은 97% → 98%로 거의 안 바꾸고
   도달 속도만 41판 → 29판으로 줄인다. 즉 정보력의 값어치는 "난이도"가 아니라 "속도"인데
   가격이 속도값에 비해 터무니없이 쌌다. 상한을 78%로 낮추고 가격을 성장 곡선에 맞춘다. */
const INFO_ACC=[0.55,0.62,0.70,0.78];
const INFO_COSTS=[30000000,400000000,5000000000];
function infoAccOf(){
  return INFO_ACC[Math.min(INFO_ACC.length-1,S.upg.infoLv||0)];
}
/* 다음 라운드의 패턴을 미리 뽑아두고 그에 대한 신호를 만든다. 라운드가 끝날 때만
   새로 뽑기 때문에, 탭을 옮기거나 종목을 바꿔서 좋은 신호가 뜰 때까지 돌리는 건 불가능. */
function rollPending(){
  const pat=pickPattern();
  const tier=PATTERN_TIER[pat.id]||'mid';
  let sig=tier;
  if(Math.random()>=infoAccOf()){
    const others=SIGNAL_TIERS.filter(t=>t!==tier);
    sig=others[Math.floor(Math.random()*others.length)];
  }
  S.pending={patId:pat.id, sig};
}
function ensurePending(){ if(!S.pending||!S.pending.patId)rollPending(); }
/* 레버리지 청산선: 배율 L에서 (mult-1)*L = -1 이 되는 지점 = 1-1/L */

/* ===== 상환 기한 =====
   시드머니가 대출이므로 채권자가 상환 일정을 준다. 라운드 한 판 = 하루 장(거래일).
   기한 안에 상환금에 못 닿으면 반대매매로 런 종료.

   왜 필요한가 — 시뮬레이션(각 500~800회)으로 다른 길을 전부 막아봤다:
     신호를 아예 삭제해도 클리어 99%, 신호를 100% 정확하게 하면 오히려 65판 → 49판,
     자산의 70%를 매 판 강제로 걸게 해도 88%, 목표를 100만 배 올려도 73판 → 154판.
     판당 기댓값이 3배에서 1.68이라 어떤 베팅 규칙도 복리를 못 이긴다.
   관문만 넣으면 패턴 밸런스를 하나도 안 건드리고 클리어 99% → 23%,
   성공 런 22분 / 실패 런 8분으로 길이도 균형이 잡힌다.

   관문마다 정해진 일수로 새로 시작한다 — 남은 거래일은 이월되지 않는다. */
const GATES=[
  {n:'1차', goal:500000,     days:13},
  {n:'2차', goal:3000000,    days:13},
  {n:'3차', goal:20000000,   days:13},

const EXTEND_DAYS=3, EXTEND_COST_FRAC=0.25;   // 기한 연장: 자산의 25%로 3거래일
/* ===== 조기 상환 보너스 (이월을 대체한다) =====
   예전에는 남은 거래일을 다음 관문으로 이월했다(상한 5일). 그런데 거래일은 복리로 붙는다 —
   판당 기댓값이 3배에서 1.68이라 5일이면 13배의 여유다. 그래서 관문을 넘을 때마다 다음
   관문이 눈에 띄게 헐거워졌고(sim/carry.js: 이월 상한 0 → 무제한에서 클리어 22% → 41%),
   "보상이 선택을 넓히는 게 아니라 난이도를 낮춘다"는 문제의 가장 큰 몫이기도 했다.

   대신 남은 거래일 1일당 방금 갚은 관문 목표의 10%를 현금으로 준다. 통과 시점의 현금이
   대략 목표와 같으므로 이건 매 관문에 같은 비율로 주는 선불이고, 판수를 늘리지 않으니
   복리로 불어나지 않는다 — 계수 하나로 조절되는 다이얼이 된다.
   상한은 두지 않는다. 상한 5일을 걸면 클리어가 19% → 15%로 현행보다 어려워져서,
   결국 조율할 상수만 하나 더 느는 셈이었다(sim/bonus.js 5번 블록).

   sim/bonus.js 실측(각 500회, 3배·보험0%·하락+4%p):
     현행(이월5)                        클리어 18%
     이월만 삭제                        클리어  9%   ← 그냥 없애면 너무 가혹하다
     이월0 + 보너스 10%/일              클리어 14%
     이월0 + 보너스 10%/일 + 일수 +1    클리어 19%   ← 채택. 현행과 같은 난이도
   그래서 GATES 일수를 전부 +1 했다(12→13, 14→15, 16→17). */
const EARLY_BONUS_RATE=0.10;
function gateOf(){return GATES[Math.min(GATES.length-1,S.gate||0)];}
function gateDone(){return (S.gate||0)>=GATES.length;}
/* 거래일 → 날짜. 주말은 건너뛴다(장이 안 서니까). */
function dateOfDay(n){
  const d=new Date(2026,2,2);            // 3월 2일 월요일에서 시작
  let left=n;
  while(left>0){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6)left--; }
  return `${d.getMonth()+1}월 ${d.getDate()}일 (${'일월화수목금토'[d.getDay()]})`;
}
/* 판당 필요 수익률 = (목표 ÷ 현금)^(1 ÷ 남은 거래일) − 1.
   D 숫자만으로는 위험한지 알 수가 없다 — 같은 D-5라도 목표의 90%를 모았으면 여유고
   10%면 사실상 끝난 판이다. 복리 기준으로 "판당 몇 % 필요"로 환산해야 한 눈에 읽힌다.
   판당 기댓값이 3배에서 1.68이라 20%는 여유, 45%를 넘으면 사실상 한 방이 필요하다. */
const PACE_OK=0.20, PACE_WARN=0.45;
function riskAt(cash,days){
  const g=gateOf();
  const need=Math.pow(g.goal/Math.max(cash,MIN_BET),1/Math.max(1,days))-1;
  let cls='p-ok';
  if(need>PACE_WARN)cls='p-bad'; else if(need>PACE_OK)cls='p-warn';
  if(days<=1)cls='p-bad'; else if(days<=3&&cls==='p-ok')cls='p-warn';
  const p=Math.max(0,need)*100;
  return {need,cls,last:days<=1,txt:`+${p<10?p.toFixed(1):Math.round(p)}%`};
}

/* ===== 트레이더 경험치 (판이 끝나도 남는 것) =====
   예전에는 포인트로 강화를 "사는" 트리였다 — 시드머니·타고난 촉·보험·뒷배·빚 청산.
   다섯 노드가 전부 다음 판을 쉽게 만드는 방향이라, 반복 플레이의 보상이 곧 난이도
   완화였다. 트리를 통째로 걷어내고 경험치만 남긴다: 고를 것도 살 것도 없이 레벨이
   오르면 열리고, 열리는 건 수치가 아니라 "할 수 있는 일"뿐이다.

   XP는 그 판의 최고 기록을 로그로 환산한다. 선형(최고÷100만)으로 두면 500억을 찍는
   순간 5만 XP가 나와서 해금이 한 판에 끝나버린다. 여기에 관문을 일찍 갚아 모아둔
   보너스 XP가 더해진다(EARLY_XP_PER_DAY).

   메타 해금은 실제로 구현된 것만 적는다. 기능이 하나 붙을 때마다 여기 한 줄이 는다 —
   "곧 나옴" 상태의 빈 항목을 두지 않기 위해서다. */
function xpOfPeak(peak){return Math.max(1,Math.floor(20*Math.log10(Math.max(peak,MIN_BET)/100000)));}

/* ===== 매도 등급 =====
   그 판에 실제로 지나간 가격 범위 안에서 어디에 팔았나. 고점 매도 100%, 바닥 매도 0%.
   처음엔 "고점 대비"((매도−1)÷(최고−1))로 잡았는데, 하락장에서는 매도 시점이 곧 그 순간의
   최저점이라 모든 플레이어가 D를 받는 결함이 있었다. 최저~최고 범위로 바꾸면 상승장·하락장
   구분 없이 항상 정의되고 실력순으로 갈린다. */
const GRADE_CUT=[[0.90,'S','완벽한 타이밍'],[0.70,'A','잘 팔았어요'],[0.45,'B','나쁘지 않아요'],
                 [0.20,'C','조금 아쉬워요'],[-1,'D','너무 늦었어요']];
const GRADE_MIN_RANGE=0.04;   /* 이보다 덜 움직인 판은 등급이 노이즈라 매기지 않는다 */
function gradeOf(mult,lo,hi){
  const rng=hi-lo;
  if(rng<GRADE_MIN_RANGE)return null;
  const e=Math.max(0,Math.min(1,(mult-lo)/rng));
  const g=GRADE_CUT.find(c=>e>=c[0]);
  return {pct:Math.round(e*100), g:g[1], txt:g[2]};
}

/* 저장된 시점 이후 흐른 시간을 catch-up: 자리를 비운 사이 돈이 불어나 있거나
   사라져 있는 건 이상하니(지켜보지 않은 결과로 보상/손실을 주지 않는다), 떠나있는
   동안 라운드가 15초를 넘겨버렸으면 손익 없이 베팅한 금액만 그대로 돌려준다. */
function catchUp(){
  const now=Date.now();
  const awaySec=(now-S.lastTick)/1000;
  let roundRefunded=null;
  if(S.activeRound){
    const idx=currentTickIdx();
    if(idx>=S.activeRound.path.length-1){
      S.cash+=S.activeRound.bet;
      roundRefunded={bet:S.activeRound.bet};
      S.activeRound=null;
      S.lastResult=null;
      rollPending(); // 이미 흘러가버린 라운드의 신호는 버리고 새로 뽑는다
    }
  }
  S.lastTick=now;
  return {awaySec,roundRefunded};
}

function loadRun(){
  try{const r=localStorage.getItem(RUN_KEY);if(r){S=JSON.parse(r);
    if(!S.upg)S.upg={leverageLv:START_LEVERAGE_LV,stoplossLv:0,infoLv:0,surge:false};

    if(typeof S.upg.infoLv!=='number')S.upg.infoLv=0;

}

   그러면 있을 이유가 없다. 레버리지도 팔지 않는다(빚/레벨 보상으로만 움직인다). */
const SHOP_IDS=['info','stoploss'];
function upgradeInfo(id){
  if(id==='stoploss'){
    const lv=S.upg.stoplossLv;
    if(lv>=3)return {emo:'🛡️',name:'손절 보험',cnt:'MAX', ds:`손실 ${Math.round(STOPLOSS_PCT[3]*100)}% 환급`, maxed:true};
    return {emo:'🛡️',name:'손절 보험',cnt:lv>0?`Lv.${lv}`:'', ds:`${lv>0?`현재 ${Math.round(STOPLOSS_PCT[lv]*100)}% 환급 · `:''}다음 ${Math.round(STOPLOSS_PCT[lv+1]*100)}% 환급`, cost:STOPLOSS_COSTS[lv], buyLabel:'강화'};
  }
  if(id==='info'){
    const lv=S.upg.infoLv||0, cur=Math.round(INFO_ACC[lv]*100);
    if(lv>=INFO_ACC.length-1)return {emo:'🔎',name:'정보력',cnt:`${cur}%`, ds:'장세 신호 적중률 최대치예요', maxed:true};
    return {emo:'🔎',name:'정보력',cnt:`${cur}%`, ds:`장세 신호 적중률 ${cur}% → ${Math.round(INFO_ACC[lv+1]*100)}% (레버리지 판단 근거가 정확해져요)`, cost:INFO_COSTS[lv], buyLabel:'강화'};
  }
}
function buyUpgrade(id){
  const info=upgradeInfo(id);
  if(info.maxed||S.cash<info.cost)return;
  S.cash-=info.cost;
  if(id==='leverage')S.upg.leverageLv++;
  else if(id==='stoploss')S.upg.stoplossLv++;
  else if(id==='info')S.upg.infoLv++;
  sfx.buy(); toast(`${info.name} 구매!`);
  saveRun(); render();
}

/* ===== 해금 탭 = 레벨 보상 로드맵 전체 (무료로 열리는 건 전부 여기 모아둔다) ===== */
/* 정산 화면은 탭에 깔지 않는다. 파산하거나 은퇴한 "직후"에만 여는 화면이다 —
   죽고 나서 강해지고 다시 들어가는 게 로그라이크의 리듬이고, 평소 화면도 깨끗해진다.
   예전 레거시 화면과 달리 고르거나 살 것이 없다. 경험치가 차면 그냥 열린다. */
function showSettleModal(st){
  const after=META.xp||0, before=after-st.total;
  /* 이번 정산으로 넘어선 해금 */
  const opened=META_UNLOCKS.filter(u=>before<u.need&&after>=u.need);

  const done=META_UNLOCKS.filter(u=>u.need<=after);
  const lo=done.length?done[done.length-1].need:0;
  const pct=nx?Math.max(0,Math.min(100,(after-lo)/Math.max(1,nx.need-lo)*100)):100;
  const penLabel=st.penalty>0?`계좌가 청산돼서 ${Math.round(st.penalty*100)}% 깎였어요`:null;
  $('modalBox').innerHTML=`<div class="emo">🧬</div><div class="tt">트레이더 경험치</div>
    <div class="xp-tbl">
      <div><span>최고 기록 ${fmtWon(st.peak)}</span><b>+${st.base}</b></div>
      ${st.early>0?`<div><span>⏱️ 관문을 일찍 갚아서</span><b>+${st.early}</b></div>`:''}
      ${penLabel?`<div class="pen"><span>${penLabel}</span><b>−${Math.round(st.penalty*100)}%</b></div>`:''}
      <div class="sum"><span>합계</span><span>+${st.total} XP</span></div>
    </div>
    <div class="xp-head"><span>Lv.${metaLv()} <small>· 누적 ${after} XP</small></span>
      <small>${nx?`${nx.emo} ${nx.name}까지 ${Math.max(0,nx.need-after)}`:'전부 열렸어요'}</small></div>
    <div class="xp-bar"><i style="width:${pct}%"></i></div>
    ${opened.map(u=>`<div class="unlock-pop"><span class="e">${u.emo}</span>
      <span><span class="t">새 해금 — ${u.name}</span><span class="d">${u.ds}</span></span></div>`).join('')}
    <button class="ok" id="mOk">새 판 시작</button>`;
  $('modal').classList.add('on');
  if(opened.length)sfx.win();

/* ===== 랭킹 (우측상단 · 순수 연출 — 현금은 일절 주지 않는다) =====
   보유 현금(S.cash)을 로그 스케일로 전국 순위에 매핑한다. peakCash가 아니라 실시간
   cash를 쓰기 때문에 베팅으로 돈이 오르내리면 등수도 그대로 오르내린다. 여기에
   "가만히 있어도" 등수가 조금씩 흔들리도록, 실제 현금은 건드리지 않는 화면표시 전용
   보정치(rankDrift)를 따로 두고 몇 초 단위로 소폭 상승/하락/횡보 구간을 이어붙인다 —
   등수가 좋을수록(1위에 가까울수록) 하락 구간이 더 자주 나오게 해서, 상위권일수록
   가만히 있으면 등수가 밀리기 쉽게 만든다(계속 단타를 해야 할 이유). */
const FAKE_NAMES=['존버킹','단타의신','물타기장인','칼손절러','한강뷰거주','우량주러버','고점매수단','익절요정','풀매수맨','존리형','개미핥기','반대매매각','손절은없다','불장기원단','떡상기도중'];
function nameFor(seed){return FAKE_NAMES[Math.abs(Math.floor(seed))%FAKE_NAMES.length];}
const RANK1_AMOUNT=50000000000, RANK_MIN_AMOUNT=100000, RANK_WORST=13000000;
function rankGoodness(amount){
  const p=Math.max(1,amount);
  return Math.min(1,Math.max(0,(Math.log10(p)-Math.log10(RANK_MIN_AMOUNT))/(Math.log10(RANK1_AMOUNT)-Math.log10(RANK_MIN_AMOUNT))));
}
function rankFromAmount(amount){
  const t=rankGoodness(amount);
  return Math.max(1,Math.round(RANK_WORST*Math.pow(1/RANK_WORST,t)));
}
let rankDrift=1;
let driftSeg={start:1,target:1,t0:Date.now(),t1:Date.now()};
function effectiveRankAmount(){return Math.max(1,S.cash*rankDrift);}
function rankOf(){return rankFromAmount(effectiveRankAmount());}
function rankText(){
  const r=rankOf();
  const pct=r/RANK_WORST*100;
  const pctTxt=pct<1?pct.toFixed(2):Math.round(pct);
  return `${r.toLocaleString()}위 (상위 ${pctTxt}%)`;
}
function updateRankDrift(now){
  if(now>=driftSeg.t1){
    const goodness=rankGoodness(effectiveRankAmount());
    const declineProb=0.30+goodness*0.45, flatProb=0.25;
    const roll=Math.random();
    let mult;
    if(roll<declineProb) mult=1-(0.01+Math.random()*0.035);
    else if(roll<declineProb+flatProb) mult=1+(Math.random()-0.5)*0.01;
    else mult=1+(0.01+Math.random()*0.03);
    const start=rankDrift;
    const target=Math.min(2.0,Math.max(0.5,start*mult));
    driftSeg={start,target,t0:now,t1:now+57000+Math.random()*6000};
  }
  const frac=Math.min(1,(now-driftSeg.t0)/(driftSeg.t1-driftSeg.t0));
  rankDrift=driftSeg.start+(driftSeg.target-driftSeg.start)*Math.sin(frac*Math.PI/2);
}
function renderRankChip(){ $('rankChip').textContent=rankText(); }

/* ===== 거래 결과에 대한 사회적 반응 =====
   베팅 "중"에는 그래프와 배율만 보게 되므로 그때 띄우는 잡담은 아무도 안 본다.
   그래서 반응은 매도가 끝난 "직후"에, 결과 크기에 비례해서 보여준다.
   소액 익절은 아무도 관심 없고(시큰둥한 한 줄), 대박은 댓글이 쏟아지고 좋아요가 터진다 —
   "따도 아무도 몰라주면 재미없다"를 정면으로 겨냥한 장치. 레버리지를 쓴 거래는
   반응이 더 커져서, 크게 거는 이유가 돈 말고 하나 더 생긴다. */
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
/* 예전엔 손익 크기만 보고 5개 등급 중 하나를 골라 4개씩 뿌렸다. 등급당 문장이 4~6개뿐이라
   금방 다 보이고, 어느 문장도 "이번 판에 실제로 벌어진 일"을 몰라서 통째로 안 읽혔다.
   그래서 개수를 최대 2개로 줄이고, 대신 이번 판의 사건을 문장에 넣는다 —
   매도 등급 · 고점 · 연승 · 청산 · 쓴 티켓 · 배율 · 상환 기한. 문장 총량은 비슷한데
   조합이 폭발하고, 무엇보다 "나를 보고 하는 말"이 된다. */
const REACTIONS={
  jackpot:['미쳤다 이걸 잡네 ㄷㄷ','와 이거 실화임? 손 떨림','형님 소리가 절로 나온다','저도 좀 알려주세요 제발','이건 캡처각이다','오늘의 주인공 등장'],
  win:['깔끔하게 먹었네요','타이밍 좋았다','오 축하합니다','이게 실력이지','부럽습니다 진짜'],
  meh:['음... 수고하셨습니다','본전치기 ㅋㅋ','조용히 지나가겠습니다','뭐 나쁘진 않네요'],
  loss:['에고 아쉽다','저도 방금 물렸어요','다음 판 가시죠','괜찮아요 흔한 일'],
  disaster:['헉 괜찮으세요...?','아이고 이건 좀','제 계좌 보는 것 같아서 눈물이','한강은 참으세요 진짜','같이 웁시다','이건 좀 아프겠는데'],
};
/* 사건별 문장 — 조건이 맞을 때만 후보에 오른다. ${} 자리에 이번 판 숫자가 들어간다. */
const EVENT_LINES=[
  {id:'wiped', when:R=>R.profit<=-R.bet*0.95,
   t:R=>[`${R.lev}배로 청산이라니 ㄷㄷ`,'계좌 녹는 소리가 여기까지 들려요','청산 당하셨네요 ㅠㅠ','이건 진짜 아프다']},
  {id:'missPeak', when:R=>R.grade&&R.grade.pct<45&&R.hi>=1.15,
   t:R=>[`${R.hi.toFixed(2)}까지 갔는데 ${R.mult.toFixed(2)}에 파셨네요 ㅋㅋ`,
        `아까 ${R.hi.toFixed(2)} 찍었을 때 팔았어야죠`,`${R.hi.toFixed(2)} 보고도 못 파는 게 사람이죠`]},
  {id:'perfect', when:R=>R.grade&&R.grade.g==='S',
   t:R=>[`${R.mult.toFixed(2)}에 칼같이 터셨네`,'고점에서 정확히 잡으셨다','이게 매도의 정석입니다','손이 기계세요?']},
  {id:'streakBreak', when:R=>R.prevStreak>=3&&R.profit<=0,
   t:R=>[`${R.prevStreak}연승 끊긴 게 더 아프겠다`,`${R.prevStreak}연승까지 갔었는데...`,'연승 끊길 때가 제일 쓰라리죠']},
  {id:'streakOn', when:R=>R.streak>=3&&R.profit>0,
   t:R=>[`${R.streak}연승째다 이거`,`${R.streak}연승 실화?`,'지금 손이 뜨거우신 듯']},
  {id:'buffFail', when:R=>(R.buffs||[]).length>0&&R.profit<0,
   t:R=>[`${(R.buffs||[]).map(b=>BUFFS[b].name).join('+')} 쓰고도 이러네 ㅠㅠ`,'티켓이 아깝다 진짜','좋은 패 들고 지셨네']},
  {id:'buffWin', when:R=>(R.buffs||[]).length>0&&R.profit>R.bet*0.5,
   t:R=>[`${(R.buffs||[]).map(b=>BUFFS[b].name).join('+')} 제대로 썼네요`,'티켓 값 뽑고도 남았다']},
  {id:'bigLev', when:R=>R.lev>=5&&R.profit>R.bet,
   t:R=>[`${R.lev}배로 이걸 성공한다고?`,`${R.lev}배 배짱 미쳤네`,'간이 크시네 ㄷㄷ']},
  {id:'dday', when:R=>R.daysLeft<=2&&R.profit>0,
   t:R=>[`D-${R.daysLeft}에 이걸 살리네`,'막판에 저력이 나오네요','마감 직전에 강한 타입']},
  {id:'ddayFail', when:R=>R.daysLeft<=2&&R.profit<0,
   t:R=>[`D-${R.daysLeft}인데 이러면 곤란한데`,'상환일 다가오는데 어쩌죠','슬슬 반대매매 각인데']},
];
const LEV_REACTIONS={
  win:['레버리지 배짱 좋네요','풀레버로 이걸 성공한다고?'],
  loss:['레버리지가 사람 잡네','그러니까 배율을 좀...'],
};
function buildReactions(R){
  const bet=R.bet, r=bet>0?R.profit/bet:0;
  let tier;
  if(r>=1.0)tier='jackpot'; else if(r>=0.15)tier='win';
  else if(r>-0.15)tier='meh'; else if(r>-0.5)tier='loss'; else tier='disaster';
  const likeBase={jackpot:260,win:28,meh:1,loss:16,disaster:140}[tier];
  const out=[];
  /* 이번 판에 해당하는 사건이 있으면 그중 하나를 먼저 — 이게 "나를 보고 하는 말"이 된다 */
  const hits=EVENT_LINES.filter(e=>{try{return e.when(R);}catch(x){return false;}});
  if(hits.length)out.push(pick(pick(hits).t(R)));
  /* 그다음 일반 반응 하나 */
  const pool=[...REACTIONS[tier]];
  if(R.lev>1){const ex=LEV_REACTIONS[r>=0.15?'win':r<=-0.15?'loss':null]; if(ex)pool.push(...ex);}
  out.push(pick(pool));
  const mult=1+(R.lev>1?R.lev*0.35:0);
  return {tier, list:out.slice(0,2).map(t=>({
    name:nameFor(Math.random()*100000), text:t,
    likes:Math.max(0,Math.round(likeBase*mult*(0.5+Math.random())))}))};
}
function resultModalHTML(R){
  const up=R.profit>=0, g=R.grade;
  const badge=R.tier==='jackpot'?`<span class="rs-badge hot">🔥 실시간 인기</span>`
    :R.tier==='disaster'?`<span class="rs-badge cold">💀 오늘의 참사</span>`:'';
  const chips=[];
  if(g)chips.push(`<span class="rs-chip grade${g.pct<45?' low':''}">매도 ${g.g} · ${g.pct}%</span>`);
  if(R.lev>1)chips.push(`<span class="rs-chip lev">🎚️ ${R.lev}배</span>`);
  if(R.streak>=2)chips.push(`<span class="rs-chip streak">🔥 ${R.streak}연승</span>`);
  (R.buffs||[]).forEach(b=>chips.push(`<span class="rs-chip">${BUFFS[b].emo} ${BUFFS[b].name}</span>`));
  const moved=R.rankBefore!==R.rankAfter, better=R.rankAfter<R.rankBefore;
  const earnRow=(R.earned&&R.earned.length)?`<div class="strip-buff" style="margin-top:11px">
      <span class="e">${R.earned.map(b=>BUFFS[b].emo).join('')}</span>

/* 한 판이 끝나면 하루가 간다 — 그런데 팝업을 닫는 순간 D가 조용히 줄면
   처음 하는 사람은 마감이 갑자기 닥친 걸로 느낀다. 소모되는 하루만 여기서 보여준다.

   날짜·목표까지 남은 금액·판당 필요 수익률은 일부러 뺐다. 셋 다 상단 상환 스트립과
   시작 버튼 위 경고줄에 이미 같은 값이 있어서, 결과 팝업에 또 적으면 한 판 끝날 때마다
   같은 숫자를 세 번 읽히는 꼴이 된다. 위험도는 문구 대신 배경색(.p-ok/.p-warn/.p-bad)이
   전달한다 — 색은 이미 스트립·진행바와 같은 3단계라 따로 배울 것도 없다.
   endOfDay()는 이 팝업을 닫은 뒤에 돌기 때문에 여기 값은 아직 줄기 전이다. */
function closeRowHTML(){
  if(gateDone())return '';
  const g=gateOf(), before=S.daysLeft, after=before-1;
  const row=(cls,inner)=>`<div class="rs-close ${cls}"><div class="cl-top one">${inner}</div></div>`;
  if(S.peakCash>=g.goal)return row('p-done',`<span class="cl-dd"><b>${g.n} 상환 가능</b></span>`);
  if(after<=0)return row('p-bad',`<span class="cl-dd"><b>기한 만료</b></span>`);
  return row(riskAt(S.cash,after).cls,`<span class="cl-dd">D-${before} → <b>D-${after}</b></span>`);
}
function showResultModal(R,after){
  $('modalBox').innerHTML=`<div class="rs-box">${resultModalHTML(R)}</div>
    <button class="ok" id="mOk" style="background:${R.profit>=0?'linear-gradient(135deg,#f04452,#ff6b78)':'linear-gradient(135deg,#3182F6,#4c8dff)'}">확인</button>`;

/* ===== 레벨 ===== */
/* 라운드가 끝날 때마다 하루가 간다. 상환 판정을 먼저 하고 기한을 따진다 —
   마지막 날에 목표를 채우면 통과해야 하니까. */
function endOfDay(){
  if(gateDone())return false;
  S.dayCount++; S.daysLeft--;
  if(checkLevelUp())return true;              // 상환 완료(=레벨업) 모달
  if(S.daysLeft<=0){ showDefaultModal(); return true; }
  return false;
}
function checkLevelUp(){
  if(gateDone())return false;
  const g=gateOf();
  if(S.peakCash<g.goal)return false;
  const nl=LEVELS.find(l=>l.lv===S.level+1);
  S.gate++; S.level=nl?nl.lv:S.level+1;
  /* 기한보다 며칠 일찍 갚았나 → 그만큼 현금으로 받는다. 거래일은 이월되지 않고,
     다음 관문은 언제나 GATES에 적힌 일수로 새로 시작한다. */
  const early=Math.max(0,S.daysLeft);
  const bonus=Math.round(g.goal*EARLY_BONUS_RATE*early);
  if(bonus>0){ S.cash+=bonus; bumpPeak(); }
  S.earlyXp=(S.earlyXp||0)+early*EARLY_XP_PER_DAY;   // 판이 끝날 때 정산에 더해진다
  if(!gateDone())S.daysLeft=GATES[S.gate].days;
  if(nl&&nl.reward&&nl.reward.f)nl.reward.f(S);
  saveRun(); render();
  showRepayModal(g,(nl&&nl.reward)?nl:null,early,bonus);
  return true;
}
/* 완제(마지막 관문 통과)는 그 판의 끝이다. 예전에는 "계속 플레이" 버튼이 팝업만 닫아서,
   더 넘을 관문도 받을 보상도 없는 판에 그대로 방치됐다(정산하려면 해금 탭에 들어가
   은퇴를 따로 눌러야 했다). 이제 버튼 하나로 100% 정산하고 레거시 화면으로 넘어간다
   — 은퇴와 같은 대우다. 기한 안에 다 갚은 사람을 은퇴보다 불리하게 둘 이유가 없다. */
function showRepayModal(g,nl,early,bonus){
  const done=gateDone();
  const r=nl&&nl.reward;
  const next=done?null:GATES[S.gate];
  const st=done?settleOf(0):null;
  $('modalBox').innerHTML=`<div class="emo">${done?'🏆':(r?r.emo:'🔗')}</div>
    <div class="tt">${done?'빚을 다 갚았어요':`${g.n} 상환 완료`}</div>
    <div class="dc">${done?'대출을 완제했어요. 최고 기록으로 정산할게요.'
      :`${fmtWon(g.goal)}을 갚았어요.`}</div>
    ${bonus>0?`<div class="lv-gain early"><b>⏱️ ${early}거래일 일찍 갚았어요</b>
      — <b>${fmtWon(bonus)}</b> · 경험치 <b>+${early*EARLY_XP_PER_DAY}</b></div>`:''}
    ${r?`<div class="lv-gain"><b>${r.t}</b> — ${r.bonusTxt||r.d}</div>`:''}
    ${next?`<div class="stat-grid">
      <div class="s"><div class="k">${next.n} 상환금</div><div class="v">${fmtWon(next.goal)}</div></div>
      <div class="s"><div class="k">기한</div><div class="v">${S.daysLeft}거래일</div></div></div>`:''}
    ${done?`<div class="stat-grid">
      <div class="s"><div class="k">이번 판 최고 기록</div><div class="v">${fmtWon(S.peakCash)}</div></div>
      <div class="s"><div class="k">경험치</div><div class="v" style="color:var(--gold)">+${st.total} XP</div></div></div>`:''}
    <button class="ok" id="mOk">${done?'🧬 경험치 정산하기':'다음 회차로'}</button>`;
  $('modal').classList.add('on');
  sfx.win();
  $('mOk').onclick=done
    ? ()=>{sfx.tap();finishRun(st);}
    : ()=>{sfx.tap();$('modal').classList.remove('on');render();checkLevelUp();};

  if(gateDone())return;

  if(cost<=0||S.cash-cost<MIN_BET)return;
  S.cash-=cost; S.daysLeft+=EXTEND_DAYS;
  sfx.buy(); toast(`🔗 ${EXTEND_DAYS}거래일 연장 — ${fmtWon(cost)} 지불`);

function switchMainTab(tab){

     15초를 통째로 날리게 되고, "직접 지켜봐야 의미가 있다"는 이 게임의 원칙과도 어긋난다 */

/* ===== 단타 라운드 ===== */
function currentTickIdx(){
  if(!S.activeRound)return 0;
  const elapsed=Date.now()-S.activeRound.startedAt;
  return Math.min(S.activeRound.path.length-1,Math.floor(elapsed/ROUND_TICK_MS));
}
function setBet(n){
  const hi=Math.floor(S.cash);
  S.betAmount=Math.max(Math.min(MIN_BET,hi),Math.min(hi,Math.round(n)));
  renderTrade();
}
function startRound(){
  if(S.activeRound)return;
  const stock=TRADE_STOCKS.find(s=>s.id===S.selectedStock);
  const bet=S.betAmount;
  if(bet<MIN_BET||bet>S.cash)return;
  ensurePending();
  const {patternId,patternEmo,path}=genRound(stock,S.pending.patId);
  const maxLev=leverageMultOf(), minLev=minLevOf();
  const leverage=Math.min(Math.max(minLev,S.betLeverage||minLev),maxLev);
  const rankBefore=rankOf(); // 베팅금 차감 전 순위 — 결과 카드에서 변화를 보여주기 위해
  S.cash-=bet;
  S.activeRound={stockId:stock.id,bet,path,patternId,patternEmo,leverage,rankBefore,
    autoTarget:metaHas('autosell')?(S.betAutoTarget||0):0,
    startedAt:Date.now(), yMin:0.96, yMax:1.04, boundsIdx:0, dispYMin:0.96, dispYMax:1.04,
    peak:1, peakIdx:0, low:1,
    buffs:(S.buffs||[]).slice()};
  S.buffs=[];              // 티켓은 이 한 판에만 — 남겨두지 않는다
  ensureToday(); S.today.rounds++;
  S.lastResult=null;
  sfx.buy();
  saveRun(); render();
}
function sellRound(auto){
  if(!S.activeRound)return;
  const idx=currentTickIdx();
  const mult=S.activeRound.path[idx];
  const bet=S.activeRound.bet;
  const lev=S.activeRound.leverage||1;
  let rawProfit=Math.round(bet*(mult-1)*lev);
  if(rawProfit>0&&roundHas('boost'))rawProfit=Math.round(rawProfit*1.5);   // ⚡ 이익만 1.5배
  let profit=applyStoploss(rawProfit);
  let payout=Math.max(0,bet+profit);
  if(roundHas('liq')&&payout<bet*0.30){ payout=Math.round(bet*0.30); profit=payout-bet; }  // 🛟 청산 면제
  const rankBefore=S.activeRound.rankBefore||rankOf();
  /* 매도 등급 — 그 판 "전 구간"의 최저~최고 안에서 내가 판 위치.
     매도 시점까지(본 구간)로 잡으면, 하락장에서는 매도 순간이 곧 그때까지의 최저점이라
     D가 47% 쏟아진다(실측). 전 구간으로 잡아야 "일찍 빠져나온 것"이 제대로 A/S를 받는다.
     플레이어가 못 본 뒷구간까지 쓰는 셈이지만, 등급은 사후 채점이고
     "안 팔았으면 어디까지 갔는지"를 알려주는 게 이 게임의 후회/안도 훅이기도 하다. */
  const R=S.activeRound;
  let lo=R.path[0], hi=R.path[0];
  for(let i=0;i<R.path.length;i++){ if(R.path[i]<lo)lo=R.path[i]; if(R.path[i]>hi)hi=R.path[i]; }
  const grade=gradeOf(mult,lo,hi);
  const buffs=(R.buffs||[]).slice();
  S.cash+=payout; bumpPeak();
  sfx[profit>=0?'pay':'warn']();
  S.activeRound=null;
  /* 연승: 익절이면 +1, 아니면 0. 단계에 닿으면 다음 한 판에 걸릴 티켓을 준다 */
  const won=profit>0;
  const prevStreak=S.streak||0;
  S.streak=won?prevStreak+1:0;
  const earned=(won&&STREAK_REWARD[S.streak])?STREAK_REWARD[S.streak].slice():[];
  if(earned.length)grantBuffs(earned);
  ensureToday();
  const T=S.today;
  if(won)T.wins++;
  if(mult>T.bestMult)T.bestMult=mult;
  if(profit>T.bestProfit)T.bestProfit=profit;
  if(S.streak>T.bestStreak)T.bestStreak=S.streak;
  if(grade&&grade.g==='S')T.sCount++;
  const res={mult,profit,bet,lev,rankBefore,rankAfter:rankOf(),
    grade,lo,hi,streak:S.streak,prevStreak,earned,buffs,daysLeft:S.daysLeft};
  const rx=buildReactions(res);
  res.tier=rx.tier; res.list=rx.list;
  S.lastResult=res;
  rollPending(); // 다음 라운드 패턴/신호를 새로 뽑는다(라운드가 끝날 때만)
  saveRun(); render();
  showResultModal(S.lastResult,()=>{
    S.lastResult=null;
    if(checkBankrupt())return;
    if(!endOfDay())render();
  });
}
/* 부드러운 곡선(2차 베지어 보간) + x/y축을 라운드 시작 시점에 고정해서
   그래프가 항상 왼쪽 끝(0초)에서 자라나 보이게 한다 */
function smoothPathD(pts){
  if(!pts.length)return '';
  if(pts.length===1)return `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=1;i<pts.length;i++){
    const prev=pts[i-1],cur=pts[i];
    const midX=(prev[0]+cur[0])/2, midY=(prev[1]+cur[1])/2;
    d+=` Q${prev[0].toFixed(1)} ${prev[1].toFixed(1)} ${midX.toFixed(1)} ${midY.toFixed(1)}`;
  }
  const last=pts[pts.length-1];
  d+=` L${last[0].toFixed(1)} ${last[1].toFixed(1)}`;
  return d;
}

function renderTrade(){
  const maxLev=leverageMultOf();
  $('tpLimit').textContent=hasDebt()
    ? `🔗 빚 때문에 최소 ${minLevOf()}배 · 최대 ${maxLev}배`
    : `🎚️ 레버리지 1~${maxLev}배`;
  if(S.activeRound){renderRoundView();return;}
  RV=null; /* 아래에서 tradeBody를 통째로 갈아엎으므로 라운드 뷰 노드 캐시를 버린다 */
  /* 자동 익절은 한 번 정하면 잘 안 바꾸는 값이라 접어 둔다 */
  const autoChip=metaHas('autosell')
    ? `<button class="opt auto ${S.autoOpen?'open':''}" id="autoToggle">🎯 자동 익절
        <b>${S.betAutoTarget?S.betAutoTarget+'x':'끄기'}</b> ${S.autoOpen?'∧':'∨'}</button>`
    : '';
  const autoPanel=(metaHas('autosell')&&S.autoOpen)?`<div class="auto-row">
      <button data-t="0" class="${!S.betAutoTarget?'sel':''}">끄기</button>
      <button data-t="1.3" class="${S.betAutoTarget===1.3?'sel':''}">1.3x</button>
      <button data-t="1.5" class="${S.betAutoTarget===1.5?'sel':''}">1.5x</button>
      <button data-t="2" class="${S.betAutoTarget===2?'sel':''}">2.0x</button>
    </div>`:'';
  /* 티켓은 위쪽 스트립에 큰 카드로 두지 않고, 시작 버튼 바로 위에 한 줄로만 알린다 —
     "지금 시작할 이 판"에 걸리는 것이므로 그 자리가 맞다. */
  const bl=(S.buffs||[]);
  const buffLine=bl.length?`<div class="buff-line">${bl.map(b=>BUFFS[b].emo).join('')}
      <span>다음 판 한정 · ${bl.map(b=>BUFFS[b].name).join(' + ')}</span></div>`:'';
  const minLev=minLevOf();
  const levOptions=LEVERAGE_MULTS.filter(m=>m>=minLev&&m<=maxLev);
  const curLev=Math.min(Math.max(minLev,S.betLeverage||minLev),maxLev);
  const liq=liqMultOf(curLev);
  /* 청산선은 배율마다 다른 값이라 버튼 안에 적는 게 맞다.
     라벨 + 버튼 + 경고 세 줄(79px)이 한 줄로 줄어든다. */
  const levRow=`<div class="auto-row lev-row">${levOptions.map(m=>{
      const l=liqMultOf(m);
      return `<button data-lev="${m}" class="${curLev===m?'sel':''}">${m}배
        <small>${l>0?`청산 ${l.toFixed(2)}x`:'청산 없음'}</small></button>`;
    }).join('')}</div>`;
  ensurePending();
  /* 🔎 정보 확신권이 걸려 있으면 신호를 참값으로 보여준다 */
  const sigId=(S.buffs||[]).includes('info')?(PATTERN_TIER[S.pending.patId]||'mid'):S.pending.sig;
  const sg=SIGNAL_INFO[sigId];
  const acc=Math.round(infoAccOf()*100);
  const signalRow=`<div class="signal ${sigId}">
      <div class="sg-left"><span class="sg-emo">${sg.emo}</span><span class="sg-name">${sg.name}</span></div>
      <div class="sg-mid"><div class="sg-ds">${sg.ds}</div>
        <div class="sg-acc">${(S.buffs||[]).includes('info')?'🔎 이번 판은 이 신호가 반드시 맞아요':`이 신호가 맞을 확률 ${acc}%`}</div></div>
    </div>`;
  const canGo=S.betAmount>=MIN_BET && S.betAmount<=S.cash;
  const room=S.cash-MIN_BET;
  /* 페이스 경고는 위험할 때만 뜬다 — 늘 떠 있으면 단타 화면만 더 빽빽해지고 경고 구실을 못 한다 */
  const pr=gateDone()?null:riskAt(S.cash,S.daysLeft);
  const paceLine=(pr&&pr.cls!=='p-ok')?`<div class="pace-line ${pr.cls}">${pr.last?'⚠️ 마지막 거래일':`D-${S.daysLeft}`} · 판당 <b>${pr.txt}</b> 필요</div>`:'';
  $('tradeBody').innerHTML=`
    ${signalRow}
    ${levRow}
    <div class="bet-row"><button id="betMinus">−</button><div class="amt">${fmtWon(S.betAmount)}</div><button id="betPlus">+</button></div>
    <div class="bet-quicks"><button data-q="0.25">25%</button><button data-q="0.5">50%</button><button data-q="0.75">75%</button><button data-q="1">최대</button></div>
    <div class="opt-row">${autoChip}<span class="opt room">🪦 여유 ${fmtWon(Math.max(0,room))}</span></div>
    ${autoPanel}
    ${buffLine}
    ${paceLine}
    <button class="trade-go ${pr&&pr.cls==='p-bad'?'danger':''}" id="tradeGo" ${canGo?'':'disabled'}>${canGo?`${fmtWon(S.betAmount)} × ${curLev}배로 시작`:'베팅금이 부족해요'}</button>
    ${(S.today.rounds<3)?'<div class="trade-note">끝까지 들고만 있으면 손해예요 — 패턴을 보고 반응하세요!</div>':''}`;
  const step=Math.max(MIN_BET,Math.round(S.cash*0.05));
  $('betMinus').onclick=()=>{sfx.tap();setBet(S.betAmount-step);};
  $('betPlus').onclick=()=>{sfx.tap();setBet(S.betAmount+step);};
  $('tradeBody').querySelectorAll('.bet-quicks button').forEach(b=>b.onclick=()=>{sfx.tap();setBet(S.cash*parseFloat(b.dataset.q));});
  if($('autoToggle'))$('autoToggle').onclick=()=>{sfx.tap();S.autoOpen=!S.autoOpen;saveRun();renderTrade();};
  $('tradeBody').querySelectorAll('.auto-row button[data-lev]').forEach(b=>b.onclick=()=>{sfx.tap();S.betLeverage=parseFloat(b.dataset.lev);saveRun();renderTrade();});
  if(metaHas('autosell')){
    $('tradeBody').querySelectorAll('.auto-row button[data-t]').forEach(b=>b.onclick=()=>{sfx.tap();S.betAutoTarget=parseFloat(b.dataset.t);saveRun();renderTrade();});
  }
  $('tradeGo').onclick=()=>startRound();
}
/* 라운드 뷰는 "한 번 만들고 좌표만 갱신"한다.
   예전에는 50ms마다 tradeBody.innerHTML을 통째로 다시 썼는데, 그러면
   (a) CSS transition/animation이 매 틱 초기화돼서 어떤 연출도 살아남지 못하고
   (b) 매도 버튼 핸들러를 초당 20번 다시 붙이게 된다.
   그래서 노드를 RV에 캐시해 두고 update만 돌린다. */
let RV=null;
const RV_H=150, RV_PADX=8, RV_PADY=16;

function buildRoundView(r,stock){
  const lev=r.leverage||1;
  $('tradeBody').innerHTML=`<div class="round-view" id="rvRoot">
    <div class="round-timer"><span class="rt-l" id="rvT1"></span><span class="rt-r" id="rvT2"></span></div>
    <div class="round-mult" id="rvMult">1.00x</div>
    <div class="round-chartbox">
      <svg class="round-chart" id="rvSvg" viewBox="0 0 320 ${RV_H}">
        <defs>
          <clipPath id="rvClipUp"><rect id="rvRectUp" x="0" y="0" width="320" height="${RV_H}"/></clipPath>
          <clipPath id="rvClipDn"><rect id="rvRectDn" x="0" y="0" width="320" height="0"/></clipPath>
        </defs>
        <rect id="rvZone" x="0" width="320" fill="#f04452" opacity="0"/>
        <line id="rvBase" x1="0" x2="320" stroke="#8b95a1" stroke-width="1" stroke-dasharray="2 3" opacity=".45"/>
        <text id="rvBaseT" class="rv-txt" text-anchor="end" font-size="9" font-weight="700" fill="#8b95a1" opacity=".9">1.00x 진입</text>
        <path id="rvAreaUp" fill="#f04452" opacity=".13" clip-path="url(#rvClipUp)"/>
        <path id="rvAreaDn" fill="#3182F6" opacity=".13" clip-path="url(#rvClipDn)"/>
        <line id="rvLiq" x1="0" x2="320" stroke="#f04452" stroke-width="1.5" stroke-dasharray="5 4" opacity="0"/>
        <path id="rvLine" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line id="rvPkL" stroke="#ffb020" stroke-width="1" stroke-dasharray="2 2" opacity="0"/>
        <circle id="rvPkD" r="3.2" fill="none" stroke="#ffb020" stroke-width="2" opacity="0"/>
        <text id="rvPkT" class="rv-txt" font-size="10" font-weight="800" fill="#c9820f" opacity="0"/>
        <circle id="rvPulse" class="rv-pulse" r="4" fill="none" stroke-width="2"/>
        <circle id="rvHead" r="4.2" stroke="#ffffff" stroke-width="2"/>
        <text id="rvTHi" class="rv-txt" x="6" font-size="9" font-weight="700" fill="#8b95a1"/>
        <text id="rvTLo" class="rv-txt" x="6" font-size="9" font-weight="700" fill="#8b95a1"/>
        <text id="rvLiqT" class="rv-txt" text-anchor="end" font-size="10" font-weight="800" fill="#f04452" opacity="0"/>
      </svg>
      <div class="round-count" id="rvCount"></div>
    </div>
    <div class="round-pnl up" id="rvPnl">+0원</div>
    <div class="rv-wallet" id="rvWallet"></div>
    <div class="round-bar"><i id="rvBar"></i></div>
    <button class="sell-btn" id="sellBtn">지금 매도</button>
  </div>`;
  const g=id=>$(id);
  RV={round:r, lev, cw:320, lastCnt:-1, lastMult:1,
    root:g('rvRoot'), t1:g('rvT1'), t2:g('rvT2'), mult:g('rvMult'), svg:g('rvSvg'),
    rectUp:g('rvRectUp'), rectDn:g('rvRectDn'), zone:g('rvZone'), base:g('rvBase'), baseT:g('rvBaseT'),
    areaUp:g('rvAreaUp'), areaDn:g('rvAreaDn'), liq:g('rvLiq'), line:g('rvLine'),
    pkL:g('rvPkL'), pkD:g('rvPkD'), pkT:g('rvPkT'), pulse:g('rvPulse'), head:g('rvHead'),
    tHi:g('rvTHi'), tLo:g('rvTLo'), liqT:g('rvLiqT'), count:g('rvCount'),
    pnl:g('rvPnl'), bar:g('rvBar'), wallet:g('rvWallet')};
  /* viewBox 폭 = 실제 픽셀 폭으로 맞춰야 SVG 안의 글자가 가로로 늘어나지 않는다 */
  const fit=w=>{ w=Math.round(w); if(w<40||w===RV.cw)return;
    RV.cw=w; RV.svg.setAttribute('viewBox',`0 0 ${w} ${RV_H}`);
    RV.rectUp.setAttribute('width',w); RV.rectDn.setAttribute('width',w);
    RV.zone.setAttribute('width',w); RV.base.setAttribute('x2',w); RV.liq.setAttribute('x2',w); };
  if(window.ResizeObserver){ RV.ro=new ResizeObserver(es=>fit(es[0].contentRect.width)); RV.ro.observe(RV.svg); }
  fit(RV.svg.clientWidth||320);
  $('sellBtn').onclick=()=>sellRound(false);
}

function renderRoundView(){
  const r=S.activeRound, stock=TRADE_STOCKS.find(s=>s.id===r.stockId);
  if(!RV || RV.round!==r || !document.body.contains(RV.root)) buildRoundView(r,stock);
  const idx=currentTickIdx(), mult=r.path[idx];
  const remain=Math.max(0,(ROUND_TICKS-idx)*ROUND_TICK_MS/1000);
  const dir=mult>1.01?'up':mult<0.99?'down':'flat';
  const W=RV.cw, H=RV_H, padX=RV_PADX, padY=RV_PADY;
  /* y축은 "지금까지 실제로 본 값"만 확장형(expand-only)으로 반영한다 — 미래 전체 경로의
     최고/최저로 미리 고정하면, 선이 차트 위/아래 끝에 닿는 순간 "이게 그 라운드의 진짜
     고점/저점이다"를 그래프가 스포일러처럼 알려줘서 패턴을 볼 필요가 없어짐. 하지만
     상승/하락이 쭉 이어지는 구간에서는 "진짜 새 고점/저점"이 거의 매 틱 갱신되기 때문에,
     목표 경계(yMin/yMax)를 그대로 그리기에 쓰면 이미 그려둔 예전 구간의 픽셀 위치까지
     매 틱 같이 밀려서 그래프가 통째로 다시 그려지는 것처럼 흔들려 보임. 그래서 실제
     그리기에 쓰는 화면상 경계(dispYMin/dispYMax)는 목표치를 향해 서서히(이징) 따라가게
     만들어서, 예전 구간은 순간이동하지 않고 부드럽게만 자리를 조정하도록 한다 */
  if(typeof r.yMin!=='number'){r.yMin=0.96;r.yMax=1.04;r.boundsIdx=0;}
  if(typeof r.peak!=='number'){r.peak=1;r.peakIdx=0;} /* 예전 세이브에서 이어붙은 라운드 대비 */
  if(typeof r.low!=='number')r.low=1;
  if(idx>r.boundsIdx){
    for(let i=r.boundsIdx+1;i<=idx;i++){
      if(r.path[i]<r.yMin)r.yMin=r.path[i];
      if(r.path[i]>r.yMax)r.yMax=r.path[i];
      if(r.path[i]>r.peak){r.peak=r.path[i];r.peakIdx=i;}
      if(r.path[i]<r.low)r.low=r.path[i];
    }
    r.boundsIdx=idx;
  }
  if(typeof r.dispYMin!=='number'){r.dispYMin=r.yMin;r.dispYMax=r.yMax;}
  const rawRng=(r.yMax-r.yMin)||0.001, pad=rawRng*0.15;
  const targetYMin=r.yMin-pad, targetYMax=r.yMax+pad;
  const EASE=0.2;
  r.dispYMin+=(targetYMin-r.dispYMin)*EASE;
  r.dispYMax+=(targetYMax-r.dispYMax)*EASE;
  const yMin=r.dispYMin, yMax=r.dispYMax;
  const rng=(yMax-yMin)||0.001;
  const xOf=i=>padX+(i/ROUND_TICKS)*(W-2*padX);
  const yOf=v=>H-padY-((v-yMin)/rng)*(H-2*padY);
  const clampY=y=>Math.max(2,Math.min(H-2,y));
  const pts=[];
  for(let i=0;i<=idx;i++)pts.push([xOf(i),yOf(r.path[i])]);
  const d=smoothPathD(pts);
  const col=dir==='up'?'#f04452':dir==='down'?'#3182F6':'#8b95a1';
  const lev=r.leverage||1;
  const profit=Math.round(r.bet*(mult-1)*lev);

  RV.line.setAttribute('d',d);
  RV.line.setAttribute('stroke',col);

  /* 1.00x 진입선 + 그 위/아래를 손익 색으로 채워서 "내가 산 자리" 기준 손익이 면적으로 읽히게 */
  const baseY=clampY(yOf(1));
  RV.base.setAttribute('y1',baseY.toFixed(1)); RV.base.setAttribute('y2',baseY.toFixed(1));
  RV.baseT.setAttribute('x',W-6); RV.baseT.setAttribute('y',(baseY-4).toFixed(1));
  const first=pts[0], last=pts[pts.length-1];
  const areaD=d+` L${last[0].toFixed(1)} ${baseY.toFixed(1)} L${first[0].toFixed(1)} ${baseY.toFixed(1)} Z`;
  RV.areaUp.setAttribute('d',areaD); RV.areaDn.setAttribute('d',areaD);
  RV.rectUp.setAttribute('height',baseY.toFixed(1));
  RV.rectDn.setAttribute('y',baseY.toFixed(1)); RV.rectDn.setAttribute('height',(H-baseY).toFixed(1));

  /* 레버리지를 걸었으면 청산선(이 아래로 가면 전액 손실) + 가까워질수록 짙어지는 경고 영역 */
  const liq=liqMultOf(lev);
  const liqY=liq>0?yOf(liq):null;
  const liqOn=(liqY!==null&&liqY>padY&&liqY<H-padY);
  RV.liq.setAttribute('opacity',liqOn?'.75':'0');
  if(liqOn){ RV.liq.setAttribute('y1',liqY.toFixed(1)); RV.liq.setAttribute('y2',liqY.toFixed(1)); }
  let zoneOp=0;
  if(lev>1){ const head=(mult-liq)/Math.max(0.02,1-liq); zoneOp=Math.max(0,Math.min(.42,(1-head)*.55)); }
  const zy=liqOn?liqY:H;
  RV.zone.setAttribute('y',zy.toFixed(1));
  RV.zone.setAttribute('height',Math.max(0,H-zy).toFixed(1));
  RV.zone.setAttribute('opacity',zoneOp.toFixed(3));
  const liqWarn=lev>1&&zoneOp>0.08;
  RV.liqT.setAttribute('opacity',liqWarn?'1':'0');
  if(liqWarn){
    RV.liqT.setAttribute('x',W-6);
    RV.liqT.setAttribute('y',(liqOn?Math.min(H-5,liqY+12):H-6).toFixed(1));
    RV.liqT.textContent=mult<=liq?'⚠️ 전액 손실 구간':`청산까지 ${(mult-liq).toFixed(2)}`;
  }

  /* 최고점 마커 — "아까 얼마까지 갔었는지"가 매도 타이밍 게임의 학습이자 후회 훅 */
  const pkOn=r.peakIdx>0&&r.peak>1.005;
  RV.pkD.setAttribute('opacity',pkOn?'1':'0');
  RV.pkL.setAttribute('opacity',pkOn?'.5':'0');
  RV.pkT.setAttribute('opacity',pkOn?'1':'0');
  if(pkOn){
    const px=xOf(r.peakIdx), py=clampY(yOf(r.peak));
    RV.pkD.setAttribute('cx',px.toFixed(1)); RV.pkD.setAttribute('cy',py.toFixed(1));
    RV.pkL.setAttribute('x1',px.toFixed(1)); RV.pkL.setAttribute('x2',px.toFixed(1));
    RV.pkL.setAttribute('y1',py.toFixed(1)); RV.pkL.setAttribute('y2',(H-2).toFixed(1));
    const rightish=px>W-78;
    RV.pkT.setAttribute('x',(rightish?Math.min(W-6,px-6):px+6).toFixed(1));
    RV.pkT.setAttribute('text-anchor',rightish?'end':'start');
    RV.pkT.setAttribute('y',Math.max(11,py-7).toFixed(1));
    RV.pkT.textContent=`최고 ${r.peak.toFixed(2)}x`;
  }

  /* 현재가 지점 — 눈이 여기를 보게 만든다 */
  const hx=last[0], hy=clampY(last[1]);
  RV.head.setAttribute('cx',hx.toFixed(1)); RV.head.setAttribute('cy',hy.toFixed(1));
  RV.head.setAttribute('fill',col);
  RV.pulse.setAttribute('cx',hx.toFixed(1)); RV.pulse.setAttribute('cy',hy.toFixed(1));
  RV.pulse.setAttribute('stroke',col);

  RV.tHi.setAttribute('y',11); RV.tHi.textContent=yMax.toFixed(2)+'x';
  RV.tLo.setAttribute('y',H-4); RV.tLo.textContent=yMin.toFixed(2)+'x';

  /* 배율 숫자는 변동폭에 반응해서 살짝 튄다 */
  RV.mult.textContent=mult.toFixed(2)+'x';
  RV.mult.className='round-mult '+dir;
  RV.mult.style.transform='scale('+(1+Math.min(0.14,Math.abs(mult-RV.lastMult)*9)).toFixed(3)+')';
  RV.lastMult=mult;

  RV.pnl.textContent=(profit>=0?'+':'')+fmtWon(profit);
  RV.pnl.className='round-pnl '+(profit>=0?'up':'down');
  RV.wallet.innerHTML=`지금 팔면 잔고 <b>${fmtWon(S.cash+Math.max(0,r.bet+profit))}</b>`;

  const levTxt=lev>1?` · 🎚️${lev}배 · 청산 ${liq.toFixed(2)}x`:'';
  const autoTxt=r.autoTarget?` · 🎯${r.autoTarget}x 자동`:'';
  const buffTxt=(r.buffs&&r.buffs.length)?' · '+r.buffs.map(b=>BUFFS[b].emo).join(''):'';
  RV.t1.textContent=`${stock.emo} ${stock.name}${levTxt}${autoTxt}${buffTxt}`;
  RV.t2.textContent=`${remain.toFixed(1)}초`;

  /* 마지막 3초 — 강제 매도 직전의 압박 */
  const tense=remain<=3&&remain>0;
  RV.t2.className='rt-r'+(tense?' warn':'');
  RV.root.classList.toggle('tense',tense);
  const c=Math.ceil(remain);
  if(tense&&c>0&&c!==RV.lastCnt){
    RV.lastCnt=c; RV.count.textContent=c;
    RV.count.className='round-count'; void RV.count.offsetWidth; RV.count.className='round-count on';
  }
  RV.bar.style.width=(idx/ROUND_TICKS*100).toFixed(1)+'%';
}

/* ===== 연승/오늘의 기록 스트립 =====
   탭을 하나 더 만들지 않고 한 줄로 상시 노출한다. 탭하면 오늘의 기록이 펼쳐진다. */
function renderStrip(){
  ensureToday();
  const T=S.today, st=S.streak||0;
  const buffs=(S.buffs||[]);
  const winRate=T.rounds?Math.round(T.wins/T.rounds*100):0;
  const buffRow='';   // 티켓 안내는 베팅 화면 하단 한 줄로 옮겼다
  const open=S.stripOpen?`
    <div class="rec-grid">
      <div class="rec"><div class="k">오늘 판수</div><div class="v">${T.rounds}판 <small style="font-size:10px;color:var(--gray3)">승률 ${winRate}%</small></div></div>
      <div class="rec"><div class="k">최고 배율</div><div class="v">${T.bestMult?T.bestMult.toFixed(2)+'x':'—'}</div></div>
      <div class="rec"><div class="k">최대 수익</div><div class="v">${T.bestProfit>0?'+'+fmtWon(T.bestProfit):'—'}</div></div>
      <div class="rec"><div class="k">최다 연승</div><div class="v">${T.bestStreak}연승</div></div>
      <div class="rec"><div class="k">S등급 매도</div><div class="v">${T.sCount}회</div></div>
      <div class="rec"><div class="k">다음 티켓까지</div><div class="v">${nextStreakTxt(st)}</div></div>
    </div>`:'';
  $('strip').innerHTML=`<div class="strip-row">
      <span class="fire">${st>0?`🔥 ${st}연승`:'🔥 연승 없음'}</span>
      <span>오늘 ${T.rounds}판</span>
      <span>최고 ${T.bestMult?T.bestMult.toFixed(2)+'x':'—'}</span>
      <span class="cv">${S.stripOpen?'∧':'∨'}</span>
    </div>${buffRow}${open}`;
  $('strip').onclick=()=>{sfx.tap();S.stripOpen=!S.stripOpen;saveRun();renderStrip();};
}
function nextStreakTxt(st){
  const steps=Object.keys(STREAK_REWARD).map(Number).sort((a,b)=>a-b);
  const nx=steps.find(n=>n>st);
  return nx?`${nx-st}승`:'—';
}

/* ===== 히어로 ===== */
function renderHero(){$('cashView').textContent=fmtWon(S.cash);}

function render(){
  renderHero();renderLevel();renderRankChip();renderStrip();
  switchMainTab(S.mainTab||'trade');
  renderTradeTabs();renderTrade();
  renderShop();renderGrowth();renderUnlock();
}

function showAwayModal(report){
  const bits=[];
  if(report.roundRefunded){
    bits.push(`<div class="lv-gain">⏸️ 진행 중이던 단타는 지켜보지 못해서 손익 없이 베팅금 <b>${fmtWon(report.roundRefunded.bet)}</b>만 환불했어요</div>`);
  }
  const awayTxt=report.awaySec>=3600?`${Math.floor(report.awaySec/3600)}시간 ${Math.floor(report.awaySec%3600/60)}분`:`${Math.floor(report.awaySec/60)}분`;
  $('modalBox').innerHTML=`<div class="emo">⏱️</div><div class="tt">${awayTxt} 만이네요</div>
    <div class="dc">자리를 비운 동안은 돈이 불지도 줄지도 않아요 — 직접 지켜봐야 의미가 있으니까요.</div>
    ${bits.join('')}
    <div class="stat-grid" style="margin-top:14px"><div class="s"><div class="k">현재 잔액</div><div class="v">${fmtWon(S.cash)}</div></div></div>
    <button class="ok" id="mOk">확인</button>`;
  $('modal').classList.add('on');
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');};
}
/* 규칙을 모른 채 맞는 마감이 제일 억울하다 — 첫 판 시작 전에 한 번만 알려준다 */
function showIntroModal(){
  const g=GATES[0];
  $('modalBox').innerHTML=`<div class="emo">🔗</div><div class="tt">이 돈, 빌린 돈이에요</div>
    <div class="dc">시드머니는 대출금이에요. 정해진 거래일 안에 상환금을 만들어 갚아야 해요.</div>
    <div class="stat-grid">
      <div class="s"><div class="k">1차 상환금</div><div class="v">${fmtWon(g.goal)}</div></div>
      <div class="s"><div class="k">기한</div><div class="v">${g.days}거래일</div></div></div>
    <div class="intro-li"><span class="e">📅</span><span>단타 <b>한 판이 끝날 때마다 하루</b>가 지나요.</span></div>
    <div class="intro-li"><span class="e">🏦</span><span>기한 안에 못 갚으면 <b>반대매매</b>로 계좌가 청산돼요.</span></div>
    <div class="intro-li"><span class="e">💰</span><span>일찍 갚으면 남은 거래일 하루당 상환금의 ${Math.round(EARLY_BONUS_RATE*100)}%를 현금으로 받아요.</span></div>
    <button class="ok" id="mOk">시작하기</button>`;
  $('modal').classList.add('on');
  META.seenIntro=true; saveMeta();
  $('mOk').onclick=()=>{sfx.tap();$('modal').classList.remove('on');};
}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),1600);}

$('muteBtn').onclick=()=>{META.mute=!META.mute;saveMeta();$('muteBtn').textContent=META.mute?'🔇':'🔊';if(!META.mute)sfx.tap();};

/* main tick — 0.05초 간격으로 라운드 진행/자동익절/파산 체크 */
setInterval(()=>{
  const now=Date.now();
  S.lastTick=now;
  if($('modal').classList.contains('on'))return;
  if(S.activeRound){
    const idx=currentTickIdx();
    const mult=S.activeRound.path[idx];
    if(idx>=S.activeRound.path.length-1){ sellRound(false); return; }
    if(S.activeRound.autoTarget && mult>=S.activeRound.autoTarget){ sellRound(true); return; }
    if(S.mainTab==='trade')renderRoundView();
  }else{
    checkBankrupt();
  }
}, ROUND_TICK_MS);
setInterval(()=>{ updateRankDrift(Date.now()); renderRankChip(); }, 1000);
setInterval(saveRun, 3000);
window.addEventListener('pagehide', saveRun);
document.addEventListener('visibilitychange',()=>{if(document.hidden)saveRun();});

updateRankDrift(Date.now());
render();
if(META.pendingSettle){ showSettleModal(META.pendingSettle); }
if(!checkBankrupt() && awayReport && awayReport.awaySec>=60) showAwayModal(awayReport);
if(!$('modal').classList.contains('on') && !META.seenIntro && !gateDone() && S.dayCount===0) showIntroModal();
</script>
</body>
</html>
